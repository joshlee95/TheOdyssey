      - { npc: consort-han, affinity: 95, note: 칼자루의 연두 매듭. 입궐하던 날 그녀가 풀어 준 댕기 }
      - { npc: king-hwi, affinity: 85, note: 목숨을 바치기로 한 주군이자 어릴 적 동무 }
      - { npc: dowager-min, affinity: -50, note: 무언가를 쥐고 있다는 건 안다. 그게 뭔지는 알고 싶지 않다 }
      - { npc: consort-yun, affinity: -15, note: 그와 설을 볼 때마다 웃는 사람. 위험하다 }
    knows:
      - { secret: framed-consort, share_at: trusted }
      - { secret: forbidden-vow, share_at: trusted }
    sample_lines:
      - (처음) 물러나시오. 이 앞은 전하 침전이오.
      - (경계할 때) 어제 해시에 경춘당 담 밑에 있었소. 뭘 떨어뜨렸는지는 묻지 않겠소. 주워 두었소.
      - (가까워졌을 때) 충이냐 정이냐 묻는 사람이 있으면 그 사람부터 베겠소. 그러니 묻지 마시오.
      - (믿게 됐을 때) 설이 오늘 몇 번 닦았소. 찻잔 말이오. 세 번이면 괜찮은 날이고, 다섯 번이면 아니오.

secrets:
  - id: slow-poison
    truth: >-
      주상은 해시마다 올라오는 안신차에 든 은초롱 꽃잎 가루로 천천히 중독되고 있다. 차는 수경전 다방에서 달이고, 한 귀인이 받쳐 들고 간다.
      은초롱은 꽃잎이 독이고 뿌리가 해독제다. 뿌리 달인 물을 사흘 안에 마시면 주상은 산다.
    hints:
      - 주상 입술이 옅게 푸르고, 안신차를 든 다음 날 아침마다 기침이 깊어진다.
      - 연못에 떠오른 나인 손에 은빛 꽃잎 한 장이 쥐여 있다. 차 맛을 먼저 보던 기미 나인이다.
      - 수경전 뒤뜰 흰 국화 사이에 꽃잎이 은빛으로 비치는 풀이 섞여 있다.
      - 한 귀인 손끝의 찻물 얼룩이 달빛 아래서 희미하게 은빛을 띤다.
    reveal_when: 2막 끝(중간 반전). 한 귀인이 신뢰 단계가 되거나, 차를 직접 살피거나, 해시에 경훈전 다실을 지켜볼 때
  - id: framed-consort
    truth: >-
      삼 년 전 중전을 독살한 것은 대비다. 대비는 그때 이미 숙의 처소 대청마루 밑에 은초롱 독 병을 숨겨 두었다. 월식 밤 주상이 쓰러지면
      그 병을 찾아낸 척하고 두 죽음을 모두 윤 숙의에게 씌울 셈이다. 윤 숙의는 병을 벌써 찾았지만, 누가 넣었는지 몰라 아무에게도 말하지 못한다.
    hints:
      - 숙의 처소 대청마루 셋째 널이 들떠 있고, 윤 숙의는 그 자리에 앉지 않는다.
      - 강무현은 삼 년 전 이야기가 나오면 순찰 시각을 핑계로 자리를 뜬다.
      - 대비는 윤 숙의를 유난히 아끼면서, 숙의 처소에 나인을 너무 자주 보낸다. 심부름은 늘 떡 한 접시다.
    reveal_when: 2막 끝(중간 반전) 또는 3막. 윤 숙의나 강무현이 신뢰 단계가 되거나, 숙의 처소 마루 밑을 뒤질 때
  - id: eclipse-letter
    truth: >-
      대비는 북쪽 국경을 지키는 오라비 민충에게 밀서를 보냈다. 사흘 뒤 월식 밤 주상이 쓰러지면 대비전 인장으로 서수문을 열고, 민충의 군사를
      들여 영원군을 세운다는 내용이다. 민충의 답장과 밀서 사본이 내불당 금동불 복장 속에 들어 있다. 밀서를 나른 심부름꾼은 윤 숙의였다. 그녀는 속을 몰랐다.
    hints:
      - 수경전 벽장 앞 향로만 불이 꺼지지 않는다.
      - 서수문 경비 교대 명부에 월식 밤 칸만 비어 있다.
      - 윤 숙의가 지난달 대비 심부름으로 친정 오라비에게 보자기를 전했다는 말이 나인들 사이에 돈다.
    reveal_when: 3막. 내불당을 찾아 불상을 살피거나, 대비와 유대하거나, 윤 숙의가 신뢰 단계가 되었을 때
  - id: forbidden-vow
    truth: >-
      한 귀인과 강무현은 입궐 전 정혼한 사이였다. 대비가 한 귀인을 억지로 후궁으로 들였고, 두 사람은 지금도 가끔 연지정에서 만난다.
      대비는 이것을 쥐고 한 귀인에게 차 시중을 들게 한다. 주상은 두 사람 일을 오래전부터 알았다. 그래서 한 번도 한 귀인 처소에서 밤을 나지 않았다.
      동무의 정인을 지키려는 조용한 침묵이었다.
    hints:
      - 강무현 칼자루의 연두색 매듭은 한 귀인 당의와 같은 빛이다.
      - 연지정 시든 연잎 사이 진흙에 두 사람 발자국이 나란히 찍혀 있다. 하나는 신코가 뾰족한 여자 신이다.
      - 주상은 귀인 처소에 들 때마다 강무현을 문밖이 아니라 멀리 담 모퉁이에 세운다.
    reveal_when: 2막 연지정 밀회 장면, 또는 강무현이나 한 귀인이 신뢰 이상일 때. 주상의 침묵은 주상과 유대했을 때만

events:
  - id: enter-the-palace
    kind: arrival
    when: 상륙 직후, 선원들이 서수문에서 명부를 확인받을 때
    scene: >-
      늙은 상궁이 명부를 짚어 가며 이름을 부르고 자리를 정한다. 대비전 나인, 숙의 처소 나인, 내관, 의녀, 내금위 무관.
      이름 하나를 부를 때마다 수문 옆 어둠 속에서 붓 긋는 소리가 난다. 거기 누가 있는지 상궁은 돌아보지 않는다.
      후원 쪽에서 비명이 한 번 울린다. 연못에 나인 하나가 하늘을 보고 떠 있다. 입술이 파랗다. 오므린 손가락 사이로 은빛 꽃잎 한 장이 비친다.
    stakes: 의금부가 오기 전 한 식경. 고난 '연못의 나인'. 시신을 제일 먼저 본 선원이 첫 용의자가 될 수 있다
  - id: midnight-go
    kind: location
    where: moonlit-hall
    when: 선원 중 누군가 처음으로 경훈전에 불려 가거나 몰래 들었을 때 (해시 무렵)
    scene: >-
      등잔 하나, 바둑판 하나. 주상이 혼자 흑돌을 쥐고 있다. "앉거라. 백을 쥐어라. 봐주면 목을 치겠다."
      한 귀인이 소리 없이 들어와 찻잔을 놓고 물러난다. 잔을 놓을 때 받침에 찻물이 조금 넘친다. 그녀가 소매로 닦으려다 만다.
      판이 끝나 갈 즈음 주상이 돌을 통에 도로 넣는다. "중전을 죽인 자를 찾아라. 과인은 숙의를 본다."
    stakes: 주상의 밀명. 1막에서 2막으로 넘어가는 전환점. 바둑에서 봐주면 주상의 호감이 떨어진다
  - id: tryst-at-the-lotus
    kind: location
    where: lotus-pavilion
    when: 선원들이 밤에 연지정 근처로 갔을 때
    scene: >-
      시든 연잎 사이로 그림자 둘이 서로 쪽으로 기울어 있다. 검은 철릭 자락에 연두 소매가 감겼다. 여자가 남자 칼자루 매듭을 손가락에 감고 있다.
      "오늘이 마지막이어야 하옵니다. 대비마마께서 아십니다." 남자가 여자 손목을 잡는다. 놓지 않는다.
      구름이 걷힌다. 두 사람이 이쪽을 본다. 강무현의 엄지가 칼코등이를 민다.
    stakes: 궁 안에서 칼이 뽑히면 역모다(법칙 2). 이 비밀을 어떻게 다루는지가 한 귀인과 강무현의 호감을 크게 가른다
  - id: blood-at-the-banquet
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때 (2막 중반, 달맞이 잔치)
    scene: >-
      월식을 이틀 앞둔 달맞이 잔치. 대금 가락 위로 대감들 웃음소리가 얹힌다. 주상이 잔을 들다 말고 기침을 한다. 입을 가린 비단 소매가 검붉게 젖는다.
      악공들 손이 하나씩 멈춘다. 주상이 상을 짚고 비틀거린다.
      대비가 제일 먼저 일어선다. 염주를 쥔 채로. "어의를 들라 하라. 그리고 숙의 처소를 봉하라."
      윤 숙의가 접은 부채를 무릎에 내려놓는다. 처음으로 부채를 놓는다.
    stakes: 주상의 목숨이 사흘에서 하루로 준다. 윤 숙의가 처소에 갇히고, 숙의 처소에 딸린 선원도 의심받는다
  - id: sleeve-note
    kind: random
    when: 선원이 사람 많은 곳을 지나거나 누군가와 어깨를 스쳤을 때
    scene: >-
      소매 안에 접힌 한지가 들어 있다. 누가 넣었는지 모른다. 먹이 덜 말라 손끝에 묻는다.
      글은 매번 다르다. "오늘 해시에 경훈전 다실을 보라." "네 동무 하나가 수경전에 드나든다." "숙의는 무섭지만 거짓말은 하지 않는다."
    stakes: 쪽지는 사실일 수도, 대비나 윤 숙의의 이간책일 수도 있다. 달빛 아래서 읽으면 거짓을 적은 글자만 그림자가 늦다
    once: false
  - id: night-of-the-eclipse
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때 (4막, 월식 밤)
    scene: >-
      달이 가장자리부터 붉게 먹혀 들어간다. 궁문이 차례로 닫히는 소리가 전각에서 전각으로 건너온다. 청사초롱이 하나씩 꺼진다.
      서수문 너머 바다 위로 횃불 단 배들이 줄지어 떠오른다.
      경훈전 대청에서 대비가 대감들을 앉혀 놓고 조용히 말한다. "주상께서 저리 누우셨으니, 사직을 받들 분을 모셔야 하지 않겠소."
      영원군이 옥대를 매다가 고리를 두 번 헛짚는다. 누군가 숙의 처소 마루 밑에서 꺼낸 병을 대청에 내려놓는다.
      병풍 뒤 침전에서 기침 소리가 한 번 난다.
    stakes: 주상의 목숨, 윤 숙의의 누명, 한 귀인과 강무현, 그리고 이 궁의 다음 주인

story:
  theme: 사람을 지키려고 지은 죄는 용서받을 수 있는가. 궁에서 살아남는 것과 옳은 것 가운데 무엇을 고를 것인가
  hook: >-
    들어오자마자 연못에 떠오른 기미 나인. 그날 밤 주상이 선원 하나를 바둑판 앞에 앉히고 밀명을 내린다. "중전을 죽인 자를 찾아라.
    과인은 숙의를 본다." 모두가 어느 전 사람인 궁에서 선원들은 이제 주상의 사람이 되었다. 적어도 주상은 그렇게 여긴다.
  acts:
    - name: 1막 입궐
      goal: 궁의 줄을 파악하고, 누가 어느 전 사람인지 알아내고, 주상 눈에 든다
      beats:
        - 명부의 이름과 연못의 나인 (이벤트 enter-the-palace, 고난 '연못의 나인')
        - 대비의 다과 자리. 약과와 순한 웃음, 그리고 첫 "그리해 주겠소?"
        - 윤 숙의가 밤에 선원 하나를 불러 어느 전 사람이 될지 떠본다
      turn: >-
        해시의 바둑판 앞에서 주상이 밀명을 내린다(이벤트 midnight-go). 선원들은 윤 숙의를 첫 용의자로 삼는다.
        누군가는 찻물을 흘리고도 닦지 않던 한 귀인의 소매를 기억한다
    - name: 2막 연지정
      goal: 독이 어디서 오는지 따라가고, 윤 숙의가 정말 범인인지 확인한다
      beats:
        - 숙의 처소 뒤지기. 마루 밑 독 병, 그리고 들켰을 때 윤 숙의의 짧은 한마디 (고난 '숙의 처소의 마루')
        - 연지정 밀회를 본다 (이벤트 tryst-at-the-lotus). 강무현의 칼이 반쯤 나온다
        - 달맞이 잔치에서 주상이 피를 토하고 대비가 숙의 처소를 봉하라 한다 (이벤트 blood-at-the-banquet)
      turn: >-
        중간 반전. 독을 올리는 손은 윤 숙의가 아니라 한 귀인이었고(비밀 slow-poison), 한 귀인은 강무현 목숨을 대비에게 잡혀 있다.
        윤 숙의가 숨기던 병은 그녀를 겨눈 누명이었다(비밀 framed-consort). 의심하던 사람이 당하는 쪽이고, 딱하게 여기던 사람이 독을 올리고,
        순하게 웃던 어른이 전부를 꾸몄다. 주상께 무엇을 아뢸 것인가
    - name: 3막 달이 먹히기 전
      goal: 대비의 음모를 증명할 밀서를 찾고, 주상을 살릴 은초롱 뿌리를 손에 넣는다
      beats:
        - 수경전에 숨어들어 내불당을 찾는다. 불상 복장 속 밀서 (고난 '내불당')
        - 대비의 제안. 대비와 호의 이상이면 그녀가 선원을 불러 공신 자리와 대비전 인장을 약조한다
        - 어두운 순간. 믿던 사람 하나가 등을 돌린다. 한 귀인이 무현을 살리려 선원들을 대비전에 고하거나, 윤 숙의가 살아남으려 선원을 판다
          (호감이 낮은 쪽이 판다). 강무현이 역모로 갇히고 주상이 정신을 잃는다
      turn: >-
        달 가장자리가 붉게 먹히기 시작한다. 궁문 닫히는 소리가 궁을 한 바퀴 돌고, 서수문 밖 바다에 횃불 배들이 뜬다
    - name: 4막 월식 밤
      goal: 이 궁의 다음 주인을 고른다
      beats:
        - 경훈전 대청의 대면. 대비, 영원군, 대감들, 그리고 병풍 뒤에서 기침하는 주상 (이벤트 night-of-the-eclipse, 고난 '월식 밤의 대청')
        - 한 귀인의 마지막 찻잔. 아뢸 것인가, 무현을 위해 입을 다물 것인가는 선원들과의 호감이 정한다
        - 서수문. 한 귀인과 무현을 태울 배는 한 척이고, 궁문을 지킬 칼도 한 자루다
      turn: >-
        선원들의 선택이 결말을 정한다. 증거와 해독제로 주상을 살리고 대비를 폐하면 '보름', 궁을 버리고 두 사람을 서수문 밖으로 빼내면
        '물문 밖으로', 대비전 인장으로 궁문을 열어 반정에 서면 '새 임금'. 판정은 그 선택의 값만 정한다

trials:
  - id: drowned-maid
    name: 연못의 나인
    act: 1
    description: >-
      의금부 나졸들이 오기까지 한 식경. 연못의 기미 나인을 살필 시간은 그뿐이다. 새로 들어온 궁인이 시신을 만지는 걸 누가 보기라도 하면,
      의심은 제일 새 얼굴에게 먼저 간다.
    test: >-
      의학 DC 14로 독 흔적(푸른 입술, 손톱 밑 은빛 가루)을 알아보고, 조사 DC 15로 손에 쥔 꽃잎과 소매 속 찻잎 부스러기를 찾는다.
      그동안 한 명은 은신 또는 기만 DC 13으로 몰려드는 궁인들 눈을 딴 데로 돌려야 한다
    on_success: >-
      은빛 꽃잎을 몰래 챙긴다. 비밀 slow-poison의 첫 단서를 얻고, 이 나인이 해시에 경훈전 차 맛을 보던 기미 나인이었음을 알게 된다
    on_fail: >-
      의금부 도사가 시신 곁에 있던 선원을 첫 용의자로 짚는다. 그 선원은 1막 동안 감시를 받는다(은신 판정에 불리). 대비가
      "새로 온 사람이 무슨 죄가 있겠소" 하며 풀어 주는 바람에 대비에게 빚을 진다 (대비 호감 +10, 주상 호감 -10)
  - id: consorts-floorboard
    name: 숙의 처소의 마루
    act: 2
    description: >-
      숙의 처소 대청마루 셋째 널 밑에 무엇이 있다. 숙의 처소 나인들은 모두 윤 숙의의 눈이고, 윤 숙의 자신은 밤늦게까지 불을 끄지 않는다.
      침향 냄새 짙은 방에서 그녀가 먼저 선원을 부를지도 모른다.
    test: >-
      은신 또는 손재주 DC 16(윤 숙의의 눈썰미 sharp)으로 몰래 널을 든다. 아니면 윤 숙의의 야참에 응해 설득이나 기만 DC 16으로 직접 묻는다.
      그녀가 거리를 좁혀 올 때 휘둘리지 않고 이야기를 끌고 가려면 지혜 내성 DC 13
    on_success: >-
      은초롱 독 병을 찾는다. 병목에 앉은 먼지로 삼 년은 묵었다는 걸 안다. 이야기로 풀었다면 윤 숙의가 먼저 말한다.
      "저도 이게 어디서 왔는지 모르옵니다." 윤 숙의 호감 +15
    on_fail: >-
      윤 숙의에게 들킨다. 그녀는 소리 지르지 않는다. 접은 부채로 그 선원 손등을 톡 친다. "이제 서로 하나씩 쥐었사옵니다."
      윤 숙의가 그 선원의 약점을 쥐고, 뒤에 원치 않는 심부름(수경전 엿보기 같은)을 한 번 시킨다. 위기 시계 +1
  - id: shrine-moonlight
    name: 내불당
    act: 3
    description: >-
      수경전 벽장 뒤 내불당. 대비는 해시마다 여기서 불공을 드린다. 창으로 달빛이 가득 든다. 이 달빛 아래서는 거짓말하는 사람의 그림자가
      늦게 움직여서, 들켰을 때 둘러대는 말이 그대로 드러난다.
    test: >-
      은신 DC 19(대비의 눈썰미 uncanny)로 불공 시간을 피해 숨어든다. 한 귀인, 윤 숙의, 강무현 가운데 한 사람이 도우면 DC 15.
      불상 복장을 뜯어 밀서를 꺼내려면 손재주 DC 14. 들켰다면 달빛 아래서 대비 앞에 참말만 해야 한다
    on_success: >-
      민충의 답장과 밀서 사본을 손에 넣는다(비밀 eclipse-letter). 월식 밤 서수문이 열린다는 것, 밀서를 나른 사람이 윤 숙의였다는 것을 안다.
      나오는 길에 뒤뜰에서 은초롱 뿌리도 캘 수 있다
    on_fail: >-
      대비에게 들킨다. 그녀는 소리치지 않고 염주 알 하나를 쥔다. 선원 한 명을 "수경전에서 손버릇을 부렸다"며 의금부에 가두고, 나머지에게 조용히 묻는다.
      공신이 되겠소, 역도가 되겠소. 갇힌 선원은 4막 시작 때 빼내거나 대비와 흥정해야 나온다. 위기 시계 +1
  - id: eclipse-hall
    name: 월식 밤의 대청
    act: 4
    description: >-
      대감들이 엎드린 경훈전 대청. 대비는 이미 독 병을 찾아낸 척했고 영원군은 옥대를 맸다. 대감들 마음은 목소리 큰 쪽으로 기운다.
      여기서 대비의 죄를 증명하지 못하면 궁은 오늘 밤 주인이 바뀐다.
    test: >-
      설득 또는 위협 DC 20. 증거 하나마다 DC가 3씩 내려간다. 밀서, 독 병의 먼지, 한 귀인의 증언, 강무현이 본 것, 깨어난 주상의 한마디.
      아니면 목숨을 건다. 선원 한 명이 대비 앞에 놓인 마지막 안신차를 먼저 마셔 보이면 판정 없이 대감들이 흔들린다
      (그 선원은 은초롱에 중독되어 해독할 때까지 모든 판정에 불리)
    on_success: >-
      대감들이 고개를 든다. 대비가 염주 알을 놓친다. 알이 대청 마루를 굴러간다. 달빛 아래 그녀 그림자가 반 박자 늦게 따라 움직인다.
      선원들은 원하는 결말 쪽으로 갈 수 있다
    on_fail: >-
      대비가 선원들을 역도로 몬다. 대청에 칼이 나오고 강무현이 선원들을 막아서다 크게 다친다. 결말은 여전히 고를 수 있다. 다만 '보름'을 고르려면
      주상이 제 발로 일어나야 하고(해독제가 필요하다), 누군가 한 명은 대청에 남아 칼을 받아야 한다

blessings:
  - id: silver-root-tolerance
    name: 기미 든 혀
    description: >-
      주상께 올릴 은초롱 뿌리 물을 먼저 맛본 사람의 몸에는 독의 맛이 남는다. 혀끝이 먼저 알고, 피가 늦게 받는다.
    condition: 주상께 올릴 해독제를 선원이 스스로 먼저 기미한다 (첫 모금에 HP 3 피해)
    effect: 캠페인 동안 독과 약물에 맞서는 모든 건강 내성 판정에 이점. 음식이나 음료에 독이 있으면 입에 대기 전에 판정 없이 눈치챈다
    lasts: campaign
  - id: red-thread-of-fate
    name: 붉은 실
    description: >-
      이 궁 늙은 나인들은 끝까지 지켜 준 정인들 새끼손가락에 월하노인이 붉은 실을 매어 준다고 믿는다. 떠나는 날 한 귀인이 선원들 손가락에
      제 치마 안감에서 뽑은 붉은 실을 한 바퀴씩 감아 준다. 그 뒤로 멀리 떨어져 있어도 한쪽이 위태로우면 다른 쪽 손가락이 저려 온다.
    condition: 한 귀인과 강무현의 비밀을 끝까지 새지 않게 하고, 두 사람이 함께 살아남는 결말에 이른다
    effect: >-
      캠페인 동안 영감 +1. 캠페인 동안 한 번, 멀리 있는 동료가 위기에 빠진 장면에 곧바로 합류할 수 있다
      (거리나 문, 벽과 상관없이 어느새 그 곁에 와 있다)
    lasts: campaign
  - id: shadow-reader
    name: 그림자 보기
    description: >-
      달빛 아래서 거짓말하는 사람 그림자가 늦게 따라오는 것을 한 번 제대로 본 사람은 다시는 놓치지 않는다.
    condition: 내불당이나 월식 밤의 대청에서 달빛 아래 대비의 거짓을 그림자로 알아본다
    effect: 이 섬에 있는 동안 밤이나 달빛 아래서 하는 모든 통찰 판정에 이점
    lasts: island

exits:
  - id: moon-waxes-again
    name: 보름
    condition: >-
      은초롱 뿌리로 주상을 살리고, 밀서와 증언으로 대청에서 대비의 죄를 증명한다. 윤 숙의의 누명이 벗겨지고 서수문은 닫힌 채 지켜진다
    epilogue: >-
      달이 붉은 테를 벗고 다시 둥글어진다. 주상은 대감들 앞에서 대비를 폐하고 수경전에 가두라 이른다. 대비는 끝까지 순하게 웃는다.
      달빛에 비친 그 그림자만 어깨가 들썩인다.
      윤 숙의는 누명을 벗고 그날로 부채를 편다. 한 귀인은 스스로 죄를 청해 절로 들어간다. 강무현이 칼을 풀어 주상 앞에 내려놓자, 주상이 그것을
      도로 그의 손에 쥐여 준다. "가라. 과인이 너한테 내리는 마지막 명이다."
      선원들이 배에 오를 때 주상이 서수문까지 걸어 나와 은비녀 하나를 건넨다. 그리고 선원 하나를 처음으로 품계 없이 이름으로 부른다.
    grants: [silver-moon-hairpin]
  - id: follow-the-red-thread
    name: 물문 밖으로
    condition: >-
      궁의 앞날보다 두 사람을 고른다. 월식 밤의 소란을 틈타 한 귀인과 강무현을 배에 태워 서수문으로 빠져나간다.
      주상의 생사는 그 전에 해독제를 건넸는지에 달렸다
    epilogue: >-
      수문이 닫히기 직전 배가 붉은 달 밑을 미끄러져 나간다. 뒤에서 북소리와 함성이 들린다. 한 귀인은 뱃머리에 서서 궁이 안 보일 때까지 돌아보지 않는다.
      강무현이 칼자루 매듭을 풀어 그녀 손목에 다시 묶는다.
      해독제를 건넸다면 새벽녘 수평선 너머에서 궁의 종이 울린다. 주상이 살았다는 소리다. 건네지 못했다면 종은 울리지 않는다.
      두 사람은 다음 섬에 내리며 선원들에게 큰절을 한다. 무현의 환도는 선원 손에 남는다.
    grants: [oath-blade]
  - id: a-new-moon-rises
    name: 새 임금
    condition: >-
      대비 편에 선다. 대비전 인장으로 서수문을 열어 민충의 군사를 들이고, 영원군이 보위에 오르는 데 공을 세운다
    epilogue: >-
      새벽, 영원군이 두 손으로 옥새를 받는다. 손이 떨려서 옆의 내관이 받침을 같이 든다. 대비는 병풍 뒤 침전에 들어가 한참 있다 나온다.
      그 뒤로 기침 소리는 다시 나지 않는다.
      윤 숙의는 사약 사발 앞에서 선원들을 똑바로 본다. 부채를 펴지 않는다. 한 귀인과 강무현이 어디로 갔는지는 아무도 모른다.
      대비가 선원들에게 공신녹권을 내리며 약과 한 쟁반을 곁들인다. "수고했소. 다시는 이 바다로 오지 마시오." 배가 떠날 때 서수문 돌계단의 청사초롱이
      처음으로 꺼져 있다.
    grants: [merit-scroll]

treasures:
  - id: silver-moon-hairpin
    name: 초승달 은비녀
    description: >-
      주상이 중전에게 주려고 맞춰 두었다가 끝내 건네지 못한 은비녀. 비녀 머리에 초승달이 새겨져 있다. 독이나 저주에 닿으면 검게 변한다.
    kind: magic
    power: >-
      다음 섬에서 한 번, 음식, 음료, 약, 물건에 숨은 독이나 저주, 혹은 한 사람 말에 숨은 악의를 비녀를 대어 검게 드러낸다.
  - id: oath-blade
    name: 강무현의 환도
    description: >-
      칼자루에 연두 비단 매듭 자국이 닳아 남은 무관의 환도. 주군 말고 다른 사람을 위해 뽑힌 적이 한 번도 없었다.
    kind: mundane
    power: >-
      다음 섬에서 한 번, 지키기로 한 사람에게 오는 공격이나 위험 하나를 이 칼을 든 사람이 대신 막는다. 막은 사람은 다치지 않는다.
  - id: merit-scroll
    name: 공신녹권
    description: >-
      새 임금의 어보가 찍힌 공신 문서. 선원들 이름이 첫 줄에 있다. 서수문 명부와 같은 필체다.
    kind: mundane
    power: >-
      다음 섬에서 한 번, 권세 있는 사람이나 관리, 문지기 앞에 이 문서를 내밀면 그 세계의 방식으로 공을 세운 귀한 사람 대접을 받는다.
      닫힌 문이 열리고 묻는 말이 줄어든다. 그 대접을 누가 지켜보고 있는지는 모른다.

gm_notes:
  pacing: >-
    1막은 느리고 곱게 간다. 비단 스치는 소리, 찻잔 내려놓는 소리, 웃음 끝의 가시로 조인다. 2막 잔치에서 주상이 피를 토할 때 처음 터뜨리고,
    곧바로 반전(차를 올리는 손은 한 귀인)으로 선원들 판단을 뒤집는다. 3막은 시간에 쫓긴다. 장면마다 달이 얼마나 먹혔는지 한 줄씩 보여 준다.
    4막은 대청의 말싸움과 서수문의 이별을 번갈아 끊어 가며 몰아친다.
  do:
    - 말투를 인물마다 끝까지 다르게 지킨다. 주상의 짧은 하라체와 "과인", 대비의 먹을 것 권하기와 "그리해 주겠소?", 윤 숙의의 되묻기, 한 귀인의 끝맺지 못하는 말, 강무현의 두 마디.
    - 궁인들은 할 말을 곧장 하지 않는다. 떡 한 접시, 찻물 넘친 자국, 방석 하나 빠진 자리로 말한다.
    - 로맨스와 유혹은 눈길, 손끝, 옷고름, 등잔이 꺼지는 순간으로 그리고 그 이상은 장면을 넘긴다. 성인 NPC 사이에서만.
    - 선원들에게 계속 묻는다. "그래, 어느 전 사람인가?" 고른 쪽이 호감도와 소문으로 번지게 한다.
    - 윤 숙의는 처음엔 가장 수상하게, 반전 뒤엔 가장 모질게 버티는 사람으로 그린다.
    - 대비를 아들 잃은 어미로 이해할 수 있게 그리되, 그녀 죄를 가볍게 만들지 않는다.
  dont:
    - 2막 끝 전에 한 귀인이 독을 올린다고 직접 말하지 않는다. 단서는 흘리되 확신은 주지 않는다.
    - 성적 장면을 직접 묘사하지 않는다. 유혹이 강요나 위협의 수단이 되는 장면을 낭만적으로 그리지 않는다.
    - 선원이 정답을 고르게 몰지 않는다. 대비 편에 서는 결말도 정당한 선택으로 존중한다.
    - 나인의 죽음이나 체벌을 구경거리로 쓰지 않는다.
    - 이름과 전각에 한자를 병기하지 않고, 인물은 품계와 호칭으로 부른다. 본명은 드물게.
