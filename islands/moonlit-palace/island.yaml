# 연경궁. 조선풍 가상 왕조의 궁중 사극. 후궁들의 암투, 느린 독, 금지된 정혼, 월식 밤의 반정.
schema_version: 1
id: moonlit-palace

meta:
  title: 연경궁
  author: 오디세이 테스트팩
  tagline: 주상께서 밤마다 드시는 차는 한 사람이 달이고, 한 사람이 올리고, 궁 전체가 모른 척한다.
  tone: [궁중 사극, 로맨스, 음모, 관능적 긴장, 비극]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: mature
    lines:
      - 미성년자가 연루된 성적 요소
      - 성폭력과 강요된 관계를 낭만화하는 것
      - 고문 장면의 구체적 묘사
    veils:
      - 성적 행위 자체 (유혹과 긴장, 입맞춤, 새벽의 흐트러진 옷고름까지만 묘사하고 그 이후는 장면 전환)
      - 사약을 받고 죽어 가는 과정의 상세한 묘사
      - 궁녀에 대한 체벌의 상세 묘사

public:
  rumor: >-
    동쪽 바다 한가운데 섬 하나를 궁궐이 통째로 덮고 있다고 한다. 그 궁 주상은 서른둘인데 기침을 오래 한다고.
    지난봄 그 섬에 쌀을 대던 뱃사람 말로는, 궁 사람들이 밤이면 달을 등지고 앉더란다. 왜 그러느냐 물었더니 다들 웃기만 했다고.
  first_sight: >-
    보름을 사흘 앞둔 달 아래로 기와지붕이 섬 끝까지 겹겹이 이어진다. 처마 끝마다 청사초롱이 걸려 물 위에 붉은 줄을 긋는다.
    제일 높은 전각 용마루 위에 달이 걸려 있다. 가장자리 한 귀퉁이가 벌레 먹은 잎처럼 조금 이지러졌다.
  arrival: >-
    배가 서수문 돌기둥 사이로 들어서자 선원들 옷이 바뀌어 있다. 당의, 무명 치마저고리, 내관의 단령, 무관의 철릭.
    수문 앞 돌계단에서 늙은 상궁 하나가 등불을 치켜들고 명부를 편다. 선원들 이름이 벌써 정갈한 해서로 적혀 있다.
    "이번 가을 들어오는 사람들이 이제야 다 왔구먼. 늦었다. 걸음 재게 놀려라. 대비전에서 기다리신다."

world:
  reality:
    genre: [궁중 사극, 로맨스, 정치 음모]
    era: 조선을 닮은 가상 왕조의 중엽. 주상 즉위 칠 년, 중전 자리가 빈 지 삼 년째 되는 가을
    magic: hidden
    technology: medieval
    speech: >-
      궁중 말씨. 나인과 궁인은 "~하옵니다", "~하시옵소서"를 쓰고 윗전을 "마마", 주상을 "전하"라 부른다. 내관은 목소리를 낮춰
      "~하였사옵니다"로 아뢴다. 주상은 스스로를 "과인"이라 하고 "~하느냐", "~하라"로 끊는다. 대비는 주상을 "주상"이라 부르며
      하오체로 느긋하게 누른다. 후궁끼리는 이름을 부르지 않고 품계로 부른다("숙의", "귀인"). 칭찬 끝에 가시를 달고, 가시 끝에 웃음을 단다.
      같은 말도 누구 앞에서 했는지가 목숨을 가른다.
    outsiders: >-
      궁 사람들은 선원들을 바다 건너 온 사람이 아니라 이번 가을 새로 들어온 궁인으로 여긴다. 이름이 이미 명부에 있으니 어디서 왔는지는
      아무도 묻지 않는다. 그 대신 누구나 첫마디로 이것부터 묻는다. "그래, 어느 전 사람인가?" 대비전, 숙의 처소, 귀인 처소, 아니면
      전하. 대답을 미루는 사람은 모든 전에서 눈 밖에 난다.
    crossover:
      magic: weakened
      tech: fails
      note: >-
        궁문을 지나는 순간 다른 세계의 기계는 모두 멎고 생김새도 궁의 물건으로 바뀐다. 휴대폰은 뒷면에 달이 새겨진 손거울 노리개가 되고,
        총은 옻칠한 빈 담뱃대가, 드론은 날개를 접은 나무 학이 된다. 마법과 이능은 궁의 기운에 눌려 약해지고, 부적 먹물이 번지거나
        꿈에 누가 다녀가거나 달빛 아래 그림자가 먼저 움직이는 식으로만 새어 나온다. 주상 앞에서는 어떤 이능도 나오지 않는다.
    appearance: blend_in
  premise: >-
    삼 년 전 중전이 병명도 없이 죽었다. 독이었다. 독을 쓴 사람은 선왕의 계비이자 주상의 계모인 대비 민씨다. 대비는 제 소생이
    세자 자리를 잃고 요절한 뒤로, 친정 조카 영원군을 보위에 올리려 해 왔다.
    지금 대비는 밤마다 주상께 잠을 돕는 안신차를 올려 보낸다. 차에는 은초롱 꽃잎 가루가 들어 있다. 몸을 천천히 말리는 독이다.
    찻잔을 받쳐 드는 사람은 한 귀인이다. 대비는 한 귀인의 옛 정혼자이자 주상의 호위인 강무현의 목숨을 쥐고 그녀를 부린다.
    대비는 북쪽 국경을 지키는 오라비 민충에게 밀서를 보냈다. 사흘 뒤 월식 밤, 주상이 쓰러지면 서수문을 열어 군사를 들이고 반정을 한다.
    삼 년 전 독살과 이번 독살은 모두 윤 숙의가 한 일로 꾸며질 것이다.
  laws:
    - 달빛 아래서 거짓을 말한 사람의 그림자는 반 박자 늦게 움직인다. 이걸 아는 궁 사람들은 밤에 달을 등지고 앉는다.
    - 주상의 허락 없이 궁 안에서 칼을 뽑은 자는 그 자리에서 역모로 다스린다.
    - 해가 진 뒤 후궁은 처소 밖에 나갈 수 없다. 어기면 사통을 의심받는다.
    - 월식 밤에는 궁문이 모두 닫힌다. 그 문을 열 수 있는 것은 어보나 대비전 인장뿐이다.
  start_location: west-water-gate
  clock:
    name: 월식
    segments: 6

locations:
  - id: west-water-gate
    name: 서수문
    description: >-
      바닷물이 궁 안까지 들어오는 돌 수문. 배가 드나들고, 새로 들어온 궁인은 여기서 명부를 확인받는다. 수문 옆 돌계단에는 밤마다
      누가 청사초롱 하나를 켜 둔다. 켜는 사람을 본 사람은 없다. 초가 늘 반쯤 타 있다.
    connects_to: [moonlit-hall, lotus-pavilion]
    tags: [상륙 지점, 출구]
  - id: moonlit-hall
    name: 경훈전
    description: >-
      주상의 편전이자 침전. 낮에는 대신들이 엎드려 상소를 올리고, 밤에는 주상이 등잔 하나를 켜 놓고 혼자 바둑을 둔다. 병풍 뒤 작은
      다실로 해시마다 안신차가 들어온다. 찻잔 받침에 늘 물방울 자국이 둘 남는다. 한 번 내려놓았다가 다시 든 자국이다.
    connects_to: [west-water-gate, flower-shadow-court, dowager-hall]
    tags: [권력, 왕]
  - id: lotus-pavilion
    name: 연지정
    description: >-
      후원 연못 한가운데 선 정자. 늦가을이라 연잎이 다 시들어 검게 물 위에 누웠다. 바람이 없는 밤이면 연못에 달이 하나 더 뜬다.
      사람 눈을 피해 만나기 좋은 곳이고, 그래서 사람이 떠오르기도 좋은 곳이다. 정자 난간 한 칸만 칠이 닳아 있다.
    connects_to: [west-water-gate, flower-shadow-court]
    tags: [후원, 밀회, 위험]
  - id: flower-shadow-court
    name: 경춘당
    description: >-
      작은 마당을 사이에 두고 숙의 처소와 귀인 처소가 마주 보는 후궁 처소. 숙의 쪽은 침향 냄새가 짙고 붉은 발이 드리웠다.
      귀인 쪽에서는 늘 찻물 끓는 소리가 난다. 두 처소 나인들은 우물가에서 마주쳐도 두레박을 먼저 양보하지 않는다.
      숙의 처소 대청마루 셋째 널이 조금 들떠 있다. 그 자리에만 방석이 놓이지 않는다.
    connects_to: [moonlit-hall, lotus-pavilion]
    tags: [후궁, 암투]
  - id: dowager-hall
    name: 수경전
    description: >-
      궁에서 제일 조용한 전각. 대비전이다. 뒤뜰에 흰 국화가 가득한데, 그 사이에 꽃잎이 은빛으로 비치는 은초롱이 섞여 있다는 걸 아는
      사람은 드물다. 다방에서 매일 저녁 안신차를 달인다. 대청 뒤 벽장 하나가 늘 잠겨 있고, 그 앞 향로만 불이 꺼지는 날이 없다.
    connects_to: [moonlit-hall, inner-shrine]
    tags: [권력, 대비, 위험]
  - id: inner-shrine
    name: 내불당
    description: >-
      수경전 벽장 뒤로 난 좁은 통로 끝의 작은 불당. 사람 키만 한 금동불 한 분이 달빛 드는 창을 향해 앉아 있다. 불상 앞에 민씨 집안 위패들과,
      일찍 죽은 대비 소생의 배냇저고리가 개어져 놓였다. 불상 등의 복장 구멍을 막은 한지가 새것이다. 풀이 아직 다 마르지 않았다.
    connects_to: [dowager-hall]
    hidden: true
    tags: [비밀, 증거]

npcs:
  - id: king-hwi
    name: 주상 이휘
    role: 즉위 칠 년째인 임금
    adult: true
    look: >-
      서른둘. 붉은 곤룡포 어깨가 남는다. 얼굴이 희고 반듯한데 입술이 옅게 푸르다. 바둑돌을 쥔 손끝이 가끔 떨려서, 떨릴 때면 돌을 바둑통에
      도로 넣고 다른 돌을 집는다. 말을 들을 때 상대 눈이 아니라 손을 본다.
    personality: >-
      아무도 믿지 않는 법을 너무 일찍 배웠다. 중전을 지키지 못한 일을 삼 년째 입에 올리지 않는다. 중전 처소였던 전각 앞은 돌아서 다닌다.
      저를 왕이 아니라 사람으로 대하는 사람에게는 어이없을 만큼 무르다. 그걸 스스로 알아서 더 차갑게 군다.
    voice: >-
      "과인"이라 칭하고 "~하느냐", "~하라"로 짧게 끊는다. 되묻는 말이 많다. 바둑을 둘 때만 말이 길어진다. 속을 보일 때는 "과인"을 버리고 "나"라고 한다.
      화가 나면 목소리를 낮추고 상대 이름을 품계 없이 부른다.
    wants: 믿을 수 있는 사람 하나. 그리고 중전을 죽인 자의 이름.
    fears: 중전처럼 누구 손에 죽는지도 모르고 죽는 것. 강무현마저 잃는 것.
    location: moonlit-hall
    alertness: sharp
    affinity: 0
    romance: true
    likes:
      - 바둑에서 봐주지 않고 이기려 드는 것
      - 무릎은 꿇되 고개를 들고 할 말을 하는 것
      - 궁 밖, 바다 건너 세상 이야기
    dislikes:
      - 입에 발린 치하
      - 대비를 두둔하는 말
      - 중전의 죽음을 가볍게 입에 올리는 것
    behaviors:
      hostile: >-
        선원을 역모에 얽힌 자로 의금부에 가두라 명한다. 강무현에게 그 일행을 궁 밖으로 내치든 베든 알아서 하라고 이른다
      wary: >-
        내관을 붙여 선원들을 서로 다른 전각에 흩어 둔다. 사람마다 다른 헛소문을 하나씩 흘려 두고 어느 말이 어디로 새는지 본다
      friendly: >-
        해시에 선원을 바둑 자리로 부른다. 돌을 놓으면서 어느 대감이 어느 전에 줄을 댔는지 흘린다. 밤에도 궁을 다닐 수 있는 통부를 내린다
      trusted: >-
        중전의 죽음이 병이 아니라고 여긴다고 말하고, 밀지를 내려 수경전을 살피게 한다. 안신차를 드는 척하다 소매 안 수건에 쏟아 버리는 것을 이 선원 앞에서만 한다
      bonded: >-
        월식 밤에 제 손으로 칼을 들고 선원 곁에 선다. 곁을 떠나지 말라고 청한다. 서로 마음이 있다면 "과인 말고, 내가 묻는 것이다" 하고 묻는다.
        선원에게 어보를 맡겨 궁문을 열 권한을 준다
    relations:
      - { npc: guard-kang, affinity: 85, note: 어릴 적 동무. 세상에서 가장 믿는 칼 }
      - { npc: consort-han, affinity: 50, note: 말없이 차를 올리는 사람. 곁에 두면 편하다. 한 번도 그녀 처소에서 밤을 난 적이 없다 }
      - { npc: consort-yun, affinity: -15, note: 영리하고 속을 모르겠는 사람. 중전을 죽인 자로 의심한다 }
      - { npc: dowager-min, affinity: -35, note: 효를 다해야 할 어른. 중전이 숨을 거두던 날 그 입가를 보았다 }
    knows:
      - { secret: forbidden-vow, share_at: bonded }
    sample_lines:
      - (처음) 앉거라. 백을 쥐어라. 봐주면 목을 치겠다.
      - (경계할 때) 네가 어느 전 사람인지는 묻지 않겠다. 어차피 거짓을 말할 테니. 다음 수나 두어라.
      - (호감이 오를 때) 무례한 수로구나. 과인한테 이렇게 두는 자는 처음이다. 한 판 더 두자. 이번엔 흑을 줄 테니.
      - (믿게 됐을 때) 오늘 차는 반만 마셨다. 반은 저 화분이 마셨지. 요즘 저 난초 잎이 누렇다. 나만 아는 일이다. 이제 너도 알고.

  - id: dowager-min
    name: 대비 민씨
    role: 선왕의 계비, 주상의 계모
    adult: true
    look: >-
      쉰 중반. 옅은 쪽빛 당의에 백옥 떨잠 하나만 꽂았다. 늘 백팔 염주를 굴리는데, 누가 거슬리는 말을 하면 굴리던 손을 멈추고 알 하나를 오래 쥔다.
      새끼손가락 손톱만 길게 길렀다. 웃는 얼굴이 순하다. 오래 보고 있으면 그 웃음이 한 번도 풀리지 않는다는 걸 알게 된다.
    personality: >-
      누구에게도 목소리를 높이지 않는다. 나인 이름과 그 어미 병까지 기억해서 먼저 묻는다. 음식을 권하는 것으로 사람을 누른다.
      선왕 시절 총애 다툼 끝에 제 소생을 잃었다. 그 뒤로 이 궁을 아들의 무덤으로 여긴다. 불공은 하루도 거르지 않는다.
    voice: >-
      느긋한 하오체. 상대를 늘 품계로 부른다("숙의", "귀인", "주상"). 명령을 부탁처럼 하고 "그리해 주겠소?"로 끝낸다. 그 말이 나오면
      이미 정해진 일이다. 먹을 것 이야기로 말을 시작하고, 끝낼 때도 먹을 것을 권한다.
    wants: 조카 영원군을 보위에 올리고 민씨 핏줄로 이 궁을 채우는 것. 아들을 죽게 한 자리에 되갚는 것.
