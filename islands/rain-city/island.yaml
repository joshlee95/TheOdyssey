# 1940년대풍 누아르. 그치지 않는 비, 클럽 가수 살인, 돈 받는 경찰과 조직, 그리고 여자 둘.
schema_version: 1
id: rain-city

meta:
  title: 9번 부두
  author: 오디세이 테스트팩
  tagline: 배를 묶자마자 총소리가 났다. 경찰은 신고보다 먼저 왔다.
  tone: [누아르, 하드보일드, 비정함, 관능, 서스펜스]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: mature
    lines:
      - 미성년자가 관련된 성적 암시나 묘사
      - 성폭력
      - 동물 학대
      - 노골적인 성행위 묘사
    veils:
      - 성인 사이의 정사 장면 (문이 닫히고, 다음 장면은 재떨이와 빗소리에서 시작한다)
      - 고문의 구체적 과정 (지하실 문이 닫히고, 나중에 결과만 보여 준다)
      - 약물 중독의 상세한 묘사

public:
  rumor: >-
    동쪽 항로 끝에 비가 안 그치는 항구가 있다. 부두 인부들은 우산 대신 모자를 쓰고, 모자챙에서 물이 떨어지는 걸 신경 쓰지 않는다.
    라일락 룸이라는 클럽에 델라 메이라는 가수가 있는데, 선원들이 그 노래를 들으려고 출항을 하루씩 미룬다고 한다.
    그 가수가 오늘 밤 마지막으로 노래한다는 말이 돈다. 왜 마지막인지는 아무도 모른다.
  first_sight: >-
    빗줄기 너머로 네온이 번져 있다. 붉은 글씨가 물웅덩이에 한 번 더 찍혀 있다.
    부두 크레인 여섯 대가 목을 숙이고 섰고, 그 뒤로 굴뚝과 성당 종탑과 호텔 간판이 한데 뭉쳐 있다. 어디선가 색소폰이 같은 소절을 되풀이한다.
  arrival: >-
    9번 부두. 밧줄을 말뚝에 두 번 감았을 때 총소리가 한 번 났다. 빗소리 속에서도 분명했다.
    화물 상자 사이 골목 끝에 빨간 우산 하나가 뒤집혀 빗물을 받고 있다. 그 옆에 초록 드레스가 엎어져 있다.
    사이렌이 들린다. 아직 아무도 전화를 걸지 않았다.

world:
  reality:
    genre: [누아르, 하드보일드, 범죄 미스터리]
    era: 1940년대풍 미국 항구 도시. 중절모, 트렌치코트, 노면전차, 5센트짜리 공중전화. 금주법은 끝났고 술값은 그대로다
    magic: none
    technology: industrial
    speech: >-
      짧게 말한다. 묻는 말에 바로 답하는 사람이 드물고, 대답 대신 값을 부른다. 경찰은 "친구"라고 부르면서 겁을 주고,
      조직 사람은 존댓말로 겁을 준다. 사람 이름은 성으로 부르고, 이름을 부르는 건 가까운 사이거나 모욕할 때다.
      돈은 달러와 센트로 센다.
    outsiders: >-
      항구라 외지 선원은 흔하다. 어디서 왔는지 묻는 사람은 없다. 다만 오늘 밤 막 배에서 내린 외지인은 살인 누명을 씌우기 딱 좋은 얼굴이고,
      그걸 한눈에 알아보는 사람이 몇 있다.
    crossover:
      magic: weakened
      tech: works
      note: >-
        이 도시에서 마법은 예감과 운으로만 남는다. 불꽃은 성냥불만 하고, 저주는 재수 없는 우연이 되고,
        치유는 "총알이 뼈를 비껴갔다"로 끝난다. 다른 세계의 기계는 제대로 돌아간다. 다만 비에 젖으면 한 번은 꼭 말을 안 듣고,
        쓰는 순간 경찰과 조직 양쪽이 알게 된다. 좋은 물건을 가진 외지인은 이 도시에서 표적이다.
    appearance: unchanged
  premise: >-
    라일락 룸 가수 델라 메이가 클럽 뒷골목에서 총에 맞아 죽었다. 델라는 13관구 경찰과 조직 사이에 오간 돈을 적은 장부를 손에 넣었고,
    그날 밤 모닝 스타 기자 노라 케인에게 넘기러 가던 길이었다.
    쏜 사람은 장부에 이름이 가장 많이 나오는 13관구 강력반 프랭크 해리건 경위다. 해리건에게 약속 장소를 알려 준 건 클럽 주인의 아내 베라 코르소다.
    베라는 델라가 겁을 먹고 장부를 내놓을 줄 알았고, 그 장부를 챙겨 남편에게서 달아날 생각이었다.
    클럽 주인이자 항구 밤장사를 쥔 살바토레 코르소는 델라의 친아버지다. 이 사실을 아는 사람은 베라뿐이다.
    해리건은 장부를 찾아 태우고, 오늘 밤 내린 외지 선원들에게 살인을 씌워 새벽 여섯 시에 사건을 닫을 생각이다.
    장부는 델라가 무대에 오르기 전 클럽 피아노의 가장 낮은 도 건반 밑에 넣어 두었다.
  laws:
    - 비는 그치지 않는다. 부두 사람들은 누구 이름이 신문 1면에 제대로 실리는 날에만 비가 그친다고 말한다.
    - 누구한테든 신세를 지면 빚이 된다. 빚은 반드시 받으러 오고, 제일 곤란할 때 온다.
    - 13관구 경찰은 돈을 받는다. 누가 얼마를 받는지는 다들 알고, 증명할 수 있는 사람만 없다.
    - 새벽 여섯 시, 첫 배 기적이 울리면 해리건이 사건 보고서에 서명한다. 서명된 보고서가 이 도시의 사실이 된다.
  start_location: rain-docks
  clock:
    name: 여섯 시 첫 배
    segments: 8

story:
  theme: 진실을 밝혀도 아무도 구해지지 않는 도시에서, 그래도 밝힐 이유가 있는가?
  hook: >-
    배에서 내린 지 일 분 만에 선원들은 살인 현장에 서 있다. 이 분 만에 해리건 경위가 도착해 선원들의 항해 서류를 걷어 간다.
    "여섯 시까지 범인을 데려오든가, 친구들이 범인이 되든가." 서류가 없으면 배는 항구를 못 나간다.
    해리건은 처음부터 선원들을 범인으로 쓸 생각이다.
  acts:
    - name: 빗속의 시체
      goal: 현장을 살피고, 델라 메이가 누구였는지, 왜 그 골목에 있었는지 알아낸다
      beats:
        - 총소리, 뒤집힌 빨간 우산, 엎어진 델라. 아무도 신고하지 않았는데 해리건의 차가 골목으로 들어온다 (gunshot-arrival)
        - 라일락 룸의 추모 무대. 베라가 델라 노래를 부르고, 안쪽 부스의 코르소는 끝날 때까지 손을 테이블 위에 올려 둔 채 움직이지 않는다 (memorial-set)
        - 델라의 하숙방은 누가 먼저 뒤졌다. 서랍 안쪽에 빈 로켓 상자, 축음기 위에 레코드 한 장
      turn: >-
        노라 케인이 빗속에서 선원들 앞을 막는다. "델라는 오늘 밤 날 만나러 오고 있었어요. 뭘 가져온다고 했죠. 이 도시 경찰 절반이 짐 싸야 할 물건을."
        치정 살인이 아니다. 장부 때문에 죽은 거다.
    - name: 장부를 쫓는 사람들
      goal: 장부가 어디 있는지 쫓고, 누가 델라를 쐈는지 좁혀 간다
      beats:
        - 13관구 심문실. 해리건이 선원 소지품에서 '나온' 38구경 탄 한 알을 책상 위에 굴린다 (interrogation-room)
        - 취한 피아니스트 새미가 델라의 마지막 곡을 치다가 가장 낮은 도에서 손을 뗀다
        - 코르소의 사람들이 선원들을 지하 도박장으로 '모신다'. 차 문은 밖에서만 열린다
      turn: >-
        코르소가 지하 사무실 금고에서 여자아이 사진을 꺼낸다. 델라다. 그는 델라의 아버지였다 (corso-daughter).
        같은 밤 노라가 검시관 메모를 가져온다. 델라 몸에서 나온 탄은 경찰 지급 38구경이다 (who-shot-della). 쏜 사람은 배지를 달고 있다.
    - name: 젖은 성냥
      goal: 장부를 손에 넣고, 누가 델라의 약속 장소를 흘렸는지 밝힌다
      beats:
        - 해리건의 부하들이 클럽을 뒤집고 새미의 피아노에 도끼를 댄다 (smashed-keys)
        - 베라가 안쪽 부스로 선원 하나를 부른다. 은색 라이터를 테이블에 놓고, 절반만 참말인 제안을 한다
        - 해리건이 선원들에게 거래를 건넨다. 장부를 넘기면 서류를 돌려주고 천 달러를 얹어 주겠다고
      turn: >-
        베라가 장부를 들고 사라진다. 사건 당일 밤 클럽 앞 공중전화로 해리건에게 전화를 건 게 베라였다는 게 드러난다 (veronica-tip).
        모닝 스타 편집국에 불이 나고, 선원들 얼굴이 수배 전단에 찍혀 나온다.
        (베라의 호감도가 유대라면, 베라는 장부를 미끼로 해리건을 부두로 불러내려고 혼자 나간 것이다)
    - name: 9번 부두, 새벽
      goal: 여섯 시 기적이 울리기 전에, 빗속 부두에서 장부와 해리건과 남은 사람들의 목숨을 정리한다
      beats:
        - 새벽 부두. 해리건, 코르소의 사람들, 장부를 든 베라, 사진기를 든 노라가 한곳에 모인다 (dawn-pier)
        - 선원들과 가장 가까워진 NPC가 목숨을 건다. 총구 앞에 서거나, 방아쇠를 대신 당긴다
        - 장부를 누구에게 넘길지 선원들이 정한다. 신문, 코르소, 아니면 떠나는 배
      turn: 선원들의 선택이 결말(exits)을 정한다. 첫 배 기적이 울린다

locations:
  - id: rain-docks
    name: 9번 부두
    description: >-
      녹슨 크레인 밑에 젖은 화물 상자가 사람 키보다 높이 쌓였다. 가로등 불빛이 웅덩이마다 하나씩 떠 있다.
      상자 사이 골목 하나가 라일락 룸 뒷문으로 이어지고, 델라가 쓰러진 자리는 말뚝에서 스무 걸음이다. 새벽 첫 배도 여기서 뜬다.
    connects_to: [blue-lagoon, precinct-13]
    tags: [해안, 사건 현장, 위험]
  - id: blue-lagoon
    name: 라일락 룸
    description: >-
      보라색 네온 아래 계단 열두 칸을 내려가면 담배 연기가 천장에 고인 클럽이 나온다. 반달 모양 무대, 칠이 벗겨진 그랜드 피아노,
      벽을 따라 붉은 가죽 부스. 바텐더는 이십 년째 아무것도 못 봤다. 무대 뒤 창고 바닥에 자물쇠 달린 철문이 있다.
    connects_to: [rain-docks, della-room, lagoon-cellar]
    tags: [클럽, 사교, 정보]
  - id: lagoon-cellar
    name: 지하 도박장
    description: >-
      라일락 룸 무대 밑. 초록 펠트 테이블 네 개, 칩 부딪는 소리, 환기구로 빠지지 못한 연기.
      가장 안쪽이 코르소의 사무실이다. 금고 하나, 벽에 걸린 오래된 여자 사진 한 장. 목요일마다 해리건이 봉투를 받아 가는 뒷문이 있다.
    connects_to: [blue-lagoon]
    hidden: true
    tags: [비밀, 조직, 위험]
  - id: precinct-13
    name: 13관구 경찰서
    description: >-
      복도 형광등 하나가 계속 깜빡인다. 젖은 모직 냄새와 타자기 소리. 강력반 심문실에는 창문이 없고, 전구 하나가 탁자 높이까지 내려와 있다.
      증거물 보관실 열쇠는 해리건 책상 오른쪽 둘째 서랍에 있다.
    connects_to: [rain-docks, harbor-herald]
    tags: [경찰, 위험, 권력]
  - id: della-room
    name: 캐널 가 하숙집
    description: >-
      델라가 살던 삼 층 방. 창밖으로 라일락 룸 네온이 보인다. 누가 먼저 다녀가서 서랍이 전부 빠져 있다.
      축음기 위에 레코드 한 장. 화장대 거울에 립스틱으로 전화번호 하나가 적혀 있고, 끝자리 하나가 지워졌다.
    connects_to: [blue-lagoon, harbor-herald]
    tags: [단서, 쓸쓸함]
  - id: harbor-herald
    name: 모닝 스타 편집국
    description: >-
      밤새 불이 안 꺼지는 신문사. 지하 윤전기가 돌 때마다 책상 위 커피잔이 떤다. 재떨이마다 꽁초가 수북하다.
      노라 책상 뒤 암실에 아직 인화하지 않은 필름 두 통이 매달려 있다.
    connects_to: [precinct-13, della-room]
    tags: [정보, 언론, 은신처]

npcs:
  - id: veronica
    name: 베라 코르소
    role: 라일락 룸 안주인, 살바토레 코르소의 아내
    adult: true
    look: 물기 먹은 듯한 검은 웨이브 머리, 초록 새틴 드레스, 장갑 낀 손가락 사이의 담배. 은색 라이터를 늘 쥐고 있는데, 제 손으로 켜는 걸 본 사람이 없다.
    personality: >-
      남이 불을 붙여 줄 때까지 담배를 문 채 기다린다. 기다리는 동안 상대를 본다. 무엇을 주든 대가를 먼저 정하고,
      정하지 않은 호의는 받지 않는다. 델라를 동생처럼 챙겼다. 델라 이야기가 나오면 라이터 뚜껑을 여닫는다. 딸깍, 딸깍.
    voice: >-
      낮고 느린 해요체에 반말이 섞인다. 상대를 "선원 양반"이라 부르다가 마음이 기울면 이름을 부른다.
      질문을 받으면 질문으로 돌려준다. 진심을 말할 때만 반말이 빠지고 끝까지 존댓말을 쓴다.
    wants: 코르소에게서 벗어나 이 도시를 뜨는 것. 장부가 그 표값이다.
    fears: 델라가 자기 전화 한 통 때문에 죽었다는 게 알려지는 것. 코르소가 그걸 아는 것.
    location: blue-lagoon
    alertness: sharp
    affinity: 20
    romance: true
    likes:
      - 담배를 물었을 때 먼저 불을 붙여 주는 것
      - "\"코르소 부인\" 말고 베라라고 부르는 것"
      - 비가 안 오는 도시 이야기
    dislikes:
      - 딱하다는 얼굴
      - 코르소 앞에서 둘이 나눈 이야기를 꺼내는 것
      - 델라 이야기를 가볍게 하는 것
    behaviors:
