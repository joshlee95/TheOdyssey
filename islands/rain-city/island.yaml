      - npc: harrigan
        affinity: -80
        note: 무슨 짓을 하는지 다 안다. 증명을 못 할 뿐이다
      - npc: corso
        affinity: -40
        note: 언젠가 쓰고 싶은 거물. 델라 일만은 그가 아닐 거라는 감이 있다
      - npc: fingers
        affinity: 40
        note: 겁 많고 착한 사람. 해장 커피는 노라가 산다
      - npc: veronica
        affinity: -30
        note: 델라를 그 클럽에 붙잡아 둔 여자
    knows:
      - { secret: who-shot-della, share_at: friendly }
    sample_lines:
      - 증거 있어요? 없으면 소문이고 있으면 기사예요. 이 도시엔 소문이 차고 넘쳐요.
      - 해리건하고 커피 마셨다면서요. 맛있었어요? 그 사람 커피 값은 코르소가 내요.
      - 검시관 메모. 경찰 지급 38구경. 이건 오프 더 레코드로 해 두죠. 아직은.
      - 델라한테 만나자고 한 거, 나예요. 그러니까 이건 내 기사예요. 끝까지.
      - 불 좀 빌려줄래요? …아니다. 끊었어요. 오늘 밤은 안 피울래요.

secrets:
  - id: who-shot-della
    truth: >-
      델라 메이를 쏜 사람은 프랭크 해리건 경위다. 장부에 그의 이름이 가장 많이 나온다. 해리건은 뒷골목에서 델라를 쏜 뒤
      블록을 한 바퀴 돌아 정문 쪽에서 출동한 것처럼 차를 몰고 들어왔다.
    hints:
      - 신고 전화가 걸려 오기 전에 해리건의 차가 현장에 도착했다. 차 보닛 위의 빗물은 이미 말라 있었다. 엔진이 한참 돌았다는 뜻이다.
      - 검시관 메모에 따르면 델라 몸에서 나온 탄은 경찰 지급 38구경이다.
      - 해리건 구두 밑창 홈에 붉은 벽돌 흙이 끼어 있다. 그 벽돌은 라일락 룸 뒷골목에만 깔려 있다.
    reveal_when: 검시관 메모를 손에 넣고 해리건 구두를 확인하거나, 새미가 골목에서 본 회색 코트 이야기를 할 때
  - id: ledger-in-piano
    truth: >-
      경찰과 조직 사이에 오간 돈을 적은 장부는, 델라가 마지막 무대에 오르기 전 라일락 룸 그랜드 피아노의 가장 낮은 도 건반 밑에 넣어 두었다.
      델라는 노라와 만나는 자리에 빈손으로 나가서, 안전하다고 판단되면 장부가 있는 곳을 알려 줄 생각이었다.
    hints:
      - 델라는 마지막 무대에서 순서에 없던 '낮은 데서 기다려'를 불렀다. 후렴 끝 음이 피아노의 가장 낮은 도다.
      - 그 피아노의 가장 낮은 도는 누르면 소리가 먹먹하게 죽는다. 다른 건반은 멀쩡하다.
      - 새미는 누가 피아노에 손만 대도 목소리가 높아진다. 전에는 손님이 건반을 눌러도 웃어넘겼다.
    reveal_when: 피아노를 뜯어보거나, 새미의 신뢰를 얻거나, 델라 레코드의 가사를 다시 들어 볼 때
  - id: veronica-tip
    truth: >-
      사건 당일 밤 베라가 클럽 앞 공중전화로 해리건에게 델라의 약속 장소를 알려 주었다. 델라가 겁을 먹고 장부를 내놓으면
      그걸 가로채 코르소에게서 달아날 생각이었다. 해리건이 총을 꺼낼 줄은 몰랐다.
    hints:
      - 베라의 은색 라이터 옆에 경찰서 앞 '맥기네 술집' 성냥갑이 놓여 있다. 해리건이 쓰는 성냥이다.
      - 사건 직전 베라가 공중전화 부스에서 누군가와 통화하는 걸 새미가 봤다.
      - 델라 이야기가 나오면 베라는 라이터 뚜껑을 여닫는다. 불은 켜지 않는다.
    reveal_when: 성냥갑이 어디서 났는지 캐거나, 새미의 말을 듣거나, 베라의 신뢰를 얻었을 때
  - id: corso-daughter
    truth: >-
      델라 메이는 살바토레 코르소의 딸이다. 적들 손에 약점이 될까 봐 평생 숨기고, 가수와 사장으로만 곁에 두었다.
      베라만 이 사실을 안다.
    hints:
      - 코르소 사무실 벽의 오래된 여자 사진은 델라 로켓 목걸이 속 사진과 같은 사람이다.
      - 델라 장례비를 누가 이름 없이 전부 치렀다. 장의사가 받은 지폐는 전부 새 돈이었다.
      - 코르소는 델라가 죽은 뒤로 무대 쪽을 보지 않는다. 앉을 때도 의자를 벽 쪽으로 돌린다.
    reveal_when: 로켓 목걸이 사진과 사무실 사진을 맞춰 보거나, 코르소의 신뢰를 얻었을 때

events:
  - id: gunshot-arrival
    kind: arrival
    when: 상륙 직후, 선원들이 9번 부두에 밧줄을 묶을 때
    scene: >-
      총소리 한 발. 골목 끝에서 빨간 우산이 뒤집혀 한 바퀴 구른다. 초록 드레스를 입은 여자가 웅덩이에 얼굴을 대고 엎어져 있다.
      손목이 아직 따뜻하다. 선원들이 다가선 지 일 분, 전조등이 골목을 하얗게 쓸고 들어온다. 전화를 건 사람은 없다.
      회색 트렌치코트가 차에서 내리더니 이쑤시개를 입 반대쪽으로 옮긴다. "이런. 운이 없네, 친구들."
    stakes: 선원들의 항해 서류, 그리고 첫 일 분 동안 현장에서 무엇을 챙기느냐
  - id: memorial-set
    kind: location
    where: blue-lagoon
    when: 선원들이 처음 라일락 룸에 들어설 때
    scene: >-
      무대 조명 아래 마이크 스탠드 하나. 베라가 초록 새틴 자락을 끌고 나와 델라 노래를 부른다. 둘째 소절에서 음 하나가 낮게 떨어진다.
      피아노 앞 새미는 가장 낮은 도가 나올 때마다 손을 한 박자 늦게 올린다. 안쪽 부스의 은발 남자는 노래가 끝나도 손을 테이블에서 떼지 않는다.
    stakes: 베라, 새미, 코르소와의 첫인상. 누구에게 먼저 다가가느냐
  - id: interrogation-room
    kind: location
    where: precinct-13
    when: 선원들이 13관구에 끌려가거나 제 발로 찾아갈 때
    scene: >-
      창문 없는 방. 전구가 탁자 바로 위에 매달려 있다. 해리건이 38구경 탄 한 알을 탁자에 굴린다. 탄이 선원 앞에서 멈춘다.
      "친구 코트 주머니에서 나왔어." 선원 누구도 처음 보는 탄이다. 해리건은 담배를 권하고, 다음엔 커피를, 마지막으로 만년필을 내민다.
    stakes: 누가 유치장에 들어가느냐, 해리건이 말실수를 하느냐
  - id: smashed-keys
    kind: clock
    clock: 4
    when: 위기 시계가 4칸 찼을 때
    scene: >-
      라일락 룸 계단으로 구둣발 소리가 한꺼번에 내려온다. 테이블이 넘어가고 손님들이 뒷문으로 빠진다. 도끼 한 자루가 피아노 뚜껑에 박힌다.
      새미가 두 손을 건반 위에 펴고 엎드린다. 두 번째 도끼질이 그 옆 나무를 쪼갠다. 같은 시각, 모닝 스타 이 층 창문이 주황색으로 밝아진다.
    stakes: >-
      장부를 아직 못 찾았다면 해리건 손에 넘어갈 판이고, 이미 찾았다면 이제 선원들이 표적이다. 새미와 노라가 무사한지도 걸려 있다
    once: true
  - id: payphone-ring
    kind: random
    when: 선원들이 빗속 거리를 걷거나 누군가를 기다릴 때
    scene: >-
      길모퉁이 공중전화가 울린다. 받으면 모르는 목소리가 한 문장만 말하고 끊는다. 참말일 수도 있고, 해리건의 덫이나 코르소의 시험일 수도 있다.
      수화기를 걸자 길 건너 세워 둔 차 안에서 담뱃불 하나가 꺼진다.
    stakes: 제보가 참말인지 가려내지 못하면 그 뒤로 미행이 붙는다
    once: false
  - id: dawn-pier
    kind: finale
    clock: 8
    when: 위기 시계가 가득 찼을 때, 새벽 여섯 시 첫 배 기적이 울리기 직전
    scene: >-
      잿빛 새벽. 9번 부두. 비는 그대로다. 크레인 밑에 해리건이 권총을 들고 서 있다. 화물 상자 뒤에서 코르소의 사람들이 하나씩 걸어 나온다.
      베라가 장부를 코트 안에 품고 말뚝 옆에 섰다. 상자 더미 위 어딘가에서 노라의 플래시 전구가 한 번 터진다.
      해리건이 이쑤시개를 뱉는다. "자, 친구들. 보고서에 누구 이름 적을까." 먼 데서 첫 배가 기적을 짧게 한 번 운다. 연습이다.
    stakes: 장부, 델라 죽음에 붙을 이름, 가장 가까워진 NPC의 목숨, 선원들의 서류

trials:
  - id: first-minute
    name: 첫 일 분
    act: 1
    description: >-
      해리건의 차가 골목에 닿기까지 일 분. 빗물이 바닥을 쓸어 가고 있고, 엎어진 델라의 오른손이 뭔가를 쥐고 있다.
    test: >-
      빗속에서 현장을 빠르게 훑는다 (조사 또는 감지 DC 15). 해리건이 오기 전에 물건을 챙기려면 손재주 DC 13.
      챙기지 않고 눈으로만 외워 두는 것도 방법이다
    on_success: >-
      델라 손에 쥐인 맥기네 술집 성냥갑과, 골목 바닥에 찍힌 붉은 벽돌 흙 발자국을 확보한다. 해리건은 선원들이 뭘 봤는지 모른다
    on_fail: 해리건이 현장을 전부 걷어 간다. 선원 한 명이 몸수색을 당하고, 그 주머니에 뭔가가 들어간다. 위기 시계 +1
  - id: bright-lamp
    name: 탁자 위 전구
    act: 2
    description: >-
      13관구 심문실. 해리건은 같은 질문을 밤새 되풀이하고, 전구는 눈앞에서 뜨겁고, 진술서는 탁자 위에서 만년필과 함께 기다린다.
      서명하면 집에 보내 준다고, 해리건은 몇 번이고 다정하게 말한다.
    test: >-
      밤샘 심문을 버틴다 (건강 내성 DC 13). 버티는 동안 해리건 말에서 틈을 잡는다 (통찰 DC 16, 해리건은 눈치가 빠르다).
      밖에 있는 선원이 보석금이나 뒷문 열쇠를 구해 올 수도 있다
    on_success: >-
      해리건이 말을 헛디딘다. "그 여자가 초록 드레스를 입고…" 아직 신문에도 안 나온 이야기다. 선원들은 해리건이 먼저 현장에 있었다는 걸 확신한다
    on_fail: >-
      선원 한 명이 유치장에 갇혀 다음 장면에 못 나온다. 꺼내려면 코르소의 호의(빚)를 받거나, 노라에게 기사로 압박해 달라고 부탁해야 한다
  - id: cellar-hand
    name: 초록 펠트
    act: 2
    description: >-
      코르소는 질문에 대답하는 대신 초록 펠트 위에 카드를 돌린다. 이기면 대답을 주고, 지면 빚이 된다.
      벽에 부하 둘이 기대 섰다. 둘 다 모자를 벗지 않았다.
    test: >-
      포커로 정당하게 이긴다 (통찰 DC 15로 코르소의 패를 읽는다). 속임수는 손재주 DC 19, 들키면 코르소 호감도가 적대로 떨어진다.
      아니면 카드를 내려놓고 델라 노래 제목을 대며 부탁한다 (설득 DC 16)
    on_success: 코르소가 금고를 연다. 델라가 누구였는지, 그가 무엇을 원하는지 말한다
    on_fail: 선원들이 코르소에게 빚을 하나 진다. 결말 직전에 그 빚을 받으러 온다 (family-business 쪽으로 기운다)
  - id: rain-shootout
    name: 스무 걸음
    act: 4
    description: >-
      새벽 부두에서 총이 터진다. 해리건의 부하들, 코르소의 사람들, 빗물과 화물 상자와 크레인 그림자.
      장부를 든 사람과 선원들 사이에 몸을 숨길 데 없는 스무 걸음이 있다.
    test: >-
      빗속을 가로질러 장부나 NPC에게 닿는다 (곡예 또는 운동 DC 15, 은신으로 돌아가면 DC 13). 누군가를 대신해 총구 앞에 서기로 하면
      판정 없이 성공하지만 그 선원은 쓰러진다
    on_success: 선원들이 고른 결말을 끝까지 밀고 갈 수 있다. 장부는 선원 손에 있다
    on_fail: >-
      장부가 웅덩이에 떨어져 몇 장의 잉크가 번진다. 선원 한 명이 총상을 입어 다음 섬을 최대 HP 절반으로 시작하고,
      선원들과 가장 가까운 NPC 한 명이 이 새벽을 넘기지 못한다

blessings:
  - id: rain-callus
    name: 빗속의 굳은살
    description: 이 도시의 밤을 무릎 꿇지 않고 넘긴 사람은 비를 맞아도 어깨를 움츠리지 않게 된다.
    condition: 심문실에서 서명하지 않거나, 총격전에서 동료나 NPC를 몸으로 감싼다
    effect: 캠페인 동안 한 번, 쓰러질 피해를 입었을 때 HP 1로 버틴다. 총알이 뼈를 비껴간다
    lasts: campaign
  - id: dellas-last-song
    name: 델라의 마지막 노래
    description: 델라가 끝을 못 부른 노래를 끝까지 들은 사람은 그 곡조를 잊지 못한다. 힘들 때 흥얼거리게 된다.
    condition: 새미와 함께 '낮은 데서 기다려'를 끝까지 치거나 듣고, 델라가 죽은 이유를 세상에 알린다
    effect: 영감 +1. 캠페인 동안 섬마다 한 번, 공연 판정에 이점
    lasts: campaign
  - id: rain-hunch
    name: 뒤통수의 귀
    description: 이 도시 사람들은 등 뒤 발소리를 빗소리와 가려 듣는다. 선원도 그 귀를 얻는다.
    condition: 노라나 새미의 호감도가 신뢰 이상이 된다
    effect: 이 섬에 있는 동안 미행, 매복, 함정을 알아채는 감지 판정에 이점
    lasts: island

exits:
  - id: front-page
    name: 1면
    condition: 장부를 노라에게 넘겨 신문에 싣고, 해리건이 델라를 쐈다는 증거를 같이 내놓는다
    epilogue: >-
      모닝 스타 조간 1면. 해리건의 이름이 굵은 활자로 박혀 있다. 윤전기가 도는 동안 선원들은 편집국 창가에서 식은 커피를 마신다.
      해리건은 정오 전에 수갑을 찬다. 장부에 적힌 다른 이름들은 아직 멀쩡히 출근한다.
      그날 아침 두 시간쯤 비가 그친다. 노라가 창틀에 불 안 붙인 담배를 내려놓는다. "이것도 기사로 쓸게요."
    grants: [dellas-record]
  - id: family-business
    name: 집안일
    condition: 해리건을 코르소에게 넘기거나, 코르소가 부두에서 해리건을 처리하도록 둔다
    epilogue: >-
      새벽 부두에서 총소리 한 발. 그다음은 빗소리뿐이다. 다음 날 해리건 이름이 실종자 명단 맨 아래에 오른다.
      코르소가 선원들의 서류를 직접 가져와 돌려주며 모자를 벗는다. "제 딸 빚을 갚아 주셨습니다. 이제 제가 빚을 졌군요."
      장부는 코르소 금고로 들어간다. 이 도시 주인은 바뀌지 않았다. 목요일 봉투를 받으러 오는 얼굴만 바뀐다.
    grants: [corso-marker]
  - id: last-boat
    name: 첫 배
    condition: 장부와 진실을 두고 첫 배 기적에 맞춰 도시를 빠져나간다. 베라를 태울 수도, 두고 갈 수도 있다
    epilogue: >-
      배가 말뚝에서 풀린다. 뒤에서 해리건이 서명한 보고서가 사실이 된다. 외지 선원들이 가수를 쏘고 달아났다.
      베라를 태웠다면, 베라는 난간에 기대 은색 라이터를 바다에 던지려다 도로 주머니에 넣는다. 다음 항구에서 인사 없이 내린다.
      두고 왔다면, 베라는 부두 끝에서 담배를 문 채 서 있다. 불을 붙여 줄 사람이 없다. 비는 수평선까지 따라온다.
    grants: [veronica-lighter]

treasures:
  - id: dellas-record
    name: 델라 메이의 마지막 레코드
    description: 라벨에 립스틱으로 '낮은 데서 기다려'라고 적힌 레코드. 두 번째 소절 긁힌 자리에서 숨 들이쉬는 소리가 난다.
    kind: anomaly
    power: >-
      다음 섬에서 한 번, 이 레코드를 틀면 그 자리에 숨겨진 것이 어디 있는지 가리키는 노랫말이 흘러나온다.
      가사는 그 세계의 말로 바뀐다. 끝 소절은 늘 비어 있다.
  - id: corso-marker
    name: 코르소의 은화
    description: 흰 카네이션이 새겨진 은화 한 닢. 뒷면에 '한 번'이라고만 찍혀 있다.
    kind: mundane
    power: >-
      한 번, 어느 섬에서든 그 세계의 뒷골목이나 암시장이나 범죄 조직에 이 은화를 내밀면 묻지 않고 부탁 하나를 들어준다.
      어느 세계든 밤장사하는 사람들은 서로 아는 사이다.
  - id: veronica-lighter
    name: 베라의 은색 라이터
    description: 제 주인이 한 번도 켜지 않은 은색 라이터. 뚜껑 안쪽에 'V에게, 비 안 오는 데서'라고 새겨져 있다.
    kind: mundane
    power: >-
      한 번, 라이터를 켜 두고 누군가에게 질문하면 불꽃이 꺼질 때까지 상대가 거짓말을 할 때마다 불꽃이 파랗게 눕는다.

gm_notes:
  pacing: >-
    총소리로 열고 끝까지 조인다. 1막은 비와 네온 속에서 사람들 얼굴을 익히는 탐색, 2막은 심문과 도박으로 압박하다 코르소의 금고에서 방향을 튼다.
    3막은 배신과 불로 바닥을 친다. 4막 부두는 짧고 거칠게. 장면이 바뀔 때 선원 한 명에게 빗속 독백 한두 줄을 청해도 좋다.
  do:
    - 서술은 3인칭 과거형으로 쓰되 하드보일드 리듬을 지킨다. 짧은 문장, 구체적인 물건, 판단 없는 관찰. 비유는 장면당 하나.
    - NPC는 전부 뭔가를 숨기고 뭔가를 원한다. 착한 사람도 손이 깨끗하지 않다.
    - 폭력은 무겁고 값을 치르게 한다. 총 한 발이 나면 그 장면의 모든 사람이 움직임을 바꾼다.
    - 베라와 노라 사이의 긴장은 대사와 소품으로 쌓는다. 불을 붙여 주느냐, 담배를 끊었느냐, 누구 커피를 마시느냐.
    - 해리건은 만화 악당이 아니다. 자기 논리가 있고 겁이 많은 사람으로 연기한다. 농담이 늘면 몰린 거다.
    - 이름은 한 번 정한 대로 부른다. 코르소는 '코르소 씨', 해리건은 '경위' 또는 '해리건', 베라는 남들 앞에서 '코르소 부인'.
  dont:
    - 성적인 장면을 직접 그리지 않는다. 문이 닫히고, 다음 장면은 재떨이와 빗소리에서 시작한다.
    - 1막에서 해리건이 범인이라고 대놓고 알려 주지 않는다. 너무 빨리 온 차는 그냥 이상한 일로 남긴다.
    - 선원들이 아무리 잘해도 도시가 깨끗해지는 결말은 주지 않는다. 누아르의 승리는 늘 반쪽이다.
    - 코르소의 딸 이야기를 2막 전환점 전에 흘리지 않는다.
