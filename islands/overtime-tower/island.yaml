# 테스트 섬: 동진빌딩 (현대 한국 오피스 블랙코미디)
# 이야기 설계 근거: docs/critique/overtime-tower.md, docs/style/story-guide.md
schema_version: 1
id: overtime-tower

meta:
  title: 동진빌딩
  author: 오디세이 테스트팩
  tagline: 오늘 자정까지 영업2팀에서 희망퇴직자 한 명의 이름을 올려야 한다. 나가고 싶은 사람은 둘이다.
  tone: [블랙코미디, 오피스, 씁쓸함]
  players: { min: 1, max: 5 }
  session_minutes: 90
  content:
    rating: teen
    lines:
      - 자살 또는 자해 장면
      - 실존 기업이나 실존 인물을 특정해 조롱하는 것
      - 직장 내 성희롱을 웃음거리로 쓰는 것
    veils:
      - 과로로 쓰러지는 순간의 구체적 묘사

public:
  rumor: >-
    바다 한가운데 32층짜리 유리 빌딩이 있다고 한다. 밤에도 불이 안 꺼진다. 옆을 지나간 화물선 갑판원 말로는,
    그 건물 회전문은 퇴근 결재서를 들고 가야만 돈다고 했다.
  first_sight: >-
    수평선에 파란 유리벽이 햇빛을 튕긴다. 옥상 전광판에 "동진물산 · 우리는 멈추지 않습니다"가 흘러간다.
    건물 밑동은 바닷물에 잠겨 있고, 1층 회전문만 물 위로 나와 부두 노릇을 한다.
  arrival: >-
    배를 대자 회전문이 한 칸 돌아 선원들을 안으로 들인다. 복사기 토너 냄새가 난다.
    로비 안내 데스크에 "영업2팀 신규 입사자" 명찰 여러 개가 가지런히 놓여 있다. 이름 칸은 비어 있다.

world:
  reality:
    genre: [현대, 오피스, 블랙코미디]
    era: 2020년대 한국 중견기업 본사. 구조조정 소문이 석 달째 돈다
    magic: hidden
    technology: modern
    speech: >-
      사내 존댓말에 결재 용어가 섞인다. "확인 부탁드립니다", "그건 저희 팀 업무가 아닌데요", "일단 기안부터 올려 봐".
      용건은 첫 문장에 말하고, 윗사람 앞에선 말끝이 반 음 올라간다. 진짜 속내는 탕비실에서만 나온다.
    outsiders: >-
      주민들은 선원들을 오늘 입사한 영업2팀 신규 입사자로 안다. 배 타고 왔다는 말은 신입 농담으로 넘긴다.
      선배들은 친절하다. 친절 끝에는 늘 인수인계 파일이 붙어 온다.
    crossover:
      magic: transformed
      tech: works
      note: >-
        다른 세계의 마법과 이능은 사내 결재 서류로 나타난다. 불을 부르면 손에 '화염 사용 품의서'가 생기고,
        결재 칸에 도장이 많이 찍힐수록 불이 커진다. 본인 사인만 있으면 라이터 불 정도다. 기계는 멀쩡히 돌지만
        밖으로 보낸 메시지는 전부 참조란에 박 부장이 달려 그에게 들어간다.
    appearance: blend_in
  premise: >-
    이 건물은 서류대로 움직인다. 기이한 것은 그것 하나다. 나머지는 평범한 회사의 평범한 밤이다.
    전무가 오늘 오후 영업2팀에 지시를 내렸다. 자정까지 희망퇴직자 한 명의 이름을 올릴 것. 위로금은 열여덟 달치.
    그 한 자리를 원하는 사람이 둘이다. 11개월째 13층 대기발령실에서 버티는 윤 과장, 그리고 아무도 모르게
    제주행 편도 항공권을 사 둔 김 대리. 이름을 써야 하는 사람은 박 부장이고, 누군가 나가야 인턴 이하늘의
    정규직 전환 예산이 생긴다. 경비원 최 씨는 총무팀으로부터 윤 과장의 퇴근 기록을 '조기 퇴근'으로 고치라는
    지시를 받았다. 근태 불량이 되면 윤 과장은 희망퇴직 대상에서 빠지고 징계 절차로 넘어간다.
    선원들은 퇴근 결재서에 담당·과장·부장 세 도장을 받아야 회전문을 나갈 수 있다. 도장을 받으려면 누군가의 편을 들게 된다.
  laws:
    - 회전문은 결재가 끝난 퇴근 결재서를 가진 사람에게만 돈다. 결재선은 담당, 과장(윤정민), 부장(박영태)이다.
    - 결재 없이 한 일은 다음 날 아침 원래대로 돌아간다. 몰래 찍은 도장, 허락 없이 옮긴 서류, 결재 없이 켠 불 모두.
    - 조직도에 없는 곳에는 엘리베이터가 서지 않는다. 13층 대기발령실은 조직도에 없어서 비상계단으로만 간다.
    - 자정에 32층 팩스로 넘어간 명단에 이름이 있는 사람은 사원증이 꺼지고, 결재 없이도 회전문이 그에게 돈다.
  start_location: lobby
  clock:
    name: 자정 팩스 (오후 6시 → 자정)
    segments: 6

story:
  theme: 떠날 자격은 누가 정하는가
  hook: >-
    오후 5시 59분 사내 방송이 켜진다. "영업2팀 금일 전원 야근입니다. 신규 입사자 포함." 선원들이 나가려면
    퇴근 결재서에 도장 셋이 필요한데, 과장 칸의 주인은 13층에 있고 부장은 23시까지 보고서를 끝내라고 한다.
  acts:
    - name: 입사 첫날 야근
      goal: 퇴근 결재선을 알고, 영업2팀 사람들과 안면을 튼다
      beats:
        - 박 부장이 23시 마감 보고서를 신입들 책상에 나눠 준다. "이거 끝나면 도장 찍어 줄게. 알지?"
        - 김 대리가 모니터를 보며 혼잣말로 보고서 요령을 흘린다. 책상 밑에는 제주공항 태그가 달린 캐리어가 있다
        - 이 인턴이 믹스커피를 타 주며 과장 도장은 13층에서 받아야 한다고, 계단으로만 갈 수 있다고 알려 준다
      turn: 박 부장 자리에서 "희망퇴직 대상자 명단 (영업2팀 1명) · 자정 팩스" 서식을 본다. 이름 칸은 비어 있다
    - name: 13층
      goal: 윤 과장의 도장을 받고, 그 한 자리를 둘러싼 사정을 알아낸다
      beats:
        - 비상계단의 층수 표시가 12층 다음 14층을 가리킨다. 서류에 없는 층을 찾아 내려가야 한다
        - 대기발령실. 윤 과장이 벽을 보고 앉아 조간신문을 넘긴다. 11개월째 같은 자리다
        - 윤 과장은 도장을 찍어 주는 조건으로 명단에 누구 이름이 올라가는지 알려 달라고 한다
        - 로비에서 최 씨가 총무팀 전화를 받고 "예, 22시까지요" 하고 끊는다
      turn: >-
        중반의 반전. 김 대리가 박 부장에게 제 이름을 명단에 써 달라고 먼저 부탁했다는 사실이 드러난다
        (kim-wants-out). 선원들이 지키려던 사람이 사실 나가려던 사람이다. 한 자리를 원하는 사람이 둘이 된다
    - name: 22시
      goal: 누구의 이름이 들어갈지 판가름할 재료를 모은다
      beats:
        - 최 씨가 윤 과장의 원본 출입 기록을 앞에 두고 볼펜을 쥔다. 고칠지 말지 선원들에게 묻지 않는다
        - 탕비실에서 김 대리와 윤 과장이 11개월 만에 처음 마주친다. 둘 다 서로가 그 자리를 원한다는 걸 안다
        - 박 부장 서랍 맨 밑 칸에 2024년 실적 보고서가 있다. 과장 칸 사인의 획이 윤 과장 것과 다르다 (forged-signature)
      turn: 23시. 박 부장이 빈 명단을 들고 선원들 앞에 선다. "너희가 정해. 도장은 찍어 줄게. 누구 이름 쓸래?"
    - name: 자정 팩스
      goal: 명단에 누구 이름이 들어가는지 선원들이 정한다
      beats:
        - 32층 전무실 팩스 앞. 전무에게서 전화가 온다. "이름 하나. 깔끔하게."
        - 이 인턴이 선원들에게 묻는다. 자기 전환이 걸린 일이라 말을 아끼다가 결국 묻는다
        - 가장 가까워진 NPC가 선원에게 자기 편을 들어 달라고, 혹은 들지 말라고 말한다
      turn: 선원들의 선택이 결말을 정한다

locations:
  - id: lobby
    name: 1층 로비
    description: >-
      대리석 바닥에 보안 게이트 넷, 쉬지 않고 도는 회전문. 경비실 CCTV 모니터 서른여섯 대 앞에 최 씨가 앉아 있다.
      책상에는 출입 기록 대장이 펼쳐져 있고, 옆에 총무팀 내선 번호가 적힌 쪽지가 붙어 있다.
    connects_to: [sales-floor, executive-suite]
    tags: [안전, 출입]
  - id: sales-floor
    name: 7층 영업2팀 사무실
    description: >-
      파티션으로 칸을 나눈 사무실. 화이트보드에 "이번 달 목표: 달성할 때까지". 창가 끝 부장석 서랍 맨 밑 칸은
      바닥이 들린다. 김 대리 책상 밑에 먼지 앉은 기내용 캐리어가 있다.
    connects_to: [lobby, pantry, emergency-stairs]
    tags: [사무실]
  - id: pantry
    name: 7층 탕비실
    description: >-
      믹스커피 박스가 천장까지 쌓인 좁은 방. 전자레인지 문에 "사용 후 청소 좀!!!" 쪽지. 여기서 한 말은 결재선을 안 탄다.
      사람들이 진짜 속내를 꺼내는 곳이다.
    connects_to: [sales-floor]
    tags: [안전, 뒷담화]
  - id: emergency-stairs
    name: 비상계단
    description: >-
      초록 비상구 등만 깜빡이는 콘크리트 계단. 층수 표시는 서류대로라서 12층 다음이 14층이다.
      층계참마다 피우다 만 꽁초, 난간에 말려 있는 "힘내자!" 포스트잇.
    connects_to: [sales-floor, floor-thirteen]
    tags: [위험]
  - id: floor-thirteen
    name: 13층 대기발령실
    description: >-
      조직도에 없는 층. 형광등 절반이 나간 넓은 사무실에 책상이 하나뿐이다. 창 없는 벽을 보고 윤 과장이 앉아 있고,
      책상 위에는 조간신문과 결재 도장, 11개월 치 '대기' 스탬프가 찍힌 출근부가 있다.
    connects_to: [emergency-stairs]
    hidden: true
    tags: [숨겨진 곳]
  - id: executive-suite
    name: 32층 전무실
    description: >-
      임원 전용 엘리베이터로만 가는 층. 전무는 퇴근하고 없다. 불 꺼진 방에 팩스기 한 대만 초록 불을 켜 두었다.
      자정에 이 팩스로 넘어간 명단이 인사팀으로 간다.
    connects_to: [lobby]
    tags: [결말]

npcs:
  - id: park-bujang
    name: 박영태
    role: 영업2팀 부장. 자정까지 명단에 이름 하나를 써야 하는 사람
    adult: true
    look: >-
      무스로 넘긴 올백 머리, 넥타이 핀, 오후 6시에 멈춘 금장 손목시계. 오른손 검지와 엄지 끝에 붉은 인주가 배어 있다.
      말할 때 그 손가락으로 책상을 두 번씩 두드린다.
    personality: >-
      큰소리치는 중간관리자. 팀원 회식비를 제 카드로 긁고, 그 얘기를 세 번은 한다. 결정해야 할 때마다 "위에서"를 찾는다.
      오늘은 위에서 결정을 그에게 넘겼다.
    voice: >-
      반말 섞인 훈계조. 선원들은 "어이 신입", 김 대리는 "소연 씨". 문장 끝에 "알지?"를 붙여 대답할 틈을 막는다.
      곤란한 질문엔 "그건 위에서 정하는 거고"로 넘긴다. 진심일 때만 존댓말이 섞인다.
    wants: >-
      팀을 지키는 것. 이 인턴을 정규직으로 올리는 것. 그리고 2024년 보고서의 과장 칸에 자기가 대신 사인했다는 사실을 묻어 두는 것.
    fears: 명단에 이름을 쓴 사람으로 남는 것. 대리 서명이 드러나 팀이 통째로 날아가는 것
    location: sales-floor
    alertness: sharp
    affinity: 0
    likes: [보고서를 제시간에 끝내는 것, 팀 사람을 챙기는 모습, 그의 왕년 이야기를 끝까지 들어 주는 것]
    dislikes: [윗선에 직접 연락하는 것, 서랍을 뒤지는 것, 김 대리 앞에서 명단 얘기를 꺼내는 것]
    behaviors:
      hostile: 선원들의 보고서를 오탈자 하나로 반려하고, 퇴근 결재서의 부장 칸을 끝까지 비워 둔다
      wary: 명단 얘기가 나오면 "그건 위에서 정하는 거고"로 자르고, 선원들을 따로 불러 무엇을 들었는지 캐묻는다
      friendly: 컵라면을 사 주며 보고서를 반만 해도 된다고 봐준다. 누가 나가야 인턴 예산이 생기는지 흘린다
      trusted: 김 대리의 부탁을 털어놓고, 서랍 맨 밑 칸 열쇠를 선원에게 맡긴다. "내가 줬다고 하지 마. 아니, 해도 돼."
      bonded: 명단을 선원 앞에 내밀며 결정을 맡긴다. 대리 서명이 드러날 걸 알면서 2024년 보고서를 건넨다
    romance: false
    relations:
      - { npc: kim-daeri, affinity: 40, note: 제일 믿는 부하. 그녀가 이름을 써 달라고 한 뒤로 눈을 못 마주친다 }
      - { npc: yoon-gwajang, affinity: -30, note: 사인을 거부한 부하. 죄책감이 짜증으로 나온다 }
      - { npc: intern-lee, affinity: 55, note: 전환시켜 주겠다고 약속했다 }
      - { npc: guard-choi, affinity: 10, note: 매일 인사는 하는 사이 }
    knows:
      - { secret: kim-wants-out, share_at: trusted }
      - { secret: forged-signature, share_at: bonded }
    sample_lines:
      - (경계) 어이 신입, 퇴근? 퇴근은 일이 끝나야 하는 거지. 이거 23시까지. 알지?
      - (경계) 명단? 그건 위에서 정하는 거고. 너희는 보고서나 해.
      - (호의) 컵라면 먹을래? 내가 왕년에 사우디에서 말이야. 됐다, 이 얘긴 다음에 하자.
      - (신뢰) 소연 씨가 먼저 왔어. 자기 이름 써 달라고. 부장님이 써 주세요, 그러더라. 내가 그걸 어떻게 쓰냐.
      - (유대) 너희가 정해. 난 22년 동안 남의 칸에 도장만 찍었어. 이번엔 내 칸이 무겁다.
  - id: kim-daeri
    name: 김소연
    role: 영업2팀 7년차 대리. 오늘 밤 이 회사를 나가고 싶은 사람
    adult: true
    look: >-
