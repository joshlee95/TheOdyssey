# 동진빌딩: 퇴근이 안 되는 회사 건물 하나가 섬 전체인 오피스 블랙코미디 호러.
schema_version: 1
id: overtime-tower

meta:
  title: 동진빌딩
  author: 오디세이 테스트팩
  tagline: 오후 5시 59분에 사내 방송이 켜진다. "금일 전 직원 야근입니다. 신규 입사자 포함."
  tone: [블랙코미디, 오피스 호러, 풍자, 씁쓸함]
  players: { min: 2, max: 5 }
  session_minutes: 100
  content:
    rating: teen
    lines:
      - 자살 또는 자해 장면
      - 실존 기업이나 실존 인물을 특정해 조롱하는 것
      - 직장 내 성희롱을 웃음거리로 쓰는 것
    veils:
      - 과로사의 구체적인 순간 묘사
      - 1997년 회장실에서 있었던 죽음의 세부

public:
  rumor: >-
    바다 한복판에 32층짜리 유리 빌딩이 서 있다는 얘기가 있다. 밤에도 불이 안 꺼진다고 한다.
    옆을 지나간 화물선 갑판원은 창마다 모니터 앞에 굽은 등이 하나씩 있었다고 했다.
    무전기에서 "퇴근하셨어요?" 하는 여자 목소리가 났는데, 채널을 돌려도 따라왔다고.
  first_sight: >-
    수평선에 파란 유리벽이 햇빛을 튕긴다. 옥상 전광판에 "동진물산 · 우리는 멈추지 않습니다"가 흘러간다.
    건물 밑동은 바닷물에 잠겨 있고, 1층 회전문만 물 위로 나와 부두 삼아 천천히 돈다.
  arrival: >-
    배를 대자 회전문이 한 칸 돌아 선원들을 안으로 들인다. 에어컨 바람에서 복사기 토너 냄새가 난다.
    어디선가 메신저 알림음이 짧게 두 번 울린다. 로비 벽시계는 5시 59분에서 초침만 움직인다.

world:
  reality:
    genre: [현대, 오피스, 블랙코미디, 호러]
    era: 2020년대 한국 중견기업 본사. 사내 달력은 전부 월요일이고, 인테리어 곳곳에 1990년대가 남아 있다
    magic: hidden
    technology: modern
    speech: >-
      사내 존댓말에 결재 용어가 섞인다. "확인 부탁드립니다", "그건 저희 팀 업무가 아닌데요", "일단 기안부터 올려 봐".
      용건은 첫 문장에 말하고, 윗사람 앞에선 말끝이 반 음 올라간다. 욕은 모니터 보면서 입 모양으로만 한다.
    outsiders: >-
      주민들은 선원들을 영업2팀 신규 입사자로 안다. 배 타고 왔다는 말은 신입 농담으로 넘긴다.
      "첫날부터 칼퇴할 건데요" 하면 다들 웃으면서 커피를 한 잔 더 타 준다. 선배들은 친절하다. 친절 끝에는 늘 인수인계 파일이 붙어 온다.
    crossover:
      magic: transformed
      tech: works
      note: >-
        다른 세계의 마법과 이능은 사내 결재 서류로 나타난다. 불을 부르려 하면 손에 '화염 사용 품의서'가 생기고,
        결재 칸에 도장이 많이 찍힐수록 불이 커진다. 본인 사인만 있으면 라이터 불 정도다.
        치유는 '병가 승인서', 순간이동은 '출장 명령서'가 된다. 다른 세계의 기계는 멀쩡히 돌아간다.
        다만 통신 장비는 전부 사내 인트라넷에만 붙고, 밖으로 보낸 메시지는 참조란에 박 부장이 달려서 그에게 들어간다.
    appearance: blend_in
  premise: >-
    동진물산 본사 동진빌딩은 1987년 창업주 노상철 회장이 로비 벽에 사훈 "영원히, 멈추지 않고"를 새긴 날부터 그 말대로 굴러간다.
    건물은 직원들의 야근 시간으로 불을 켠다. 오후 6시 이후 켜진 창 하나가 퇴근 못 한 사람 하나의 저녁이다.
    자정을 넘긴 사람은 사원증을 받고, 다음 날 아침 대신 같은 월요일을 다시 산다.
    회장은 1997년 외환위기 때 회장실에서 죽었다. 회장 직인은 지금도 혼자 결재를 한다.
    직인은 회사가 계속 굴러가는 데 보탬이 되는 서류에만 내려앉는다. 퇴근 결재서는 양식부터 통과가 안 되게 짜여 있다.
    너무 오래 남은 사람은 얼굴이 잘못 스캔한 서류처럼 번진 채, 층 안내도에 없는 13층 기획조정실 미결함으로 간다.
  laws:
    - 오후 6시 이후 "먼저 들어가 보겠습니다"라고 말한 사람은 반드시 누군가에게서 "아, 가기 전에 이것만" 하고 업무 하나를 받는다.
    - 결재선을 거치지 않은 행동은 건물이 없던 일로 돌린다. 몰래 연 문은 돌아보면 닫혀 있고, 옮긴 물건은 제자리에 가 있다.
    - 자정을 넘긴 사람에게 사원증이 나온다. 사원증을 건 사람이 회전문을 지나면 로비로 도로 들어온다.
    - 회전문은 담당·과장·부장·회장 네 칸이 다 찍힌 퇴근 결재서를 든 사람에게만 바깥쪽으로 돈다.
  start_location: lobby
  clock:
    name: 막차가 끊긴다 (오후 6시에서 자정까지)
    segments: 6

story:
  theme: 다들 버티는 곳에서 먼저 나가는 사람은 배신자인가, 길을 여는 사람인가?
  hook: >-
    회전문을 지나자 선원들 옷이 정장으로 바뀌고, 목에 '영업2팀 신규 입사자' 임시 출입증이 걸린다.
    배로 돌아가려고 회전문을 밀면 문은 한 바퀴 돌아 그들을 로비에 도로 내려놓는다.
    경비실 창구에서 최 씨가 모자챙을 들지도 않고 말한다. "퇴근은 결재 받고 하는 기다. 신입이 그것도 모르나."
  acts:
    - name: 입사 첫날
      goal: 건물의 법칙을 배우고, 퇴근 결재서 양식과 결재선(담당·과장·부장·회장)을 알아낸다
      beats:
        - 오후 6시 정각에 사내 방송이 전원 야근을 알리고, 선원들의 옷이 정장으로 바뀐다 (welcome-orientation)
        - 박 부장이 "잠깐 회의 좀 하자" 하고 신규 입사자에게 23시 마감 보고서 서른 장을 나눠 준다 (urgent-meeting)
        - 탕비실에서 김 대리와 이 인턴이 믹스커피를 타며 야근 괴담을 푼다. 김 대리는 "다 헛소리예요" 하면서 괴담마다 층수를 정확히 짚는다 (pantry-ghost-stories)
      turn: >-
        첫 결재 시도. 박 부장이 퇴근 결재서의 과장 칸을 볼펜 끝으로 두 번 친다. "과장님 도장부터 받아 와야지."
        칸에는 '과장 윤정민'이 인쇄돼 있다. 옆자리 김 대리가 치던 엑셀 셀에서 커서가 멈춘다. 영업2팀 과장 자리는 11년째 비어 있다
    - name: 결재선을 따라
      goal: 과장 칸의 주인 윤정민을 찾아 있지도 않은 13층에 올라간다
      beats:
        - 경비실 CCTV 서른여섯 화면. 불 꺼진 창 쪽마다 빈 책상이 하나씩 늘어 있다. 최 씨는 "불 꺼진다꼬 퇴근한 거 아이다"라고만 한다
        - 김 대리가 신입 때 사수였던 윤 과장 얘기를 꺼내고, 비상계단으로 13층 가는 순서를 알려 준다 (empty-seat)
        - 오후 9시, 엘리베이터가 한꺼번에 서고 버튼판 맨 위에 없던 13 버튼에 불이 들어온다 (thirteenth-button)
        - 13층 복도. 얼굴이 번진 사람들이 서류를 넘기는 사이로 윤 과장이 걸어와 "검토 후 회신드렸었습니다" 하고 인사한다 (unfiled-corridor)
      turn: >-
        윤 과장이 내민 출입 기록부에 이 인턴의 입사일이 적혀 있다. 2014년 3월 3일 월요일.
        선원들의 임시 출입증 입사일 칸에 오늘 날짜가 한 획씩 찍히기 시작한다. 이 건물은 야근으로 불을 켜고,
        퇴근 결재는 처음부터 통과되지 않게 짜여 있다 (overtime-fuel, eternal-intern)
    - name: 회장실
      goal: 마지막 칸의 주인인 회장 직인이 무엇인지 알아내고, 그것을 움직일 방법을 찾는다
      beats:
        - 박 부장 책상 서랍 이중바닥에서 회장실 출입 카드를 찾거나, 박 부장에게서 직접 받아 낸다. 그의 오른손 검지에는 늘 인주가 묻어 있다
        - 최 씨가 경비실 금고에서 1997년 VHS 테이프를 꺼낸다. 빈 회장실 화면 속에서 도장이 혼자 들렸다가 서류 위로 내려온다
        - 회장실. 먼지 앉은 빈 의자 앞 인주함 옆에서 직인이 쿵, 쿵 결재를 하고 있다 (chairman-seal)
        - 이 인턴이 회장실 유리 진열장에 비친 서른다섯 살 얼굴을 본다. 그는 대답 대신 "넵" 소리를 세 번 연달아 내고 주저앉는다
      turn: >-
        박 부장이 뒤따라 들어와 직인을 집어 든다. "22년이야. 22년을 내가 이거 대신 찍었어."
        그가 인주를 묻히는 서류는 선원들의 결재서가 아니라 자기 상무 승진 품의서다. 승진이 결재되면 이 건물의 새 주인이 된다고 믿는다.
        박 부장의 호감도가 신뢰 이상이면 그는 직인을 선원들 쪽으로 밀고, 넥타이 매듭에 손가락을 넣는다
    - name: 자정의 결재
      goal: 누구의 퇴근을 결재할지 정한다. 자기들만인지, 건물 전체인지, 결재 없이 계단으로 달아날지
      beats:
        - 자정. 사내 방송이 철야 확정을 알리고, 층마다 프린터가 사원증을 뱉고, 미결자들이 계단을 타고 모든 층으로 내려온다 (midnight-lockdown)
        - 가장 가까워진 NPC가 대가를 자청한다. 윤 과장은 결재선에서 자기 이름을 지우겠다고, 최 씨는 마스터 스위치를 내리겠다고, 김 대리는 캐리어를 끌고 따라나서겠다고 한다
        - 직인 앞의 선택. 네 칸 찍힌 우리 몫의 퇴근 결재서, 전 직원을 내보낼 회사 청산 품의서, 아니면 비상계단
      turn: 선원들의 선택이 결말(exits)을 정한다

locations:
  - id: lobby
    name: 1층 로비
    description: >-
      대리석 바닥에 보안 게이트 네 개, 쉬지 않고 도는 회전문. 벽에는 금박 사훈 "영원히, 멈추지 않고"가 붙어 있다.
      경비실에 CCTV 모니터가 서른여섯 대 있고, 오른쪽 맨 아래 한 대는 늘 회장실을 비춘다. 건물에서 시계가 맞는 곳은 로비뿐이다.
    connects_to: [sales-floor, emergency-stairs]
    tags: [시작, 경비, 출구]
  - id: sales-floor
    name: 7층 영업2팀 사무실
    description: >-
      파티션으로 칸을 나눈 사무실. 모니터 불빛이 켜진 자리마다 등이 하나씩 굽어 있다.
      화이트보드에 "이번 달 목표: 달성할 때까지"라고 적혀 있고, 창가 끝 부장석에서 헛기침이 난다.
      구석 김 대리 책상 밑에 먼지 앉은 기내용 캐리어가 있다. 손잡이에 제주공항 수하물 태그가 3년째 붙어 있다.
    connects_to: [lobby, pantry, emergency-stairs, executive-suite]
    tags: [사내 정치, 업무, 감시]
  - id: pantry
    name: 7층 탕비실
    description: >-
      믹스커피 박스가 천장까지 쌓인 좁은 방. 전자레인지 문에 "사용 후 청소 좀!!!" 쪽지가 붙어 있다.
      여기서 한 말은 결재선을 안 탄다. 괴담도 뒷담화도 다 여기서 나온다.
      정수기 옆 손바닥만 한 거울은 비친 사람을 실제 근속 연수만큼 늙혀 보여 준다.
    connects_to: [sales-floor]
    tags: [안전, 소문, 휴식]
  - id: emergency-stairs
    name: 비상계단
    description: >-
      초록 비상구 등만 깜빡이는 콘크리트 계단. 층수 표시가 가끔 틀려서 12층 다음이 14층이었다가 다시 12층이 된다.
      층계참마다 피우다 만 꽁초가 있고, 난간에 누가 붙인 "힘내자!" 포스트잇이 말려 있다.
    connects_to: [lobby, sales-floor, floor-thirteen]
    tags: [괴담, 위험, 탈출로]
  - id: floor-thirteen
    name: 13층 기획조정실
    description: >-
      엘리베이터 버튼판에도 층 안내도에도 없는 층. 끝이 안 보이는 복도 양쪽으로 '미결' 서류함이 늘어서 있다.
      얼굴이 번진 사람들이 파쇄기 소리에 박자를 맞춰 서류를 넘긴다. 천장 형광등 하나가 1997년부터 깜빡이는 중이다.
    connects_to: [emergency-stairs, executive-suite]
    hidden: true
    tags: [미결자, 공포, 진실]
  - id: executive-suite
    name: 32층 회장실
    description: >-
      임원 전용 엘리베이터로만 올라가는 꼭대기 층. 발목까지 빠지는 카펫, 오동나무 책상, 먼지가 하얗게 앉은 가죽 의자.
      책상 위 인주함 옆에서 회장 직인이 저 혼자 들렸다가 서류 위로 쿵 내려온다. 벽에 걸린 회장 사진은 1997년 것이 마지막이다.
    connects_to: [sales-floor, floor-thirteen]
    tags: [결재, 클라이맥스, 금지 구역]

npcs:
  - id: park-bujang
    name: 박영태
    role: 영업2팀 부장. 22년째 부장이고, 몰래 회장 직인을 대신 찍어 온 사람
    adult: true
    look: >-
      무스로 넘긴 올백 머리, 넥타이 핀, 오후 6시에 멈춘 금장 손목시계. 오른손 검지와 엄지 끝에
      붉은 인주가 배어 있다. 말할 때 그 손가락으로 책상을 두 번씩 두드린다.
    personality: >-
      윗사람 전화는 일어서서 받고, 부하 보고서는 앉은 채 첫 장만 넘긴다. 회의 때마다 누가 먼저 나가나 세어 둔다.
      사실은 겁이 많다. 승진만 하면 건물이 자기를 놓아줄 거라 믿고 22년을 버텼다. 퇴근 시간이 가까우면 괜히 화장실을 두 번 간다.
    voice: >-
