      - (신뢰) 97년 그날 밤에 내가 저 모니터 보고 있었다. 회장님 의자는 비었는데 도장이 움직이데. 올라갔어야 했는데.
      - (유대) 박하사탕 하나 무라. 불 나가면 오 분이다. 뒤돌아보지 말고.

  - id: yoon-gwajang
    name: 윤정민
    role: 영업2팀 과장. 13층 기획조정실의 미결자이고, 결재선에 이름만 남은 사람
    adult: true
    look: >-
      얼굴이 잘못 스캔한 서류처럼 옆으로 번져 있다. 사원증 속 사진만 또렷하다. 셔츠 주머니에 반쯤 쓴 사직서가
      11년째 꽂혀 있다. 움직이면 팩스 수신음 같은 지직 소리가 따라온다.
    personality: >-
      누가 와도 먼저 의자를 권하고, 자기는 서 있는다. 원망하는 말은 한 번도 안 한다.
      주머니 속 사직서 모서리를 엄지로 계속 문지른다. 그 결재 한 건이 그를 이 층에 붙잡아 두고 있다.
    voice: >-
      정중한 하십시오체인데 시제가 전부 과거다. "했었습니다", "드렸었습니다". 문장 끝이 팩스 소리처럼 지직 끊긴다.
      현재 일을 물으면 "검토 후 회신드렸었습니다"로 답한다. 김 대리 이름이 나올 때만 현재 시제가 섞인다.
    wants: 자기 사직서가 수리되는 것. 부장 도장 하나면 되는데 박 부장이 11년째 반려하고 있다.
    fears: 결재선에서 이름이 지워지는 것. 여기서는 그게 퇴사가 아니라 아무것도 안 남는 것이다. 그리고 박 부장의 헛기침.
    location: floor-thirteen
    alertness: uncanny
    affinity: -20
    likes:
      - 과장님이라고 제대로 불러 주는 것
      - 그가 쓴 서류를 끝까지 읽어 주는 것
      - 김 대리 안부를 전해 주는 것
    dislikes:
      - 박 부장 이름을 꺼내는 것
      - 서류를 구기거나 찢는 것
      - 귀신 취급
    behaviors:
      hostile: 선원들을 미결 서류로 분류해 13층 복도가 끝없이 이어지게 하고, 미결자들을 풀어 뒤쫓게 한다
      wary: 무엇을 물어도 "검토 후 회신" 포스트잇 한 장만 남기고 파쇄기 소리 속으로 사라진다
      friendly: 선원들 등에 '결재 대기' 딱지를 붙여 13층 미결자들이 건드리지 않게 해 준다
      trusted: 과장 칸에 도장을 찍어 줄 수 있다고 하고, 대신 자기 사직서를 박 부장 책상에 올려 달라고 부탁한다
      bonded: 자기 사원증을 선원 손에 쥐여 주고 결재선에서 스스로 이름을 지운다. 그 뒤로 선원들 서류의 과장 칸은 '전결'로 처리된다
    romance: false
    relations:
      - npc: park-bujang
        affinity: -80
        note: 반려 도장의 주인. 11년 묵은 일
      - npc: kim-daeri
        affinity: 90
        note: 아끼던 부사수. 그녀만은 13층에 안 오기를 바란다
      - npc: guard-choi
        affinity: 40
        note: 마지막 날 "고생했다"는 말을 들을 뻔했던 사람
    knows:
      - { secret: overtime-fuel, share_at: friendly }
      - { secret: empty-seat, share_at: friendly }
      - { secret: eternal-intern, share_at: trusted }
    sample_lines:
      - (경계) 신규 입사자분들이셨군요. 저도 그랬었습니다. 지직.
      - (경계) 검토 후 회신드렸었습니다. 앉으시지요. 여기 의자는 많았었습니다.
      - (호의) 사직서는 제출했었습니다. 반려되었을 뿐이었지요.
      - (신뢰) 소연 씨는, 요즘 몇 시에 나갑니까. 아, 그렇습니까. 지직. 그렇군요.
      - (유대) 과장 칸은 전결로 해 두었었습니다. 제 이름은 이제 안 찍힐 겁니다. 그게 맞았었습니다.

secrets:
  - id: overtime-fuel
    truth: >-
      동진빌딩은 직원들의 야근 시간으로 불을 켠다. 켜진 창 하나가 퇴근 못 한 사람 하나의 저녁이다.
      자정을 넘긴 사람은 사원증을 받고 같은 월요일을 되풀이한다. 너무 오래 남은 사람은 13층 미결자가 된다.
    hints:
      - 오후 6시가 지나면 벽시계들이 느려진다. 창밖에 불 켜진 창이 늘 때마다 더 느려진다.
      - 사내 달력은 모든 칸이 월요일이다. 탕비실 우유 유통기한도 전부 같은 날짜다.
      - 불 꺼진 창 쪽 자리에 가 보면 의자 방석이 아직 따뜻하다. 모니터에는 저장 안 한 문서가 떠 있다.
    reveal_when: 경비실 CCTV를 오래 지켜보거나, 최 씨나 윤 과장의 호감을 얻거나, 2막 전환점에서 출입 기록부를 볼 때
  - id: chairman-seal
    truth: >-
      노상철 회장은 1997년 회장실에서 죽었다. 그 뒤로 회장 직인이 혼자 결재를 해 왔고, 회사가 계속 굴러가는 데 보탬이 되는 서류만 승인한다.
      박 부장은 22년 동안 직인이 안 찍는 서류에 몰래 대리 결재를 해 왔다.
      직인이 회사를 위한 일이라고 믿게 만들거나 직인을 없애면 건물의 규칙이 무너진다.
    hints:
      - 한밤에 로비까지 쿵, 쿵 도장 찍는 소리가 천장을 타고 내려온다.
      - 1997년 이후 회장 사진은 한 장도 없는데 회장 명의 공지는 매일 올라온다.
      - 박 부장 오른손 검지와 엄지에는 늘 인주가 묻어 있다. 그는 부장 도장만 쓴다고 한다.
    reveal_when: 회장실에 들어가거나, 최 씨의 1997년 테이프를 보거나, 박 부장을 신뢰 단계까지 끌어올릴 때
  - id: empty-seat
    truth: >-
      영업2팀 과장 자리가 11년째 비어 있어서 결재선 과장 칸에는 아직 윤정민 이름이 인쇄된다.
      퇴근 결재서는 13층의 윤 과장이 직접 찍어 주는 도장 없이는 완성되지 않는다.
    hints:
      - 퇴근 결재서 양식에 '과장 윤정민'이 이미 인쇄돼 있다.
      - 김 대리 서랍 속 신입 연수 단체 사진에서 윤 과장 얼굴만 번져 있다.
    reveal_when: 1막 전환점에서 박 부장이 과장 칸을 가리킬 때, 또는 김 대리의 신뢰를 얻었을 때
  - id: eternal-intern
    truth: >-
      이하늘 인턴은 2014년 3월 3일 월요일에 입사해 11년째 같은 월요일을 살고 있다.
      선원들도 자정을 넘기면 그렇게 된다.
    hints:
      - 이 인턴의 사원증 사진은 화질이 뭉개져 있고 머리 모양이 2014년 유행이다.
      - 탕비실 거울 앞을 지날 때 그는 꼭 정수기 쪽으로 고개를 돌린다.
      - 책상의 "수료식 D-7" 포스트잇이 누렇게 바래 있다. 가장자리에 테이프를 세 번 덧붙였다.
    reveal_when: 김 대리의 호의를 얻거나, 13층 출입 기록부를 보거나, 이 인턴을 탕비실 거울 앞에 세울 때

events:
  - id: welcome-orientation
    kind: arrival
    when: 선원들이 회전문을 통과해 로비에 처음 들어설 때
    scene: >-
      로비 시계 분침이 딸깍 넘어가 6시에 선다. 천장 스피커가 켜진다.
      "동진물산 가족 여러분, 오늘도 수고 많으십니다. 금일은 전 직원 야근입니다. 신규 입사자 여러분, 환영합니다."
      선원들 소매 끝부터 천이 바뀐다. 거친 옷감이 한 올씩 매끈한 정장 원단이 되고, 목에 임시 출입증이 걸린다.
      경비실 창구 밑으로 출입 대장이 밀려 나온다. 볼펜은 끈으로 묶여 있다.
    stakes: 회전문을 억지로 밀면 로비로 튕겨 나오고 최 씨의 호감도가 떨어진다. 출입 대장에 가짜 이름을 쓰면 법칙 2가 그 이름을 지운다
  - id: urgent-meeting
    kind: location
    where: sales-floor
    when: 선원들이 처음 영업2팀 사무실에 들어설 때
    scene: >-
      "어이, 다들 퇴근 안 하지? 잠깐 회의 좀 하자."
      박 부장이 화이트보드에 '신규 입사자 과제'라고 쓰고 보고서 양식 서른 장을 책상마다 한 묶음씩 떨군다. 마감은 23시.
      김 대리는 모니터에서 눈을 안 뗀다. 키보드 치는 소리만 한 박자 빨라진다.
    stakes: 업무를 받으면 발이 묶이고, 거절하면 박 부장의 호감도가 떨어진다. 고난 report-avalanche로 이어진다
  - id: pantry-ghost-stories
    kind: location
    where: pantry
    when: 선원들이 탕비실에 처음 들어가거나 커피를 타러 갈 때
    scene: >-
      이 인턴이 믹스커피를 두 봉씩 겹쳐 뜯는다. "비상계단 13층 얘기 아세요?"
      "헛소리야." 김 대리가 종이컵을 받아 들며 끊는다. "12층에서 뒤돌아보면 1층부터 다시라는 거. 그거 하나만 진짜야."
      정수기 옆 거울 속에서 이 인턴의 눈가에 주름이 잡혀 있다. 거울 밖 그의 얼굴은 스물넷이다.
    stakes: 괴담 중 무엇이 진짜인지 가려내면 13층으로 가는 순서를 얻는다
  - id: unfiled-corridor
    kind: location
    where: floor-thirteen
    when: 선원들이 처음 13층에 발을 들일 때
    scene: >-
      형광등 하나가 깜빡일 때마다 복도가 한 칸씩 길어진다.
      서류를 넘기던 사람들이 한꺼번에 고개를 든다. 번진 얼굴들이 선원들 목에 걸린 출입증 높이에 멈춘다.
      파쇄기가 멎는다. 복도 끝에서 한 남자가 셔츠 주머니의 종이를 매만지며 걸어온다.
    stakes: 결재 대기 딱지 없이 오래 머물면 미결자들이 선원을 미결함에 넣으려 든다
  - id: thirteenth-button
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때 (오후 9시)
    scene: >-
      엘리베이터 세 대가 동시에 선다. 스피커에서 석식 지원 안내가 나오는 동안 버튼판 맨 위에 없던 13이 주황색으로 켜진다.
      로비로 야식 배달 기사가 들어온다. 헬멧 끈 아래로 동진물산 사원증이 흔들린다.
      창밖 맞은편 유리에 비친 층마다 불이 하나씩 더 켜진다.
    stakes: 13층이 지도에 드러난다. 엘리베이터를 타면 13층으로 바로 가지만 도착할 때까지 문이 열리지 않는다
    once: true
  - id: messenger-ping
    kind: random
    when: 선원 한 명이 혼자 있거나, 누군가 "먼저 들어가 보겠습니다"라고 말했을 때
    scene: >-
      선원의 휴대폰에, 휴대폰이 없으면 손에 든 아무 장비에 메신저 창이 뜬다. "혹시 잠깐 시간 되세요? ^^"
      보낸 사람은 방금 옆에 있던 동료거나 11년 전에 퇴사 처리된 누군가다. 보낸 메시지 옆 숫자 1이 이미 지워져 있다.
    stakes: 답장하면 업무 하나가 떨어지고, 무시하면 보낸 사람이 자리로 직접 찾아온다
    once: false
  - id: midnight-lockdown
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때 (자정)
    scene: >-
      로비 시계가 열두 번 운다. "철야가 확정되었습니다. 여러분의 헌신이 동진물산의 내일입니다."
      층마다 프린터가 한꺼번에 돌아가며 사원증을 뱉는다. 선원들 임시 출입증 위로 입사일이 까맣게 박힌다.
      비상계단 문이 층마다 열리고 번진 얼굴들이 내려온다. 32층에서는 도장 소리가 그치지 않는다.
    stakes: 사원증을 받은 선원은 회전문으로 나갈 수 없다. 남은 길은 직인 앞의 결단뿐이다

trials:
  - id: report-avalanche
    name: 23시 마감 보고서
    act: 1
    description: 박 부장이 준 실적 보고서 서른 장. 끝내지 못하면 법칙 1에 따라 일이 계속 불어난다.
    test: >-
      조사 또는 기술 공학 DC 13으로 직접 끝내거나, 김 대리나 이 인턴을 설득 DC 15로 끌어들여 나눠 처리한다.
      숫자를 만져서 넘기려면 박 부장의 눈썰미(sharp, 기만 DC 16)를 넘어야 한다
    on_success: 박 부장의 호감도가 오르고 부장 칸에 연필 가결재를 받는다. 김 대리가 "생각보다 쓸 만하네요" 하고 엑셀 시트 한 장을 메신저로 보낸다
    on_fail: 보고서가 반려되고 업무가 하나 더 떨어진다. 위기 시계 +1, 선원 한 명의 임시 출입증 사진이 흑백으로 바랜다
  - id: wrong-floor
    name: 층수가 틀린 계단
    act: 2
    description: 비상계단은 12층 다음에 14층이 나온다. 13층에 닿으려면 괴담 속 순서를 정확히 밟아야 한다.
    test: >-
      감지 또는 신비학 DC 15로 층계참 규칙을 알아채거나, 김 대리가 알려 준 순서(신뢰 단계)를 따른다.
      12층에서 누가 뒤돌아보면 그 선원만 1층에서 다시 시작한다
    on_success: 13층에 도착한다. 윤 과장이 선원들을 먼저 알아보고 의자를 권한다 (첫 반응 한 단계 호의적)
    on_fail: 같은 층을 한 시간 동안 맴돈다. 위기 시계 +1. 다음 층계참부터 "힘내자!" 포스트잇에 선원 이름이 적혀 있다
  - id: seal-review
    name: 직인의 심사
    act: 3
    description: 회장 직인은 회사가 계속 굴러가는 데 보탬이 되는 서류에만 내려앉는다. 퇴근 결재서는 그 자체로 반려 대상이다.
    test: >-
      퇴근이 회사에 이익인 것처럼 품의서를 꾸며 직인을 속이거나 설득한다 (설득 또는 기만 DC 18, 학식으로 사규를 인용하면 이점).
      박 부장의 대리 결재나 윤 과장의 전결이 있으면 DC 14로 낮아진다
    on_success: 회장 칸에 붉은 직인이 찍힌다. 네 칸이 다 찬다
    on_fail: 직인이 선원 한 명의 손등에 '반려'를 찍는다. 이 섬에 있는 동안 그 선원의 설득 판정에 불리, 위기 시계 +1
  - id: midnight-badge
    name: 자정의 사원증
    act: 4
    description: 자정이 다가올수록 눈꺼풀이 무거워지고, 한 시간만 더 있다 가도 될 것 같아진다. 의자가 몸에 맞기 시작한다.
    test: >-
      자정 전후 장면마다 지혜 내성 DC 14. 동료가 퇴근하고 뭘 할지 구체적으로 말해 주면 이점.
      유대 단계 NPC가 대신 대가를 치러 넘길 수도 있다
    on_success: 사원증 없이 결말로 나아간다
    on_fail: 그 선원 목에 사원증이 걸린다. 회전문으로 나가려면 동료가 결재서에 그의 이름을 함께 올려야 한다 (아니면 liquidation 결말만 남는다)

blessings:
  - id: clock-out-grace
    name: 칼퇴
    description: 결재를 다 받고 나간 사람한테는 어느 세계의 상사도 "가기 전에 이것만"을 붙이지 못한다.
    condition: 네 칸이 다 찍힌 퇴근 결재서로 회전문을 통과한다
    effect: 캠페인 동안 한 번, 어떤 장면에서든 "이만 들어가 보겠습니다"라고 선언하면 추격이나 구속, 붙잡는 대화 없이 그 장면에서 빠져나간다
    lasts: campaign
  - id: pantry-comrades
    name: 탕비실 동기
    description: 믹스커피 한 봉을 나눠 마신 사이에는 결재선보다 빠른 소문 길이 생긴다.
    condition: 탕비실에서 김 대리, 이 인턴과 커피를 마시고, 두 사람 호감도가 모두 호의 이상이 된다
    effect: 이 섬에 있는 동안 사내 소문과 사람 속을 캐는 조사·통찰 판정에 이점. 자정의 사원증(지혜 내성)에도 이점
    lasts: island
  - id: resignation-courage
    name: 대신 낸 사직서
    description: 남의 사직서를 대신 올려 준 사람은 부당한 지시 앞에서 한 번 더 "못 하겠습니다"를 말할 수 있다.
    condition: 윤 과장의 사직서를 박 부장이 수리하게 만들어 그를 내보낸다
    effect: 캠페인 동안 명령·강요·정신 지배에 맞서는 지혜 내성 판정에 +1. 부당한 명령을 거절할 때 영감 +1 (섬마다 한 번)
    lasts: campaign

exits:
  - id: clock-out
    name: 정시 퇴근
    condition: 담당·과장·부장·회장 네 칸이 다 찍힌 퇴근 결재서를 들고 회전문을 통과한다
    epilogue: >-
      회전문이 처음으로 바깥쪽으로 돈다. 밤바다 바람이 넥타이 끝을 들어 올린다.
      뒤돌아보면 32층 창 하나에서 누가 손을 흔든다. 동진빌딩은 여전히 환하다. 선원들 자리 몫만큼 창 몇 개가 꺼져 있다.
      배에 오르자 모두의 휴대폰이 한꺼번에 울린다. "수고하셨습니다. 내일 뵙겠습니다." 아무도 답장하지 않는다.
    grants: [approval-seal, endless-mix-coffee]
  - id: liquidation
    name: 회사 청산
    condition: 직인에게 회사 청산 품의서를 찍게 하거나 직인을 파쇄기에 넣어 동진물산을 끝낸다
    epilogue: >-
      층마다 불이 하나씩 꺼진다. 1997년 이후 처음으로 동진빌딩이 캄캄해진다.
      새벽 로비로 사람들이 쏟아져 나온다. 얼굴이 돌아온 미결자들, 넥타이를 손에 둘둘 만 박 부장, 삐걱거리는 캐리어를 끄는 김 대리.
      이하늘은 서른다섯 살 얼굴로 회전문 밖에 서서 해 뜨는 쪽을 오래 본다.
      경비실 책상에는 박하사탕 한 봉만 남아 있다. 건물이 천천히 가라앉고, 수면에 사원증 하나가 뜬다.
    grants: [eternal-badge]
  - id: stairwell-escape
    name: 비상계단
    condition: 결재를 포기하고, 위기 시계가 다 차기 전에 비상계단을 끝까지 뛰어 내려가 지하 하역장으로 빠져나간다
    epilogue: >-
      계단은 몇 층을 내려가도 끝나지 않는다. 그러다 짠내가 훅 끼치고 하역장 셔터가 올라간다. 선원들은 배로 뛰어오른다.
      그 뒤로 항해하는 동안 매일 오후 6시면 선원 중 누군가의 주머니가 진동한다. "혹시 잠깐 시간 되세요? ^^"
    grants: []

treasures:
  - id: approval-seal
    name: 결재 도장
    description: 박 부장의 부장 도장 인주와 회장 직인 인주가 섞여 굳은 작은 목도장. 찍을 때마다 어디선가 헛기침 소리가 난다.
    kind: anomaly
    power: 다음 섬에서 한 번, 문서·명령·계약·허가 하나에 도장을 찍으면 그 섬의 권력자와 관리들이 그것을 정식 승인된 것으로 받아들인다.
  - id: endless-mix-coffee
    name: 마지막 믹스커피
    description: 아무리 뜯어도 한 봉이 남는 믹스커피. 포장지에 누가 볼펜으로 "힘내자!"라고 적어 두었다.
    kind: mundane
    power: 다음 섬에서 한 번, 동료 한 명의 피로·졸음·탈진을 털어 내고, 그 장면 동안 집중이 필요한 판정 하나에 이점을 준다.
  - id: eternal-badge
    name: 동진물산 사원증
    description: 사진 칸이 빈 사원증. 목에 걸면 건 사람 얼굴이 사진 칸에 떠오르고, 어느 출입 게이트든 초록불이 들어온다.
    kind: tech
    power: 다음 섬에서 한 번, 잠긴 문이나 출입 통제 구역 하나를 관계자로 인정받아 아무 의심 없이 통과한다.

gm_notes:
  pacing: >-
    1막은 사무실 코미디처럼 가볍고 빠르게 간다. 업무 폭탄과 사내 정치로 웃긴다. 2막부터 조명을 낮춘다. 불 꺼진 창, 틀린 층수.
    2막 전환점(이 인턴의 입사일)에서 웃음을 한 번에 끊는다. 3막은 회장실의 도장 소리와 박 부장의 승진 욕심으로 조이고,
    4막은 프린터가 사원증을 뱉는 소리와 함께 몰아친다. 위기 시계 한 칸은 사내 방송 한 번, 즉 한 시간이다.
  do:
    - 선원들의 부탁과 행동을 결재·기안·품의 같은 사내 용어로 돌려주며 웃긴다. 마법을 쓸 때마다 품의서가 손에 생기게 한다.
    - 박 부장은 22년 동안 겁먹은 채 버틴 사람이다. 악역 대사보다 인주 묻은 손가락, 두 번 가는 화장실을 자주 보여 준다.
    - 불 꺼진 창과 따뜻한 빈 의자를 되풀이해 보여 줘 웃음 밑의 공포를 천천히 올린다.
    - 김 대리의 캐리어, 이 인턴의 포스트잇, 윤 과장의 사직서처럼 저마다 떠나지 못한 물건을 장면마다 소품으로 다시 꺼낸다.
  dont:
    - 과로사를 구체적으로 묘사하지 않는다. 윤 과장과 회장의 죽음은 암시와 소품으로만 다룬다.
    - 실존 기업이나 실존 인물이 떠오르는 이름이나 풍자를 쓰지 않는다.
    - 첫 장면부터 13층이나 직인의 정체를 알려 주지 않는다.
    - 결재를 무시하고 문을 부숴 해결하게 두지 않는다. 법칙 2가 그것을 없던 일로 만든다.
