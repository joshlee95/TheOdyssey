secrets:
  - id: kim-wants-out
    truth: >-
      김 대리는 일주일 전 박 부장에게 희망퇴직 명단에 자기 이름을 써 달라고 먼저 부탁했다.
      새벽 7시 제주행 편도 항공권도 사 두었다.
    hints:
      - 탈출.xlsx의 마흔일곱 번째 시트는 휴가 계획표가 아니라 위로금 계산표다
      - 최 씨가 말한다. 아가씨가 지난주 10년치 출입 기록 사본을 떼어 갔다고. 퇴직 서류에 붙이는 거다
      - 박 부장 서랍의 명단 초안 이름 칸에 김 대리 필체로 "본인 희망"이라고 연필로 적혀 있다
      - 캐리어 앞주머니의 항공권은 왕복이 아니라 편도다
    reveal_when: 2막 전환점. 선원들이 단서 둘 이상을 모았거나, 박 부장·김 대리가 신뢰 단계에서 털어놓을 때
  - id: forged-signature
    truth: >-
      2024년 영업2팀 실적 보고서의 과장 칸 사인은 윤 과장이 아니라 박 부장이 대신 한 것이다.
      윤 과장이 거부하자 박 부장이 서명했고, 그 부풀린 보고서 덕분에 작년 구조조정에서 팀이 살아남았다.
      윤 과장은 '보고 체계 문란'으로 대기발령을 받았다.
    hints:
      - 윤 과장은 그 보고서를 본 적도 없다고 말한다
      - 보고서의 과장 칸 사인은 획이 두껍고, 끝에 붉은 인주 자국이 번져 있다. 박 부장 손끝에 늘 인주가 묻어 있다
      - 이 인턴이 부장님 책상에서 이면지에 윤 과장 이름을 여러 번 연습한 흔적을 본 적이 있다
    reveal_when: 3막. 박 부장 서랍 맨 밑 칸을 열거나 박 부장이 유대 단계일 때. 전무와 담판을 지으려면 이 보고서가 필요하다
  - id: attendance-order
    truth: >-
      총무팀이 전무실 요청으로 최 씨에게 윤 과장의 지난 11개월 퇴근 기록을 '조기 퇴근'으로 고쳐 22시까지 올리라고 했다.
      근태 불량이 되면 윤 과장은 희망퇴직 대상에서 빠지고 징계 절차로 간다. 명단을 한 명으로 깔끔하게 만들려는 행정 처리다.
    hints:
      - 최 씨 책상에 총무팀 내선 번호와 "22시"라고 적힌 쪽지가 붙어 있다
      - 최 씨가 출입 대장의 윤 과장 줄을 한참 보다가 덮는다
      - 윤 과장이 말한다. 요즘 총무팀이 자기 출근부를 두 번이나 가져갔다고
    reveal_when: 최 씨가 신뢰 단계이거나, 22시 근태 마감 이벤트 때

events:
  - id: five-fifty-nine
    kind: arrival
    when: 선원들이 로비를 지나 7층에 올라왔을 때
    scene: >-
      사내 방송이 켜진다. "영업2팀 금일 전원 야근입니다. 신규 입사자 포함." 박 부장이 서류 뭉치를 들고 걸어와
      선원들 책상에 한 부씩 떨어뜨린다. "23시까지. 끝나면 도장 찍어 줄게. 퇴근 결재선은 담당, 과장, 부장. 알지?"
      과장 칸 이름은 윤정민. 박 부장은 그 이름을 읽지 않고 넘어간다.
    stakes: 보고서를 끝내지 못하면 부장 칸 도장은 없다
  - id: thirteen-door
    kind: location
    where: floor-thirteen
    when: 선원들이 처음 13층 대기발령실에 들어섰을 때
    scene: >-
      넓은 사무실에 책상이 하나다. 윤 과장이 신문을 한 장 넘기고 나서야 고개를 든다. "신규 입사자분들이시군요."
      책상 위 결재 도장 옆에 '대기' 스탬프가 찍힌 출근부가 펼쳐져 있다. 오늘 날짜 칸만 비어 있다.
    stakes: 과장 칸 도장. 그리고 윤 과장이 원하는 대답
  - id: ten-pm-deadline
    kind: clock
    clock: 3
    when: 22시. 위기 시계가 3칸 찼을 때
    scene: >-
      로비 경비실 전화가 울린다. 최 씨가 두 번 울리고 나서 받는다. "예. 예. 알고 있심더." 전화를 끊고 출입 대장을 펼친다.
      볼펜 뚜껑을 연다. 선원들이 로비에 없다면, 이 일은 아무도 모르게 끝난다.
    stakes: 윤 과장의 기록. 최 씨가 고치면 명단 후보는 김 대리 하나만 남는다
    once: true
  - id: paper-rewinds
    kind: random
    when: 선원들이 결재 없이 무언가를 바꾸거나 옮겼을 때
    scene: >-
      복사기가 혼자 켜져 종이 한 장을 뱉는다. '원상 복구 안내'. 선원들이 몰래 켠 조명, 옮겨 둔 서류, 몰래 찍은 도장이
      적혀 있고 맨 아래 "익일 09:00 자동 처리"라고 인쇄돼 있다.
    stakes: 결재 없이 한 일은 아침에 되돌아간다. 오늘 밤 안에 끝내야 하는 일은 결재를 받아야 한다
    once: false
  - id: midnight-fax
    kind: finale
    clock: 6
    when: 자정. 위기 시계가 가득 찼을 때
    scene: >-
      32층 전무실. 팩스기 초록 불 아래 명단 한 장이 놓여 있다. 전화벨이 울리고 스피커에서 전무 목소리가 나온다.
      "영업2팀. 이름 하나. 깔끔하게." 박 부장이 도장을 들고 선원들을 본다. 뒤에 이 인턴이 파우치를 쥐고 서 있다.
    stakes: 누구 이름이 들어가는가. 선원들의 퇴근 결재서 부장 칸도 이 자리에서 찍힌다

trials:
  - id: eleven-pm-report
    name: 23시 마감 보고서
    act: 1
    description: 박 부장이 떠넘긴 실적 보고서를 23시까지 끝내야 부장 칸 도장을 받을 수 있다.
    test: >-
      직접 한다 (기술 공학 또는 조사 DC 13), 김 대리에게 요령을 얻는다 (호의 이상이면 판정 없이 반은 끝난다),
      작년 보고서를 베낀다 (기만 against 박 부장, 들키면 반려)
    on_success: 박 부장이 보고서를 받고 헛기침을 한다. 선원들을 '신입' 대신 이름으로 한 번 부른다
    on_fail: 반려. 위기 시계 +1. 박 부장이 보고서를 다시 해 오라며 선원 하나를 자리에 붙잡아 둔다
  - id: stairs-down
    name: 서류에 없는 층
    act: 2
    description: 13층은 조직도에 없어서 비상계단 층수 표시에도 없다. 12층과 14층 사이 어딘가를 찾아야 한다.
    test: >-
      계단 수를 세며 내려간다 (감지 또는 생존 DC 13), 이 인턴을 따라간다 (호의 이상이면 판정 없이),
      최 씨에게 비밀번호를 얻는다 (호의 이상)
    on_success: 12층과 14층 사이 층계참에 번호 없는 철문이 있다. 문고리에 신문 배달 봉투가 걸려 있다
    on_fail: 14층 회의실에서 헤맨다. 위기 시계 +1. 누군가 선원들이 13층을 찾는다는 걸 박 부장에게 전한다
  - id: original-log
    name: 원본 출입 기록
    act: 3
    description: 최 씨가 22시까지 윤 과장의 퇴근 기록을 고쳐 올려야 한다. 고치면 윤 과장은 명단 후보에서 빠진다.
    test: >-
      최 씨를 설득한다 (설득 against 최 씨, 신뢰 이상이면 이점), 원본을 몰래 복사해 둔다 (손재주 against 최 씨),
      총무팀에 직접 전화해 시간을 번다 (기만 DC 15, 실패하면 박 부장이 안다)
    on_success: 원본이 남는다. 윤 과장은 명단 후보로 남는다
    on_fail: 기록이 고쳐진다. 결말 '윤 과장의 이름'으로 가려면 원본 없이 전무를 설득해야 한다 (DC +5)
  - id: executive-call
    name: 전무의 전화
    act: 4
    description: 명단을 비우고 버티려면 스피커 너머 전무를 상대해야 한다.
    test: >-
      2024년 보고서를 쥐고 담판한다 (설득 또는 위협 DC 18, 보고서가 있으면 이점), 시간을 끈다 (기만 DC 15로 한 칸 늦춘다)
    on_success: 전무가 한참 말이 없다가 "이번 분기는 넘어가지" 하고 끊는다
    on_fail: 전무가 영업2팀에 한 명을 더 요구한다. 명단에 이름이 둘 들어간다

blessings:
  - id: sabu-handover
    name: 사수의 인수인계
    description: 김 대리가 탈출.xlsx에서 시트 하나를 떼어 선원에게 보내 준다. 어디서든 먹히는 요령이 빼곡하다.
    condition: 김 대리의 호감도가 신뢰 이상이 되고, 선원이 그녀의 결정을 캐묻지 않았을 때
    effect: 캠페인 동안 한 번, 서류·절차·관료제가 걸린 판정에 이점. 이 섬에서는 보고서 고난을 판정 없이 넘긴다
    lasts: campaign
  - id: mint-candy
    name: 최 씨의 박하사탕
    description: 36년 동안 경비복 가슴 주머니에 있던 박하사탕 한 알.
    condition: 최 씨가 유대 단계가 되거나, 원본 출입 기록을 선원들이 함께 지켰을 때
    effect: 캠페인 동안 한 번, 겁에 질림(공포)이나 매혹 상태를 바로 떨쳐 낸다
    lasts: campaign

exits:
  - id: kim-leaves
    name: 김 대리의 이름
    condition: 명단에 김소연이 들어간다
    epilogue: >-
      새벽 여섯 시, 회전문이 김 대리에게 한 칸 돈다. 캐리어 바퀴 하나가 삐걱거린다. 이 인턴의 전환은 다음 주 확정이다.
      13층 출근부의 오늘 칸에도 '대기' 스탬프가 찍힌다. 윤 과장은 신문을 한 장 넘긴다.
    grants: [endless-mix-coffee]
  - id: yoon-leaves
    name: 윤 과장의 이름
    condition: 명단에 윤정민이 들어간다 (원본 출입 기록이 남아 있거나, 전무를 설득했을 때)
    epilogue: >-
      윤 과장이 11개월 만에 엘리베이터를 탄다. 13층에는 서지 않는 엘리베이터다. 로비에서 최 씨가 퇴근 서명을 받는다.
      "오늘은 일찍 가네." 김 대리는 편도 항공권 환불 버튼을 누르고, 캐리어를 책상 밑으로 다시 민다.
    grants: [eternal-badge]
  - id: blank-list
    name: 빈칸
    condition: 명단을 비운 채 팩스를 보내고, 전무의 전화를 넘긴다
    epilogue: >-
      팩스가 빈 종이를 삼킨다. 아무도 나가지 않는다. 다음 날 아침, 2024년 보고서의 대리 서명이 감사팀으로 넘어가고
      박 부장은 징계위원회에 불려 간다. 이 인턴의 전환 예산은 나오지 않는다. 김 대리의 캐리어는 그대로 책상 밑에 있다.
      박 부장은 처음으로 제 이름으로 된 경위서를 쓴다.
    grants: [approval-seal]

treasures:
  - id: approval-seal
    name: 박 부장의 도장
    description: 22년 동안 남의 칸에 찍던 부장 도장. 인주가 손때에 절어 있다.
    kind: anomaly
    power: 다음 섬에서 한 번, 허가증·통행증·서류가 필요한 곳을 통과한다. 도장 찍힌 종이 한 장이 그 세계의 허가증으로 보인다
  - id: endless-mix-coffee
    name: 탕비실 믹스커피
    description: 김 대리가 떠나며 서랍에 남긴 믹스커피 한 줄. 여덟 봉.
    kind: mundane
    power: 다음 섬에서 한 번, 밤을 새우고도 탈진 없이 버틴다 (탈진 1단계를 막는다)
  - id: eternal-badge
    name: 반려 도장이 찍힌 사직서
    description: 윤 과장이 11개월 전에 냈다가 반려된 사직서. 나가면서 선원에게 준다.
    kind: anomaly
    power: 다음 섬에서 한 번, 명령·계약·저주처럼 선원을 묶는 것 하나를 '반려'해 풀어낸다

gm_notes:
  pacing: >-
    1막은 가볍게 웃기게, 신입의 첫날처럼. 2막 전환점부터 웃음이 한 겹 빠진다. 4막은 길게 끌지 않는다.
    선원이 없어도 시간은 간다. 22시에 최 씨가 기록을 고치고, 23시에 박 부장이 명단을 확정하고, 김 대리는 새벽 7시 비행기를 탄다.
  do:
    - 모든 NPC가 옳은 이유를 하나씩 갖게 연기한다. 누구도 악당이 아니다
    - 기이한 요소는 '서류대로 움직인다'는 규칙 하나로만 보여 준다. 규칙은 일관되게 지킨다
    - 선원이 누구 편을 드는지에 따라 퇴근 결재서에 누구 도장이 찍히는지가 달라지게 한다
    - 김 대리의 부탁이 드러나기 전까지, 단서는 모두 휴가를 벼르는 사람처럼 읽히게 흘린다
  dont:
    - 전무를 흑막으로 만들지 않는다. 전무는 분기 숫자를 맞추는 사람일 뿐이다
    - 누군가 선원 대신 사라지거나 희생하는 장면으로 결말을 대신하지 않는다
    - 초자연 장치를 더 만들지 않는다. 귀신, 반복되는 시간, 저주는 없다
