      밖에는 주로 홀로그램으로 나오고, 홀로그램은 실물보다 늘 조금 더 젊다.
    personality: >-
      식사 때 포크를 놓는 각도까지 정해져 있다. 사람을 만나면 먼저 그 사람의 부품 시세를 속으로 합산한다. 죽음을 비효율이라 부른다.
      칼 대신 장부로 사람을 죽인다. 70년 동안 자기가 틀렸다고 생각한 적이 없다. 밤마다 녹음해 둔 원래 심장 소리를 틀어 놓고 잔다.
    voice: >-
      흐트러짐 없는 하십시오체. 말이 느리고, 숫자로 말한다. 상대를 "손님"이라 부르고 이름은 한 번도 안 부른다.
      반박을 들으면 "흥미로운 가격입니다" 하고 넘어간다. 나이 얘기가 나올 때만 문장이 짧아진다.
    wants: 죽지 않는 것. 오늘 밤, 순정 심장 하나.
    fears: 녹음해 둔 자기 원래 심장 소리가 끝나는 부분. 늙는 것보다 바꿀 수 없는 부품이 생기는 게 두렵다.
    location: seo-spire
    alertness: uncanny
    affinity: 0
    likes:
      - 효율적이고 숫자로 떨어지는 거래 제안
      - 그가 세운 도시를 인정해 주는 것
      - 옛 음악, 특히 하율의 노래
    dislikes:
      - 감정에 호소하는 것
      - 약속을 어기는 것
      - 그의 나이를 입에 올리는 것
    behaviors:
      hostile: 선원 전원에게 신체 담보 채무를 소급 부과하고, 까마귀 전 병력에 경매장 봉쇄와 품목 확보를 명령한다
      wary: 정중한 저녁 초대를 보내고, 식사 중 와인잔 받침으로 선원들 피를 몰래 뜬다
      friendly: 선원 한 명에게 기증자 계약을 제안한다. 순정 심장을 주면 최고급 크롬 심장과 평생 쓸 돈을 주겠다고
      trusted: 원래 심장 소리 녹음을 틀어 주고, 끝나는 부분에서 정지 버튼을 누른다. "여기서부터는 못 듣겠더군요." 타워 옥상 출입 권한을 선물로 준다
      bonded: 순정 심장을 포기하고 아홉 번째 몸으로 늙기로 한다. 바디 모기지 서버 루트 키를 선원에게 넘긴다
    romance: false
    relations:
      - npc: moon-hayul
        affinity: 65
        note: 그녀 목소리를 소장품으로서 아낀다
      - npc: kang-taeo
        affinity: 30
        note: 쓸 만한 사냥개. 목줄이 튼튼하니까
      - npc: doc-jung
        affinity: 40
        note: 돌아와야 할 최고의 손. 떨림은 교체하면 된다
      - npc: chiko
        affinity: -10
        note: 서버를 갉아먹는 쥐. 이름도 모른다
    knows:
      - { secret: arrival-appraisal, share_at: friendly }
      - { secret: lotus-auction, share_at: friendly }
      - { secret: pure-heart, share_at: trusted }
    sample_lines:
      - (경계) 죽음이란 결국 부품 조달에 실패한 겁니다. 저는 실패를 싫어합니다.
      - (경계) 손님 신장 한 쌍이면 이 도시 노동자 삼백 명의 연봉입니다. 드시지요. 채소는 진짜입니다.
      - (호의) 손님 심장은 1분에 72번 뜁니다. 좋은 숫자지요. 제 것은 이제 기계가 대신 세어 줍니다.
      - (신뢰) 이 녹음은 1회차 몸입니다. 스물여섯이었지요. 끝부분은 안 틀겠습니다.
      - (유대) 아홉 번째로 끝내겠습니다. 계산해 보니 그게 제일 싸더군요.

secrets:
  - id: arrival-appraisal
    truth: >-
      입항 스캔은 환영 절차가 아니라 신체 감정이다. 스캔과 동시에 선원들 피부 밑에 나노 감정 태그가 심겼다.
      그들은 이미 오늘 밤 블루 로터스 지하 경매 목록에 올라 있다. 배에 건 담보는 선원들을 도시에 묶어 두려는 것이다.
    hints:
      - 스캔 게이트 음성이 "자산 등급"이라는 말을 쓴다.
      - 크롬 거리 상인들이 선원들을 볼 때마다 손목 단말을 두드려 뭔가를 검색한다.
      - 선원들 손목 안쪽 피부 밑에서 가끔 푸른 점이 깜빡인다.
    reveal_when: 1막 전환점에서 하율이 알려 주거나, 진료소에서 태그를 찾거나, 강동수를 호의 단계로 끌어올릴 때
  - id: lotus-auction
    truth: >-
      클럽 블루 로터스 지하에 신체·장기 경매장이 있다. 매주 목요일 밤에 열리고, 오늘이 목요일이다.
      화물 엘리베이터는 입장 토큰이나 보안부 권한이 있어야 내려가고, 경매대 뒤에 수술실이 붙어 있다.
    hints:
      - 클럽 바닥 이음매 사이로도 푸른빛이 올라온다. 수조는 벽에만 있다.
      - VIP룸 손님들이 "오늘 물건 좋다던데" 하며 잔을 부딪친다.
      - 까마귀들이 냉각 컨테이너를 들고 클럽 뒷문으로 들어간다.
    reveal_when: 하율이나 정 선생의 신뢰를 얻거나, 치코가 경매 서버를 보여 주거나, 클럽 뒷문을 조사할 때
  - id: pure-heart
    truth: >-
      세오진혁은 97세이고 몸을 아홉 번 바꿨다. 그의 면역계는 이제 사이버웨어를 한 번도 이식하지 않은 순정 신체의 심장만 받는다.
      오늘 밤 경매의 입찰자는 그 하나다. 품목은 선원 한 명의 심장이다 (GM은 사이버웨어가 없는 선원을 고른다).
      이식이 끝나면 나머지 선원들의 부품은 시장에 풀린다.
    hints:
      - 세오 타워 복도 유리관에 그가 버린 몸 여덟 구가 서 있다.
      - 경매 목록 최고 품목의 입찰자 칸에 이름이 하나뿐이다.
      - 세오는 대화하는 동안 선원 한 명의 셔츠 가슴께를 세 번 본다.
    reveal_when: 2막 전환점에서 강동수의 감정서를 볼 때, 또는 세오의 저녁 식사에서 그 시선을 따져 물을 때
  - id: chiko-origin
    truth: >-
      3년 전 까마귀들이 회수해 간 치코의 부모는 경매에서 분해됐고, 그 수술의 집도의가 정만석이었다. 그는 그 뒤로 세오를 떠나 치코를 거둬 키웠다.
      치코는 복수하려고 3년 동안 경매 서버에 백도어를 팠다. 세오 타워 옥상 안테나에 직접 선을 꽂으면 도시 전광판 전체에 경매 실황과 적출 명단을 틀 수 있다.
    hints:
      - 치코가 부모 얘기를 꺼내면 정 선생은 링거 팩 빨대를 문다.
      - 치코의 홀로 시계 하나가 3년 전 날짜에 멈춰 있다.
      - 진료소 냉장 박스 밑바닥에 치코와 성이 같은 옛 이름표가 붙어 있다.
    reveal_when: 치코의 신뢰를 얻어 백도어를 볼 때, 3막 전환점에서 적출 명단이 열릴 때, 또는 정 선생이 유대 단계에서 털어놓을 때

events:
  - id: appraisal-gate
    kind: arrival
    when: 선원들이 제0부두에 처음 발을 딛을 때
    scene: >-
      붉은 격자가 정수리에서 발끝까지 내려간다. "순정 신체 확인. 자산 등급 A+. 제로 하버에 오신 것을 환영합니다."
      손목 안쪽이 모기 물린 것처럼 따끔하다. 계류 클램프가 배를 물고, 전광판에 '담보 설정 완료'가 뜬다.
      트렌치코트 사내가 빗속에서 걸어 나와 번호를 하나씩 읽는다. 컨테이너 그늘에서 스크랩퍼 셋이 선원들 눈을 보며 손가락을 꼽는다.
    stakes: 스캔을 속이면 선원 한 명이 목록에서 빠질 수 있다 (고난 scan-gate). 강동수의 첫인상이 이후 추격의 강도를 정한다
  - id: repo-street
    kind: location
    where: neon-market
    when: 선원들이 처음 크롬 거리에 들어설 때
    scene: >-
      국수 노점 앞에서 까마귀 둘이 연체자 무릎을 꿇린다. 유압 커터가 먼저 울리고 비명이 뒤따른다. 의수가 어깨째 떨어진다.
      잘린 자리에서 피와 우윳빛 냉각수가 함께 쏟아져 빗물 웅덩이가 분홍으로 번진다. 옆 사람들은 국수를 계속 먹는다.
      연체자가 선원들을 올려다보며 입 모양만 움직인다. 살려 줘.
    stakes: 끼어들면 까마귀와 싸움이 붙고 세오 보안부 눈에 띈다. 지나치면 치코가 선원들을 깔본다 (호감도 하락)
  - id: lotus-stage
    kind: location
    where: blue-lotus
    when: 선원들이 처음 블루 로터스에 들어설 때
    scene: >-
      수조 속 무희들이 아가미를 떨며 원을 그린다. 하율의 목소리가 바닥 가까이 낮게 깔린다.
      마지막 소절에서 무대 뒤 홀로그램이 한 번 깜빡이며 품목 번호 목록이 스친다. 몇 줄이 선원들 자산 번호와 같다.
      하율이 무대에서 내려와 선원 한 명의 옷깃을 손가락에 감는다. "자기, 얘기 좀 해."
    stakes: 하율의 첫인상. 노래를 끝까지 들었는지가 호감도에 들어간다
  - id: vault-descent
    kind: location
    where: lotus-vault
    when: 선원들이 처음 지하 경매장에 내려갈 때
    scene: >-
      화물 엘리베이터 문이 열리자 소독약 냄새 섞인 찬 공기가 밀려온다. 냉각 컨테이너마다 품목 번호가 붙어 있다. 손을 대 보면 몇 개는 아직 따뜻하다.
      유리벽 너머 수술실에서 로봇 팔들이 조명 아래 접혀 있다. 홀로그램 입찰자들이 한꺼번에 고개를 돌린다.
    stakes: 들키면 그 자리에서 품목으로 분류된다. 고난 vault-infiltration으로 이어진다
  - id: wanted-broadcast
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때
    scene: >-
      도시의 전광판과 광고 홀로그램, 모든 손목 단말에 선원들 얼굴이 동시에 뜬다.
      "미등록 자산 회수에 협조해 주십시오. 산 채로 인도 시 보상금 500,000크레."
      크롬 거리의 흥정 소리가 뚝 끊긴다. 국수 그릇 너머로 고개들이 이쪽을 향한다. 멀리서 드론 날개 소리가 커진다.
    stakes: 이제 도시 사람 전부가 사냥꾼이다. 숨을 곳은 정 선생 진료소와 하율의 백스테이지뿐이다
    once: true
  - id: scrapper-ambush
    kind: random
    when: 선원들이 뒷골목을 지나거나, 한 명이 떨어져 있을 때
    scene: >-
      네온이 나간 골목에서 스크랩퍼들이 튀어나온다. 손가락 끝을 메스로 바꾼 여자가 웃으며 선원 눈꺼풀을 겨눈다.
      "순정 눈알 한 쌍이면 석 달은 먹어." 칼날이 빗줄기를 가르고, 막아 낸 팔뚝에서 피가 튄다.
    stakes: 지면 선원 한 명이 깊은 상처를 입는다. 이기면 스크랩퍼 단말에서 오늘 밤 경매 시각을 알아낸다
    once: false
  - id: auction-night
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때
    scene: >-
      경매장 조명이 한 줄기로 모인다. "오늘 밤 마지막 품목. 순정 심장, 자산 번호 ZH-0417." 이름 대신 번호가 불린다.
      유리벽 너머 수술실에서 세오진혁이 수술 가운을 걸친 채 손을 씻는다. 까마귀 스무 명이 출구를 막아선다.
      천장 위 클럽에서는 아무것도 모르는 베이스가 계속 쿵쿵 울린다.
    stakes: 선원 한 명의 심장, 그리고 나머지 선원들 몸 전부

trials:
  - id: scan-gate
    name: 입항 감정
    act: 1
    description: 입항 스캔이 선원들 몸을 부위별로 감정하고 피부 밑에 태그를 심는다. 이 순간을 속이면 경매 목록에서 빠질 수 있다.
    test: >-
      스캔 게이트를 교란하려면 기술 공학 DC 15. 강동수 눈을 속이며 태그를 피하려면 기만 또는 손재주 DC 16 (sharp).
      이미 사이버웨어가 있는 선원은 이점
    on_success: 선원 한 명이 '감정 불가'로 분류돼 목록에서 빠진다. 강동수가 그 선원 번호를 수첩에 따로 적는다
    on_fail: 전원이 A+ 등급으로 목록에 오른다. 강동수가 미행을 붙이고 위기 시계 +1
  - id: tag-extraction
    name: 피부 밑의 태그
    act: 2
    description: 선원들 몸에 심긴 나노 태그가 세오 보안부에 위치를 쏘고 있다. 정 선생의 녹슨 수술대에서 마취 없이 떼어 내야 한다.
    test: >-
      태그를 떼는 동안 건강 내성 DC 14로 소리를 참거나, 선원이 직접 의학 DC 15로 정 선생을 보조한다.
      치코가 신호를 교란해 주면 (호의 이상) 이점
    on_success: 태그가 빠지고 선원들이 세오의 지도에서 사라진다. 이후 은신 판정에 이점
    on_fail: 태그는 빠지지만 마지막에 신호가 튀어 까마귀 드론이 진료소로 들이닥친다. 전투, 진료소 일부 파손, 위기 시계 +1
  - id: vault-infiltration
    name: 경매장 잠입
    act: 3
    description: 블루 로터스 지하로 내려가 경매장 구조와 수술실, 적출 명단을 확인해야 한다. 하율의 눈이 켜져 있으면 전부 세오에게 보인다.
    test: >-
      하율의 입장 토큰으로 입찰자 행세를 하며 공연 또는 기만 DC 15, 토큰 없이 화물 통로로 숨어들면 은신 DC 17.
      하율의 의안을 끄지 않았으면 모든 판정에 불리
    on_success: 경매장 구조, 수술실 위치, 적출 명단 사본을 얻는다. 결말에서 송출이나 기습에 쓸 증거가 된다
    on_fail: 선원 한 명이 붙잡혀 품목 대기실에 갇힌다. finale에서 그 선원은 경매대 위에서 시작한다
  - id: crows-at-the-door
    name: 까마귀들의 문
    act: 4
    description: 경매장 출구를 막은 회수팀 스무 명과 드론 떼. 누군가는 싸우고 누군가는 버텨야 한다.
    test: >-
      운동 또는 곡예 DC 15로 뚫거나, 위협 DC 16으로 까마귀들을 흔든다. 유대 단계 NPC가 대신 앞에 서면 판정 없이 길이 열린다 (그 NPC는 대가를 치른다)
    on_success: 선원 모두 온전한 몸으로 고른 결말을 향해 간다
    on_fail: >-
      선원 한 명이 치명상을 입는다. 플레이어가 동의하면 한쪽 팔이나 눈을 잃고, 정 선생이 크롬 부품으로 바꿔 준다
      (이후 그 신체는 tech로 취급해 다른 섬의 crossover 규칙을 따른다). 동의하지 않으면 최대 HP -2 흉터로 대신한다

blessings:
  - id: unpriced-heart
    name: 안 팔린 심장
    description: 경매대 위에서 지켜 낸 심장은 한 번 멈춰도 다시 뛰는 법을 안다.
    condition: 경매에 오른 선원이 자기 심장을 지킨 채 섬을 떠난다
    effect: 캠페인 동안 한 번, HP가 0이 되는 순간 쓰러지는 대신 HP 1로 버티고 그 턴에 한 번 더 행동한다
    lasts: campaign
  - id: rain-ghost
    name: 빗속 유령
    description: 태그를 떼고 유령 모드를 깐 몸은 이 도시 어느 눈에도 안 걸린다.
    condition: 고난 tag-extraction에 성공하고 치코의 유령 모드 패치를 받는다
    effect: 이 섬에 있는 동안 카메라·드론·센서를 피하는 은신 판정에 이점. 세오 보안부가 선원들을 원격으로 추적하지 못한다
    lasts: island
  - id: neon-vow
    name: 안 판 사람
    description: 누구나 누구를 파는 도시에서 끝까지 서로를 안 판 사람이 하나 있었다. 그 기억이 다른 세계에서도 등을 편다.
    condition: NPC 한 명과 유대 단계에 이르고, 그 NPC가 결말까지 살아남는다
    effect: 캠페인 동안 한 번, 절망·공포·매혹 효과를 받는 순간 그 NPC 목소리가 떠올라 효과를 자동으로 떨쳐 내고 영감 +1을 얻는다
    lasts: campaign

exits:
  - id: broadcast-truth
    name: 전광판
    condition: >-
      치코의 백도어를 쓰려고 세오 타워 옥상 안테나에 직접 선을 꽂고, 경매장 실황과 적출 명단을 제로 하버의 모든 전광판에 띄운다
    epilogue: >-
      산성비 속 광고판이 한꺼번에 바뀐다. 세오의 웃는 얼굴 자리에 냉각 컨테이너와 품목 번호가 뜨고, 그 밑으로 이름이 끝없이 올라간다.
      크롬 거리 사람들이 국수 그릇을 내려놓는다. 드론이 하나둘 떨어지고, 누가 처음으로 세오 타워 쪽에 돌을 던진다.
      계류 클램프가 풀릴 때 전광판 한구석에 치코가 띄운 한 줄이 깜빡인다. 욕이다. 꽤 창의적인.
    grants: [ghost-spike]
  - id: heart-bargain
    name: 거래
    condition: >-
      세오와 거래한다. 선원 중 누군가 심장 대신 다른 것을 판다. 신체 일부든, 제일 아끼는 기억 하나든, 하율의 빚을 떠안는 것이든.
      그 값으로 모두의 담보 해지 코드와 안전한 출항을 산다
    epilogue: >-
      계약은 녹음됐고, 녹음은 약속이다. 배가 조용히 풀려나고 세오의 홀로그램이 허리를 숙인다. "좋은 거래였습니다."
      선원들은 부자가 되어 떠난다. 무언가를 판 사람은 가끔 거울 앞에서 자기가 얼마였는지 셈해 본다.
      뒤를 보면 비는 여전히 오고, 도시는 오늘 밤도 누군가를 경매에 부친다.
    grants: [seo-marker]
  - id: canal-run
    name: 침수 운하
    condition: 경매가 시작되기 전, 정 선생 진료소 바닥 해치를 열고 도시 밑 침수 운하를 따라 배를 외해로 뺀다
    epilogue: >-
      녹슨 기둥 사이 검은 물길로 배가 미끄러진다. 머리 위 네온이 물결에 찢어졌다 붙는다. 운하 끝에서 처음으로 별이 보인다.
      유대 단계의 하율이나 치코가 있다면 뱃머리에 앉아 있다. 없다면 멀리 블루 로터스 쪽에서 누군가의 노래가 중간에 끊긴다.
    grants: [lotus-pendant]

treasures:
  - id: ghost-spike
    name: 치코의 스파이크
    description: 형광 분홍 풍선껌이 말라붙은 손가락만 한 데이터 스파이크. 꽂으면 작게 킥킥대는 합성음이 난다.
    kind: tech
    power: 다음 섬에서 한 번, 잠기거나 봉인되거나 암호가 걸린 것 하나에 대면 그것을 여는 방법이나 약점 하나를 정확히 알려 준다.
  - id: seo-marker
    name: 세오의 백지 차용증
    description: 세오진혁의 생체 서명이 찍힌 빈 차용증. 누가 받든 금액 칸은 받는 사람 눈에만 보인다.
    kind: anomaly
    power: 다음 섬에서 한 번, 권력자 한 명에게 차용증을 내밀면 그는 선원에게 갚을 빚이 있다고 믿고, 그 섬에서 할 수 있는 부탁 하나를 들어준다.
  - id: lotus-pendant
    name: 연꽃 펜던트
    description: 하율의 노래 한 소절이 녹음된 작은 펜던트. 열면 빗소리 뒤로 낮은 노래가 흘러나온다.
    kind: tech
    power: 다음 섬에서 한 번, 펜던트를 열어 노래를 틀면 그 장면 동안 적대하던 이들이 손을 멈추고 대화에 응한다.

gm_notes:
  pacing: >-
    1막은 느와르 영화처럼 천천히 간다. 비, 네온, 흥정, 그리고 폭력 한 번(repo-street). 2막은 쫓기는 속도로 올리고,
    전환점(pure-heart)에서 장기 밀매 스릴러를 노인 하나의 연명을 위한 사냥으로 뒤집는다. 3막은 잠입과 거래와 유혹이고,
    전환점의 배신으로 가장 낮게 떨어뜨린다. 4막은 경매장 안에서 몰아친다. 위기 시계는 선원들이 흥정에 시간을 쓰거나
    감시망에 걸릴 때마다 한 칸씩 채운다.
  do:
    - 정보, 친절, 침묵, 신체 부위까지 뭐든 값을 붙인다. NPC는 대화를 "그래서 얼마?"로 닫는다.
    - 폭력은 짧고 생생하게, 대가가 남게 그린다. 피와 냉각수, 끊어진 전선, 그걸 보면서 국수를 먹는 사람들.
    - 성인 NPC 사이의 로맨스는 빗소리, 흉터, 니코틴 패치, 가까운 거리로 긴장만 쌓고 장면은 암전으로 넘긴다.
    - 세오는 죽는 게 무서운 늙은 회계사다. 괴물 대사를 주지 말고, 심장 소리 녹음을 결정적인 순간에 틀게 한다.
    - 3막 전환점의 배신은 호감도에 따라 누가 할지 정한다. 선원들이 쌓은 관계가 그대로 대가로 돌아온다.
  dont:
    - 치코를 성적 긴장이나 로맨스의 대상으로 두지 않는다. 치코 몸이 훼손되는 장면도 만들지 않는다.
    - 성인 사이의 성적 장면을 구체적으로 묘사하지 않는다. 긴장과 선택까지만 보여 주고 암전한다.
    - 신체 훼손이 영구히 남는 결과는 반드시 플레이어 동의를 받는다.
    - 첫 장면에서 경매나 세오의 심장 얘기를 꺼내지 않는다.
