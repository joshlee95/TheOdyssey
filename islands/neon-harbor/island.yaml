# 제로 하버: 몸이 담보가 되는 사이버펑크 느와르 항구 도시.
schema_version: 1
id: neon-harbor

meta:
  title: 제로 하버
  author: 오디세이 테스트팩
  tagline: 입항세는 0크레. 오늘 밤 경매 목록 맨 윗줄에 당신 자산 번호가 있다.
  tone: [느와르, 사이버펑크, 폭력적, 관능적, 비정함]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: mature
    lines:
      - 미성년자가 관련된 성적 묘사나 암시
      - 성폭력
      - 아이의 신체를 적출하거나 훼손하는 장면
    veils:
      - 성인 사이의 성적 장면은 분위기와 긴장까지만 묘사하고 암전한다
      - 산 사람을 대상으로 한 장기 적출 수술의 전 과정
      - 장시간의 고문

public:
  rumor: >-
    남쪽 산성비 해역에 제로 하버라는 항구가 있다. 입항세가 0크레라서 누구든 받아 주고, 뭐든 판다.
    거기 다녀온 선원들은 이상하게 흉터가 늘어 있었다. 어떤 선장은 돌아온 지 한 달 만에 문자 한 통을 받았다고 한다.
    "고객님의 오른쪽 신장은 잘 쓰이고 있습니다."
  first_sight: >-
    그치지 않는 비 너머로 빛 덩어리가 위로 솟는다. 폐선과 컨테이너를 층층이 쌓아 올린 수상 도시다.
    꼭대기에 검은 탑 하나가 구름을 뚫고 서 있다. 탑 허리의 홀로그램 여자가 웃으며 입을 연다. "당신의 몸, 당신의 미래. 세오 바이오닉스."
  arrival: >-
    제0부두의 녹슨 크레인이 배를 끌어당긴다. 선창에 발을 딛자 붉은 레이저 격자가 몸을 위아래로 훑는다.
    "환영합니다. 순정 신체 확인. 자산 등급 A+." 합성 음성이 상냥하다.
    우산 없이 빗속에 선 트렌치코트 사내가 목덜미에서 니코틴 패치 하나를 떼어 낸다.

world:
  reality:
    genre: [사이버펑크, 느와르, SF, 스릴러]
    era: 2190년대. 해수면이 오른 뒤 폐선과 해상 플랜트 위에 지은 기업 소유 수상 도시
    magic: none
    technology: futuristic
    speech: >-
      한국어에 영어·일본어·중국어 은어가 섞인 항구 말. 돈은 크레, 사이버웨어를 하나도 안 한 몸은 '살' 또는 '순정',
      부품을 뜯어 가는 회수팀은 까마귀라 부른다. 반말이 기본이다. 존댓말을 쓰는 사람은 기업 쪽이거나 뭘 팔려는 중이다.
      대화 절반은 흥정이고 나머지는 협박이다. 말끝에 "그래서 얼마?"가 붙는다.
    outsiders: >-
      입항 스캔을 통과한 순간부터 선원들은 미등록 순정 신체, 걸어 다니는 고가품이다. 브로커들은 필요 이상으로 친절하다.
      뒷골목 스크랩퍼들은 선원들 눈을 보면서 손가락으로 시세를 센다. 이름을 묻는 사람은 없다. 번호는 다들 안다.
    crossover:
      magic: weakened
      tech: works
      note: >-
        다른 세계의 마법과 이능은 도시를 덮은 전파 노이즈에 절반쯤 먹힌다. 본 사람들은 불법 신경 임플란트 오작동이나 홀로그램 사기라고 여긴다.
        세오 보안부는 그것을 미등록 사이버웨어로 분류해 현상금을 건다.
        다른 세계의 기계는 그대로 돌아가지만, 도시 네트워크에 한 번이라도 접속하면 세오 바이오닉스 자산 목록에 올라간다.
    appearance: unchanged
  premise: >-
    제로 하버는 세오 바이오닉스가 통째로 가진 항구다. 시민 대부분은 신체 담보 대출, 바디 모기지로 의수와 의안을 산다.
    연체하면 까마귀가 부품을 뜯어 간다. 크롬이든 살이든.
    회장 세오진혁은 97세다. 70년 동안 몸을 아홉 번 갈아 끼웠다. 이제 그의 면역계는 사이버웨어를 한 번도 이식하지 않은 순정 신체의 심장만 받는다.
    이 도시에 그런 몸은 남아 있지 않다. 그래서 외지 배가 들어오면 입항 스캔이 선원들을 감정하고, 클럽 블루 로터스 지하 경매 목록에 올린다.
    오늘 밤 경매의 입찰자는 세오진혁 하나고, 최고 품목은 선원 한 명의 심장이다.
  laws:
    - 제로 하버의 모든 계약은 신체로 보증한다. 녹음된 말은 약속이고, 약속은 계약이다.
    - 이 도시에 경찰은 없다. 세오 보안부가 있고, 그들은 사람이 아니라 자산을 지킨다.
    - 도시 네트워크에 접속한 장비는 전부 세오의 눈이 된다.
    - 비는 그치지 않는다. 산성도가 매시간 전광판에 뜨고, 5를 넘으면 맨살이 따끔거린다.
  start_location: pier-zero
  clock:
    name: 경매의 밤
    segments: 6

story:
  theme: 몸 구석구석에 값이 붙은 도시에서 값을 못 매기는 것은 무엇인가?
  hook: >-
    입항 스캔이 끝나자 배의 계류 클램프가 철컥 잠긴다. 부두 전광판에 한 줄이 뜬다. "입항세 0크레. 정박 담보 설정 완료. 담보물: 승선원 전원."
    배를 풀려면 누군가의 담보 해지 코드가 있어야 한다. 빗속의 사내, 세오 보안부 수사관 강동수가 코트 깃을 세운다.
    "축하해요. 이 도시에서 제일 비싼 분들이 됐네요. 오늘 밤까지는."
  acts:
    - name: 자산 등급 A+
      goal: 도시의 규칙을 배우고, 배를 묶은 담보를 풀 방법과 자기들이 왜 비싼지를 알아낸다
      beats:
        - 입항 스캔 게이트에서 강동수와 처음 만난다. 그는 이름 대신 자산 번호를 부른다 (appraisal-gate)
        - 크롬 거리 한복판에서 까마귀들이 연체자의 의수를 어깨째 뜯어 간다. 끼어들지, 지나칠지 (repo-street)
        - 치코가 선원들 장비를 몰래 뚫다가 들킨다. 벌금 대신 유령 모드 패치를 깔아 주겠다고 흥정한다
        - 블루 로터스 무대에서 하율이 노래한다. 노래가 끝나자 그녀가 선원들을 VIP룸으로 부른다 (lotus-stage)
      turn: >-
        VIP룸. 하율이 선원 손목 안쪽을 엄지로 누른다. 피부 밑에서 푸른 점이 깜빡인다.
        "자기들, 오늘 밤 목록에 있어. 입구 스캔, 그거 인사 아니야. 감정이야."
        담보는 배가 아니라 선원들 몸이었다 (arrival-appraisal)
    - name: 사냥감
      goal: 몸에 심긴 감정 태그를 떼어 내고, 누가 무엇 때문에 자기들을 원하는지 알아낸다
      beats:
        - 정 선생 진료소. 폐 여객선 선실에서 떨리는 손이 로봇 팔을 몰아 피부 밑 나노 태그를 찾는다
        - 도시 전광판 전체에 선원들 얼굴이 뜬다. 보상금 50만 크레, 산 채로 (wanted-broadcast)
        - 뒷골목 스크랩퍼들이 칼날 손가락을 펴고 선원 한 명의 눈을 노린다 (scrapper-ambush)
        - 강동수가 선원들을 옥상으로 몰아넣는다. 수갑을 꺼낼지 담배를 꺼낼지는 그의 호감도에 달렸다
      turn: >-
        강동수가 내민 보안부 감정서 입찰자 칸에 이름이 하나뿐이다. 세오진혁.
        장기 밀매가 아니었다. 노인 하나가 더 살려는 사냥이고, 품목은 선원 한 명의 순정 심장이다 (pure-heart).
        이식 수술 예정 집도의 칸에는 옛 이름이 적혀 있다. 정만석
    - name: 블루 로터스 지하
      goal: 경매장에 들어갈 수단과, 판을 뒤집을 무기(증거, 송출망, 배신자)를 손에 넣는다
      beats:
        - 세오 타워 꼭대기의 저녁 식사. 세오가 아홉 번째 몸의 서른 살 얼굴로 기증자 계약서를 내민다. 와인잔 받침이 손끝의 피를 한 방울 뜬다
        - 치코가 경매 서버에 심어 둔 백도어를 보여 준다. 도시 전광판을 뺏으려면 세오 타워 옥상 안테나에 직접 선을 꽂아야 한다 (chiko-origin)
        - 하율이 자기 왼쪽 의안이 세오의 카메라라고 털어놓는다. 경매장에 들어가기 전에 그 눈을 꺼야 한다
        - 블루 로터스 지하 경매장 잠입 (vault-descent)
      turn: >-
        누군가 선원들을 판다. 하율이나 정 선생의 호감도가 신뢰 미만이면 그들이 선원 한 명을 세오에게 넘긴다.
        신뢰 이상이면 대신 강동수의 군용 의수 킬스위치가 원격으로 켜지고, 그 손이 선원의 목을 쥔다.
        같은 시각 치코가 경매 서버에서 적출 명단을 연다. 자기 부모 이름 옆 집도의 칸에 정만석이 있다
    - name: 경매의 밤
      goal: 심장을 지키고, 이 도시를 어떻게 떠날지 고른다
      beats:
        - 경매 개시. 푸른 조명 아래 경매대가 있고, 유리벽 너머 수술실에서 세오가 기다린다 (auction-night)
        - 유대 단계의 NPC가 대가를 치른다. 하율은 제 눈을 뽑고, 강동수는 망가져 가는 의수로 까마귀를 막고, 정 선생은 수술대 위에서 메스를 돌리고, 치코는 드론이 문을 두드리는 동안 송출을 붙든다
        - 세오 앞의 선택. 도시 전체에 진실을 틀 것인가, 무언가를 팔아 모두의 안전을 살 것인가, 운하로 빠질 것인가
      turn: 선원들의 선택이 결말(exits)을 정한다

locations:
  - id: pier-zero
    name: 제0부두
    description: >-
      녹슨 컨테이너 크레인과 입항 스캔 게이트가 늘어선 부두. 산성비에 삭은 난간마다 세오 바이오닉스 광고가 깜빡인다.
      묶여 있는 배들 선체에 붉은 '담보 설정' 스티커가 붙어 있다. 부두 끝 배수구는 침수 운하로 이어진다.
    connects_to: [neon-market, doc-clinic]
    tags: [시작, 감시, 출구]
  - id: neon-market
    name: 크롬 거리
    description: >-
      빗물 고인 골목에 네온 간판이 서너 겹씩 걸린 노천 시장. 정육점 갈고리에 중고 의수가 걸려 있다.
      국수 노점 김 사이로 '신체 담보 즉시 대출' 전단이 젖어 붙는다. 드론 날개 소리가 들리면 흥정하던 입들이 동시에 닫힌다.
    connects_to: [pier-zero, blue-lotus, doc-clinic]
    tags: [시장, 위험, 소문]
  - id: blue-lotus
    name: 클럽 블루 로터스
    description: >-
      푸른 조명이 물결무늬로 벽을 타는 클럽. 벽 한 면 전체가 수조이고, 아가미를 이식한 무희들이 그 안에서 천천히 돈다.
      무대에서는 하율이 노래한다. VIP룸 벨벳 커튼 너머로 기업 간부들 웃음소리와 숫자가 새어 나온다.
      무대 뒤 화물 엘리베이터는 권한이 있는 사람만 아래로 내려 준다.
    connects_to: [neon-market, seo-spire, lotus-vault]
    tags: [유흥, 정보, 관능]
  - id: doc-clinic
    name: 정 선생 진료소
    description: >-
      가라앉다 만 여객선의 3등 선실을 고친 무면허 진료소. 형광 소독약 냄새가 코를 찌른다. 녹슨 수술대 위로 로봇 팔 여덟 개가 접혀 있다.
      냉장 박스 안에 이름표 없는 부품들이 있다. 바닥 해치를 열면 도시 밑을 지나 외해로 빠지는 침수 운하가 나온다.
    connects_to: [pier-zero, neon-market]
    tags: [치료, 은신처, 밀항로]
  - id: seo-spire
    name: 세오 타워 최상층
    description: >-
      구름 위 900미터. 이 도시에서 비가 안 오는 유일한 곳이다. 통유리 아래로 네온이 늪처럼 깔려 있고, 식탁엔 흙에서 기른 채소가 오른다.
      복도 양쪽 유리관에 세오진혁이 버린 몸 여덟 구가 서 있다. 옥상에는 도시 전광판 송출 안테나가 벼락을 맞으며 서 있다.
    connects_to: [blue-lotus, lotus-vault]
    tags: [기업, 권력, 송출망]
  - id: lotus-vault
    name: 블루 로터스 지하 경매장
    description: >-
      클럽 두 층 아래 원형 경매장. 수조의 푸른빛이 천장 틈으로 스며든다. 경매대 뒤 유리벽 너머가 수술실이다.
      입찰자 좌석에는 사람 대신 홀로그램이 앉아 있다. 냉각 컨테이너가 품목 번호를 달고 줄지어 있다.
    connects_to: [blue-lotus, seo-spire]
    hidden: true
    tags: [경매, 공포, 클라이맥스]

npcs:
  - id: moon-hayul
    name: 문하율
    role: 블루 로터스 가수. 뒤로는 정보를 판다
    adult: true
    look: >-
      은발 단발. 목을 따라 성대 증폭기 봉합선이 빛나는 문신처럼 지나간다. 왼쪽 눈은 세오사 정품 광학 의안이라,
      뭘 계산할 때 홍채 위로 작은 바코드가 스친다. 젖은 비단 드레스에 맨발.
    personality: >-
      누구를 만나든 먼저 값을 잰다. 신발, 의수 제조사, 빚이 있는 사람의 눈 밑. 자기 값은 412만 크레라는 숫자로만 안다.
      계산 없이 말하는 사람을 만나면 노래 가사를 까먹는다. 이 도시에서 제일 드문 부품이 정직이라서.
    voice: >-
      낮고 느린 반말. 상대를 "자기"라 부르고, 진짜 대답을 해야 할 자리에 노래 가사 한 줄을 흘린다.
      값을 부를 때만 말이 빨라진다. 강동수 앞에서는 "수사관님"이라고 일부러 존댓말을 쓴다.
    wants: 담보로 잡힌 자기 눈과 목소리를 되찾아 이 도시를 뜨는 것. 남은 빚 412만 크레.
