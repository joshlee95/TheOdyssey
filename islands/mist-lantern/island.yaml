# 테스트 섬: 오르나의 등대 (몽환 미스터리)
# 이야기 설계 근거: docs/critique/mist-lantern.md, docs/style/story-guide.md
schema_version: 1
id: mist-lantern

meta:
  title: 오르나의 등대
  author: 오디세이 테스트팩
  tagline: 기름은 한 드럼 남았다. 오늘 밤 그 불로 바다에 나간 배를 부를지, 뭍으로 가는 배를 띄울지.
  tone: [몽환적, 쓸쓸함, 미스터리]
  players: { min: 1, max: 5 }
  session_minutes: 90
  content:
    rating: teen
    lines: [아이가 다치는 장면]
    veils: [물에 빠져 죽는 순간의 묘사]

public:
  rumor: >-
    북쪽 안개 바다에 작은 등대섬이 있다. 거기 안개는 사람 목소리를 흉내 낸다고 한다.
    먼저 간 사람 목소리로 이름을 부르는데, 대답하고 따라가면 안 된다고.
  first_sight: >-
    잿빛 안개 벽 너머로 창백한 불빛이 느리게 돈다. 한 바퀴를 다 돌지 못하고 두어 번 깜빡인다.
  arrival: >-
    배 밑바닥이 모래를 긁는다. 해변에는 뒤집힌 나룻배 몇 척과 녹슨 기름 드럼 통이 굴러다닌다.
    마을 쪽에서 누가 종을 친다. 세 번, 쉬고, 세 번. 배가 아직 안 들어왔다는 뜻이다.

world:
  reality:
    genre: [다크 판타지, 미스터리]
    era: 등유 램프와 발동선의 시대. 뭍에서 오는 보급선은 3년째 끊겼다
    magic: hidden
    technology: industrial
    speech: >-
      느릿한 존댓말과 짧은 반말이 섞인다. 뭍 사람한테는 존대하고, 섬 사람끼리는 별명으로 부른다.
      안개 얘기는 낮게, 짧게 한다. 이름은 되도록 부르지 않는다.
    outsiders: >-
      안개를 뚫고 온 배라서 반가워하면서도 경계한다. 다들 선원들 배에 기름이 얼마나 있는지부터 궁금해한다.
    crossover:
      magic: transformed
      tech: weakened
      note: >-
        다른 세계의 마법은 빛과 소리로만 드러난다. 불을 부르는 주문은 등불 크기의 빛이 된다.
        전자기기는 안개 속에서 잡음만 내고, 불빛이 닿는 곳에서만 제대로 켜진다.
    appearance: unchanged
  premise: >-
    이 섬에서 기이한 것은 안개 하나다. 등대 불빛이 닿지 않는 곳에서 안개는 한 번 들은 목소리를 흉내 내 사람을 부른다.
    대답하고 따라간 사람은 돌아오지 못한다. 그래서 이 섬은 등대로 산다.
    보급선이 끊긴 3년 동안 등대지기 오르나는 밀수꾼 선장에게서 몰래 기름을 사 불을 지켜 왔다. 이제 남은 기름은 한 드럼이다.
    오늘 밤 마을 어선 세 척이 아직 바다에 있다. 새벽까지 등불을 켜야 그 배들이 돌아온다.
    같은 기름이면 선장의 발동선이 뭍까지 간다. 선장은 그 배로 섬을 뜨려 하고, 오르나가 맡아 키운 아이 핌이 그 배에 타고 싶어 한다.
  laws:
    - 불빛이 닿는 곳에서 안개는 소리를 내지 못한다.
    - 안개는 한 번 들은 목소리만 흉내 낸다. 섬에 처음 온 사람의 목소리는 아직 모른다.
    - 안개의 부름에 대답하고 불빛 밖으로 따라간 사람은 돌아오지 못한다. 불빛이 그 자리를 비추면 멈춰 선다.
  start_location: wreck-beach
  clock:
    name: 새벽 네 시, 안개가 가장 짙어진다
    segments: 6

story:
  theme: 붙잡는 것과 보내 주는 것 중 무엇이 사랑인가
  hook: >-
    상륙하자마자 등대 불빛이 두 번 깜빡이다 꺼질 뻔한다. 선원들이 섬을 떠나려면 안개를 뚫을 불빛이 필요하다.
    그런데 그날 밤 등대 기름 창고가 비어 있다.
  acts:
    - name: 종소리
      goal: 섬의 사정과 안개의 규칙을 배우고, 사라진 기름을 쫓기 시작한다
      beats:
        - 해변에서 안개가 선원을 부른다. 아직 선원 목소리는 모르니 다른 사람 목소리로 (fog-whisper)
        - 소금마을에서 소금댁이 종을 친다. 아들 태식이 탄 배가 아직 안 들어왔다 (salt-feast)
        - 오르나가 등대에서 선원들을 맞는다. 기름 창고 자물쇠가 멀쩡한데 드럼 하나가 없다
      turn: 조수 동굴 쪽에서 발동선 시동 소리가 들린다. 섬에 배라고는 어선 셋과 선장의 배뿐이다
    - name: 선장
      goal: 기름을 가져간 사람과 그 이유를 알아낸다
      beats:
        - 조수 동굴에 선장의 발동선이 묶여 있다. 선장은 기름을 가져갔다고 순순히 말한다. 누가 줬는지는 말하지 않는다
        - 선장은 몇 해째 오르나에게 기름을 대 온 사람이다. 원망하면서도 팔았다 (lamp-truth)
        - 핌이 선원들을 졸졸 따라다니며 뭍의 학교는 어떤지, 기숙사가 있는지 묻는다
      turn: >-
        중반의 반전. 창고 열쇠를 선장에게 건넨 사람은 핌이다 (pim-name). 선원들이 쫓던 도둑은 없고,
        떠나고 싶은 아이와 그 아이를 데려가 주겠다는 어른이 있다
    - name: 일지
      goal: 기름 한 드럼을 어디에 쓸지 결정할 재료를 모은다
      beats:
        - 오르나가 핌의 보따리를 발견한다. 화내지 않고 등대 계단에 앉는다
        - 등대 지하 일지실에서 30년 전 등불이 꺼진 밤의 기록을 찾는다 (archive)
        - 소금댁이 마을 사람들을 데리고 조수 동굴로 간다. 기름을 되찾겠다고
      turn: 새벽 두 시. 안개가 해변을 넘어 마을로 들어온다. 누군가 이제 기름을 부어야 한다
    - name: 새벽 네 시
      goal: 등불과 뭍 가운데 무엇에 불을 줄지 선원들이 정한다
      beats:
        - 바다에서 어선의 뱃고동이 두 번 들린다. 안개가 그 소리를 따라 하며 세 번째를 낸다 (fog-tide)
        - 핌이 선장의 배 앞과 등대 계단 사이에 선다
        - 가장 가까워진 NPC가 선원에게 자기 편을 들어 달라고, 혹은 들지 말라고 한다
      turn: 선원들의 선택이 결말을 정한다

locations:
  - id: wreck-beach
    name: 드럼통 해변
    description: 뒤집힌 나룻배와 녹슨 드럼통이 굴러다니는 모래톱. 불빛이 끊기는 자리마다 안개가 한 뼘씩 더 들어와 있다.
    connects_to: [salt-village, tide-caves]
    tags: [해안, 위험]
  - id: salt-village
    name: 소금마을
    description: 소금 굽는 가마 연기가 안개와 뒤섞이는 작은 마을. 문마다 문패 대신 조개껍데기가 걸려 있다. 마을 한가운데 종이 있다.
    connects_to: [wreck-beach, lighthouse]
    tags: [마을, 안전]
  - id: lighthouse
    name: 등대
    description: 나선 계단 꼭대기에 기름 등이 있다. 계단 밑에 기름 창고, 그 옆에 늘 잠겨 있는 지하 문. 계단 셋째 칸 아래 틈에 누가 보따리를 밀어 넣어 두었다.
    connects_to: [salt-village, name-archive]
  - id: tide-caves
    name: 조수 동굴
    description: 물이 빠지면 드러나는 동굴. 안쪽 물길에 선장의 발동선이 묶여 있다. 기름 냄새가 짙다.
    connects_to: [wreck-beach]
    tags: [안개, 위험]
  - id: name-archive
    name: 등대 지하 일지실
    description: 오르나가 40년 동안 쓴 등대 일지가 선반에 꽂혀 있다. 해마다 한 권, 표지에 연도만 적혀 있다.
    connects_to: [lighthouse]
    hidden: true

npcs:
  - id: orna
    name: 오르나
    role: 등대지기. 40년째 이 섬의 불을 지켜 온 사람
    adult: true
    look: 등이 굽은 노파. 손끝이 늘 그을려 있고, 앞치마 주머니에서 기름 냄새가 난다.
    personality: >-
      다정하고 고집이 세다. 손님 찻잔이 비는 걸 못 본다. 등불 얘기가 나오면 말이 짧아진다.
      밀수꾼에게 기름을 산다는 걸 부끄러워하지 않는다. 불을 지키는 게 먼저다.
    voice: >-
      느린 해요체. 손님은 "손님", 핌은 "우리 아가". 싫은 말은 "그건 좀 두고 봐요"로 미룬다.
      거짓말을 할 때는 말끝을 "~랍니다"로 맺는다.
    wants: 오늘 밤 등불을 새벽까지 켜서 바다에 나간 배 세 척을 불러들이는 것. 그리고 핌을 곁에 두는 것
    fears: 30년 전처럼 불이 꺼진 밤에 누군가를 잃는 것. 핌이 떠나는 것
    location: lighthouse
    alertness: sharp
    affinity: 25
    likes: [등불을 존중하는 태도, 핌에게 다정하게 대하는 것, 차를 끝까지 마셔 주는 것]
    dislikes: [선장 편을 드는 것, 일지실을 기웃거리는 것, 핌 앞에서 뭍 얘기를 꺼내는 것]
    behaviors:
      hostile: 선원들 배에 기름을 한 방울도 나눠 주지 않고, 핌을 등대 위층에 들여보낸 뒤 문을 잠근다
      wary: 기름 얘기를 돌리고, 선원들이 선장과 무슨 말을 했는지 떠본다
      friendly: 안개의 규칙을 알려 주고, 불빛 밖에서는 절대 대답하지 말라고 한다
      trusted: 선장에게서 기름을 사 왔다고 털어놓고, 지하 일지실 열쇠를 꺼낸다
      bonded: 핌의 보따리를 선원에게 건네며 "아가가 가고 싶다면 그쪽이 데려다줘요"라고 한다
    romance: false
    relations:
      - { npc: pim, affinity: 95, note: 부모를 바다에 잃은 아이를 여섯 살 때부터 맡아 키웠다 }
      - { npc: nameless-captain, affinity: -40, note: 원망을 받는 걸 안다. 그래도 기름을 사야 했다 }
      - { npc: salt-widow, affinity: 60, note: 40년 이웃. 같은 밤에 사람을 잃었다 }
    knows:
      - { secret: lamp-truth, share_at: trusted }
      - { secret: archive, share_at: bonded }
    sample_lines:
      - (경계) 손님, 차 식어요. 기름 얘기는 그건 좀 두고 봐요.
      - (호의) 안개가 이름을 부르면 대답하지 말아요. 불빛 안에 있으면 걔들은 말을 못 해요.
      - (신뢰) 선장한테 샀어요. 3년 동안. 걔 아버지 원망을 같이 사는 셈이지만, 불이 먼저랍니다. 아니, 불이 먼저예요.
      - (유대) 우리 아가가 뭍에 가고 싶다고 하면요. 그쪽이 데려다줘요. 나는 등대를 못 떠나니까.
  - id: pim
    name: 핌
    role: 소금마을 아이. 오르나가 맡아 키운다
    adult: false
    look: 소금기로 뻣뻣한 머리, 맨발, 너무 큰 선원 외투. 오늘은 웬일로 장화를 신었다. 장화에서 기름 냄새가 난다.
    personality: >-
      호기심 많고 겁이 없다. 외지인을 졸졸 따라다니며 뭍 얘기를 캔다. 할머니를 좋아하는데, 섬 밖을 너무 보고 싶다.
    voice: >-
      반말. 질문을 쉬지 않는다. 할머니 얘기를 할 때만 존댓말이 섞인다. 거짓말을 할 때 발끝으로 모래를 판다.
    wants: 뭍의 학교에 가는 것. 선장이 데려다주겠다고 했다
    fears: 할머니를 혼자 두는 것. 할머니가 우는 것
    location: salt-village
    alertness: dull
    affinity: 40
    likes: [뭍 얘기를 들려주는 것, 같이 놀아 주는 것, 어른처럼 대해 주는 것]
    dislikes: [할머니를 나쁘게 말하는 것, 아이 취급하는 것]
    behaviors:
      hostile: 할머니에게 선원들이 기름을 노린다고 일러바친다
      wary: 선원들을 피해 숨고, 말을 걸어도 "몰라"만 한다
      friendly: 마을 곳곳을 안내하고 조수 시간과 동굴 가는 길을 알려 준다
      trusted: 창고 열쇠를 자기가 선장에게 줬다고 털어놓는다
      bonded: 할머니한테 직접 말하겠다고 선원 손을 잡고 등대로 간다
    romance: false
    relations:
      - { npc: orna, affinity: 90, note: 할머니. 떠나고 싶은 마음을 아직 말하지 못했다 }
      - { npc: nameless-captain, affinity: 30, note: 뭍에 데려다주겠다고 한 어른 }
    knows:
      - { secret: pim-name, share_at: trusted }
    sample_lines:
      - 형들 뭍에서 왔어? 거기 학교는 기숙사 있어? 밥은 줘?
      - (경계) 몰라. 창고 열쇠? 할머니가 갖고 있지. 아마.
      - (신뢰) 내가 줬어. 선장 아저씨가 뭍에 데려다준대서. 할머니한테는 말 안 했어요.
  - id: nameless-captain
    name: 선장
    role: 밀수꾼. 3년째 오르나에게 몰래 기름을 대 온 사람
    adult: true
    look: 기름때 묻은 방수 외투, 왼손 새끼손가락이 없다. 사람들이 이름 대신 선장이라고 부른다.
    personality: >-
      셈이 빠르고 약속은 지킨다. 30년 전 등불이 꺼진 밤 아버지의 배가 암초에 걸렸고, 그 뒤로 오르나를 원망한다.
      원망하면서 기름을 팔았다. 이번엔 그 기름으로 섬을 뜨려 한다.
    voice: >-
      짧은 하게체. 흥정할 때만 말이 길어진다. 오르나를 "그 노인네"라 부르고, 핌은 "꼬마"라 부른다.
    wants: 오늘 밤 기름을 채워 뭍으로 가는 것. 약속한 대로 핌을 데려가는 것
    fears: 이 섬에서 늙어 죽는 것. 핌을 데려갔다가 오르나와 같은 사람이 되는 것
    location: tide-caves
    alertness: uncanny
    affinity: -30
    likes: [공정한 거래, 약속을 지키는 것, 바다 얘기]
    dislikes: [오르나 편에서 훈계하는 것, 약속을 어기는 것]
    behaviors:
      hostile: 발동선 시동을 걸고 선원들이 따라오지 못하게 동굴 물길의 밧줄을 끊는다
      wary: 기름을 돌려주는 대가로 선원들 배의 기름을 요구한다
      friendly: 기름을 누가 줬는지 빼고는 다 말해 준다. 오르나에게 3년 동안 기름을 팔았다고
      trusted: 핌과 한 약속을 털어놓고, 오르나 허락 없이는 데려가지 않겠다고 한다
      bonded: 기름을 반으로 나누자고 먼저 제안한다. 모자란 불은 자기 배의 등으로 채우겠다고
    romance: false
    relations:
      - { npc: orna, affinity: -70, note: 아버지를 잃은 밤 불을 지키지 못한 사람. 그래도 기름을 팔았다 }
      - { npc: pim, affinity: 40, note: 저 나이 때 자기를 닮았다 }
      - { npc: salt-widow, affinity: -30, note: 밀수꾼이라고 대놓고 싫어한다 }
    knows:
      - { secret: lamp-truth, share_at: friendly }
      - { secret: pim-name, share_at: bonded }
    sample_lines:
      - (경계) 기름? 내가 가져갔네. 훔친 건 아니고. 누가 줬는지는 묻지 말게.
      - (호의) 그 노인네한테 3년을 팔았어. 원망은 원망이고 장사는 장사지.
      - (신뢰) 꼬마랑 약속했네. 뭍까지만. 그 노인네가 싫다 하면 안 데려가.
      - (유대) 반 나누세. 모자란 불은 내 배 등을 떼어 걸면 돼. 30년 만에 그 등대에 올라가 보는구먼.
  - id: salt-widow
    name: 소금댁
    role: 소금마을 어른. 아들 태식이 오늘 밤 바다에 나간 어선에 타고 있다
    adult: true
    look: 소금 가마 재를 뒤집어쓴 앞치마, 굵은 팔뚝. 종 치는 줄을 손목에 감고 다닌다.
    personality: 말이 거칠고 셈이 정확하다. 마을 일을 도맡는다. 밀수꾼을 싫어하고, 등대를 믿는다.
    voice: 걸걸한 반말. 뭍 사람한테도 반말이다. "그래서, 기름은?"으로 모든 얘기를 끝낸다.
    wants: 오늘 밤 등불을 끝까지 켜서 아들이 탄 배를 부르는 것
    fears: 30년 전 남편을 잃은 밤이 되풀이되는 것
    location: salt-village
    alertness: normal
    affinity: 0
    likes: [마을 일을 거드는 것, 등불 편을 드는 것, 종을 대신 쳐 주는 것]
    dislikes: [선장과 거래하는 것, 핌을 뭍에 보내자는 말]
    behaviors:
      hostile: 마을 사람들을 모아 선원들 배를 부두에 묶어 버린다
      wary: 선원들이 어디 가는지 사람을 붙여 지켜본다
      friendly: 소금에 절인 생선을 내주고, 안개가 들은 목소리를 흉내 낸다는 걸 알려 준다
      trusted: 30년 전 그 밤 얘기를 한다. 남편과 선장의 아버지가 같은 날 바다에서 돌아오지 못했다고
      bonded: 선장과 한 배에 타는 건 싫지만 핌을 보내는 데 반대하지 않겠다고 한다
    romance: false
    relations:
      - { npc: orna, affinity: 60, note: 40년 이웃. 같은 밤에 사람을 잃었다 }
      - { npc: nameless-captain, affinity: -50, note: 밀수꾼. 기름값을 두 배로 받는다고 믿는다 }
      - { npc: pim, affinity: 50, note: 마을이 같이 키운 아이 }
    knows:
      - { secret: archive, share_at: trusted }
    sample_lines:
      - 그래서, 기름은?
      - (호의) 안개가 태식이 목소리로 부르면 나는 대답할 기라. 그러니 종은 니가 쳐라.
      - (신뢰) 그날 밤 우리 영감이랑 선장 애비가 같이 나갔다. 둘 다 안 돌아왔고. 원망할 데가 등대밖에 없었던 거지.

secrets:
  - id: lamp-truth
    truth: 보급선이 끊긴 3년 동안 오르나는 선장에게서 몰래 기름을 사 등불을 지켜 왔다. 섬의 불은 밀수 기름으로 탄다.
    hints:
      - 등대 기름 드럼에 뭍 보급선 도장이 아니라 긁어낸 자국이 있다
      - 선장 발동선에 같은 드럼통이 여러 개 실려 있다
      - 오르나 앞치마 주머니에 선장 필체로 적힌 기름값 쪽지가 있다
    reveal_when: 선장이 호의 이상이거나 오르나가 신뢰 이상일 때, 또는 드럼통을 비교해 볼 때
  - id: archive
    truth: >-
      30년 전 등불이 꺼진 밤, 기름이 떨어진 이유가 오르나의 일지에 적혀 있다. 선장의 아버지가 그 주에 오르나에게 넘기기로 한 기름을
      뭍의 선주에게 더 비싸게 팔았다. 그날 밤 선장의 아버지와 소금댁의 남편이 탄 배가 함께 돌아오지 못했다.
    hints:
      - 소금댁이 그날 밤 두 사람이 같은 배에 탔다고 말한다
      - 오르나가 선장 원망을 받으면서 한 번도 변명하지 않았다
      - 일지실 선반에 30년 전 한 권만 표지가 닳아 있다
    reveal_when: 일지실에 들어가 30년 전 일지를 읽을 때. 선장에게 보여 주면 원망이 흔들린다
  - id: pim-name
    truth: 기름 창고 열쇠를 선장에게 준 사람은 핌이다. 선장이 뭍의 학교에 데려다주겠다고 했다. 핌은 할머니에게 아직 말하지 못했다.
    hints:
      - 기름 창고 자물쇠는 부서지지 않았다. 열쇠로 열렸다
      - 핌이 오늘은 웬일로 장화를 신었고, 장화에서 기름 냄새가 난다
      - 핌이 선원들에게 뭍의 학교에 기숙사가 있는지 묻는다
      - 등대 계단 셋째 칸 밑에 핌의 보따리가 있다
    reveal_when: 2막 전환점. 단서 둘 이상을 모았거나, 핌이나 선장이 털어놓을 때

events:
  - id: fog-whisper
    kind: arrival
    when: 상륙 직후, 일행이 해변에 발을 디딜 때
    scene: >-
      안개 속에서 목소리가 부른다. 부엌에서 밥 먹으라고 부르는 말투다. "태식아, 들어와." 선원 누구의 이름도 아니다.
      등대 불빛이 머리 위를 지나가자 목소리가 뚝 끊긴다. 모래 위에 맨발 자국 하나가 안개 쪽으로 나 있다.
    stakes: 안개는 아직 선원들의 목소리를 모른다. 섬에서 말을 많이 할수록 흉내 낼 목소리가 늘어난다
  - id: salt-feast
    kind: location
    where: salt-village
    when: 일행이 처음 소금마을에 들어설 때
    scene: >-
      소금댁이 종 줄을 쥐고 있다. 세 번, 쉬고, 세 번. 줄을 놓고 선원들을 본다. "뭍 배가? 그래서, 기름은 얼마나 있노."
    stakes: 마을 사람들은 선원들 배의 기름을 셈하기 시작한다
  - id: lamp-flicker
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때
    scene: >-
      등불이 크게 깜빡인다. 창고에 남은 기름으로는 한 시간이 버겁다. 불빛이 줄어든 만큼 안개가 마을 골목으로 들어온다.
      소금댁이 사람들을 모아 조수 동굴로 향한다.
    once: true
  - id: borrowed-voice
    kind: random
    when: 일행이 흩어져 있거나 불빛 밖에 있을 때
    scene: 안개 너머에서 동료의 목소리가 도와 달라고 부른다. 섬에 와서 한 말투 그대로다.
    once: false
  - id: fog-tide
    kind: finale
    clock: 6
    when: 새벽 네 시. 위기 시계가 가득 찼을 때
    scene: >-
      바다에서 뱃고동이 두 번 들린다. 안개가 그 소리를 따라 세 번째를 낸다. 등대 계단 위에 오르나, 동굴 물길에 선장,
      그 사이 모래밭에 핌이 서 있다. 기름 드럼은 선원들 발밑에 있다.
    stakes: 기름 한 드럼. 등불과 뭍 중 어디에 붓는가

trials:
  - id: calling-fog
    name: 안개의 부름
    act: 1
    description: 흩어진 동료를 찾아야 하는데, 안개가 동료 목소리를 흉내 낸다.
    test: 목소리 대신 쓸 신호를 정하거나(판정 없이), 흉내 낸 목소리에 대답하지 않고 버틴다(지혜 내성 DC 13)
    on_success: 가짜 목소리를 가려내는 요령을 익힌다. 이후 borrowed-voice 이벤트에서 이점
    on_fail: 대답한 선원이 불빛 밖으로 몇 걸음 걸어 나간다. 누군가 불빛을 비춰 줄 때까지 움직이지 못한다. 위기 시계 +1
  - id: captains-bargain
    name: 선장과의 흥정
    act: 2
    description: 선장은 기름을 돌려주는 대가로 선원들 배의 기름이나 그만한 값을 요구한다.
    test: 흥정한다(haggle 또는 설득 against 선장), 약속을 받아 낸다(통찰로 속내를 읽으면 이점), 핌 얘기를 꺼낸다
    on_success: 선장이 기름을 누가 줬는지 말할 마음을 먹는다. 호감도가 오른다
    on_fail: 선장이 발동선 시동을 건다. 위기 시계 +1
  - id: first-page
    name: 30년 전 일지
    act: 3
    description: 잠긴 등대 지하 일지실에 30년 전 그 밤의 기록이 있다.
    test: 오르나의 허락을 얻거나(신뢰 이상), 몰래 들어간다(은신 against 오르나), 소금댁에게 그 밤 얘기를 먼저 듣는다
    on_success: 일지를 찾는다. 선장에게 보여 주면 원망이 흔들린다
    on_fail: 오르나에게 들킨다. 오르나의 호감도가 떨어지고 위기 시계 +1
  - id: dying-light
    name: 모자란 불
    act: 4
    description: 기름을 나눈다면 모자란 불빛은 누군가 등대 꼭대기에서 직접 들고 새벽까지 버텨야 한다.
    test: 등대 꼭대기에서 손등을 들고 안개의 부름을 버틴다(라운드마다 건강 내성 DC 13, 이능·빛을 쓰면 이점)
    on_success: 새벽까지 불빛이 이어진다
    on_fail: 불빛이 끊긴 사이 안개가 마을 골목까지 들어온다. 어선 한 척이 해가 뜬 뒤에야 돌아온다

blessings:
  - id: salt-guest
    name: 안개에 귀 닫기
    description: 안개의 부름을 한 번 버텨 낸 사람은 가짜 목소리의 결을 안다.
    condition: 안개의 부름 고난을 대답 없이 넘기거나, 동료를 불빛으로 되찾아 온다
    effect: 캠페인 동안 한 번, 목소리·환청·유혹으로 거는 효과를 자동으로 떨쳐 낸다
    lasts: campaign
  - id: true-name
    name: 등대지기의 일지 한 장
    description: 오르나가 일지에서 한 장을 찢어 준다. 이 섬 뱃길이 손으로 그려져 있다.
    condition: 오르나가 유대 단계가 되고, 선원들이 핌의 결정을 오르나에게 숨기지 않았을 때
    effect: 캠페인 동안 한 번, 길 찾기나 항해 판정을 자동으로 성공한다
    lasts: campaign

exits:
  - id: relight
    name: 등불
    condition: 기름 한 드럼을 모두 등불에 붓는다
    epilogue: >-
      새벽까지 불빛이 돈다. 어선 세 척이 차례로 들어오고 소금댁이 종을 다섯 번 친다. 선장의 발동선은 동굴에 한 계절 더 묶인다.
      핌은 보따리를 다시 계단 밑에 밀어 넣는다. 오르나는 그걸 보고도 모른 척한다.
    grants: [lantern-shard]
  - id: free-the-nameless
    name: 뭍으로
    condition: 기름을 선장의 발동선에 붓고, 핌이 그 배에 탄다
    epilogue: >-
      발동선이 선원들 배를 끌고 안개를 빠져나간다. 등대는 새벽 두 시에 꺼진다. 어선 세 척은 안개 속에서 닻을 내리고 해를 기다린다.
      모두 돌아오지만 태식의 배는 정오가 되어서야 들어온다. 오르나는 등대 계단에 혼자 앉아 뭍 쪽을 본다.
    grants: [captains-compass]
  - id: flee
    name: 두 불
    condition: 기름을 반으로 나누고, 모자란 불빛은 선원들이 직접 들고 새벽까지 버틴다
    epilogue: >-
      반쪽 불빛이 새벽까지 돈다. 선장의 배는 뭍까지 겨우 간다. 마지막 몇 해리는 노를 저어야 한다.
      핌은 떠나기 전에 할머니한테 인사를 한다. 오르나가 처음으로 선장에게 차를 한 잔 따른다.
    grants: [lantern-shard, captains-compass]

treasures:
  - id: lantern-shard
    name: 등불 조각
    description: 손바닥만 한 푸른 불씨가 담긴 유리 조각.
    kind: magic
    power: 어둠이나 안개 속에서 한 번, 숨겨진 길을 비춘다
  - id: captains-compass
    name: 선장의 나침반
    description: 새끼손가락 없는 손때가 묻은 낡은 나침반. 바늘이 가끔 멋대로 돈다.
    kind: anomaly
    power: 다음 섬을 고를 때 한 번, 선원들이 가장 원하는 것이 있는 섬을 가리킨다

gm_notes:
  pacing: >-
    초반은 조용하고 불안하게. 선원이 없어도 시간은 간다. 새벽 두 시에 소금댁이 동굴로 가고, 새벽 네 시에 안개가 가장 짙어진다.
  do:
    - 누구도 악당이 아니게 연기한다. 오르나도 선장도 소금댁도 옳은 이유가 있다
    - 기이한 것은 안개 하나다. 안개의 규칙 셋을 끝까지 지킨다
    - 핌의 부탁이 드러나기 전까지 단서는 도둑을 쫓는 이야기처럼 읽히게 흘린다
  dont:
    - 핌이 누군가의 숨겨진 혈육이라는 식의 설정을 붙이지 않는다
    - 누군가 선원 대신 사라지거나 희생하는 장면으로 결말을 대신하지 않는다
    - 안개 말고 다른 초자연 장치를 만들지 않는다
