# 예시 섬. 스키마의 모든 기능을 보여 주는 샘플이자 문체 기준 섬이다.
schema_version: 1
id: mist-lantern

meta:
  title: 오르나의 등대
  author: 오디세이 테스트팩
  tagline: 안개 속에서 누가 이름을 물으면, 대답하지 마세요.
  tone: [조용한 공포, 쓸쓸함, 미스터리]
  players: { min: 2, max: 5 }
  session_minutes: 90
  content:
    rating: teen
    lines: [아이가 다치는 장면]
    veils: [죽음의 구체적 묘사]

public:
  rumor: >-
    북쪽 안개 바다에 오십 년째 한 번도 꺼진 적 없는 등대가 있대. 그 불을 보고 들어간 배는 다 멀쩡히 돌아왔어.
    다만 선원 몇은 부두에 내려서 자기 이름을 한참 생각해야 했다더라.
  first_sight: >-
    안개가 벽처럼 서 있다. 그 너머에서 푸르스름한 불빛이 느리게 돈다. 빛이 한 바퀴 지나갈 때마다 안개 가장자리에서
    무언가 한 발씩 물러난다. 사람 키만 하다.
  arrival: >-
    배 밑이 모래를 긁고 멈춘다. 해변에 부서진 배가 켜켜이 누워 있다. 뱃머리마다 이름판이 달려 있는데, 글자 자리는
    전부 칼끝으로 긁어 놓았다. 긁은 자국이 아직 하얗다.

world:
  reality:
    genre: [다크 판타지, 미스터리]
    era: 달력을 넘기지 않는 옛 어촌. 등유 램프와 돛배의 시대
    magic: hidden
    technology: industrial
    speech: >-
      느릿한 존댓말. 문장 끝을 올리지 않는다. 마을 사람들은 서로를 이름 대신 별명으로 부른다. 소금댁, 그물 영감, 짝눈이.
      누가 이름을 대면 못 들은 척하고 다른 얘기를 한다. 아이들만 반말을 쓴다.
    outsiders: >-
      난파한 사람으로 여기고 극진히 먹이고 재운다. 부엌에서는 새 식구가 몇 명인지 센다.
    crossover:
      magic: transformed
      tech: weakened
      note: >-
        다른 세계의 마법은 안개와 빛으로만 나타난다. 불꽃 주문은 손끝에서 푸른 빛이 번지는 것으로 끝나고, 소환한 것은 안개로
        빚은 윤곽만 선다. 전자기기는 켜지지만 화면에 물기가 차고 스피커에서는 먼 파도 소리만 난다.
    appearance: unchanged
  premise: >-
    등대는 기름이 아니라 사람 이름으로 탄다. 등대지기 오르나는 오십 년 동안 난파한 선원들의 이름을 장부에 받아 적고,
    한 장씩 찢어 등불에 넣어 안개를 막아 왔다. 이름을 잃은 사람은 안개 속을 떠도는 무명이 된다. 장부가 얇아지자
    오르나는 찾아온 손님들의 이름을 노린다. 장부 첫 장에는 그녀가 끝내 찢지 못한 이름 하나가 있다.
  laws:
    - 안개 속에서 자기 이름을 소리 내어 말하면 안개가 그 이름을 가져간다.
    - 등대 불빛이 닿는 곳에는 무명이 들어오지 못한다.
    - 섬에서 대접받은 음식을 먹은 사람은 섬의 손님이 되고, 떠날 때 값을 치른다.
  start_location: wreck-beach
  clock:
    name: 등불 심지
    segments: 6

story:
  theme: 살아남으려고 누군가를 잊은 사람을 용서할 수 있는가.
  hook: >-
    상륙한 다음 날 아침, 배 이름판이 긁혀 있다. 누가 그랬는지 아무도 못 봤다. 이름 없는 배는 안개를 빠져나가지 못한다.
    이름을 되찾으려면 이 섬이 이름을 어디로 가져가는지 알아내야 한다.
  acts:
    - name: 환대
      goal: 섬의 법칙을 배우고, 배 이름이 사라진 까닭을 쫓기 시작한다
      beats:
        - 안개 속 목소리가 선원들 이름을 묻는다 (fog-whisper)
        - 소금마을 잔치. 먹을지 말지를 선원마다 따로 정한다 (salt-feast)
        - 핌이 선원들을 따라다니며 묻는다. "진짜 이름 있어? 몇 개?"
      turn: 밤, 등대 창 너머 불꽃 속에 배 이름 글자가 한 번 떠올랐다가 오그라드는 것을 선원 하나가 본다
    - name: 등불 밑
      goal: 등불이 무엇으로 타는지, 안개 속 무명이 누구인지 알아낸다
      beats:
        - 조수 동굴에서 선장이 거래를 건다. 동굴 벽에는 긁어낸 이름 자국이 수백 개
        - 오르나가 등대 문 앞에서 차를 권하며 선원들이 어디까지 알았는지 떠본다
        - 등불이 깜빡이고 무명들이 해변으로 올라온다 (lamp-flicker)
      turn: >-
        선원들을 지켜 주던 불이 바로 이름을 태우는 불이다 (lamp-truth). 오르나는 마을을 살린 사람이고,
        저 해변의 이름판을 긁은 사람이다
    - name: 장부실
      goal: 등대 밑 장부실에 들어가 이름을 되찾을 방법을 손에 넣는다
      beats:
        - 핌과 가까워지면 할머니 몰래 열쇠가 어디 있는지 알려 준다 (archive)
        - 장부실 잠입. 선반 가득한 장부에서 배 이름을 찾는다
        - 장부 첫 장만 그을음이 없다. 거기 적힌 이름이 핌의 이름이다 (pim-name)
      turn: 오르나에게 들킨다. 그녀는 첫 장을 가슴에 대고 계단을 올라간다. "이거 한 장이면 오십 년을 가요."
    - name: 안개 물때
      goal: 누구 이름을 지키고 누구 이름을 태울지 선원들이 정한다
      beats:
        - 등불이 꺼지고 안개가 마을로 들어온다 (fog-tide)
        - 선장은 장부를 읽으라 하고, 오르나는 한 장만 태우자 하고, 핌은 자기가 불 속에 들어가겠다고 한다
        - 선원과 가장 가까워진 NPC가 대신 값을 치르겠다고 나선다 (호감도 유대인 NPC가 있다면)
      turn: 선원들의 선택이 결말(exits)을 정한다

locations:
  - id: wreck-beach
    name: 난파선 해변
    description: >-
      이름판을 긁힌 배들이 모래에 반쯤 묻혀 있다. 갈매기가 없다. 물이 빠지면 바위 절벽 밑으로 동굴 입구가 드러난다.
    connects_to: [salt-village, tide-caves]
    tags: [해안, 위험]
  - id: salt-village
    name: 소금마을
    description: >-
      소금 굽는 가마 연기가 안개에 섞여 어디까지가 연기인지 모른다. 집집마다 문패 자리에 조개껍데기가 하나씩 박혀 있다.
      우물가에서 여자들이 서로를 소금댁, 짝눈이라고 부른다.
    connects_to: [wreck-beach, lighthouse]
    tags: [마을, 안전]
  - id: lighthouse
    name: 등대
    description: >-
      나선 계단이 백열두 칸. 꼭대기에서 푸른 불꽃이 탄다. 가까이 가면 기름 냄새 대신 종이 타는 냄새가 난다.
      불꽃 속에서 가끔 글자 획이 하나씩 오그라든다.
    connects_to: [salt-village, name-archive]
  - id: tide-caves
    name: 조수 동굴
    description: >-
      하루 두 번 물에 잠기는 동굴. 벽에 이름이 빼곡히 새겨졌다가 모두 긁혔다. 긁힌 자리에 따개비가 붙어 있어,
      만지면 손가락이 긁힌다. 물이 들어올 때 안에서 여러 사람이 동시에 숨 쉬는 소리가 난다.
    connects_to: [wreck-beach]
    tags: [안개, 위험]
  - id: name-archive
    name: 장부실
    description: >-
      등대 밑 지하. 선반마다 같은 크기의 장부가 등을 맞대고 꽂혀 있다. 대부분 중간이 뜯겨 얇다. 책상 위 잉크병은
      반쯤 남았고, 펜촉이 아직 젖어 있다.
    connects_to: [lighthouse]
    hidden: true

npcs:
  - id: orna
    name: 오르나
    role: 등대지기
    adult: true
    look: 등이 굽은 노파. 손끝이 까맣게 그을렸고 손톱 밑에 잉크가 배어 있다. 앞치마 주머니에 늘 몽당연필 한 자루.
    personality: >-
      손님 찻잔이 비는 걸 못 본다. 한 모금 마시면 바로 채운다. 누가 이름을 흘리면 웃으면서 앞치마 주머니에 손을 넣는다.
      마을이 오십 년 무사했던 건 자기 덕이라고 믿고, 그 믿음을 한 번도 소리 내어 말한 적이 없다.
    voice: >-
      느릿한 해요체. 상대를 "손님"이라고만 부르고, 핌만 "우리 아가"라고 부른다. 질문을 받으면 날씨나 차 이야기로 한 번
      돌아간 뒤에 답한다. 거짓말을 할 때는 말이 조금 더 다정해지고, 문장 끝에 "~랍니다"가 붙는다.
    wants: 등불을 꺼뜨리지 않는 것. 그러려면 새 이름이 있어야 한다.
    fears: 안개가 마을에 들어오는 날. 그리고 장부 첫 장을 찢어야 하는 날.
    location: lighthouse
    alertness: sharp
    affinity: 25
    likes: [등불 앞에서 모자를 벗는 것, 핌에게 다정하게 구는 것, 섬 음식을 남기지 않고 먹는 것]
    dislikes: [등대를 함부로 뒤지는 것, 장부 이야기를 캐묻는 것, 선장과 거래하는 것]
    behaviors:
      hostile: 밤중에 선원 방 문 앞에 앉아 잠꼬대를 기다린다. 무릎에 장부를 펴 놓고 연필을 쥐고 있다
      wary: 등대 문 앞에 의자를 내놓고 앉아 차를 권한다. 문은 등 뒤로 닫혀 있다
      friendly: 따뜻한 보리차를 내주고, 안개 속에서 지킬 것들을 하나씩 일러 준다. 이름은 말하지 마라, 불빛 밖으로 나가지 마라
      trusted: 불이 무엇으로 타는지 털어놓는다. 그러고는 해 질 녘에 자기가 어디로 내려가는지는 말하지 않고 계단 쪽만 본다
      bonded: 첫 장을 선원 손에 쥐여 준다. "우리 아가 이름, 손님이 불러 주세요. 나는 못 해요. 그리고 불은 내 걸로 하지요."
    relations:
      - { npc: pim, affinity: 95, note: 손자. 이름 한 번 못 불러 준 손자 }
      - { npc: nameless-captain, affinity: -70, note: 처음으로 이름을 받아 적은 사람. 그날 그는 살려 달라고 했다 }
    knows:
      - { secret: lamp-truth, share_at: trusted }
      - { secret: archive, share_at: trusted }
      - { secret: pim-name, share_at: bonded }
    sample_lines:
      - 손님, 이름이 참 곱네요. 아, 아직 말 안 하셨던가요. 그럼 끝까지 하지 마세요. 여기선 그게 예의랍니다.
      - 차 식어요. 등대요? 계단이 가팔라서요. 무릎 성한 사람도 올라가면 한참 앉아 있다 내려온답니다.
      - 불이 꺼지면 저것들이 올라와요. 저것들도 전에는 손님이었지요.
      - 오십 년이에요. 우물에 빠진 애가 하나도 없었어요. 그거 하나는 손님도 세어 보세요.
      - 우리 아가 이름은 내가 제일 처음 적었어요. 적고 나서, 못 찢었어요. 그게 다예요.

  - id: pim
    name: 핌
    role: 소금마을 아이
    adult: false
    look: 소금기로 뻣뻣하게 선 머리. 맨발. 소매를 세 번 걷어도 손이 안 나오는 선원 외투를 입었다. 주머니에 조개껍데기가 가득하다.
    personality: >-
      처음 보는 사람 뒤를 열 걸음 떨어져 따라온다. 말을 걸면 다섯 걸음으로 줄인다. 겁이 없는 게 아니라 무서운 걸 아직 모른다.
      조개껍데기마다 이름을 지어 주고, 다음 날이면 잊는다.
    voice: >-
      반말. 질문을 끝내기 전에 다음 질문을 한다. "왜?"로 문장을 끝내는 버릇. 할머니 이야기가 나오면 갑자기 존댓말을 한 번 섞는다.
      모르는 말은 되묻지 않고 비슷한 말로 바꿔 따라 한다.
    wants: 자기 진짜 이름을 알고 싶다. 핌은 마을 사람들이 붙여 준 별명이다. 뭐에서 따온 건지 아무도 모른다.
    fears: 할머니가 부엌에서 혼자 앉아 있는 것.
    location: salt-village
    alertness: dull
    affinity: 40
    likes: [바깥 바다 이야기를 들려주는 것, 조개껍데기 줍기에 같이 쪼그려 앉는 것, 진짜 이름을 같이 궁금해해 주는 것]
    dislikes: [할머니 흉보기, 애라고 말을 끊는 것]
    behaviors:
      hostile: 할머니한테 달려가 저 사람들이 등대 문고리를 만졌다고 이른다
      wary: 부서진 배 밑에 숨어서 나오지 않는다. 불러도 조개 부딪는 소리만 난다
      friendly: 마을을 구석구석 끌고 다니고, 물때를 손가락으로 세어 알려 준다
      trusted: 할머니 앞치마 주머니 말고 다른 데 열쇠가 하나 더 있다고 속삭인다. 부엌 소금 단지 밑
      bonded: 안개 속까지 따라 들어온다. 선원 소매를 꼭 쥐고, 이름 대신 "나야, 나" 하고 계속 말한다
    relations:
      - { npc: orna, affinity: 90, note: 하나뿐인 식구. 할머니 손 냄새를 잉크 냄새로 안다 }
      - { npc: nameless-captain, affinity: -20, note: 무섭다. 그런데 동굴에 가면 가끔 조개를 두고 온다 }
    knows:
      - { secret: archive, share_at: friendly }
    sample_lines:
      - 이름 뭐야? 아, 아니다. 안개 앞에서는 안 돼. 그럼 나중에. 나중엔 돼?
      - 이건 달걀이, 이건 배꼽이. 어제 이름은 까먹었어. 괜찮아, 조개는 몰라.
      - 할머니 지하실에 책이 엄청 많아. 다 똑같이 생겼어. 근데 할머니가, 아니, 할머니께서 만지지 말랬어.
      - 형은 이름 있잖아. 부르면 대답하는 거. 그거 어떤 느낌이야? 간지러워?
      - 나 무서운 거 아니야. 그냥 손 좀 잡고 있는 거야. 놓지 마, 왜냐면, 그냥.

  - id: nameless-captain
    name: 선장
    role: 안개 속 무명들의 우두머리
    adult: true
    look: 속이 빈 선원복이 서 있다. 모자 챙 밑에 얼굴 대신 안개가 느리게 돈다. 소매 끝에서 물이 떨어지는데, 바닥에 닿기 전에 마른다.
    personality: >-
      화를 내지 않는다. 대신 조건을 붙인다. 약속은 글자 그대로 지키고, 글자 밖의 것은 챙긴다. 바다 이야기를 들으면
      모자를 벗어 무릎에 놓는다. 벗은 모자 속에 아무것도 없다.
    voice: >-
      한 사람이 말하는데 목소리가 둘셋 겹쳐 온다. 한 박자씩 늦게. 하게체와 반말이 섞이는데, 흥정할 때만 또박또박 하게체다.
      상대 말을 그대로 따라 한 뒤 끝만 바꿔서 대답한다.
    wants: 이름을 되찾아 바다로 돌아가는 것. 자기 배 이름이라도.
    fears: 등대 불빛. 그리고 이름을 되찾았을 때 그 이름이 기억나지 않는 것.
    location: tide-caves
    alertness: uncanny
    affinity: -30
    likes: [공정한 흥정, 잃어버린 걸 찾아 주겠다는 약속, 먼바다 이야기]
    dislikes: [등불 빛을 들이대는 것, 약속을 어기는 것]
    behaviors:
      hostile: 안개 속에서 동료 목소리를 흉내 내 선원을 하나씩 불러낸다. 부르는 목소리는 늘 도와 달라고 한다
      wary: 거래를 건다. 조건이 공정해 보이는데, 조건 하나에 기한이 빠져 있다
      friendly: 등불이 무엇으로 타는지 값을 받지 않고 알려 준다. 알려 주고 나서 오래 가만히 서 있다
      trusted: 물이 빠질 때만 드러나는 물길로 등대 밑에 닿는 법을 알려 준다
      bonded: 섬이 가라앉을 때 뱃머리에 서서 안개 속 길을 짚는다. 자기 배가 가라앉은 자리는 돌아서 간다
    relations:
      - { npc: orna, affinity: -85, note: 그의 이름을 받아 적은 여자. 그날 그녀는 울면서 적었다 }
      - { npc: pim, affinity: 30, note: 동굴에 조개를 두고 가는 아이. 그 애만은 원망하지 않는다 }
    knows:
      - { secret: lamp-truth, share_at: friendly }
      - { secret: archive, share_at: trusted }
    sample_lines:
      - 이름 좀 빌려주게. 하룻밤이면 되네. 돌려준다는 말은, 그래, 안 했지.
      - 불이 무엇으로 타느냐고? 자네가 물었지. 자네가 대답해 보게. 해변에 긁힌 판자가 몇 장이던가.
      - 공정하게 하세. 자네가 길을 원하고 내가 이름을 원하네. 이름이 싫으면 기억 하나. 작은 걸로. 첫 생일 같은.
      - 그 아이는 조개를 두고 가네. 한 번도 이름을 안 붙이고. 그게 고마워서 나는 그 애 목소리는 흉내 안 내네.
      - 내 배 이름이 뭐였는지 아나? 나도 모르네. 그러니 찾거든 먼저 읽지 말고 나한테 주게.

secrets:
  - id: lamp-truth
    truth: 등대는 사람 이름으로 탄다. 이름 한 장이 한 달쯤 간다.
    hints:
      - 등불 속에서 글자 획이 하나씩 오그라든다.
      - 등대 꼭대기에서는 기름 냄새가 아니라 종이 타는 냄새가 난다.
      - 해변의 배마다 이름판이 긁혀 있다. 긁은 자국이 새것일수록 등불이 밝다.
      - 마을 사람들은 서로의 진짜 이름을 모른다. 물어보면 웃고 만다.
    reveal_when: 등불을 가까이서 살피거나, 선장과 이야기하거나, 오르나를 몰아붙일 때
  - id: archive
    truth: >-
      등대 밑에 아직 태우지 않은 이름을 적은 장부들이 있다. 장부의 이름을 소리 내어 읽어 주면 무명이 사람으로 돌아온다.
      읽힌 이름은 더는 불에 들어가지 않는다.
    hints:
      - 오르나는 해 질 녘마다 등대 밑으로 내려갔다가 손끝에 잉크를 묻히고 올라온다.
      - 핌이 말한다. "할머니 지하실에 책이 엄청 많아. 다 똑같이 생겼어."
    reveal_when: 등대를 뒤지거나, 핌과 가까워졌을 때
  - id: pim-name
    truth: 핌은 오르나의 손자다. 장부 첫 장에 적힌, 오르나가 끝내 찢지 못한 이름이 핌의 진짜 이름이다.
    hints:
      - 오르나는 핌만 이름 대신 "우리 아가"라고 부른다. 다른 사람은 다 별명이다.
      - 장부 첫 장만 그을음이 없다. 종이 가장자리가 손때로 부드럽다.
    reveal_when: 장부실에 들어간 뒤, 또는 절정 직전

events:
  - id: fog-whisper
    kind: arrival
    when: 상륙 직후, 선원들이 해변에 발을 디딜 때
    scene: >-
      안개 속에서 목소리가 부른다. 부엌에서 밥 먹으라고 부르는 말투다.
      "왔어요? 춥죠. 이름이 뭐예요?"
      누군가 입을 여는데 등대 불빛이 머리 위를 지나간다. 목소리가 뚝 끊긴다. 모래 위에 맨발 자국 하나가 남아 있다.
      안개 쪽으로 나 있다.
    stakes: 이름을 말한 캐릭터는 이름을 잃기 시작한다 (다른 사람이 그 이름을 떠올리지 못함)
  - id: salt-feast
    kind: location
    where: salt-village
    when: 선원들이 처음 소금마을에 들어설 때
    scene: >-
      긴 상이 우물가에 차려져 있다. 소금에 절인 생선, 김이 오르는 조개탕. 수저가 선원 수만큼 이미 놓여 있다.
      소금댁이 국자를 든 채 기다린다. "식어요." 아무도 먼저 먹지 않는다. 다들 선원들 쪽만 본다.
    stakes: 먹으면 섬의 손님이 된다 (법칙 3)
  - id: lamp-flicker
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때
    scene: >-
      불빛이 돌다가 한 번 걸린다. 한 박자, 두 박자. 그동안 해변이 어둡다. 파도 끝에서 젖은 손이 모래를 짚는다.
      또 하나. 불빛이 다시 돌아올 때 그것들은 벌써 배 난간까지 와 있다.
    once: true
  - id: borrowed-voice
    kind: random
    when: 선원들이 흩어져 있거나 안개 속에 있을 때
    scene: >-
      안개 너머에서 동료 목소리가 부른다. "여기, 여기야. 발이 빠졌어." 말버릇까지 똑같다. 다만 그 동료가 방금 옆에서
      기침을 했다.
    once: false
  - id: fog-tide
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때
    scene: >-
      등불이 꺼진다. 소리가 없다. 안개가 우물가 상 다리를 타고 올라와 수저를 덮는다. 계단 위에서 성냥 긋는 소리가 난다.
      오르나가 장부 첫 장 귀퉁이에 불을 붙여 들고 서 있다. 불이 종이 끝에서 망설인다.
      "이거 한 장이면 오십 년이에요. 손님, 오십 년."
    stakes: 핌의 이름, 마을, 그리고 선원들의 이름

trials:
  - id: calling-fog
    name: 이름을 부르는 안개
    act: 1
    description: 안개 속에서 흩어진 동료를 찾아야 한다. 그런데 이름을 부르면 안개가 그 이름을 가져간다.
    test: 이름 대신 쓸 신호를 정하거나, 동료 목소리를 흉내 내는 부름에 대답하지 않고 버틴다 (지혜 내성 DC 13)
    on_success: 가짜 목소리를 가려내는 요령을 익힌다. 이후 borrowed-voice 이벤트에서 이점
    on_fail: 대답한 선원의 이름이 흐려진다. 동료들이 그 이름을 부르려 하면 첫 글자에서 막힌다
  - id: captains-bargain
    name: 선장의 흥정
    act: 2
    description: 선장은 장부실로 가는 물길을 알려 주겠다고 한다. 값은 하룻밤 쓸 이름 하나다.
    test: 조건에 빠진 기한을 짚어 내거나 (통찰 DC 16), 다른 값을 내밀어 흥정한다
    on_success: 값 없이, 또는 작은 값으로 물길을 알아낸다
    on_fail: 선원 하나의 기억 하나가 담보로 잡힌다. 어릴 적 집 부엌 냄새 같은 것. 선장을 풀어 줘야 돌려받는다
  - id: first-page
    name: 장부 첫 장
    act: 3
    description: 오르나가 앞치마 안에 품고 다니는 장부 첫 장을 손에 넣어야 한다.
    test: 오르나 몰래 빼낸다 (은신 DC 16). 혹은 그녀를 설득한다 (호감도 신뢰 이상이면 이점)
    on_success: 첫 장을 손에 넣는다. 핌의 이름을 누가 불러 줄지 선원들이 정할 수 있다
    on_fail: 오르나가 첫 장을 빼앗아 등대 꼭대기로 올라간다. 위기 시계 +2
  - id: dying-light
    name: 꺼져 가는 불
    act: 4
    description: 등불이 꺼지고 안개가 밀려드는 동안, 누군가는 장부를 끝까지 읽거나 불 곁을 지켜야 한다.
    test: 안개 속에서 라운드마다 건강 내성 DC 15. 또는 자기 이름을 불에 넣는다
    on_success: 선택한 결말을 끝까지 해낸다
    on_fail: 버티지 못한 선원은 호칭 하나를 잃는다. 동료들이 새 이름을 지어 줄 때까지 판정에 불리

blessings:
  - id: salt-guest
    name: 소금 식구
    description: 섬 음식을 먹고 식구로 받아들여진 사람 옷에서는 한동안 짠 냄새가 가시지 않는다. 무명들은 그 냄새를 피한다.
    condition: 잔치 음식을 먹고, 오르나나 핌의 호감도가 신뢰 이상이 된다
    effect: 이 섬에 있는 동안 안개와 무명에 맞서는 지혜 내성 판정에 이점. 대신 섬을 떠날 때 법칙 3의 값을 치른다
    lasts: island
  - id: true-name
    name: 불러 준 이름
    description: 누가 소리 내어 불러 준 이름은 쉽게 빼앗기지 않는다. 부른 사람 목소리가 이름에 묻어 있다.
    condition: 장부에서 동료나 NPC의 이름을 찾아 소리 내어 불러 주거나, 이름을 잃은 선원에게 동료들이 새 이름을 지어 준다
    effect: 캠페인 동안 한 번, 정신을 조종하거나 홀리는 효과를 자동으로 떨쳐 낸다
    lasts: campaign

exits:
  - id: relight
    name: 이름 하나를 넣는다
    condition: 선원 중 누군가 자기 이름을 스스로 등불에 넣는다
    epilogue: >-
      불이 다시 돈다. 배가 안개를 빠져나올 때 누가 뱃머리 쪽을 향해 부르려다 입을 다문다. 거기 서 있는 사람을
      뭐라고 불러야 할지 아무도 모른다. 그 사람이 먼저 돌아본다. "나 불렀어?"
    grants: [lantern-shard]
  - id: free-the-nameless
    name: 장부를 읽는다
    condition: 장부실의 이름을 소리 내어 읽어 무명을 풀어 준다
    epilogue: >-
      한 이름을 읽을 때마다 해변에서 누가 기침을 한다. 젖은 옷을 입은 사람들이 모래 위에 앉아 제 손을 본다.
      등대는 다시 켜지지 않는다. 섬이 안개에 잠기는 동안 선장이 뱃머리에서 길을 짚는다. 그는 끝까지 제 이름을 묻지 않는다.
    grants: [captains-compass]
  - id: flee
    name: 떠난다
    condition: 위기 시계가 다 차기 전에 배로 돌아간다
    epilogue: >-
      뒤에서 불빛이 여전히 돈다. 섬 음식을 먹은 사람은 다음 항구에서 무언가 하나를 떠올리지 못한다. 어머니가 부르던
      노래 둘째 줄 같은 것.
    grants: []

treasures:
  - id: lantern-shard
    name: 등불 조각
    description: 손바닥만 한 유리 조각 안에 푸른 불씨가 앉아 있다. 가까이 대면 종이 타는 냄새가 희미하게 난다.
    kind: magic
    power: 어둠이나 안개 속에서 한 번, 숨겨진 길을 비춘다.
  - id: captains-compass
    name: 선장의 나침반
    description: 바늘 대신 가는 안개 한 줄기가 도는 나침반. 뚜껑 안쪽에 이름을 긁어낸 자국이 있다.
    kind: anomaly
    power: 다음 섬을 고를 때 한 번, 선원들이 가장 원하는 것이 있는 섬을 가리킨다.

gm_notes:
  pacing: >-
    초반은 조용하고 다정하게. 무서운 건 친절 쪽에서 온다. 밥상, 차, 부르는 목소리. 등불이 한 번 걸린 뒤부터는
    장면을 짧게 끊고 몰아친다.
  do:
    - 누가 이름을 부를 일이 생기면 한 박자 멈춘다. 불빛이 지금 어디를 돌고 있는지 짚어 준다.
    - 오르나를 악당이 아니라 오십 년 동안 한 가지 선택을 되풀이한 사람으로 그린다. 그녀의 친절은 진짜다.
    - 공포는 사물로 보여 준다. 수저 개수, 젖은 발자국, 긁힌 이름판, 종이 타는 냄새.
    - 말투를 고정한다. 오르나는 느린 해요체, 핌은 질문 많은 반말, 선장은 겹치는 목소리의 하게체.
  dont:
    - 첫 장면에서 등대의 비밀을 알려 주지 않는다.
    - 무명을 괴물처럼 그리지 않는다. 그들은 젖은 손을 가진 옛 손님이다.
    - 핌이 다치는 장면을 그리지 않는다. 위험은 이름에만 온다.
