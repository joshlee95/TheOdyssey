# 레드록: 금광 마을, 현상금 사냥꾼, 정오의 결투, 철도 회사의 음모.
schema_version: 1
id: dustwind-gulch

meta:
  title: 레드록
  author: 오디세이 테스트팩
  tagline: 상륙한 날 아침, 마을 게시판에 당신 얼굴이 붙어 있었다. 생사불문, 500달러. 잉크는 벌써 바래 있었다.
  tone: [서부극, 비정함, 복수, 긴장]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: mature
    lines:
      - 아이에게 가해지는 폭력
      - 성폭력
      - 인종이나 민족을 비하하는 표현을 대사로 쓰는 것
    veils:
      - 고문의 구체적인 과정
      - 무너진 갱도 속 시신의 세부 묘사
      - 성인 사이의 성적 장면은 램프가 꺼지는 데서 끝낸다

public:
  rumor: >-
    서쪽 모래 바다 끝에 레드록이라는 금광 마을이 있다. 5년 전 광산이 무너져 서른한 명이 묻힌 뒤로 금이 끊겼다고 한다.
    그런데 요즘 그 협곡까지 철도가 깔리고 있다. 금 안 나는 마을에 철도가 왜 들어가는지 묻는 사람은 없다.
    거기서는 묻는 사람이 먼저 묻힌다는 얘기가 있어서다.
  first_sight: >-
    붉은 사암 절벽이 수평선 위로 솟는다. 절벽 틈으로 누런 모래바람이 흘러내린다.
    협곡 어귀 소금 호수 위에 반쯤 깔린 철로가 햇빛에 번쩍인다. 절벽 중턱 폐광 입구 앞에 작은 나무 십자가가 빽빽하다. 교회 종이 한 번 울린다.
  arrival: >-
    배가 소금 호수의 철도회사 부두에 닿는다. 흰 정장 신사가 모자를 들어 인사하는 사이, 총 멘 사내들이 뱃전에 나무판을 못 박는다.
    '철도 부지 무단 정박. 압류.' 햇볕이 정수리를 누른다. 바람에 섞인 쇳가루 모래가 이 사이에서 서걱거린다.

world:
  reality:
    genre: [서부극, 복수극, 스릴러]
    era: 1878년, 서부 개척의 끝자락. 전신선과 철도가 막 협곡에 닿은 금광 마을
    magic: none
    technology: industrial
    speech: >-
      느리고 거친 하오체와 반말. "이봐, 이방인", "그렇게 하슈", "총은 내려놓는 게 좋을 거구먼".
      말은 짧게 끊고, 진짜 하고 싶은 말은 위스키 잔을 내려다보며 한다. 욕은 한 단어로 끝낸다.
      성경 구절과 포커 용어가 속담처럼 섞인다. "패는 까 봐야 알지", "뿌린 대로 거둔다던데".
    outsiders: >-
      이방인은 셋 중 하나로 본다. 광부, 현상금 사냥꾼, 아니면 철도회사 개. 첫날엔 얼굴보다 총 쥔 손을 먼저 본다.
      선원들이 온 아침에는 네 번째가 생겼다. 게시판에 얼굴이 붙은 철도 강도단.
    crossover:
      magic: works
      tech: weakened
      note: >-
        이 땅에 마법은 없지만 막지도 않는다. 다른 세계의 마법과 이능은 그대로 된다. 대신 본 사람들은 악마 짓이거나 떠돌이 약장수 사기라고 여기고,
        그날 밤 안으로 시전자 목에 현상금 100달러를 더 붙인다.
        다른 세계의 전기·전자 장비는 사흘째 부는 쇳가루 바람 때문에 지직거리다 자주 먹통이 된다. 화약·증기·태엽으로 도는 물건은 멀쩡하다.
    appearance: unchanged
  premise: >-
    레드록 금광은 5년 전 붕괴로 광부 서른한 명이 묻힌 뒤 말라붙었다고 알려져 있다. 그 붕괴는 컨티넨털 퍼시픽 철도회사가 광업권자들을 몰아내려고 한 발파였다.
    진짜 금맥은 폐광이 아니라 마을 바로 밑을 지난다.
    철도 대리인 사일러스 크레인은 내일 정오, 회사 이사들을 태운 첫 기차가 도착하는 순간 마을 밑 갱도에 묻은 다이너마이트로 마을을 사고처럼 날릴 생각이다.
    그 죄는 철도 강도단에게 씌운다. 강도단 전단은 선원들이 오기 전날 인쇄됐다.
    마을 전체 지하권을 보장하는 문서는 붕괴로 남편을 잃은 살롱 주인 마사 홀리데이의 광업권 증서 한 장뿐이다.
    크레인의 본명은 에이머스 라일. 동부에서 마을 두 곳을 불태운 수배범이다.
  laws:
    - 정오의 결투는 건드리지 않는다. 정면에서, 증인 앞에서, 상대가 먼저 뽑았다면 아무도 살인이라 부르지 않는다.
    - 현상수배 전단에 얼굴이 붙은 사람은 누구든 쏠 수 있다. 산 채로든 죽여서든.
    - 살롱 안에서는 총을 카운터에 맡긴다. 어기면 마사가 쏜다.
    - 모래바람이 불면 아무도 거리에 안 나간다. 바람 속에서는 누가 누구를 쐈는지 아무도 모른다.
  start_location: rail-camp
  clock:
    name: 정오 기차
    segments: 6

story:
  theme: 법이 팔려 버린 땅에서 총을 뽑는 이유는 복수인가, 정의인가?
  hook: >-
    철도회사가 배를 압류했다. 마을에 들어서니 게시판에 선원들 얼굴을 그린 현상수배 전단이 붙어 있다.
    "철도 강도단. 생사불문. 1인당 500달러." 잉크가 이미 바랬다. 누군가 선원들이 오기 전부터 그들을 기다리고 있었다.
    배를 되찾고 살아서 나가려면 이 전단을 누가 왜 붙였는지 알아내야 한다.
  acts:
    - name: 수배된 이방인
      goal: 살아남아 전단이 꾸며졌다는 증거를 찾고, 마을에서 누가 누구 편인지 파악한다
      beats:
        - 철도 부두의 압류와 사일러스 크레인의 정중한 인사. 그는 선원들 얼굴을 보고도 모르는 척한다 (salt-dock-arrival)
        - 중앙 거리 게시판 앞에서 마을 사람들 손이 하나씩 권총집으로 내려간다. 살롱 창가에서 까마귀 깃털 모자를 쓴 여자가 본다 (poster-standoff)
        - 살롱에서 마사가 총을 맡기라고 한다. 포커 판에 크레인의 총잡이들이 앉아 있다 (saloon-poker)
        - 크레인이 캠프로 선원들을 불러 차를 따르며 제안한다. 수배를 거둬 주겠다, 대신 과부의 증서를 가져오라
      turn: >-
        토미가 전신국 쓰레기통에서 주운 전보 조각을 1센트에 판다. "강도단 전단 50장 선불 완료. 인상착의는 다음에 협곡에 들어오는 외지인으로."
        날짜는 선원들이 오기 전날이다 (scapegoat-posters). 크레인에게 필요한 건 강도가 아니라 누명 쓸 얼굴이었다
    - name: 서른한 개의 십자가
      goal: 크레인이 왜 누명 쓸 사람을 필요로 하는지, 5년 전 광산 붕괴의 진실에 다가간다
      beats:
        - 폐광 입구의 십자가 서른한 개와 바위에 줄지어 난 드릴 구멍. 갱도에서 바람이 새어 나올 때마다 휘파람 같은 소리가 길게 운다 (thirty-one-crosses)
        - 마사가 남편의 마지막 편지를 꺼낸다. 붕괴 전날 밤 "회사 사람들이 갱도에 상자를 넣는 걸 봤다"고 적혀 있다
        - 한밤중에 크레인의 총잡이들이 살롱에 불을 지른다 (night-raid)
        - 보안관 해스킨스가 술병을 책상 서랍에 넣고 입을 연다. 그날 발파 소리를 들었고, 크레인의 돈을 받았다
      turn: >-
        폐광 깊은 곳에서 찾은 새 도화선이 무너진 광산이 아니라 마을 쪽으로 뻗어 있다.
        진짜 금맥은 마을 밑에 있고, 크레인이 원하는 건 광산이 아니라 마을 땅이다. 내일 정오 기차가 들어오면 마을이 통째로 날아가고,
        그 죄는 선원들 것이 된다 (mine-collapse, true-vein)
    - name: 흰 양복의 이름
      goal: 크레인을 무너뜨릴 증거와 그의 본명을 손에 넣고, 도화선이 묻힌 갱도를 찾는다
      beats:
        - 루스가 안장 가방에서 손때 묻은 수배서를 꺼낸다. 얼굴은 크레인, 이름은 에이머스 라일 (crane-true-name)
        - 철도 캠프의 흰 개인 객차에 몰래 들어간다. 금고 안에 뇌물 영수증과 다이너마이트 주문서가 있다 (private-car)
        - 토미가 아빠의 쪽지를 보여 주고, 살롱 지하실 뒤 판자로 막은 갱도 입구를 알려 준다. 다이너마이트 상자가 교회와 살롱 밑까지 줄지어 있다
      turn: >-
        루스의 호감도가 유대 미만이면, 그녀는 크레인을 정오의 거리로 끌어내려고 선원 한 명을 크레인에게 넘긴다.
        "미안. 저놈은 인질이 있어야 기차에서 내려." 유대라면 대신 자기가 잡혀간다.
        같은 밤, 보안관의 호감도가 신뢰 미만이면 그는 마사의 증서를 들고 크레인의 객차 문을 두드린다
    - name: 정오
      goal: 도화선을 끊고, 크레인과의 끝을 선원들 손으로 정한다
      beats:
        - 정오의 기적 소리. 크레인이 인질을 앞세우고 선로 위에 서고, 갱도 속 도화선에 불이 붙는다 (high-noon-train)
        - 누군가는 어두운 갱도로 뛰어들어 도화선을 끊고, 누군가는 거리 한복판에서 크레인의 총잡이와 마주 선다
        - 유대 단계의 NPC가 선원 곁에 선다. 마사는 산탄총을 들고, 보안관은 닦은 별을 달고, 루스는 복수 대신 선원 목숨을 고를 기회를 쥔다
      turn: 선원들의 선택이 결말(exits)을 정한다. 심판할 것인가, 금을 들고 달아날 것인가, 증거를 싣고 기차에 오를 것인가

locations:
  - id: rail-camp
    name: 철도 캠프와 소금 부두
    description: >-
      소금 호수 가장자리, 반쯤 깔린 선로가 끝나는 자리에 천막과 침목 더미, 다이너마이트 창고가 늘어서 있다.
      부두에는 압류판이 박힌 선원들의 배. 캠프 한가운데 흰 개인 객차가 한 대 서 있다. 창틀에 모래 한 알 없다.
      안에는 가죽 의자, 크리스털 잔, 무쇠 금고가 있다.
    connects_to: [main-street]
    tags: [시작, 철도회사, 출구]
  - id: main-street
    name: 중앙 거리
    description: >-
      모래가 발목까지 쌓인 흙길 양옆으로 판잣집 상점, 교회, 급수탑이 선다. 거리 한복판에 빈 교수대와 현상수배 게시판.
      정오가 되면 그림자가 발밑으로 숨는 곳이라, 이 마을 결투는 전부 여기서 끝났다.
    connects_to: [rail-camp, saloon, sheriff-office, old-mine]
    tags: [결투, 소문, 위험]
  - id: saloon
    name: 홀리데이 살롱
    description: >-
      스윙도어, 음이 나간 피아노, 벽에 박힌 총알 자국들. 카운터 위에 총을 맡기는 나무 선반이 있고, 그 밑에 마사의 산탄총이 있다.
      2층에 방이 여섯. 지하 저장고 안쪽 벽은 판자로 막혀 있다. 밤이 깊으면 그 너머에서 곡괭이 소리가 난다는 말이 돈다.
    connects_to: [main-street, under-vein]
    tags: [안전, 정보, 도박]
  - id: sheriff-office
    name: 보안관 사무소
    description: >-
      녹슨 철창 감방 두 칸, 위스키 냄새가 밴 책상. 벽에 5년 전 붕괴 사망자 명단이 누렇게 붙어 있다.
      서랍 안에 인쇄소 날짜 도장이 찍힌 현상수배 전단 원본 묶음이 있다.
    connects_to: [main-street]
    tags: [법, 감옥, 증거]
  - id: old-mine
    name: 폐광
    description: >-
      절벽 중턱의 무너진 광산 입구. 앞에 선 나무 십자가 서른한 개에 이름 대신 번호만 새겨져 있다.
      입구 바위에 발파용 드릴 구멍이 자로 잰 듯 한 줄로 나 있다. 바람이 갱도를 빠져나올 때마다 길게 우는 소리가 난다.
    connects_to: [main-street, under-vein]
    tags: [무덤, 진실, 위험]
  - id: under-vein
    name: 마을 밑 갱도
    description: >-
      폐광 깊은 곳과 살롱 지하실을 잇는 새 갱도. 누가 몰래 팠다. 램프를 비추면 벽의 금맥이 누렇게 빛을 받는다.
      다이너마이트 상자가 교회와 살롱, 급수탑 밑까지 줄지어 묻혀 있고, 도화선 하나가 그 전부를 잇는다.
    connects_to: [old-mine, saloon]
    hidden: true
    tags: [금맥, 폭약, 클라이맥스]

npcs:
  - id: martha-holliday
    name: 마사 홀리데이
    role: 홀리데이 살롱 주인. 광업권 증서를 가진 사람
    adult: true
    look: >-
      서른여덟. 상복 대신 진홍 드레스를 입고 가터에 데린저를 찼다. 손등에 오래된 화약 화상.
      목에 남편의 광부 인식표를 가죽끈으로 걸었다. 생각할 때 그 인식표를 이로 문다.
    personality: >-
      남 우는 꼴은 못 보고 자기는 안 운다. 누가 죽으면 제일 먼저 잔을 채우고 제일 나중에 불을 끈다.
      5년 동안 크레인을 의심했지만 증거가 없었다. 그래서 매일 밤 그의 부하들에게 위스키를 따르며 취한 입에서 나오는 말을 외워 뒀다.
    voice: >-
      느긋한 하오체에 비꼬는 농담. 남자는 전부 "카우보이"라 부르고, 이름은 그 사람을 믿을 때부터 부른다.
      나쁜 소식일수록 웃으며 먼저 말한다. 남편 얘기가 나오면 농담이 뚝 끊기고 문장이 짧아진다.
    wants: 남편과 서른 명을 죽인 자가 값을 치르는 것. 이 마을이 남편처럼 땅 밑에 묻히지 않는 것.
    fears: 증서를 지키다가 토미가 다치는 것. 결국 크레인에게 증서를 팔게 될지도 모른다는 것.
    location: saloon
    alertness: sharp
    affinity: 10
    likes:
      - 살롱 규칙(총 맡기기)을 지키는 것
      - 폐광의 서른한 명 앞에서 모자를 벗는 것
