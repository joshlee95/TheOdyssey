      존댓말과 반말이 반반 섞인 빠른 말. "아저씨, 이거 진짜 비밀인데요!" 하고 운을 뗀다.
      값을 부를 때 꼭 한 번 올린다. "1센트요. 아니 2센트." 무서우면 말이 더 빨라진다.
    wants: 루스처럼 멋진 총잡이가 되는 것. 마사 아줌마를 지키는 것.
    fears: 폐광. 아빠가 거기 서른한 명 중 하나로 묻혀 있다. 흰 양복 아저씨의 웃는 눈.
    location: main-street
    alertness: normal
    affinity: 35
    likes:
      - 1센트 동전
      - 모험 이야기, 특히 총잡이 이야기
      - 어른 대접. 위험한 일에 끼워 준다는 뜻은 아니다
    dislikes:
      - 애 취급
      - 마사 아줌마 욕
      - 약속을 안 지키는 것
    behaviors:
      hostile: 선원들이 어디 묵는지 크레인의 부하에게 5센트에 판다
      wary: 전보 얘기엔 "몰라요"만 하고, 선원들 뒤를 밟아 마사에게 일러바친다
      friendly: 전신국 쓰레기통에서 주운 크레인의 전보 조각들을 펼쳐 보인다. 전단 주문, 그리고 "정오 도착 확정. 발파 준비"
      trusted: 붕괴 날 아빠가 도시락 보자기에 쓴 쪽지를 보여 주고, 살롱 지하실 뒤 판자로 막은 갱도 입구를 알려 준다
      bonded: 전신국 전신기로 연방 보안관에게 몰래 전보를 친다. 크레인의 본명과 정오의 계획을, 자기 이름을 걸고
    romance: false
    relations:
      - npc: martha-holliday
        affinity: 90
        note: 엄마 같은 사람
      - npc: ruth-mcgraw
        affinity: 70
        note: 영웅. 저 모자를 꼭 한번 써 보고 싶다
      - npc: silas-crane
        affinity: -60
        note: 무서운 흰 양복. 웃을 때 눈은 안 웃는다
      - npc: sheriff-haskins
        affinity: 20
        note: 불쌍한 아저씨. 아빠 장례식 때 울었다
    knows:
      - { secret: scapegoat-posters, share_at: friendly }
      - { secret: true-vein, share_at: trusted }
    sample_lines:
      - (경계) 아저씨들 진짜 강도예요? 에이, 강도는 저렇게 멍하게 안 서 있는데.
      - (경계) 몰라요. 진짜 몰라요. 2센트 주면 알 수도 있고요.
      - (호의) 이거 1센트요. 아니 2센트. 흰 양복 아저씨 전보거든요. 이런 건 목숨값이 붙어서 비싸요.
      - (신뢰) 아빠가 도시락 싸 가던 보자기요. 뒷면에 뭐 써 놨어요. 마사 아줌마한테는 아직 안 보여 줬어요.
      - (유대) 전보 쳤어요. 제 이름으로요. 토미 오닐. 철자 안 틀렸어요, 두 번 봤어요.

secrets:
  - id: scapegoat-posters
    truth: >-
      선원들의 현상수배 전단은 그들이 오기 전날 인쇄됐다. 크레인은 정오의 폭발을 뒤집어씌울 철도 강도단이 필요했고,
      다음에 협곡에 들어오는 외지인 무리를 그 자리에 정해 뒀다. 섬은 빈 인상착의를 선원들 얼굴로 채웠다.
    hints:
      - 전단 잉크가 이미 바랬고, 모서리가 햇볕에 말려 있다.
      - 보안관 서랍 속 원본에 찍힌 인쇄소 날짜 도장이 선원들이 오기 전날이다.
      - 토미가 주운 전보 조각에 "전단 50장 선불"이라고 적혀 있다.
    reveal_when: 1막 전환점에서 토미의 전보를 볼 때, 보안관 서랍을 뒤지거나 그의 호의를 얻을 때, 또는 루스와 얘기할 때
  - id: mine-collapse
    truth: >-
      5년 전 광산 붕괴는 사고가 아니라 철도회사의 발파였다. 광부 서른한 명이 죽었고, 그중에 마사의 남편과 토미의 아버지가 있다.
      붕괴 다음 주부터 철도회사는 겁먹은 광업권자들 땅을 헐값에 사들였다. 보안관 해스킨스는 발파 소리를 듣고도 돈을 받고 입을 닫았다.
    hints:
      - 폐광 입구 바위에 발파용 드릴 구멍이 한 줄로 나 있다.
      - 마사 남편의 마지막 편지에 "회사 사람들이 갱도에 상자를 넣었다"고 적혀 있다.
      - 보안관 사무소 벽 사망자 명단 옆에 붕괴 일주일 뒤 날짜의 철도회사 토지 매입 공고가 겹쳐 붙어 있다.
    reveal_when: 폐광을 조사하거나, 마사나 보안관을 신뢰 단계까지 끌어올릴 때
  - id: true-vein
    truth: >-
      진짜 금맥은 폐광이 아니라 마을 바로 밑을 지난다. 크레인은 폐광 깊은 곳에서 마을 밑으로 새 갱도를 몰래 파고,
      교회·살롱·급수탑 밑에 다이너마이트를 묻었다. 정오 기차가 들어오는 순간 도화선에 불을 붙여 마을을 지운다.
      마사의 증서만 없으면 지하권은 회사 것이 된다.
    hints:
      - 밤이 깊으면 살롱 지하실 판자벽 너머에서 곡괭이 소리가 난다.
      - 철도 캠프 다이너마이트 창고의 상자 수가 장부보다 한참 모자란다.
      - 토미 아버지의 쪽지에 "금은 광산 말고 마을 쪽으로 뻗었다"고 적혀 있다.
    reveal_when: 2막 전환점에서 폐광 속 도화선을 따라갈 때, 또는 토미의 신뢰를 얻어 막힌 갱도 입구를 알게 될 때
  - id: crane-true-name
    truth: >-
      사일러스 크레인의 본명은 에이머스 라일. 동부 텍사스에서 철도 부지를 얻으려고 마을 두 곳을 불태운 방화 살인 수배범이다.
      루스 맥그로는 그 마을 가운데 하나의 생존자이고, 크레인의 총잡이로 고용된 척하며 그를 쫓아왔다.
    hints:
      - 크레인의 지팡이 은 손잡이 밑면에 긁어 지운 'A.L.' 이니셜이 있다.
      - 크레인은 사진기 앞에 절대 안 선다.
      - 루스는 크레인과 말할 때 그의 왼손 장갑을 오래 본다. 장갑 밑이 화상 자국이다.
    reveal_when: 루스를 신뢰 단계까지 끌어올리거나, 크레인의 객차에서 옛 신문 스크랩을 찾을 때

events:
  - id: salt-dock-arrival
    kind: arrival
    when: 선원들의 배가 소금 호수 철도 부두에 닿을 때
    scene: >-
      흰 정장 사내가 모자를 가슴에 댄다. "컨티넨털 퍼시픽의 사일러스 크레인입니다. 여긴 회사 부지라서요. 규정상 배는 잠시 맡아 두겠습니다."
      부하들이 망치질을 하는 동안 크레인은 선원들 얼굴을 한 사람씩 본다. 왼쪽에서 오른쪽으로, 명단을 대조하는 속도로.
      협곡 쪽에서 교회 종이 한 번 울린다.
    stakes: 여기서 총을 뽑으면 첫날부터 철도회사 총잡이 열두 명과 싸운다. 크레인의 첫인상이 그의 나중 제안을 바꾼다
  - id: poster-standoff
    kind: location
    where: main-street
    when: 선원들이 처음 중앙 거리에 들어설 때
    scene: >-
      게시판 앞에서 대장장이가 전단과 선원들 얼굴을 번갈아 본다. 망치가 그의 손에서 내려간다. 대신 오른손이 허리로 간다.
      하나, 둘. 거리의 손들이 권총집 위에 얹힌다. 바람이 멎고 풍차 삐걱대는 소리만 남는다.
      살롱 창가에서 까마귀 깃털 모자를 쓴 여자가 잔을 입에 댄 채 내리지 않는다.
    stakes: 고난 poster-standoff-trial로 이어진다. 누가 먼저 뽑으면 거리에 피가 뿌려진다
  - id: saloon-poker
    kind: location
    where: saloon
    when: 선원들이 처음 살롱에 들어서거나 포커 판에 앉을 때
    scene: >-
      "총은 선반에." 마사가 턱으로 가리킨다. 구석 포커 테이블에서 크레인의 총잡이 셋이 판돈 대신 선원들 현상금을 두고 내기를 한다.
      한 놈이 소매에서 에이스를 빼다가 선원과 눈이 마주친다. 피아노가 멈춘다.
    stakes: 속임수를 까발리면 마사의 호감이 오르지만 총잡이들이 앙심을 품는다. 살롱 안에서 먼저 총을 뽑으면 마사가 쏜다 (법칙 3)
  - id: thirty-one-crosses
    kind: location
    where: old-mine
    when: 선원들이 처음 폐광 입구에 닿을 때
    scene: >-
      번호만 새긴 십자가 서른한 개가 모래바람에 한쪽으로 기울어 있다. 7번 밑에 녹슨 광부 호루라기가 하나 놓여 있다.
      갱도에서 바람이 빠져나올 때마다 길고 낮은 소리가 난다. 입구 바위의 드릴 구멍은 한 뼘 간격으로 곧게 줄지어 있다. 무너진 돌은 그렇게 안 깨진다.
    stakes: 모자를 벗고 추모하면 마사와 토미의 호감이 오른다. 갱도 깊이 들어가면 2막 전환점의 도화선에 닿는다
  - id: private-car
    kind: location
    where: rail-camp
    when: 선원들이 크레인의 흰 개인 객차에 몰래 들어갈 때
    scene: >-
      가죽 의자, 크리스털 디캔터. 벽의 협곡 지도에 마을 전체가 붉은 잉크로 동그라미 쳐져 있고, 여백에 단정한 글씨가 있다. '정오. 발파. 강도단.'
      무쇠 금고 다이얼이 달빛을 받는다. 객차 밖에서 박차 소리가 한 걸음씩 가까워진다.
    stakes: 고난 private-car-safe로 이어진다. 들키면 현상금이 두 배가 된다
  - id: night-raid
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때 (자정 무렵)
    scene: >-
      석유 냄새가 먼저 온다. 살롱 창으로 불붙은 병이 날아들고, 스윙도어가 산탄에 쪼개진다. 크레인의 총잡이 여섯이 말을 달리며 쏜다.
      피아노 치던 늙은 샘이 건반 위로 엎어진다. 목에서 나온 피가 상아 건반 틈으로 흘러든다.
      2층 계단에 불이 옮겨붙는다. 마사가 카운터 밑에서 산탄총을 꺼내며 외친다. "증서! 2층에 있어!"
    stakes: 증서, 마사의 목숨, 살롱. 고난 burning-saloon으로 이어진다
    once: true
  - id: dust-storm
    kind: random
    when: 선원들이 마을 밖에 있거나, 거리에서 오래 머물 때
    scene: >-
      하늘이 누렇게 변하고 쇳가루 섞인 모래바람이 벽처럼 밀려온다. 세 걸음 앞이 안 보인다. 바람 속 어딘가에서 총성이 한 번 난다.
      선원 귀 옆 판자벽에 구멍이 뚫린다. 누가 쐈는지, 누구를 노렸는지는 아무도 모른다 (법칙 4).
    stakes: 모래바람 속에서는 감지 판정에 불리. 흩어진 선원은 바람이 걷힐 때 다른 곳에 서 있다
    once: false
  - id: high-noon-train
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때 (정오)
    scene: >-
      해가 정수리 위에 선다. 그림자가 발밑으로 들어가 사라진다. 협곡 저편에서 기적이 길게 울고, 검은 연기를 뿜는 기관차가 들어온다.
      크레인이 선로 위에서 회중시계 뚜껑을 연다. "정확하군요." 그가 손수건을 흔들자 갱도 속 도화선이 쉭 소리를 내며 타들어 간다.
      중앙 거리 양끝에 그의 총잡이들이 늘어선다. 교회 종이 정오를 친다. 열두 번.
    stakes: 마을 전체, 인질로 잡힌 사람, 선원들 이름에 붙은 누명

trials:
  - id: poster-standoff-trial
    name: 게시판 앞
    act: 1
    description: 전단을 본 마을 사람들이 총을 겨눈다. 한 발만 터져도 거리 전체가 사격장이 된다.
    test: >-
      위협 DC 15로 기를 꺾거나, 설득 DC 15로 보안관을 불러 재판을 요구한다. 전단의 바랜 잉크를 짚어 내면 (감지 DC 13) 설득에 이점.
      먼저 뽑으면 전투가 벌어진다
    on_success: 아무도 안 쏜다. 보안관이 체포 대신 "조사 중"을 선언하고, 루스가 처음으로 잔을 내려놓고 선원들 쪽으로 몸을 돌린다
    on_fail: 총성이 울리고 선원 한 명이 총상을 입는다 (최대 HP의 절반 피해). 보안관이 그들을 감방에 넣고, 위기 시계 +1
  - id: burning-saloon
    name: 불타는 살롱
    act: 2
    description: 크레인의 총잡이들이 살롱에 불을 질렀다. 2층에 증서가 있고, 불길 속에 사람들이 있고, 밖에서는 총잡이들이 쏜다.
    test: >-
      불길을 뚫고 2층에 올라가 증서를 가져오려면 운동 또는 곡예 DC 15, 연기 속에서 건강 내성 DC 13.
      동시에 누군가는 밖의 총잡이 여섯을 상대하거나 쫓아내야 한다 (전투 또는 위협 DC 17)
    on_success: 증서와 사람들을 구한다. 마사의 호감도가 크게 오르고, 붙잡은 총잡이 한 명에게서 크레인의 명령을 캐낼 수 있다
    on_fail: 증서는 건지지만 살롱이 무너지고 마사가 화상을 입는다. 총잡이들은 다 달아나고, 위기 시계 +1
  - id: private-car-safe
    name: 흰 객차의 금고
    act: 3
    description: 크레인의 개인 객차 무쇠 금고에 뇌물 영수증, 다이너마이트 주문서, 에이머스 라일의 옛 신문 스크랩이 있다.
    test: >-
      경비 눈을 피해 객차에 들어가려면 은신 DC 16, 금고를 열려면 손재주 DC 17. 루스에게 다이얼 듣는 법을 배웠으면 (신뢰 이상) 이점.
      크레인을 저녁 식사로 붙잡아 둘 미끼가 있으면 은신 판정은 생략
    on_success: 크레인을 법정에서도 결투장에서도 무너뜨릴 증거를 얻는다. 보안관에게 영수증을 돌려주면 그가 목줄에서 풀린다
    on_fail: 증거 일부만 챙기고 들킨다. 현상금이 두 배가 되고, 크레인이 계획을 한 시간 앞당긴다 (위기 시계 +1)
  - id: fuse-in-the-dark
    name: 어둠 속 도화선
    act: 4
    description: 마을 밑 갱도에서 도화선이 타들어 간다. 갈래는 여럿이고 램프는 하나다.
    test: >-
      생존 또는 감지 DC 15로 진짜 도화선을 찾아 끊는다. 토미 아버지의 쪽지나 갱도 지도가 있으면 이점. 실패할 때마다 한 갈래가 폭발에 더 가까워진다 (최대 세 번)
    on_success: 도화선이 전부 끊긴다. 마을은 무사하고, 크레인의 계획은 증거로만 남는다
    on_fail: 도화선 한 갈래가 터져 급수탑이 무너진다. 마을은 절반만 남고, 갱도 안의 선원은 건강 내성 DC 15로 매몰을 피해야 한다
  - id: noon-duel
    name: 정오의 결투
    act: 4
    description: 크레인은 직접 안 쏜다. 대신 청부 총잡이 실버 조가 거리 한복판에 선다. 은도금 리볼버 손잡이에 눈금이 스물두 개 새겨져 있다.
    test: >-
      상대가 뽑는 순간을 읽는 통찰 DC 16에 성공하면 선제 공격에 이점, 이어 명중 판정. 상대가 먼저 뽑게 만들면 법칙 1에 따라 아무도 살인이라 부르지 않는다.
      유대 단계 NPC가 곁에 서면 두 번째 총잡이는 그 NPC가 맡는다
    on_success: 실버 조가 모래 위에 쓰러진다. 크레인 앞을 막을 사람이 없어진다
    on_fail: 선원이 총에 맞아 쓰러진다 (HP 0 직전에서 멈춤). 곁에 선 NPC가 대신 방아쇠를 당기지만, 그 NPC도 크게 다치거나 쓰러진다

blessings:
  - id: high-noon-hand
    name: 정오의 손
    description: 그림자 없는 거리에서 살아남은 손은 어느 세계에서든 먼저 움직인다.
    condition: 정오의 결투에서 상대가 먼저 뽑게 만든 뒤 이긴다
    effect: 캠페인 동안 모든 전투의 선제권 판정에 +2. 대치 상황에서 위협 판정에 이점
    lasts: campaign
  - id: thirty-one-blessing
    name: 서른한 개의 이름
    description: 묻힌 사람들 이름을 땅 위에 새겨 준 사람에게 땅이 한 번 길을 비켜 준다.
    condition: 광산 붕괴의 진실을 마을 사람들 앞에 밝히고, 십자가 서른한 개에 광부들 이름을 새겨 준다
    effect: 캠페인 동안 한 번, 붕괴·매몰·추락·폭발로 죽을 상황에서 죽음을 피하고 HP 1로 살아남는다
    lasts: campaign
  - id: dust-eyes
    name: 모래바람 눈
    description: 쇳가루 바람 속을 걸어 본 눈은 뿌연 데서 움직이는 것을 가려낸다.
    condition: 모래바람(dust-storm) 속에서 흩어지지 않고 동료와 함께 빠져나오거나, 루스에게 바람 읽는 법을 배운다
    effect: 이 섬에 있는 동안 모래바람과 연기 속에서 받는 감지 판정 불리를 무시한다
    lasts: island

exits:
  - id: high-noon-justice
    name: 정오의 심판
    condition: 도화선을 끊고, 정오의 거리에서 크레인을 법으로 체포하거나 결투로 쓰러뜨려 마을 사람들 앞에 그의 죄를 드러낸다
    epilogue: >-
      흰 정장 무릎에 모래가 묻는다. 루스가 닳은 수배서를 그의 얼굴 앞에 편다. "이름."
      크레인이 입을 연다. 에이머스 라일. 마을 사람들이 하나둘 모자를 벗는다.
      그날 저녁 십자가 서른한 개에 처음으로 이름이 새겨진다. 보안관이 별을 떼어 마사에게 건네고, 마사는 그걸 선원 손에 쥐여 준다.
      압류판을 뜯어낸 배가 소금 호수를 떠날 때 토미가 광산 호루라기를 길게 분다.
    grants: [tin-star]
  - id: gold-and-run
    name: 금
    condition: 마을을 구하는 대신 갱도의 금맥이나 기차의 회사 금고를 털어 정오의 폭발 전에 달아난다
    epilogue: >-
      등 뒤에서 땅이 솟는다. 교회 종탑이 먼지 속으로 내려앉고, 불붙은 판자 조각이 비처럼 쏟아진다. 안장 가방이 금으로 무겁다.
      다음 날 서부의 모든 게시판에 새 전단이 붙는다. 이번엔 진짜다. "철도 강도단. 레드록 학살의 주범."
      배 위에서 금덩이를 세던 누군가의 손이 멈춘다. 금 사이에 광부 호루라기 하나가 섞여 있다.
    grants: [cursed-nugget]
  - id: evidence-train
    name: 동쪽행 기차
    condition: 뇌물 영수증과 크레인의 옛 수배서를 손에 넣고 도화선을 끊은 뒤, 정오 기차를 되돌려 타고 해안의 연방 법정으로 간다
    epilogue: >-
      기차가 협곡을 빠져나간다. 크레인은 수갑을 찬 채 앉아 있고, 흰 정장 소매에 처음으로 먼지가 묻어 있다.
      재판은 먼 동부에서 열린다. 판결이 날 즈음 선원들은 다른 바다 위에 있을 것이다.
      플랫폼에서 마사가 한 손을 들고, 루스는 모자챙을 한 번 내린다. 종착역 부두에 배가 먼저 와 있다.
    grants: [widows-silver-bullet]

treasures:
  - id: tin-star
    name: 해스킨스의 별
    description: 윌 해스킨스가 소매로 닦아 건넨 양철 별. 뒷면에 칼끝으로 "다시는 입 다물지 말 것"이라고 새겨져 있다.
    kind: mundane
    power: 다음 섬에서 한 번, 그 섬의 법 집행자(경비·기사·경찰·수호자)가 선원 한 명을 같은 편 법관으로 대하고 그의 말을 증언으로 받아들인다.
  - id: widows-silver-bullet
    name: 마사의 은탄환
    description: 마사가 남편의 결혼반지를 녹여 만든 은탄환 한 발. 탄피에 작은 눈금 서른한 개가 새겨져 있다.
    kind: anomaly
    power: 다음 섬에서 한 번, 탄환이든 화살이든 주문이든 선원이 날리는 일격 하나가 무엇에도 막히거나 빗나가지 않고 반드시 맞는다.
  - id: cursed-nugget
    name: 호루라기 박힌 금덩이
    description: 주먹만 한 금덩이에 녹슨 광부 호루라기가 반쯤 박혀 있다. 밤에 가끔 저 혼자 짧게 운다.
    kind: anomaly
    power: 다음 섬에서 한 번, 이 금덩이로 무엇이든 살 수 있다. 단, 그 거래 상대는 그날부터 금에 눈이 멀어 선원들을 다시 찾아온다.

gm_notes:
  pacing: >-
    1막은 긴 침묵과 짧은 총성의 서부극 호흡으로 간다. 대치, 손끝, 먼지. 크레인은 신사로, 마을은 적으로 시작한다.
    2막은 십자가 서른한 개로 가라앉혔다가 살롱 습격(night-raid)으로 폭력을 터뜨린다. 2막 전환점에서
    광산의 비밀을 마을을 통째로 지우려는 계획으로 뒤집는다. 3막은 잠입과 배신의 밤, 4막은 정오를 향해 조여 간다.
    위기 시계 한 칸은 교회 종이나 멀리서 들리는 기적 소리로 알린다.
  do:
    - 총격은 짧고 잔혹하게, 결과가 오래 남게 그린다. 모래에 스며드는 피, 멈춘 피아노, 다음 날까지 남는 탄흔.
    - 대치 장면에서는 침묵을 길게 끈다. 바람, 풍차, 박차 소리, 권총집에 닿는 손끝을 먼저 보여 주고 판정을 부른다.
    - 크레인은 끝까지 공손하고 계산이 맞는 악당이다. 총 대신 장부로 사람을 죽인다.
    - 3막 전환점의 배신은 루스와 보안관의 호감도로 정한다. 선원들이 쌓은 관계가 정오의 거리에 누가 서는지 정한다.
    - 마사, 루스와의 로맨스는 결투 전날 밤의 모닥불과 벗는 모자, 늦게까지 켜진 램프로 암시하고 램프가 꺼지는 데서 끝낸다.
  dont:
    - 토미를 총격이나 폭력의 피해자로 만들지 않는다. 위험한 곳에 따라오려 하면 반드시 말릴 기회를 준다.
    - 인종이나 민족을 비하하는 말을 서부극 분위기 삼아 쓰지 않는다.
    - 첫 장면부터 크레인의 정체나 마을 밑 금맥을 드러내지 않는다.
    - 결말을 주사위만으로 정하지 않는다. 정오에 무엇을 지키고 무엇을 가져갈지는 선원들이 고른다.
