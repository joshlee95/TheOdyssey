# 동화풍 코지 코미디. 말하는 동물들의 과자 숲 공화국, 선거 전날 밤 투표함이 사라졌다.
schema_version: 1
id: candy-republic

meta:
  title: 비스킷 숲
  author: 오디세이 테스트팩
  tagline: 내일이 선거인데 투표함이 없어졌어요. 받침대 위에는 설탕 발자국만 줄지어 남았고요. 아주 작은 발자국이요.
  tone: [동화, 코지 코미디, 정치 풍자, 따뜻함]
  players: { min: 2, max: 5 }
  session_minutes: 90
  content:
    rating: all
    lines:
      - 피나 상처가 보이는 부상
      - 동물이 잡아먹히거나 죽는 장면
      - 진짜 무기로 누군가를 해치는 장면
      - 어린이 NPC가 위험에 빠진 채 방치되는 장면
    veils:
      - 누군가 크게 다치는 일 (넘어지면 끈적해질 뿐, 다치지 않는다)
      - 어른들의 진짜 사랑 고백 (구 영감의 짝사랑은 체스판 앞에서 말을 더듬는 데까지만)

public:
  rumor: >-
    남쪽 바다에 과자로 된 숲이 떠 있대요. 거기 사는 동물들은 비스킷 나무 그늘에서 낮잠을 자고,
    해마다 사탕 한 알씩 넣어 대통령을 뽑는대요. 올해는 후보가 둘인데, 한쪽 공약이 "매일 공짜 솜사탕"이래요.
    다른 쪽 공약은 아무도 기억을 못 한대요.
  first_sight: >-
    분홍 솜사탕 구름 아래로 갈색 비스킷 나무가 빽빽해요. 숲 한가운데 초콜릿 지붕이 햇빛을 받아 번들거리고,
    바람이 불 때마다 바닐라 냄새가 뱃머리까지 와요. 숲 동쪽 끝의 나무 몇 그루가 한쪽으로 기울어 있어요.
  arrival: >-
    배가 부두에 닿자 발밑이 폭신하게 꺼져요. 콧등이 간지럽더니 코가 길어지고, 바지 뒤로 꼬리가 비죽 나와요.
    기둥 꼭대기 확성기에서 오리 목소리가 쩌렁쩌렁 울려요. "알립니다! 투표함이 없어졌습니다! 수상한 동물을 보면 바로 신고해 주십시오!"
    확성기 아래 오리가 선원들을 내려다보더니, 한 번 더 말해요. "지금 보고 있습니다."

world:
  reality:
    genre: [동화, 코지 미스터리, 정치 풍자]
    era: 그림책 속 어느 늦은 오후. 시계가 전부 사탕이라 오래 들여다보면 바늘이 녹아요
    magic: common
    technology: industrial
    speech: >-
      해요체가 기본인 다정한 동화 말투. 어른 동물들은 점잖은 척 "~하는 바입니다"를 쓰다가도 놀라면 제 울음소리가 튀어나와요
      (오리는 꽥, 부엉이는 부엉). 누구나 먹기 전에 "잘 먹겠습니다"를 꼭 말해요. 아이들은 반말, 어른끼리는 존댓말.
    outsiders: >-
      외지 동물은 처음 보는 거라 다들 구경하러 모여요. 하필 투표함이 없어진 날 내렸으니 절반은 의심부터 해요.
      후보들은 선원을 보자마자 "유권자님!" 하고 달려왔다가, 투표권이 없다는 걸 알면 쥐고 있던 솜사탕을 반쯤 도로 가져가요.
    crossover:
      magic: transformed
      tech: transformed
      note: >-
        다른 세계에서 가져온 마법은 전부 과자가 되어 나와요. 불꽃은 뜨끈한 캐러멜, 번개는 톡 쏘는 탄산 사탕, 얼음은 셔벗,
        치유는 코코아 한 잔. 기계는 태엽 오르골이나 사탕 발사기가 되고, 총알은 젤리빈이 돼요.
        이 섬에서는 무엇으로도 누구를 다치게 할 수 없어요. 맞으면 끈적해질 뿐이에요.
    appearance: blend_in
  premise: >-
    과자 숲 위에 말하는 동물들이 세운 공화국. 주민들은 숲을 조금씩 뜯어 먹고 살고, 숲은 밤사이 저절로 자란다고 믿는다.
    실제로는 눈에 잘 안 띄는 개미들이 밤마다 설탕 반죽으로 뜯긴 자리를 메워 왔다.
    개미에게는 투표권이 없다. 쉰 해 전에 생긴 '제 손 조항' 때문이다. 투표 사탕을 제 손으로 투표함 구멍에 넣을 수 있어야 시민인데,
    개미는 사탕 한 알을 여럿이 들어야 한다. 선거 전날 밤 개미들이 투표함을 통째로 굴에 옮기고 숲 수선을 멈췄다.
    투표함이 없으니 선거가 멈추고, 수선이 멈추니 숲이 녹는다.
    여우 후보 홍단비는 질 경우에 대비해 가짜 투표함을 미리 만들어 두었다. 이 소동에 "제가 찾았어요!" 하고 내놓을 생각이다.
  laws:
    - 거짓말을 하면 입에서 쓴 감초 냄새가 난다. 그래서 거짓말을 자주 하는 동물은 늘 박하사탕을 물고 다닌다.
    - 먹기 전에 "잘 먹겠습니다"를 말해야 한다. 말없이 먹으면 한 시간 동안 딸꾹질이 멈추지 않는다.
    - 공화국 법 제1조 2항, 제 손 조항. 투표 사탕을 제 손으로 구멍에 넣을 수 있는 자만 시민이다.
    - 자정 종이 칠 때 투표함이 광장에 없으면 선거는 일 년 미뤄지고, 겨울잠 자는 곰 대통령이 계속 대통령이다. 곰은 봄까지 안 일어난다.
  start_location: cotton-pier
  clock:
    name: 자정 개표 종
    segments: 6

story:
  theme: 너무 작아서 안 보이는 이의 목소리도 한 표로 셀 수 있을까?
  hook: >-
    투표함이 사라진 바로 그 시각에 부두에 내린 외지 동물들. 호 판사는 선원들을 '용의자 제1호'로 적고,
    배에 뜨거운 캐러멜을 부어 봉인한다. 자정 종이 울리기 전에 진짜 투표함을 찾아오지 못하면 배는 일 년 동안 광장에 전시된다.
  acts:
    - name: 수상한 외지 동물
      goal: 누명을 벗고 임시 조사관 배지를 받아 투표함 수사를 시작한다
      beats:
        - 동물로 변한 선원들이 서로를 알아보는 사이 확성기 오리가 선원들을 방송으로 신고한다 (candy-arrival)
        - 초콜릿 의사당에서 호 판사의 공개 심문. 텅 빈 받침대에서 숲 쪽으로 설탕 가루 발자국이 한 줄로 나 있다 (capitol-inquest)
        - 두 후보가 동시에 달려와 한쪽은 솜사탕을, 한쪽은 통밀 크래커 한 조각을 내민다
      turn: >-
        꼬마 기자 보리가 돋보기 사진기로 받침대를 찍었는데, 사진을 키우자 쌀알만 한 글씨가 나온다. "우리도 세어 주세요."
        호 판사는 선원들에게 임시 조사관 배지를 건넨다. 자정에 돌려받는다는 조건으로.
    - name: 달콤한 공약, 쓴 공약
      goal: 두 후보 캠프를 오가며 투표함이 없어져 누가 이득을 보는지, 숲에 무슨 일이 생겼는지 알아낸다
      beats:
        - 솜사탕당 유세장. 홍 후보가 "매일 공짜 솜사탕!"을 외치다 선원의 앞발을 번쩍 들어 올린다 (fox-rally)
        - 비스킷 숲에서 구 영감이 줄자로 기운 나무를 잰다. 수첩에 적힌 숫자가 날마다 줄어 있다
        - 꿀벌 합창단이 로고송을 부르며 선원들 머리 위를 따라다닌다 (bee-choir)
      turn: >-
        숲에서 쿵 소리가 나고 나무 한 그루가 초콜릿 강 쪽으로 넘어간다. 구 영감이 쓰러진 밑동을 가리킨다. 흙손으로 바른 것 같은
        설탕 반죽 자국이 수백 겹이다 (forest-mend). 같은 때 광장 확성기에서 홍 후보 목소리가 나온다. "투표함을 찾았어요!" (forest-tilt)
        도둑을 찾던 사건이 파업이었다는 게 드러난다.
    - name: 그루터기 밑
      goal: 개미굴에 들어가 점례 씨와 협상하고, 홍 후보의 투표함이 가짜라는 증거를 모은다
      beats:
        - 콩알사탕을 먹고 개미만 해져서 그루터기 밑으로 들어간다. 부스러기가 바위만 하고, 개미들이 숲 뿌리를 어깨로 받치고 있다
        - 점례 씨가 투표함 뚜껑의 봉인이 그대로인 걸 보여 주고 요구를 읽는다. "개미도 시민으로 세어 주십시오."
        - 제 손 조항을 쓴 게 쉰 해 전의 구 영감이라는 사실이 나온다 (old-law)
      turn: >-
        보리가 첫 특종에 들떠 개미굴 위치를 호외로 찍어 광장에 뿌린다. 홍 후보의 꿀벌 경비대가 굴 입구를 캐러멜로 막고
        진짜 투표함을 들고 간다. 이제 홍 후보 천막에 투표함이 두 개 있다.
    - name: 자정 개표
      goal: 광장 개표식에서 어느 투표함을 열지, 누구의 표를 셀지 정한다
      beats:
        - 자정 직전, 홍 후보가 연단에 반짝이는 투표함을 올린다 (midnight-count)
        - 녹아내리는 숲에서 개미들이 광장으로 줄지어 오고, 구 영감은 연단 계단 첫 칸에서 발을 멈춘다
        - 선원들과 가장 가까워진 NPC가 제 것 하나를 건다 (판사는 판결문, 여우는 박하사탕, 보리는 1면)
      turn: 선원들이 어느 투표함을 연단에 올리고 개미의 한 표를 약속받는지가 결말(exits)을 정한다

locations:
  - id: cotton-pier
    name: 솜사탕 부두
    description: >-
      솜사탕을 겹겹이 다져 만든 부두. 밟으면 발목까지 푹 꺼지고, 비가 오면 신발이 달라붙어요.
      기둥마다 선거 벽보가 붙었는데, 여우 얼굴 벽보가 거북 얼굴 벽보를 반쯤 덮고 있어요. 선원들 배는 여기서 캐러멜로 봉인돼요.
    connects_to: [chocolate-capitol, biscuit-woods]
    tags: [해안, 시작]
  - id: chocolate-capitol
    name: 초콜릿 의사당
    description: >-
      밀크초콜릿 돔 아래 선거관리위원회가 있고, 앞마당은 알사탕을 촘촘히 박은 광장이에요.
      투표함이 놓여 있던 유리 받침대는 비었고, 빨간 감초 끈이 둘러쳐져 있어요. 자정 개표식이 여기서 열려요.
    connects_to: [cotton-pier, fox-tent, acorn-press]
    tags: [마을, 공공장소, 사건 현장]
  - id: fox-tent
    name: 솜사탕당 천막
    description: >-
      마시멜로를 부풀려 세운 분홍 천막. 입구의 솜사탕 기계는 한 번도 멈추지 않고, 안쪽 벽에는 홍 후보 사진이 백 장쯤 걸렸어요.
      천막 뒤쪽 작은 방 문에는 '공약 창고. 들어오지 마세요.'라고 적혀 있고, 자물쇠가 새것이에요.
    connects_to: [chocolate-capitol]
    tags: [선거 캠프, 화려함]
  - id: acorn-press
    name: 나무구멍 신문사
    description: >-
      커다란 도토리나무 구멍 속 신문사. 편집장, 기자, 배달부가 전부 보리 한 명이에요.
      호두 껍데기 인쇄기가 딸깍딸깍 돌고, 벽 한가운데 홍 후보 사인 벽보가 붙어 있어요. 책상 서랍 하나에 '먹지 마시오'라고 써 붙였어요.
    connects_to: [chocolate-capitol, biscuit-woods]
    tags: [정보, 아늑함]
  - id: biscuit-woods
    name: 비스킷 숲
    description: >-
      통밀 비스킷 줄기에 웨하스 잎이 달린 숲. 초콜릿 강이 숲을 가로질러 흘러요.
      요즘 나무들이 한쪽으로 기울고, 가지 끝이 녹아서 뚝뚝 떨어져요. 구 영감의 오두막과 한입덜당 사무소가 한 지붕 아래 있어요.
    connects_to: [cotton-pier, acorn-press, sugar-tunnels]
    tags: [숲, 위험, 선거 캠프]
  - id: sugar-tunnels
    name: 그루터기 밑 개미굴
    description: >-
      숲에서 제일 큰 비스킷 그루터기 아래, 개미만 해져야 들어갈 수 있는 굴. 작아진 눈으로 보면 천장이 까마득해요.
      개미들이 줄지어 설탕 반죽을 나르고, 숲 뿌리 밑에 어깨를 대고 서 있어요. 가장 깊은 방에 유리 투표함이 놓였어요.
    connects_to: [biscuit-woods]
    hidden: true
    tags: [비밀, 지하]

npcs:
  - id: judge-macaron
    name: 호 판사
    role: 선거관리위원장 겸 대법관 (부엉이)
    adult: true
    look: 동그란 금테 안경을 코끝에 걸쳤어요. 깃털 사이사이 슈가파우더가 묻었고, 판결할 때는 망치 대신 비스킷을 딱 쪼개요.
    personality: >-
      규정집을 조항 번호까지 외워요. 누가 말하는 도중에도 수첩에 적고, 적은 걸 소리 내어 한 번 더 읽어요.
      밤을 새우는 걸 힘들어하지 않고, 혼자 새우는 걸 싫어해요. 찻잔을 두 개 꺼내 놓고 기다리는 버릇이 있어요.
    voice: >-
      하오체. "~하시오", "~이오". 말끝에 "이상."을 붙여 대화를 끊어요. 무엇이든 조항 번호부터 말하고,
      당황하면 문장 중간에 "부엉" 하고 딸꾹질을 해요. 상대를 "귀하"라고 불러요.
    wants: 자정 종이 칠 때 한 표도 빠뜨리지 않고 규정대로 개표하는 것.
    fears: 공화국 역사상 처음으로 선거 없는 해가 되는 것. 자기가 오십 년 외운 규정집에 누군가 빠져 있었다는 것.
    location: chocolate-capitol
    alertness: uncanny
    affinity: 0
    likes:
      - 증거를 번호 붙여 차례대로 가져오는 것
      - 질문하기 전에 "조사관으로서 묻겠습니다"라고 먼저 말하는 것
      - 자정까지 같이 깨어 차를 마셔 주는 것
    dislikes:
      - 거짓말 (감초 냄새를 누구보다 먼저 맡아요)
      - 증거물을 입에 대는 것 (증거가 전부 과자예요)
      - 새치기
    behaviors:
      hostile: 선원들 얼굴을 그린 '용의자 제1호' 벽보를 광장 사탕 기둥마다 붙이고, 배의 캐러멜 봉인을 한 겹 더 붓는다
