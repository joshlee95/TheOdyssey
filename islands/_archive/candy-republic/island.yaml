      - npc: cracker-turtle
        affinity: -50
        note: 제 손 조항을 쓴 거북이라는 걸 안다. 그가 개미굴 위로는 발을 들고 걷는다는 것도 안다
      - npc: judge-macaron
        affinity: -30
        note: 규정집은 읽고 발밑은 안 보는 판사
      - npc: dotori
        affinity: 20
        note: 개미를 처음으로 사진에 찍어 준 꼬마
    knows:
      - { secret: ant-strike, share_at: friendly }
      - { secret: forest-mend, share_at: friendly }
      - { secret: old-law, share_at: friendly }
    sample_lines:
      - 개미 연합 성명 제1호. 투표함은 안전합니다. 여러분 발밑은 장담 못 합니다.
      - 질문은 성명서 3쪽을 참고하십시오. 3쪽은 아직 안 썼습니다.
      - 앉으십시오. 아니, 거기 말고요. 거긴 제 조카 방입니다.
      - 봉인을 보십시오. 어제 판사님이 찍은 도장 그대로입니다. 우리는 가져간 게 아니라 맡아 둔 겁니다.
      - 오늘 밤 숲은 우리가 고칩니다. 대신 내일 아침에 허리를 한 번만 숙여 주십시오.

secrets:
  - id: ant-strike
    truth: >-
      투표함은 개미 연합이 가져갔다. 훔친 게 아니라 "우리도 세어 달라"는 시위다. 투표함은 비스킷 숲에서 제일 큰 그루터기 밑,
      개미굴 가장 깊은 방에 있다. 봉인은 뜯지 않았다. 개미들은 같은 날 밤부터 숲 수선을 멈췄다.
    hints:
      - 받침대에서 숲 쪽으로 설탕 가루 발자국이 수천 개, 한 줄로 이어진다. 발자국 하나가 깨알보다 작다.
      - 받침대 모서리에 돋보기로만 보이는 쪽지가 붙어 있다. "우리도 세어 주세요."
      - 유리 투표함은 동물 하나가 들기엔 무겁다. 받침대 둘레에 긁힌 자국은 없다. 누가 끌고 간 게 아니라 들고 간 것이다.
    reveal_when: 발자국을 따라 숲까지 가거나, 보리의 사진을 크게 뽑아 보거나, 구 영감의 신뢰를 얻었을 때
  - id: fake-box
    truth: >-
      홍 후보는 질 경우에 대비해 까마귀 비서를 시켜 가짜 투표함을 만들어 두었다. 안에는 솜사탕당에 찍은 투표 사탕만 들었다.
      투표함이 사라지자 가짜를 '찾았다'고 내놓으려 한다.
    hints:
      - 홍 후보는 박하사탕을 입에서 떼는 법이 없다. 이 섬에서 거짓말을 하면 감초 냄새가 난다.
      - 사흘 전 까마귀 비서가 유리 공방에 '투표함과 꼭 같은 크기'의 유리 상자를 주문했다. 공방 장부에 발톱 자국 서명이 있다.
      - 솜사탕당 천막 뒤에서 빈 투표 사탕 봉지가 한 자루 나온다. 투표 사탕은 개표 날 아침에야 나눠 주는 물건이다.
    reveal_when: 공약 창고를 뒤지거나, 박하사탕을 뺀 홍 후보에게 질문하거나, 보리의 사진과 공방 장부를 맞춰 볼 때
  - id: forest-mend
    truth: >-
      과자 숲은 저절로 자라지 않는다. 쉰 해 동안 개미들이 밤마다 설탕 반죽으로 뜯긴 자리를 메워 왔다.
      개미가 손을 놓은 지금, 숲은 하룻밤 만에 녹아 무너질 수 있다.
    hints:
      - 기운 나무 밑동마다 흙손으로 바른 것 같은 설탕 반죽이 겹겹이 굳어 있다. 제일 바깥 겹만 아직 끈적하지 않다.
      - 선관위 숲 일지에 "밤사이 저절로 복구됨"이 오십 년 동안 매일 적혀 있고, 어젯밤 칸만 비었다.
    reveal_when: 구 영감과 숲을 재거나, 개미굴에 들어가거나, 숲이 기울 때(forest-tilt)
  - id: old-law
    truth: >-
      개미의 투표권을 막은 제 손 조항은 쉰 해 전 젊은 구 영감이 쓴 법이다. 그땐 개미가 있는 줄도 몰랐고,
      '투표는 남 시키지 말고 제 손으로'라는 좋은 뜻이었다. 나중에 수선 자국을 보고 개미를 알아챈 뒤로 영감은 줄곧 그 조항을 부끄러워했다.
    hints:
      - 법전 제1조 2항 옆 여백에 느린 필체로 쓴 연필 글씨가 있다. "미안하다." 여러 번 지웠다 쓴 자국이 있다.
      - 점례 씨는 구 영감 이야기만 나오면 골무 확성기를 내려놓는다.
    reveal_when: 기록실에서 조항 원본을 찾거나, 점례 씨나 구 영감과 깊이 이야기할 때

events:
  - id: candy-arrival
    kind: arrival
    when: 상륙 직후, 선원들이 솜사탕 부두에 발을 디딜 때
    scene: >-
      발바닥이 간지럽더니 선원들이 하나씩 동물로 변한다. 각자를 닮은 동물이다 (GM이 정하거나 플레이어에게 묻는다).
      서로 꼬리를 확인할 틈도 없이 확성기가 꽥 울린다. "방금 내린 수상한 동물들, 거기 그대로 계십시오!"
      하늘에서 부엉이 하나가 내려와 앉는다. 호 판사가 날개 밑에서 냄비를 꺼내 배에 뜨거운 캐러멜을 붓는다. 캐러멜이 굳는 소리가 딱딱 난다.
    stakes: 자정까지 투표함을 찾지 못하면 배는 일 년 동안 광장 전시품이 된다
  - id: capitol-inquest
    kind: location
    where: chocolate-capitol
    when: 선원들이 처음 초콜릿 의사당에 들어설 때
    scene: >-
      빈 유리 받침대 앞에 의자가 한 줄로 놓였다. 광장에 모인 동물들이 까치발을 든다.
      호 판사가 선원을 한 명씩 불러 앉히고 묻는다. "어젯밤 무엇을 하셨소." 대답이 끝날 때마다 광장 앞줄이 일제히 코를 킁킁댄다.
    stakes: 심문을 통과하면 임시 조사관 배지를, 실패하면 발목 방울을 얻는다
  - id: fox-rally
    kind: location
    where: fox-tent
    when: 선원들이 처음 솜사탕당 천막을 찾을 때
    scene: >-
      솜사탕 기계가 윙윙 돌고 토끼 운동원들이 "홍! 단! 비!"를 외친다. 연단에서 손을 흔들던 홍 후보가 계단을 뛰어 내려와
      선원 하나의 앞발을 잡아 번쩍 든다. "먼 나라 친구들도 저를 찍는대요!" 천막 안의 얼굴이 전부 선원 쪽으로 돌아간다. 사진기 플래시가 터진다.
    stakes: 여기서 무슨 말을 하느냐에 따라 공화국이 선원을 어느 편으로 볼지 정해진다
  - id: forest-tilt
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때
    scene: >-
      쿠웅. 숲에서 큰 나무 하나가 초콜릿 강 쪽으로 넘어간다. 강물이 넘쳐 광장 알사탕 사이로 갈색 물이 스며들고,
      동물들이 꺅꺅거리며 벤치 위로 올라간다. 신발 바닥이 쩍쩍 달라붙는다.
      그 소란 한가운데 확성기에서 홍 후보 목소리가 나온다. "여러분! 제가 투표함을 찾았어요!"
    stakes: 숲이 녹기 시작했고, 가짜 투표함이 곧 공식 발표된다
    once: true
  - id: bee-choir
    kind: random
    when: 선원들이 광장이나 숲길을 지날 때, 한숨 돌릴 만할 때
    scene: >-
      꿀벌 합창단이 윙윙 날아와 선원들 머리 위에서 로고송을 부른다. "홍단비, 홍단비, 입안 가득 달콤해." 맞은편에서 달팽이 운동원 둘이
      "한입덜당" 팻말을 들고 온다. 아침에 출발했다고 한다. 양쪽이 동시에 선원 등에 스티커를 붙이려고 손을 뻗는다.
    stakes: 누구 스티커를 달고 다니느냐에 따라 그날 만나는 NPC의 첫인상이 바뀐다
    once: false
  - id: midnight-count
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때, 자정 개표 종이 울린다
    scene: >-
      광장에 촛불 사탕이 켜지고 공화국 동물이 전부 모였다. 숲은 절반쯤 녹아 흘러내렸고, 초콜릿 강물이 광장 가장자리를 적신다.
      홍 후보가 연단에 반짝이는 투표함을 올려놓는다. "자, 열어 볼까요?" 광장 바닥 알사탕 틈에서 사각사각 소리가 올라온다.
      발소리다. 수천 개가 발을 맞춰 걷고 있다.
    stakes: 어느 투표함을 열지, 누구를 시민으로 셀지, 그리고 내일 아침에 숲이 남아 있을지

trials:
  - id: owl-inquest
    name: 부엉이 심문
    act: 1
    description: >-
      호 판사가 광장 한가운데서 선원들의 알리바이를 묻는다. 거짓말을 하면 감초 냄새가 나고, 앞줄 동물들이 전부 코를 댄다.
      선원들은 하필 투표함이 사라진 시각에 부두에 내렸다.
    test: >-
      거짓말 없이 알리바이를 댄다 (조사나 설득 DC 13). 작은 거짓말로 넘어가려면 냄새를 가릴 박하사탕부터 구해야 한다
      (기만 DC 19, 판사는 박하 냄새도 적어 둔다)
    on_success: 임시 조사관 배지를 받아 기록실과 현장을 마음대로 조사할 수 있다. 판사 호감도 +10
    on_fail: 선원 전원의 발목에 방울이 달린다. 섬에 있는 동안 은신 판정에 불리. 수사는 할 수 있다. 판사가 세 걸음 뒤에서 따라온다
  - id: stump-speech
    name: 사탕 연단
    act: 2
    description: >-
      홍 후보가 선원 하나를 연단에 떠밀어 올린다. 수백 개의 귀가 선원 쪽으로 쫑긋 선다.
      여우를 편들면 구 영감이 등을 돌리고, 여우를 망신 주면 군중이 야유한다. 무슨 말을 할지는 선원이 정한다.
    test: >-
      어느 편도 들지 않고 군중을 움직이는 말을 한다 (공연 DC 15). 아니면 한쪽 편을 분명히 든다 (선택, 판정 없음, 반대편 호감도 -20)
    on_success: 군중이 선원을 '공정한 외지 친구'로 기억한다. 4막 개표식에서 선원이 입을 열면 광장이 조용해진다
    on_fail: 선원이 얼떨결에 솜사탕당 벽보 모델이 된다. 광장 기둥마다 선원 얼굴이 붙고, 구 영감 호감도 -15
  - id: shrinking-tunnel
    name: 콩알만 한 길
    act: 3
    description: >-
      개미굴은 개미만 해져야 들어간다. 콩알사탕을 먹으면 몸이 줄어드는데, 줄어든 몸에는 빵 부스러기가 바위고
      초콜릿 한 방울이 홍수다.
    test: >-
      작아진 몸으로 무너지는 설탕 굴을 지난다 (곡예 또는 생존 DC 15). 길 안내하는 개미를 설득해 지름길을 얻을 수도 있다
      (교감 DC 13, 점례 씨 호감도가 호의 이상이면 이점)
    on_success: 점례 씨 앞에 제 발로 도착해 협상 자리에 앉는다. 점례 씨 호감도 +15
    on_fail: 콩알사탕이 너무 세게 들어 한 선원이 개미보다 작아진다. 다음 장면이 끝날 때까지 동료 주머니에 들어가 다녀야 한다
  - id: minty-lie
    name: 박하사탕
    act: 4
    description: >-
      자정 개표식. 홍 후보는 연단에서 박하사탕을 딸각거리며 가짜 투표함을 쓰다듬는다. 진짜 투표함은 천막 어딘가에 있다.
      광장의 동물들은 공짜 솜사탕 이야기에 벌써 박수를 치고 있다.
    test: >-
      감초 냄새 법칙으로 여우의 거짓말을 모두 앞에서 드러낸다. 박하사탕을 슬쩍 빼내거나 (손재주 DC 16),
      증거를 내밀고 따진다 (조사 DC 13 뒤 설득 DC 15). 홍 후보 호감도가 신뢰 이상이면 스스로 사탕을 뱉는다
    on_success: 광장에 쓴 감초 냄새가 확 퍼지고 가짜 투표함이 증거물로 봉인된다. count-everyone 결말이 열린다
    on_fail: 군중이 여우 편에 선다. 선원들이 진짜 투표함을 직접 연단까지 날라 와야 하고, 시계는 이미 끝에 가깝다

blessings:
  - id: honorary-paw
    name: 초콜릿 발도장
    description: 공화국이 처음으로 외지인 손등에 찍어 주는 초콜릿 발도장. 씻어도 바닐라 냄새가 남는다.
    condition: 개표가 공정하게 끝나고, 호 판사나 점례 씨 중 한 명의 호감도가 신뢰 이상일 때
    effect: 캠페인 동안 섬마다 한 번, 여럿이 모인 자리에서 하는 설득 또는 공연 판정에 이점
    lasts: campaign
  - id: licorice-nose
    name: 감초 코
    description: 거짓말 냄새를 맡는 공화국 동물의 코가 선원에게 옮는다. 누가 거짓말을 하면 코끝이 찡하다.
    condition: 섬에 있는 동안 한 번도 거짓말을 안 한 선원, 또는 여우의 거짓말을 모두 앞에서 밝힌 선원
    effect: 이 섬에 있는 동안 통찰 판정에 이점. 상대가 대놓고 거짓말을 하면 판정 없이 냄새로 안다
    lasts: island
  - id: small-voices
    name: 낮은 귀
    description: 개미의 말을 들으려고 허리를 숙여 본 사람은, 그 뒤로 어디서든 작은 목소리를 먼저 듣는다.
    condition: 점례 씨와 유대 단계가 되거나, 개미 투표권 약속을 받아 낸다
    effect: 캠페인 동안 작은 생물, 사람이 아닌 존재, 무시당하는 이들과 교감하거나 설득하는 판정에 +2
    lasts: campaign

exits:
  - id: count-everyone
    name: 모두 센다
    condition: >-
      진짜 투표함을 개표식 연단에 올리고, 개미에게도 투표권을 준다는 판결이나 공개 약속을 받아 낸다
      (호 판사의 판결문, 구 영감의 고백, 홍 후보의 쓴 공약 중 하나 이상)
    epilogue: >-
      자정 종이 열두 번 치는 동안 투표 사탕을 한 알씩 센다. 마지막 표는 깨알만 한 사탕이다. 개미 연합의 첫 표.
      그날 밤 개미들이 숲으로 돌아가고, 아침이 되자 기울었던 나무들이 곧게 서 있다. 누가 대통령이 됐든 광장 게시판에 새 법이 붙는다.
      "시민은 크기로 세지 않는다." 배의 캐러멜 봉인이 녹아 흘러내린다. 부두 끝에서 개미들이 줄지어 손을 흔든다.
      허리를 숙여야 보인다.
    grants: [ant-ballot-candy]
  - id: sweet-landslide
    name: 달콤한 압승
    condition: 가짜 투표함으로 개표해 홍 후보가 당선되고, 선원들이 막지 않거나 거든다
    epilogue: >-
      홍 후보가 큰 표 차로 당선된다. 광장에서 솜사탕 폭죽이 터지고, 선원들은 명예 당원 자격으로 금박 공약집을 받는다.
      배는 박수 속에 떠난다. 돌아보면 숲 동쪽이 아직 기울어 있다. 그 밑에서 뭔가 외치는 소리가 나는 것도 같은데,
      너무 작아서 파도 소리에 묻힌다.
    grants: [golden-pledge-book]
  - id: sticky-escape
    name: 끈적한 탈출
    condition: 위기 시계가 다 차기 전에 캐러멜 봉인을 억지로 뜯고 배로 달아난다
    epilogue: >-
      배가 캐러멜을 길게 늘어뜨리며 부두를 빠져나간다. 뒤에서 확성기가 꽥꽥 운다. "용의자 도주! 용의자 도주!"
      선원 하나의 엉덩이에 꼬리가 아직 붙어 있다. 다음 섬에 닿을 때까지 안 떨어진다. 가끔 꼬리 끝이 섬 쪽으로 살랑 흔들린다.
    grants: []

treasures:
  - id: ant-ballot-candy
    name: 개미 연합의 첫 표
    description: 깨알만 한 투명 사탕 하나. 햇빛에 대고 보면 안에서 작은 발 수천 개가 발맞춰 걷는다.
    kind: magic
    power: >-
      다음 섬에서 한 번, 이 사탕을 깨물면 그 자리에서 가장 작거나 가장 무시당한 존재가 바라는 것이 모두에게 또렷하게 들린다.
      누구도 못 들은 척할 수 없다.
  - id: golden-pledge-book
    name: 금박 공약집
    description: 홍단비 사인이 든 반짝이는 공약집. 펼칠 때마다 박하 냄새가 확 올라온다.
    kind: anomaly
    power: >-
      한 번, 지킬 수 없는 약속을 해도 듣는 사람이 그 장면이 끝날 때까지 철석같이 믿는다. 장면이 끝나면 약속한 사람 입에서
      감초 냄새가 나고, 속은 사람은 그걸 기억한다.

gm_notes:
  pacing: >-
    1막은 동물 변신과 심문으로 가볍게 웃기며 연다. 2막은 두 캠프를 오가는 선거 풍자로 속도를 올리다가, 나무가 넘어가는 순간(forest-tilt)
    한 번 진지하게 꺾는다. 3막 개미굴에서는 큰 풍경과 조용한 대화로 숨을 고르고, 보리의 호외로 뒤집는다.
    4막 개표식은 모두 한자리에 모인 소동극이다.
  do:
    - 선원이 무슨 동물이 됐는지 계속 쓴다. 거북은 느리고, 토끼는 먼저 뛰어가고, 고양이는 초콜릿 강 앞에서 발을 뺀다.
    - 감초 냄새 법칙을 자주 써서 거짓말을 웃음거리이자 단서로 만든다. 냄새가 나면 앞줄 동물들이 동시에 코를 킁킁댄다.
    - 홍 후보는 악당이 아니다. 주민을 기쁘게 하고 싶은데 방법을 모르는 정치인이다. 구 영감도 성인군자가 아니다.
    - 개미 눈높이 장면에서는 크기 차이를 크게 잡는다. 빵 부스러기 하나를 넘는 데 한 장면을 써도 된다.
    - 보리의 호외는 특종 욕심과 어린 마음에서 나온 실수로 그린다. 4막에서 스스로 만회할 기회를 준다.
    - 말장난은 '한입덜당' 하나로 충분하다. 새 말장난을 지어내지 않는다.
  dont:
    - 누구도 진짜로 다치지 않는다. 위기는 캐러멜, 초콜릿 물, 끈적함으로 보여 준다.
    - 1막에서 개미가 범인이라고 바로 알려 주지 않는다. 설탕 발자국은 처음엔 '누가 설탕을 흘렸나' 정도로 보여 준다.
    - 현실 정당이나 실존 정치인에 빗대지 않는다.
    - 구 영감의 짝사랑을 놀림거리로 쓰지 않는다. 체스판 앞에서 말을 더듬는 데서 멈춘다.
