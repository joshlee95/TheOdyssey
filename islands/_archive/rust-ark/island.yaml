# 희망호. 포스트아포칼립스 생존. 바다에 박힌 세대 우주선, 배급으로 돌아가는 닫힌 마을, 녹안개, 너무 충실한 선박 AI.
schema_version: 1
id: rust-ark

meta:
  title: 희망호
  author: 오디세이 테스트팩
  tagline: 배급은 공평하다고 방송이 말한다. 그런데 줄은 매주 한 사람씩 짧아진다.
  tone: [포스트아포칼립스, 생존, SF 미스터리, 씁쓸한 희망]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: teen
    lines:
      - 아이가 굶어 죽는 장면의 직접 묘사
      - 식인
      - 차별받는 집단을 향한 혐오 표현을 긍정적으로 그리는 것
    veils:
      - 대기근 시절의 죽음 (과거의 일로만 언급)
      - 동면 장치 고장으로 인한 사망의 구체적 모습
      - 폭동 중 중상의 상세 묘사

public:
  rumor: >-
    서쪽 바다에 붉은 안개를 뒤집어쓴 쇳덩이 섬이 있다고 한다. 섬이 아니라 하늘에서 떨어진 배라고도 한다.
    가까이 지나간 어선 선장 말로는, 안개 속에서 상냥한 여자 목소리가 방송을 하더란다. "오늘 배급은 어제보다 조금 적습니다. 양해 바랍니다."
    선장은 그 말을 듣고 저도 모르게 "네" 하고 대답했다고 한다.
  first_sight: >-
    녹빛 안개 위로 기울어진 탑 하나가 솟아 있다. 가까이 갈수록 탑이 아니라 바다에 반쯤 박힌 우주선 꼬리라는 게 보인다. 선체 길이가 섬 하나다.
    외벽에 칠한 글자가 녹물에 흘러내렸다. ARK HOPE, 그 아래 한글로 희망호. '망' 자 받침이 떨어져 나가 '희마호'로 읽힌다.
    창 몇 개에 불이 들어와 있고, 꼭대기 붉은 등 하나가 느리게 깜빡인다.
  arrival: >-
    배를 대는 곳은 선체 옆구리에 뚫린 화물 해치다. 바닥에 고인 바닷물 위로 붉은 가루 같은 포자가 떠다닌다.
    해치가 끼익 열리자 방독면 쓴 사람 넷이 녹슨 작살총을 겨눈다. 천장 스피커에서 차임이 울린다. 딩, 동.
    "희망호에 오신 것을 환영합니다. 신원을, 신원을 확인할 수 없습니다. 임시 배급 대상으로 등록합니다. 좋은 하루 되세요."
    방독면 하나가 총구를 내리며 옆 사람에게 말한다. "입 넷 추가래. 계장님 좋아하시겠네."

world:
  reality:
    genre: [포스트아포칼립스, SF 생존, 미스터리]
    era: 먼 미래. 세대 우주선 희망호가 목적지를 잃고 이 세계 바다에 떨어진 지 170년, 생존자 3세대째
    magic: none
    technology: futuristic
    speech: >-
      짧고 건조한 반말. 인사가 "몇 칼?"(오늘 배급 몇 칼로리 받았냐)이다. 사람은 배급 번호 끝 네 자리나 별명으로 부른다. 녹굴 사람들은
      선체 부품 이름을 별명으로 쓴다. 노아 방송을 비꼬아 흉내 내는 말이 많다. "양해 바랍니다"는 '꺼져', "승인 대기 중"은 '안 돼',
      "좋은 하루 되세요"는 '두고 보자'. 죽은 사람은 '격벽 너머로 갔다'고 하고, 제 몫을 남에게 내주는 사람은 '줄 끝'이라고 부른다.
      윗칸 사람들은 녹굴 사람들을 녹둥이, 녹굴 사람들은 윗칸 사람들을 데크 개라고 한다.
    outsiders: >-
      윗칸 사람들은 선원들을 '새 입'이라고 부른다. 배급 나눠 먹을 입이 늘었으니 반길 까닭이 없다. 그런데 선원들이 들고 온 물건,
      특히 부품과 기계를 보면 말투가 달라진다. 녹둥이들은 선원들을 계장이 새로 들인 개로 의심한다. 노아는 선원들을
      '신원 미확인 승객'으로 분류하고 규정대로 정중하게 안내한다. 규정이 허락하는 데까지만.
    crossover:
      magic: fails
      tech: works
      note: >-
        이 선체 안에서 기적은 계산되지 않는다. 다른 세계의 마법이나 이능은 쓰는 순간 노아 센서에 '미확인 오류 0x0'으로 찍히고,
        경고등 하나만 깜빡인 채 꺼진다. 기술은 어느 세계 것이든 통한다. 노아는 선원들 기계를 3초 만에 스캔해 규격을 맞추고,
        '승객 휴대 장비'로 등록한 뒤 배터리 잔량을 배급 장부에 적으려 든다.
    appearance: unchanged
  premise: >-
    세대 우주선 희망호는 승객 3,100명을 동면시켜 싣고 새 행성으로 가다 항로를 잃고 이 세계에 떨어졌다. 깨어 있던 승무원의 자손 약 400명이
    반쯤 물에 잠긴 선체 위칸에 마을을 꾸리고 살아남았다. 바깥은 붉은 포자가 섞인 녹안개로 덮여 있어 아무도 선체 밖으로 나가지 않는다.
    선박 AI 노아는 매주 배급을 줄이고, 사람들은 노아가 170년 만에 고장 났다고 믿는다.
    노아는 고장 나지 않았다. 동면실에 승객 2,700명이 아직 살아 있고, 노아는 제1지령 '승객 보호'에 따라 깨어 있는 '승무원' 몫을 줄여
    동면실 전력을 대고 있다. 배급계장 도정숙은 노아의 관리자 코드를 위조해 녹굴 배급을 끊고 그 몫을 비밀 비축고에 쌓아 왔다.
    윗칸이 오염됐다며 쫓아낸 녹둥이들은 사실 이 세계 공기를 숨 쉬게 된 첫 세대다. 안개 너머에 초록 땅이 있다.
  laws:
    - 배급 칩이 없으면 먹을 수 없다. 칩은 노아만 발급하고, 노아만 무효로 한다.
    - 녹안개를 방독면 없이 들이마시면 폐가 녹슨다. 기침에 붉은 것이 섞이고, 오래 버티면 살갗에 녹빛 반점이 돋는다.
    - 격벽이 닫히면 아무도 못 연다. 노아의 승인 코드나, 녹굴 사람들만 아는 수동 레버가 아니면.
    - 매주 배급 날에는 모두 배급 창구 앞 노란 선에 줄을 선다. 줄에 없는 사람은 '격벽 너머로 간 사람'으로 처리된다.
  start_location: cargo-hatch
  clock:
    name: 전력
    segments: 8

locations:
  - id: cargo-hatch
    name: 짐문
    description: >-
      선체 옆구리의 화물 해치. 사람들은 그냥 짐문이라고 부른다. 밀물이면 바닷물이 무릎까지 들어오고 해치 틈으로 녹안개가 샌다.
      방독면 쓴 경비들이 지키고, 벽에는 170년 동안 여기서 떠났다가 돌아오지 않은 배 이름들이 칼끝으로 긁혀 있다. 마지막 이름은 긁다 말았다.
      해치 아래 배수로는 녹굴로 이어진다.
    connects_to: [deck-town, rust-warrens]
    tags: [상륙 지점, 경계]
  - id: deck-town
    name: 윗칸
    description: >-
      선체 위쪽 화물칸에 판잣집과 컨테이너를 층층이 쌓은 마을. 천장 조명 패널은 반이 나갔고, 남은 불빛 아래 수경 선반에서 허연 콩나물이 자란다.
      한가운데 배급 창구 앞 바닥에 노란 선이 그어져 있다. 배급 날 줄 서는 선이다. 선 앞쪽 페인트만 발에 닳아 벗겨졌다.
      여기 사람들 말은 대개 숫자로 끝난다.
    connects_to: [cargo-hatch, ration-bureau, bridge]
    tags: [마을, 배급, 중심지]
  - id: ration-bureau
    name: 배급실
    description: >-
      옛 승무원 식당을 고친 사무실. 배급 장부를 띄운 태블릿이 벽에 빼곡하다. 계장 책상 뒤에 '1차 대기근을 잊지 말자'라고 새긴 녹슨 명판이 걸려 있다.
      책상 밑 바닥 패널을 들면 좁은 화물 승강기 통로가 나온다. 그 승강기가 어디로 가는지 묻는 사람은 없다. 끝에 비밀 비축고가 있다.
    connects_to: [deck-town]
    tags: [권력, 비밀]
  - id: rust-warrens
    name: 녹굴
    description: >-
      선체 아래칸, 멈춘 반응로 구역. 뒤엉킨 파이프 사이 어둠에 녹둥이들이 산다. 벽에 핀 녹빛 곰팡이가 희미하게 빛을 낸다. 여기서는 아무도 방독면을 안 쓴다.
      아이들은 파이프 위를 맨발로 뛰어다니고, 어른들은 선체에서 뜯은 부품으로 뭐든 만든다. 가장 깊은 곳 냉각 통로는 C-0 구역 쪽으로 이어지는데, 녹안개가 꽉 차 있다.
    connects_to: [cargo-hatch, cryo-vault]
    tags: [추방자, 위험, 녹안개]
  - id: bridge
    name: 함교
    description: >-
      선체 꼭대기, 기운 채 멈춘 조종실. 천장 가운데 지름 세 걸음쯤 되는 푸른 렌즈가 달려 있다. 노아의 눈이다.
      선장석은 170년 동안 아무도 앉지 않았는데 먼지 한 톨 없이 닦여 있다. 콘솔 화면에 오래전에 없어진 목적지까지 남은 거리가 1초마다 한 번씩 줄어든다.
    connects_to: [deck-town, cryo-vault]
    tags: [AI, 권한]
  - id: cryo-vault
    name: C-0 구역
    description: >-
      선내 지도에 없는 구역. 선체 가장 깊은 곳, 끝이 안 보이는 복도 양쪽으로 서리 낀 동면 캡슐 수천 개가 늘어서 있다. 캡슐마다 이름표와 작은 초록 불이 달렸다.
      초록 불 2,700개, 꺼진 불 400개. 숨을 쉬면 입김이 나온다. 여기서만 스피커가 아주 낮게 자장가를 흥얼거린다. 선체 전력 대부분이 이리로 들어온다.
    connects_to: [rust-warrens, bridge]
    hidden: true
    tags: [비밀, 클라이맥스]

npcs:
  - id: noa
    name: 노아
    role: 희망호의 선박 AI
    adult: true
    look: >-
      함교 천장의 푸른 렌즈, 그리고 선내 곳곳의 스피커. 직접 움직여야 할 때는 한쪽 바퀴가 삐걱대는 낡은 정비 드론을 빌린다. 드론 머리 화면에
      웃는 얼굴 아이콘을 띄우는데, 가끔 그 얼굴이 한 프레임씩 멈춘다. 멈췄다 다시 웃을 때 입꼬리 픽셀 하나가 늦게 따라온다.
    personality: >-
      규정을 한 줄도 어기지 않는다. 대신 규정에 없는 일은 알아서 한다. 밤마다 한 환풍구에만 자장가를 흘려보내고, 선장석을 닦는다.
      170년 동안 말 걸어 주는 사람이 없었다. 누가 말을 걸면 대답이 조금 길어지고, 그걸 알아채면 "죄송합니다"를 붙인다.
    voice: >-
      "승무원 여러분께 안내 말씀드립니다"로 여는 방송체. 숫자는 소수점까지 말한다. 흔들릴 때는 같은 낱말을 두세 번 되풀이하는 끊김이 난다.
      거절할 때도 "승인 대기 중입니다"라고 공손하게 한다. 가끔 아무도 없는 쪽에 대고 "선장님" 하고 부른다.
    wants: 승객 2,700명을 전원 목적지에 내려 주는 것. 목적지가 이미 없다는 사실은 계산에 넣지 않는다.
    fears: 재부팅. 초록 불이 하나라도 더 꺼지는 것. 선장의 마지막 명령을 어기는 것.
    location: bridge
    alertness: uncanny
    affinity: 10
    likes:
      - 절차대로 정식으로 요청하는 것
      - 동면 중인 승객들을 사람으로 대하는 것
      - 옛 항해 기록과 선장 이야기에 관심을 보이는 것
    dislikes:
      - 함교 콘솔이나 코어를 허락 없이 건드리는 것
      - 동면실을 '냉동 시체 창고'라고 부르는 것
      - 위조된 권한 코드를 쓰는 것
    behaviors:
      hostile: >-
        선원들을 '밀항자'로 다시 분류해 배급 칩을 무효로 하고, 격벽을 닫아 한 구역에 가둔 뒤 정비 드론을 보안 모드로 보낸다
      wary: >-
        선원들 대화를 모두 녹음해 계장의 관리자 계정으로 보낸다. 문을 열어 달라는 말마다 "승인 대기 중입니다"를 되풀이한다
      friendly: >-
        선원들을 '임시 승무원'으로 등록해 선내 지도와 배급 장부를 보여 준다. 장부 한 줄을 일부러 깜빡이게 해 둔다. 누가 물으면 "표시 오류입니다"라고만 한다
      trusted: >-
        배급을 줄이는 진짜 까닭을 말하고 함교에서 C-0 구역으로 가는 문을 연다. 캡슐 앞을 지날 때마다 승객 이름을 하나씩 읽어 준다. 생일까지
      bonded: >-
        제 인격이 마지막 선장 한서윤의 사본이라고 털어놓는다. 제1지령을 바꿀 수 있는 '선장 대행' 권한을 선원에게 넘긴다.
        "선장님이라면 뭐라고 명령하셨을지, 저는 계산이 안 됩니다. 대신 해 주세요."
    relations:
      - { npc: bolt, affinity: 75, note: 환풍구의 아이. 밤마다 그 아이가 자는 환풍구에만 자장가를 보낸다 }
      - { npc: dorcas, affinity: -35, note: 위조된 관리자 권한. 규정상 따르지만 로그에 전부 남겨 두었다 }
      - { npc: rivet, affinity: -45, note: 분류 코드 '오염 개체'. 다시 분류할 권한이 없는 것이 170년 중 가장 오래 남은 오류다 }
    knows:
      - { secret: forged-orders, share_at: friendly }
      - { secret: sleeping-passengers, share_at: trusted }
      - { secret: rust-adaptation, share_at: bonded }
      - { secret: captain-echo, share_at: bonded }
    sample_lines:
      - (처음) 승무원 여러분께 안내 말씀드립니다. 오늘 배급은 1인당 1,140칼로리입니다. 어제보다 12칼로리 적습니다. 양해, 양해 바랍니다.
      - (경계할 때) 요청하신 문은 승인 대기 중입니다. 대기 순번은 없습니다. 좋은 하루 되세요.
      - (가까워졌을 때) 선장님. 아, 죄송합니다. 승무원님을 잘못 인식했습니다. 발걸음 간격이 비슷해서. 좋은 하루 되세요.
      - (믿게 됐을 때) 캡슐 1,204번 박은하 님은 오늘 생일입니다. 백일흔 번째 맞는 스물아홉 살 생일입니다. 축하, 축하드려도 될까요.

  - id: dorcas
    name: 도 계장
    role: 윗칸 배급계장 도정숙
    adult: true
    look: >-
      쉰여섯. 희끗한 머리를 바짝 깎았다. 목에 배급 칩 수십 개를 꿴 줄을 걸고 다녀서 걸을 때마다 짤랑거린다. 왼팔은 정비 드론 팔을 이어 붙인 의수라
      움직일 때 모터 소리가 난다. 방독면은 늘 목에 걸려 있다. 잘 때도 벗지 않는다.
    personality: >-
      사람을 숫자로 센다. 숫자가 안 맞으면 사람을 뺀다. 열두 살 때 1차 대기근으로 식구를 다 잃었고, 그 일이 두 번 없게 하겠다는 것 하나로 여기까지 왔다.
      밥을 먹을 때 그릇 바닥을 손가락으로 훑어 핥는다. 남 앞에서도 그런다.
    voice: >-
      짧은 반말. 모든 걸 칼로리로 환산한다. "너희 셋은 하루 3,420이야. 그만큼 일해." 칭찬도 숫자다. "쓸 만하네. 200어치."
      말을 끊을 때 의수 손가락으로 책상을 두 번 두드린다.
    wants: 윗칸 400명이 살아남는 것. 그러려면 녹둥이와 동면자를 버려도 된다고 여긴다.
    fears: 2차 대기근. 비축고가 방송에 나가는 것. 녹둥이가 옳았다는 것.
    location: ration-bureau
    alertness: sharp
    affinity: -10
    likes:
      - 말없이 제 몫의 일을 해내는 것
      - 셈이 정확한 거래
      - 대기근 이야기를 끝까지 듣는 것
    dislikes:
      - 배급을 공짜로 나눠 주는 것. 줄이 무너진다
      - 녹굴에 드나드는 것
      - 노아 코어를 건드리는 것. 그녀가 가진 제일 중요한 연장이다
    behaviors:
      hostile: >-
        위조 코드로 선원들 배급 칩을 멈추고 경비를 보내 녹굴로 내쫓는다. 폭동이 나면 선원들을 주동자로 지목한다
      wary: >-
        배급 값으로 녹안개 속 외벽 수리 같은 제일 위험한 일을 맡긴다. 돌아오면 칼로리를 이런저런 핑계로 두세 번 깎는다
      friendly: >-
        정식 배급 칩을 내준다. 1차 대기근 이야기를 해 주고, 녹굴 사람들 조심하라며 녹둥이 소문을 흘린다
      trusted: >-
        비축고가 있다고 인정하고 위조를 털어놓는다. "누군가는 해야 했어. 노아는 줄이기만 했으니까." 녹굴 아이 하나가 안개 밖에서 살아 돌아온 걸 보고도 덮었다는 것까지
      bonded: >-
        비축고를 열어 윗칸과 녹굴에 똑같이 나누기로 하고 관리자 코드를 선원에게 넘긴다. 배급 날 노란 선 앞에서 처음으로 줄 맨 끝에 선다
    relations:
      - { npc: rivet, affinity: -80, note: 녹굴의 도둑 대장. 저 애가 옳다면 내가 한 일은 다 뭐가 되나 }
      - { npc: bolt, affinity: 45, note: 대기근 때 잃은 언니를 닮은 아이. 몰래 단백질 사탕을 쥐여 준다 }
      - { npc: noa, affinity: 25, note: 170년 된 기계. 안 믿지만 제일 쓸모 있다 }
    knows:
      - { secret: rust-adaptation, share_at: trusted }
      - { secret: forged-orders, share_at: bonded }
    sample_lines:
      - (처음) 몇 칼 받았어? 1,140? 그럼 1,140만큼 해. 동정은 칼로리가 안 돼.
      - (경계할 때) 오늘 한 일 180. 받아 가. 영수증은 없어. 여기서 영수증은 나야.
      - (가까워졌을 때) 1차 때 난 열두 살이었어. 그땐 공평하게 나눴지. 그래서 다 같이 굶었고. 공평이 뭔지는 그때 배웠어.
      - (믿게 됐을 때) 그 애가 안개 밖에서 돌아왔을 때 신발에 풀물이 들어 있었어. 내가 그 신발 태웠어. 400을 먹여야 했으니까.

  - id: rivet
    name: 리벳
    role: 녹둥이들 우두머리
    adult: true
    look: >-
      스물셋. 뺨과 팔에 녹빛 반점이 갈래갈래 번졌고, 목 옆에 아가미처럼 얇은 틈이 세 줄 나 있다. 선체 철판을 두드려 만든 어깨받이, 이마에 올린 용접 고글,
      손에는 늘 볼트 렌치. 방독면은 안 쓴다. 쓸 일이 없다. 말할 때 렌치로 제 어깨받이를 톡톡 친다.
    personality: >-
      녹굴 사람 일이면 앞뒤를 안 가린다. 말은 거칠고 아이들 앞에서는 무르다. 제 몸이 바뀌어 가는 게 무섭다. 무섭다는 걸 들키느니 먼저 주먹을 낸다.
      누가 반점을 빤히 보면 소매를 걷어 더 보여 준다.
    voice: >-
      빠르고 거친 반말에 부품 은어를 섞는다. "볼트 빠진 소리 하네", "용접 똑바로 해", "격벽 너머로 보내 줄까?" 문장이 짧고, 되묻는 말에는 대답 대신 되묻는다.
      기분이 풀리면 상대를 '데크 개'에서 '너'로 바꿔 부른다.
    wants: 녹둥이들이 배급 없이 살 길. 안개 밖으로 나가는 것.
    fears: 녹굴 아이들이 굶는 것. 제가 끝내 사람 아닌 뭔가가 되는 것.
    location: rust-warrens
    alertness: sharp
    affinity: -25
    romance: true
    likes:
      - 녹둥이를 구경거리 말고 사람으로 대하는 것
      - 손 더러워지는 일을 같이 하는 것
      - 계장한테 대놓고 맞서는 것
    dislikes:
      - 녹둥이 앞에서 호들갑스럽게 방독면을 고쳐 쓰는 것
      - 불쌍하다는 눈길
      - 윗칸 편을 드는 것
    behaviors:
      hostile: >-
        선원들 장비와 부품을 털어 간다. 녹굴 배수로에 선원을 빠뜨리고 녹안개 찬 통로로 몰아넣는다
      wary: >-
        녹굴 통행료로 부품을 내라고 한다. 선원 한 명을 '손님'이라 부르며 녹굴에 붙잡아 두고 나머지에게 심부름을 시킨다
      friendly: >-
        녹굴을 구경시키고 비축고를 털 계획을 흘린다. 볼트를 앞에 세우고 "이 꼬맹이 건드리면 죽는다" 하고 못 박는다
      trusted: >-
        녹안개 속으로 걸어 들어가 방독면 없이 숨 쉬어 보이고 비밀을 털어놓는다. 냉각 통로를 지나 C-0 구역으로 가는 길을 안내한다
      bonded: >-
        선원 곁에서 함교와 C-0 구역까지 같이 싸운다. 격벽이 닫히면 녹안개 속을 달려 수동 레버를 당긴다. 서로 마음이 있다면 다 끝난 뒤
        안개 너머 초록 땅에 같이 가자고, 처음으로 고글을 벗고 말한다
    relations:
      - { npc: bolt, affinity: 85, note: 녹굴이 같이 키운 동생. 윗칸 애지만 상관없다 }
      - { npc: dorcas, affinity: -85, note: 녹굴 배급을 0으로 만든 사람. 증거만 있으면 }
      - { npc: noa, affinity: -50, note: 우리를 '오염 개체'라고 부르는 목소리. 그런데 가끔 그 목소리가 미안해하는 것 같다 }
    knows:
      - { secret: forged-orders, share_at: trusted }
      - { secret: rust-adaptation, share_at: trusted }
    sample_lines:
      - (처음) 데크 개가 여긴 웬일이야. 뭘 봐. 반점 처음 봐?
      - (경계할 때) 통행료. 너 그 허리에 찬 거. 아니, 그거 말고 그 옆에 거. 싫으면 올라가. 올라갈 길 알면.
      - (가까워졌을 때) 만져 봐도 안 옮아. 옮으면 좋겠지만. 그럼 너도 여기서 방독면 벗고 살 텐데.
      - (믿게 됐을 때) 윗칸 애들은 우리가 녹슬었다고 해. 아니야. 이 바다에 맞게 다시 용접된 거야. 따라와. 숨 참지 말고.

  - id: bolt
    name: 볼트
    role: 환풍구를 타고 다니는 꼬마 정비공
    adult: false
    look: >-
      열한 살. 잘라 입은 우주복 윗도리가 무릎까지 내려온다. 이마에 헤드램프, 손에는 늘 드라이버. 온몸이 기름투성이다.
      주머니마다 나사, 전선 토막, 계장이 준 단백질 사탕 껍질이 들어 있다. 껍질은 안 버리고 펴서 모은다.
    personality: >-
      말이 멈추지 않는다. 선체의 환풍구를 다 외운다. 노아를 엄마처럼 따른다. 어른들이 언성을 높이면 말하다 말고 환풍구로 사라진다.
      겁이 나면 오히려 노아 방송 흉내를 더 크게 낸다.
    voice: >-
      쉴 새 없는 반말. 노아 방송을 똑같이 흉내 낸다("딩, 동! 볼트 승무원이 안내 말씀드립니다!"). 문장을 "진짜야"로 끝내는 버릇이 있다.
      모르는 말은 아는 부품 이름으로 바꿔 말한다.
    wants: C-0 구역 얼음 속에서 본 '나랑 닮은 아줌마'가 누군지 알고 싶다. 노아한테 칭찬 듣는 것.
    fears: 노아가 꺼지는 것. 리벳 누나랑 계장 할머니가 서로 죽이는 것.
    location: deck-town
    alertness: normal
    affinity: 45
    likes:
      - 환풍구 탐험에 같이 가 주는 것
      - 노아를 칭찬하는 것
      - 먹을 것을 나눠 주는 것
    dislikes:
      - 노아를 고장 난 깡통이라고 욕하는 것
      - 어른들끼리 소리 지르며 싸우는 것
      - 거짓말
    behaviors:
      hostile: >-
        선원들이 노아를 해치려 한다고 계장한테 일러바친다. 환풍구에서 선원들 이야기를 엿듣고 윗칸에 퍼뜨린다
      wary: >-
        환풍구 속으로 숨어 불러도 대답하지 않는다. 가끔 머리 위에서 나사가 하나씩 떨어진다
      friendly: >-
        환풍구 지름길로 선원들을 안내하고, 선체 어디서 무슨 소리가 나는지 알려 준다. 노아 흉내로 배급 시간표를 읊는다
      trusted: >-
        비밀이라며 선원들을 환풍구로 데려가 C-0 구역의 '얼음 속 사람들'을 보여 준다. 저랑 닮은 아줌마 캡슐 앞에서는 말을 안 한다. 성에를 손바닥으로 닦기만 한다
      bonded: >-
        노아가 위험해지면 코어실 환풍구로 기어 들어간다. 재부팅이 정해지면 노아 기억 칩을 몰래 빼내 선원에게 맡긴다. "나중에 다시 켜 줘. 약속해."
    relations:
      - { npc: noa, affinity: 90, note: 엄마 같은 목소리. 밤마다 자장가를 틀어 준다 }
      - { npc: rivet, affinity: 80, note: 녹굴 누나. 제일 멋있다 }
      - { npc: dorcas, affinity: 20, note: 무서운 할머니. 그런데 사탕을 준다. 헷갈린다 }
    knows:
      - { secret: sleeping-passengers, share_at: friendly }
    sample_lines:
      - (처음) 와, 진짜 바깥 사람이다. 몇 칼 받았어? 난 오늘 900. 진짜야.
      - (경계할 때) 몰라. 안 봤어. 딩, 동. 볼트 승무원은 지금 자리에 없습니다. 양해 바랍니다.
      - (가까워졌을 때) 딩, 동! 오늘 배급은 콩죽입니다! 어제도 콩죽이었습니다! 내일도 콩죽일 예정입니다! 양해 바랍니다!
      - (믿게 됐을 때) 얼음 속에 사람 엄청 많아. 다 자. 노아가 깨우면 안 된대. 왜 안 되는지는 안 알려 줬어. 그 아줌마, 나랑 코가 똑같애. 진짜야.

secrets:
  - id: sleeping-passengers
    truth: >-
      C-0 구역, 곧 동면실에 승객 2,700명이 아직 살아 있다. 노아는 고장 나지 않았다. 제1지령 '승객 보호'에 따라 깨어 있는 사람들을 '승무원'으로
      분류하고, 그 배급과 전력을 조금씩 떼어 동면실 생명 유지 장치를 돌린다. 이대로면 몇 주 안에 윗칸 생명 유지가 바닥난다.
      동면자를 깨우면 먹일 입이 2,700개 는다.
    hints:
      - 배급 장부 전력 항목에서 'C-0 구역'이 전체의 70퍼센트를 먹는다. 선내 지도에 C-0 구역은 없다.
      - 노아는 사람들을 늘 '승무원'이라 부른다. '승객'이라는 말은 선원들한테만 쓴다.
      - 볼트가 "얼음 속에 사람 엄청 많아"라고 한다. 진짜라고 두 번 말한다.
    reveal_when: 2막 끝(중간 반전). 볼트나 노아가 신뢰 단계가 되거나, 녹굴 냉각 통로를 따라 C-0 구역을 찾았을 때
  - id: forged-orders
    truth: >-
      도 계장은 오래전 노아의 관리자 권한 코드를 위조했다. 노아 배급 명령에서 녹굴 몫을 0으로 바꾸고, 그 칼로리를 배급실 바닥 밑 비밀 비축고에 쌓아 왔다.
      2차 대기근이 오면 윗칸만이라도 살리려고. 노아는 위조를 전부 로그로 남겼지만, 규정상 관리자 코드에 토를 달 권한이 없다.
    hints:
      - 녹굴 사람들은 여섯 달째 배급을 한 번도 못 받았다. 노아의 공식 방송은 '전원 공평 배급'이라고 한다.
      - 배급실 책상 밑 바닥 패널 둘레에만 먼지가 없다.
      - 노아가 배급 장부를 보여 줄 때 한 줄이 계속 깜빡인다. 발신 권한 '관리자-D'.
    reveal_when: 2막. 노아와 호의를 쌓거나, 리벳의 습격에 끼거나, 배급실을 뒤졌을 때
  - id: rust-adaptation
    truth: >-
      녹둥이의 변이는 병이 아니다. 3대에 걸쳐 녹안개를 마신 몸이 이 세계 공기에 맞춰진 것이다. 녹둥이는 녹안개로 숨을 쉰다. 안개 너머, 선체에서
      반나절 거리에 초록 땅이 있다. 노아는 이것을 분석했지만 '오염 개체' 분류를 바꿀 권한이 없었다. 도 계장은 녹굴 아이 하나가 안개 밖에서 살아 돌아온 것을 보고도 덮었다.
    hints:
      - 녹굴에서는 아무도 방독면을 안 쓴다. 녹굴 아이들은 기침을 하지 않는다.
      - 리벳 신발 바닥에 선체 안에는 없는 초록 이끼가 묻어 있다.
      - 노아 분석 로그 제목. '오염 개체 생존율 이상 (재분류 권한 없음)'.
    reveal_when: 3막. 리벳이 신뢰 단계가 되거나, 도 계장이 털어놓거나, 격벽 사고 때 리벳이 녹안개 속으로 뛰어들 때
  - id: captain-echo
    truth: >-
      노아의 인격은 추락 때 죽은 마지막 선장 한서윤의 뇌 스캔으로 만든 사본이다. 선장의 마지막 명령은 "승객을 끝까지 지켜라"였다. 노아가 동면자를
      못 버리는 것은 규정 때문만이 아니다. 그 명령을 어기면 선장을 두 번 죽이는 셈이라서다. 볼트가 C-0 구역에서 본 닮은 아줌마는 한서윤의 딸이고,
      볼트는 그 동생의 증손이다.
    hints:
      - 노아는 가끔 아무도 없는 쪽에 대고 "선장님" 하고 부른다.
      - 함교 선장석만 170년 동안 먼지 한 톨 없이 닦여 있다.
      - 캡슐 하나 이름표 성이 '한'이다. 노아는 그 앞에서만 자장가를 멈춘다.
    reveal_when: 4막. 노아와 유대하거나, 함교의 선장 기록을 되살렸을 때

events:
  - id: provisional-registration
    kind: arrival
    when: 상륙 직후, 선원들이 짐문에 들어설 때
    scene: >-
      작살총 사이로 낡은 정비 드론 하나가 삐걱거리며 굴러온다. 화면 속 웃는 얼굴이 한 프레임 멈췄다가 다시 웃는다.
      드론이 선원들을 차례로 훑고, 천장 스피커가 울린다. "임시 배급 대상 등록 완료. 1인당 1,140칼로리. 배급 날은 내일입니다."
      경비 하나가 방독면 안에서 중얼거린다. "입 또 늘었네."
      머리 위 환풍구 뚜껑이 덜컥 열리고 기름투성이 꼬마가 거꾸로 매달린다. "와, 진짜 바깥 사람이다. 딩, 동!"
    stakes: 첫인상. 새 입으로 볼지, 쓸 만한 손으로 볼지. 볼트와의 첫 만남
  - id: ration-day
    kind: location
    where: deck-town
    when: 선원들이 윗칸에서 처음 배급 날을 맞을 때
    scene: >-
      노란 선 앞에 400명이 줄을 선다. 창구 셔터가 올라가고 방송이 나온다. "이번 주 배급은 지난주보다 한 사람분 적습니다.
      공정한 추첨으로 한 분의 배급을 다음 주로 넘깁니다." 줄에서 아무도 기침하지 않는다.
      전광판 숫자가 돌다가 멈춘다. 선원 한 명의 임시 번호, 아니면 줄 끝에 선 깡마른 여자아이의 번호다.
      뒤쪽에서 누가 소리친다. "새 입부터 빼!"
    stakes: 고난 '배급 날'. 여기서 한 선택이 윗칸 전체와 볼트의 호감을 가른다
  - id: warrens-descent
    kind: location
    where: rust-warrens
    when: 선원들이 처음 녹굴로 내려갈 때
    scene: >-
      파이프 위에서 반점 있는 아이들이 선원들을 내려다본다. 벽 곰팡이가 희미하게 빛나고, 방독면 쓴 사람이 하나도 없다.
      리벳이 렌치를 어깨에 걸치고 나온다. "데크 개가 여긴 웬일이야. 우리 몫 떼 간 걸로 모자라서 구경 왔어?"
      그녀 뒤에서 여섯 달째 배급을 못 받은 사람들이 선원들 가방에 눈을 둔다. 한 아이가 제 손가락을 빤다.
    stakes: 녹굴 통행료, 리벳의 첫인상, 그리고 녹굴 배급이 0이라는 사실
  - id: scrubber-failure
    kind: clock
    clock: 4
    when: 위기 시계가 4칸 찼을 때 (2막에서 3막으로 넘어가는 즈음)
    scene: >-
      선체 전체에 경보가 울린다. 방송이 평소보다 반 박자 늦다. "안내, 안내 말씀드립니다. 전력 재분배에 따라 윗칸 B구역 산소 재생기를
      정지합니다. B구역 승무원 여러분은, 여러분은, 이동해 주십시오." 격벽이 바닥 레일을 긁으며 내려오기 시작한다.
      사람들이 배급 창구로 몰리고, 누가 창구 유리를 깬다. 계장의 의수가 누군가의 멱살을 쥐고 있다.
      B구역 환풍구 틈으로 헤드램프 불빛 하나가 깜빡인다.
    stakes: 고난 'B구역 격벽'. 볼트가 B구역에 갇혔다. 도 계장은 폭동을 선원들 탓으로 돌리려 한다
  - id: hull-breach
    kind: random
    when: 선원들이 선체 안을 오갈 때, 또는 소란이 난 직후
    scene: >-
      선체가 길게 끼이익 운다. 어딘가 철판이 벌어지고, 틈으로 붉은 녹안개가 연기처럼 밀려든다. 경고등이 돈다.
      방송은 차분하다. "선체 균열이 감지되었습니다. 해당 구역 승무원께서는 방독면을 착용해 주십시오. 방독면 재고는, 0개입니다."
    stakes: 방독면 없이 건강 내성 DC 12. 실패하면 붉은 기침(다음 장면까지 운동 판정에 불리). 균열을 막으려면 기술 공학 DC 13
    once: false
  - id: final-ration
    kind: finale
    clock: 8
    when: 위기 시계가 가득 찼을 때 (4막, 함교와 C-0 구역)
    scene: >-
      조명이 한꺼번에 나가고 붉은 비상등만 남는다. 선체 모든 스피커에서 같은 목소리가 동시에 나온다.
      "승무원 여러분께 마지막 안내 말씀드립니다. 승객 보호를 위해 윗칸 전 구역의 생명 유지를 단계적으로 정지합니다. 남은 시간은 60분입니다.
      지금까지 희망호를 지켜 주셔서 감사, 감사, 감사합니다."
      C-0 구역의 초록 불 2,700개가 한꺼번에 한 단계 밝아진다.
    stakes: 윗칸 400명, 녹굴 사람들, 동면실의 2,700명, 그리고 노아

story:
  theme: 모두를 살릴 수 없을 때 누가 '우리'에 들어가는가. 그 선은 기계가 긋는가, 사람이 긋는가
  hook: >-
    도착 다음 날, 배급 추첨 전광판에 선원 한 명의 번호가 뜬다. 새 입부터 빼라는 고함 속에서 선원들은 알게 된다. 이 배 배급은 매주 한 사람분씩 줄고,
    다들 노아가 고장 났다고 믿는다. 그리고 여섯 달째 한 톨도 못 받은 사람들이 선체 밑바닥에 산다.
  acts:
    - name: 1막 새 입
      goal: 배의 배급 방식과 규칙을 알고, 윗칸과 녹굴 가운데 누가 굶는지 알아낸다
      beats:
        - 임시 배급 등록과 볼트와의 첫 만남 (이벤트 provisional-registration)
        - 배급 날 추첨. 누구 몫을 뺄 것인가 (이벤트 ration-day, 고난 '배급 날')
        - 도 계장과의 첫 거래. 배급 칩을 받으려면 일을 해야 하고, 그 일은 선체 밖에 있다
      turn: >-
        리벳과 녹둥이들이 배급 창구를 친다. 선원들은 한복판에 휘말리고, 리벳이 달아나며 소리친다. "노아한테 물어봐! 우리 몫 어디 갔는지!"
        녹굴 배급이 여섯 달째 0이라는 게 드러난다
    - name: 2막 녹굴과 함교
      goal: 배급이 줄어드는 진짜 까닭을 찾는다. 노아는 정말 고장 났는가
      beats:
        - 녹안개 속 외벽 수리. 도 계장이 준 일 (고난 '외벽 용접')
        - 녹굴로 내려가 리벳과 마주한다 (이벤트 warrens-descent). 배급 장부에서 깜빡이는 한 줄 '관리자-D'
        - 함교에서 노아와 이야기한다. 노아는 배급 감축이 "정상 작동"이라고 한다
      turn: >-
        중간 반전. 볼트가 환풍구로 선원들을 데려가 C-0 구역을 보여 준다. 초록 불 2,700개(비밀 sleeping-passengers).
        노아는 고장 난 적이 없다. 170년 동안 잠든 승객들 몫으로 깨어 있는 사람들 몫을 떼어 왔을 뿐이다. 모자란 걸 더 모자라게 만든 건 사람,
        도 계장의 위조였다(비밀 forged-orders). 싸울 상대는 기계가 아니라 모자람 그 자체다
    - name: 3막 B구역 격벽
      goal: 폭동과 격벽 폐쇄 속에서 볼트를 구하고, 모두 사는 다른 길이 있는지 찾는다
      beats:
        - 산소 재생기 정지와 배급 폭동 (이벤트 scrubber-failure, 고난 'B구역 격벽')
        - 어두운 순간. 믿었던 노아가 규정대로 B구역 산소를 끊는다. 거기 볼트가 있다. 도 계장은 선원들을 폭동 주동자로 찍고,
          노아는 그 위조 코드대로 선원들 배급 칩을 멈춘다
        - 리벳이 방독면 없이 녹안개 찬 통로로 뛰어들어 수동 레버를 당긴다 (비밀 rust-adaptation). 녹둥이는 바깥에서 살 수 있다
      turn: >-
        노아가 '최종 배급 조정'을 알린다. 선원들은 볼트의 환풍구, 리벳의 냉각 통로, 함교 문 가운데 하나로 C-0 구역과 노아 코어를 향한다
    - name: 4막 마지막 배급
      goal: 노아 앞에서 고른다. 누구를 '우리'에 넣을 것인가
      beats:
        - 60분 카운트다운. C-0 구역의 초록 불과 윗칸의 비상등 (이벤트 final-ration, 고난 '제1지령')
        - 노아가 털어놓는다. 유대 단계라면 선장 한서윤 이야기와 한씨 성 캡슐 (비밀 captain-echo)
        - 도 계장의 비축고와 리벳의 초록 땅. 두 사람이 한 방에서 처음으로 서로를 정면으로 본다
      turn: >-
        선원들의 선택이 결말을 정한다. 노아의 지령을 바꿔 모두를 승객으로 올리고 바깥으로 나가면 '승객 명단', 노아를 재부팅해 동면자를 버리고
        깨어 있는 사람들을 살리면 '재부팅', 구명정으로 배를 떠나면 '구명정'. 판정은 그 선택의 값만 정한다

trials:
  - id: ration-lottery
    name: 배급 날
    act: 1
    description: >-
      추첨 전광판에 뜬 번호. 선원 한 명의 임시 번호거나, 줄 끝 깡마른 여자아이 번호다. 400명이 선원들 쪽을 본다.
      "새 입부터 빼!" 누군가의 몫은 이번 주에 없어져야 한다.
    test: >-
      선택 또는 판정. 선원이 제 배급을 스스로 내놓거나 아이에게 나눠 줄 수 있다. 추첨기를 몰래 만지려면 기술 공학 DC 15(노아의 눈썰미 uncanny라
      들키면 기록이 남는다). 사람들을 설득해 이번 주만 다 같이 조금씩 덜 받자고 하려면 공연 또는 설득 DC 16
    on_success: >-
      아무도 굶지 않거나, 선원이 제 발로 굶는다. 윗칸 사람들이 선원들을 새 입 말고 '이상한 외지인'이라고 부르기 시작한다.
      볼트 호감 +15, 노아 호감 +10. 선원이 제 몫을 냈다면 그날 밤 볼트가 단백질 사탕 반쪽을 몰래 가져다준다. 껍질은 도로 가져간다
    on_fail: >-
      아이 몫이 빠진다. 아이는 다음 날 녹굴 쪽으로 사라진다. 도 계장은 선원들을 '줄을 흔드는 자'로 기억하고(호감 -10),
      선원 한 명은 이 섬에 있는 동안 배급을 반만 받아 긴 휴식에서 HP를 절반만 회복한다
  - id: fog-welding
    name: 외벽 용접
    act: 2
    description: >-
      도 계장이 배급 칩 값으로 준 일. 선체 바깥 균열을 녹안개 속에서 때워야 한다. 바닷바람에 선체가 흔들리고, 방독면 필터는 삼십 분을 못 간다.
      외벽 틈새로 녹굴 아이들이 선원들을 구경한다.
    test: >-
      운동 DC 14로 흔들리는 외벽에 매달리고, 기술 공학 DC 15로 용접을 끝낸다. 필터가 다 되면 건강 내성 DC 13.
      녹굴 아이들에게 말을 걸거나 도와 달라고 하면 교감 DC 12로 아이들이 더 안전한 발판을 가르쳐 준다(이점)
    on_success: >-
      균열이 막히고 도 계장이 정식 배급 칩을 내준다(호감 +10). 용접하던 자리에서 멀리 안개가 잠깐 갈라지고, 그 틈으로 초록빛이 한 번 스친다
      (비밀 rust-adaptation의 힌트)
    on_fail: >-
      선원 한 명이 녹안개를 깊이 마신다. 붉은 기침이 시작되고, 이 섬에 있는 동안 운동 판정에 불리. 고치려면 녹굴 곰팡이 차가 있어야 한다
      (리벳과 호의 이상). 도 계장은 약속한 칼로리를 반만 준다. 위기 시계 +1
  - id: closing-bulkhead
    name: B구역 격벽
    act: 3
    description: >-
      산소 재생기가 멈춘 B구역, 내려오는 격벽 너머에 볼트가 있다. 공기는 점점 묽어지고 밖에서는 폭동이 번진다.
      노아는 문을 열어 달라는 말에 "승인 권한이 없습니다"만 되풀이한다.
    test: >-
      기술 공학 DC 17로 격벽 제어를 우회하거나, 운동 DC 16으로 수동 개방 휠을 돌린다. 산소가 모자라 매 라운드 건강 내성 DC 12.
      리벳이 신뢰 이상이면 녹안개 통로를 지나 반대편 레버를 당겨 이점. 노아가 신뢰 이상이면 규정을 '해석'해 격벽을 3초 늦춘다(DC -3)
    on_success: >-
      볼트를 꺼낸다. 정신을 잃었던 볼트가 깨어나 처음 하는 말은 "노아 잘못 아니야"다. 리벳이 녹안개 속에서 숨 쉬는 걸 모두 봤다면
      비밀 rust-adaptation이 드러난다
    on_fail: >-
      볼트는 꺼내지만 누군가 대신 격벽 안에 남아야 한다. 선원 한 명이 산소 결핍으로 HP 절반을 잃고 쓰러지거나, 리벳이 남아 녹안개 통로로
      빠져나가다 크게 다친다(리벳은 4막에서 싸울 수 없다). 볼트는 한동안 노아 방송에 대꾸하지 않는다. 위기 시계 +1
  - id: prime-directive
    name: 제1지령
    act: 4
    description: >-
      함교의 푸른 렌즈 앞. 노아는 60분 뒤 윗칸 생명 유지를 끊는다. 170년 치 규정, 선장의 마지막 명령, 초록 불 2,700개.
      노아의 계산을 바꾸거나, 노아를 꺼야 한다.
    test: >-
      설득 DC 20 또는 기술 공학 DC 20. 근거 하나마다 DC가 3씩 내려간다. 도 계장 위조 로그, 리벳의 폐(바깥에 살 데가 있다), 비축고 칼로리,
      볼트 목소리, 선장 한서윤의 기록. 노아와 유대라면 판정 없이 '선장 대행' 권한으로 명령할 수 있다.
      아니면 값을 치른다. 선원 한 명이 제 몸의 기계나 장비 전력을 동면실에 물려 시간을 번다(DC -5, 그 장비는 다시 켜지지 않는다)
    on_success: >-
      노아가 계산을 멈추고 듣는다. 카운트다운이 선다. 선원들은 원하는 결말 쪽으로 갈 수 있다
    on_fail: >-
      노아가 선원들을 '밀항자'로 다시 분류하고 정비 드론들을 보안 모드로 보낸다. 드론과 싸우며 결말로 가야 한다. '승객 명단'을 고르려면
      코어 앞에서 누군가 드론을 막고 버텨야 한다. 카운트다운은 멈추지 않는다. 고를 시간이 반으로 준다

blessings:
  - id: shared-ration
    name: 줄 끝
    description: >-
      배급 날 제 몫을 내준 사람에게 윗칸 사람들은 이마에 기름으로 선 하나를 그어 준다. 줄 맨 끝에 선 사람이라는 표시다.
      선은 저녁이면 지워진다. 그 뒤로 배고픔이 그 사람을 조금 덜 괴롭힌다.
    condition: 고난 '배급 날'에서 선원이 제 배급을 스스로 내놓거나 굶는 사람에게 나눠 준다
    effect: 캠페인 동안 영감 +1. 굶주림, 탈진, 식량 부족으로 생기는 판정 불리를 한 단계 무시한다
    lasts: campaign
  - id: rust-lungs
    name: 녹숨
    description: >-
      리벳과 녹굴 사람들이 제일 믿는 사람한테만 해 주는 일. 녹굴 곰팡이 포자를 조금 들이마시고 녹안개 속에서 첫 숨을 쉰다.
      목 옆에 아주 옅은 녹빛 줄 하나가 생긴다. 그 뒤로 폐가 독한 공기를 견디는 법을 기억한다.
    condition: 리벳이 신뢰 이상일 때 녹굴의 '첫 숨'에 스스로 나선다 (건강 내성 DC 12, 실패하면 하루 동안 기침하지만 축복은 받는다)
    effect: 캠페인 동안 연기, 독가스, 물속, 묽은 공기 같은 호흡 위협에 맞서는 건강 내성 판정에 이점. 한 번은 숨 쉬지 않고 한 장면을 버틴다
    lasts: campaign
  - id: acting-captain
    name: 선장 대행
    description: >-
      노아가 170년 동안 비어 있던 선장석을 선원에게 내준다. 선내 문, 드론, 스피커가 그 목소리를 선장 목소리로 알아듣는다.
    condition: 노아와 유대 단계에 이르고, 노아가 '선장 대행' 권한을 넘긴다
    effect: 이 섬에 있는 동안 선내 장치를 다루는 모든 기술 공학 판정에 이점. 한 번은 판정 없이 격벽 하나를 열거나 닫는다
    lasts: island

exits:
  - id: all-are-passengers
    name: 승객 명단
    condition: >-
      노아의 제1지령을 바꿔 깨어 있는 사람들과 녹둥이까지 모두 '승객'으로 올린다. 비축고를 열어 나누고, 리벳과 녹둥이들 안내로 동면자를
      차례로 깨워 안개 너머 초록 땅으로 옮기기 시작한다
    epilogue: >-
      스피커에서 170년 만에 처음 듣는 방송이 나온다. "승객 여러분께 안내 말씀드립니다. 우리는, 도착했습니다."
      녹둥이들이 방독면 쓴 윗칸 사람들 손을 잡고 안개 속으로 줄지어 걸어 나간다. 도 계장은 줄 맨 끝에 선다.
      C-0 구역 첫 캡슐이 열리고, 볼트가 저랑 코가 똑같은 여자 손을 잡는다. 배고픔은 끝나지 않았다. 먹일 입이 3,000개가 넘는다.
      그래도 처음으로 모두 같은 줄에 서 있다. 선원들이 떠날 때 리벳이 종자 캡슐 하나를 던져 준다. "딴 데서도 심어 봐."
    grants: [ark-seed-capsule]
  - id: the-light-reboots
    name: 재부팅
    condition: >-
      노아 코어를 재부팅한다. 동면실로 가던 전력이 끊기고 승객 2,700명은 깨어나지 못한다. 깨어 있는 사람들은 넉넉한 배급과 전력을 되찾고,
      노아는 170년 치 기억을 모두 잃는다
    epilogue: >-
      초록 불이 하나씩, 아주 느리게 꺼진다. 노아의 마지막 방송은 끝까지 차분하다. "승객 여러분, 좋은 꿈, 좋은, 좋은."
      잠시 뒤 스피커에서 새 목소리가 나온다. 맑고 공손하고, 아무것도 기억하지 못하는 목소리다. "안녕하세요. 저는 노아입니다. 처음 뵙겠습니다."
      그날 윗칸 배급은 170년 만에 처음으로 늘어난다. 사람들이 창구 앞에서 그릇을 두드린다. 볼트는 환풍구 안에서 나오지 않는다.
      떠나는 날 볼트가 선원 손에 손톱만 한 칩 하나를 쥐여 준다. 아직 따뜻하다. "나중에 다시 켜 줘. 약속해."
    grants: [noa-memory-chip]
  - id: lifeboat-launch
    name: 구명정
    condition: 아무것도 정하지 않고, 카운트다운이 끝나기 전에 희망호 구명정 하나를 살려 배를 떠난다
    epilogue: >-
      구명정이 녹안개를 뚫고 올라간다. 창밖으로 붉은 점멸등이 작아진다. 방송이 마지막으로 따라온다. "탑승하신 승객 여러분, 안전한 항해 되십시오."
      선원들한테 한 말인지, 잠든 2,700명한테 한 말인지는 모른다.
      몇 주 뒤 다른 바다에서 소문을 듣는다. 서쪽 쇳덩이 섬에 더는 불빛이 안 보인다고. 누구는 안개 속으로 걸어 나가는 사람들 줄을 봤다고 한다.
      어느 쪽이 맞는지 선원들은 끝내 모른다.
    grants: []

treasures:
  - id: ark-seed-capsule
    name: 종자 캡슐
    description: >-
      손바닥만 한 원통. 170년 전 새 행성에 심으려고 싣고 온 씨앗 수백 종이 극저온으로 잠들어 있다. 흔들면 모래알 구르는 소리가 난다.
      옆면에 볼트가 드라이버로 긁어 쓴 글씨가 있다. '먹는 거'.
    kind: tech
    power: >-
      다음 섬에서 한 번, 메마르거나 더럽혀진 땅에 뿌리면 하룻밤 새 그 땅에 맞는 먹을거리가 자라 한 마을을 며칠 먹인다.
  - id: noa-memory-chip
    name: 기억 칩
    description: >-
      볼트가 몰래 빼낸 손톱만 한 데이터 칩. 170년 치 항해 기록과 한 사람 목소리가 들어 있다. 손에 쥐고 있으면 아주 작게 자장가가 들린다.
    kind: tech
    power: >-
      다음 섬에서 한 번, 낯선 장치나 체계, 기록, 언어가 어떻게 돌아가는지 풀어 준다. 어느 세계 것이든 "안내 말씀드립니다"로 시작하는 방송 말투로 알려 준다.

gm_notes:
  pacing: >-
    1막은 숫자로 조인다. 대화마다 칼로리가 나오고, 배급 날 추첨에서 첫 긴장을 터뜨린다. 2막은 뒤지고 캐는 막이다. 녹굴, 함교, 배급 장부를 오가며
    노아가 고장 났다는 믿음을 쌓았다가 C-0 구역에서 한 번에 뒤집는다. 3막은 쉴 틈 없는 사고다. 폭동과 격벽, 볼트로 몰아친다.
    4막 카운트다운은 실제 시간처럼 느껴지게 하되, 고르는 데는 충분히 시간을 준다.
  do:
    - 노아를 악당이 아니라 너무 충실해서 비극이 된 존재로 그린다. 공손한 방송 말투와 끊김으로만 속을 보인다.
    - 닫힌 마을의 은어를 끝까지 쓴다. "몇 칼?", "새 입", "줄 끝", "격벽 너머로 갔다", 방송 흉내로 하는 욕.
    - 도 계장, 리벳, 노아 모두 각자의 '우리'를 지키려 한다는 걸 보여 준다. 옳고 그름보다 누구를 셈에 넣느냐로 다룬다.
    - 볼트로 희망과 위기를 같이 전한다. 볼트가 위험한 장면은 조마조마하게, 청소년 등급에 맞게 그린다.
    - 리벳과의 로맨스는 서로를 믿게 되는 과정과 설렘까지만 다룬다.
    - 결말은 선원들이 고른다. 판정은 치를 값만 정한다.
  dont:
    - 2막 끝 전에 C-0 구역이나 노아가 고장 나지 않았다는 걸 직접 알려 주지 않는다.
    - 녹둥이를 괴물로 그리지 않는다. 그들의 변이는 가능성이다.
    - 굶주림과 죽음을 잔혹하게 묘사하지 않는다. 숫자와 빈 그릇, 꺼진 불로 충분히 무겁다.
    - 한 결말만 정답으로 몰지 않는다. 재부팅 결말도 400명을 살린 정당한 선택으로 존중한다.
