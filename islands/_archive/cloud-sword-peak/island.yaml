      - npc: seol
        affinity: 60
        note: 나루에서 처음 본 날 칼 한 번 뽑는 걸 보고 반했다. 이겨서 말할 생각이다
      - npc: soyeon
        affinity: 30
        note: 작년에 그를 이긴 꼬마. 인정하기 싫지만 천재다
      - npc: mugyeol
        affinity: -30
        note: 너무 깨끗한 놈. 흰옷이 저렇게 안 더러워질 수는 없다
    knows:
      - { secret: seol-defector, share_at: friendly }
      - { secret: spy-is-mugyeol, share_at: trusted }
    sample_lines:
      - 세 합이면 되네. 이 혁련웅의 도를 세 합만 받으면 오늘 술값은 내가 내지. 두 합이면 자네가 내고.
      - 첩자라는 말, 내가 먼저 한 건 맞네. 틀렸으면 틀렸다고 해야지. 여기 한 잔 받게. 사과는 술로 하는 걸세.
      - 그 낭자 발 딛는 걸 봤나? 정파 보법이 아니야. 그런데 칼끝에 살기가 없었네. 사람 벨 칼이 아니었다는 말일세.
      - 흰옷이 사흘 비무에 한 번도 안 더러워지는 놈을 나는 못 믿네. 칼 쓰는 놈 옷은 더러워야 해.
      - 아버지한테 편지를 쓰려는데 말이야. 이겼다고 쓸까, 친구가 생겼다고 쓸까. 형은 친구가 없거든.

secrets:
  - id: spy-is-mugyeol
    truth: >-
      마교 첩자는 대사형 위소겸이다. 마교에서 자라 열 살에 고아 행세를 하며 산문 앞에 버려졌다. 마교는 그의 누이동생을
      데리고 있고, 그의 임무는 결승 날 연무대 진안석을 꺼서 흑풍대를 들이고 검보를 가져가는 것이다.
      그는 장경각에 숨어들었다가 궤짝이 이미 빈 것을 보고, 그 사실을 종이학에 적어 마교에 보냈다.
    hints:
      - 소겸은 밤마다 청송원 절벽에서 구름 밑으로 종이학을 날린다.
      - 소겸이 진검을 뽑을 때 아주 잠깐 칼끝에 붉은 기가 번진다 (법칙 3).
      - 궤짝이 빈 그날 밤 장경각 앞 번을 선 사람이 소겸이었다.
      - 혁련세가 무사들이 본 복면인은 흙 한 점 묻지 않은 흰 소매였다.
    reveal_when: 종이학 암호를 풀거나, 소겸의 진검을 가까이서 보거나, 진화설이나 혁련웅의 신뢰를 얻었을 때, 또는 망운동 앞에서
  - id: manual-hidden
    truth: >-
      검보 아홉째 장은 도둑맞지 않았다. 청허 진인이 직접 장경각에서 꺼내 망운동 사조 묘에 봉했다. 아홉째 장의 검은 구름을
      가를 만큼 멀리 닿지만 쓰는 사람의 수명 십 년을 가져간다. 그는 소연이 그걸 배우지 않기를 바랐고, 도난 소문을 퍼뜨려
      첩자가 움직이게 했다.
    hints:
      - 궤짝 자물쇠에 긁힌 자국이 없고, 문 앞 나무 인형은 움직인 흔적이 없다.
      - 청허의 소매에서 굴속 이끼 냄새와 사조 묘에 피우는 백단향 냄새가 난다.
      - 청허는 소연에게 마지막 장 같은 건 원래 없었다고 말하면서 부채를 편다.
    reveal_when: 장경각을 꼼꼼히 뒤지거나, 청허의 신뢰를 얻거나, 진화설이 가로챈 종이학을 읽었을 때
  - id: seol-defector
    truth: >-
      떠돌이 여검객 진화설은 마교의 옛 성녀다. 삼 년 전 마교를 버리고 나왔고, 소겸이 첩자로 심어진 걸 알고 막으러
      백학산에 올라왔다. 그녀의 어머니는 이십 년 전 정마대전에서 청허 진인의 칼에 쓰러졌다.
    hints:
      - 진화설의 왼 소매 안쪽 손목에 검은 연꽃 문신이 있다.
      - 그녀의 보법은 정파 것이 아닌데 칼끝에 살기가 없다.
      - 청허가 지나갈 때마다 진화설은 칼자루를 잡았다가 놓는다. 손가락을 하나씩 뗀다.
    reveal_when: 지붕 추격 끝에 복면을 벗기거나, 소연이 쓰러진 뒤 그녀가 몰렸을 때, 또는 그녀의 신뢰를 얻었을 때

events:
  - id: cloud-arrival
    kind: arrival
    when: 상륙 직후, 선원들이 아랫나루에 발을 디딜 때
    scene: >-
      소매가 넓어지고 허리에 천 띠가 감긴다. 아랫배가 데운 돌을 삼킨 것처럼 따뜻하다. 기둥에 기대 있던 혁련웅이
      귀두도 끝을 돌바닥에 박고 포권한다. "혁련세가 혁련웅일세. 이름은 칼 받고 나서 들어도 되네." 계단에서 내려오던
      사람들이 걸음을 멈추고 둥글게 선다. 누군가 벌써 내기 돈을 걷는다.
    stakes: 첫 비무 결과가 강호가 선원들을 보는 눈을 정한다. 거절하면 겁쟁이 소문이, 이기면 적과 친구가 한꺼번에 생긴다
  - id: prelim-bouts
    kind: location
    where: sword-plaza
    when: 선원들이 처음 연무대에 올라설 때
    scene: >-
      북이 세 번 울린다. 무인들이 차례로 올라 포권하고, 짧게 부딪치고, 내려간다. 관람석 한가운데 청허 진인이 부채를
      얼굴에 얹고 졸고 있다. 그 옆에서 소연이 목검 자루를 손바닥으로 문지르며 선원들을 본다. 눈을 떼지 않는다.
      연무대 한가운데 진안석이 발소리에 맞춰 흐려졌다 밝아진다.
    stakes: 본선에 오르면 대회 내내 연무대를 마음대로 드나들 수 있다
  - id: empty-shelf
    kind: location
    where: scripture-pavilion
    when: 선원들이 처음 장경각에 들어설 때
    scene: >-
      문 앞 나무 인형이 목을 삐걱 돌려 선원들을 내려다본다. 창은 들지 않는다. 칠 층 안쪽 궤짝은 뚜껑이 열린 채다.
      바닥 먼지 위에 네모난 자국 하나가 또렷하고, 그 옆에 발자국은 없다. 창틀에 백단향 재가 조금 떨어져 있다.
    stakes: 여기서 무엇을 알아채느냐가 2막 수사 방향을 정한다
  - id: poison-needle
    kind: clock
    clock: 3
    when: 위기 시계가 3칸 찼을 때, 준결승 비무 도중
    scene: >-
      소연의 목검이 상대 칼을 쳐 올린다. 관람석 어딘가에서 햇빛이 한 번 튄다. 소연이 목덜미를 짚더니 목검을 짚고
      한쪽 무릎을 꿇는다. 목덜미에 바늘 하나가 꽂혀 있다. "저 여자다. 소매, 소매 봐." 칼 뽑는 소리가 관람석을 따라
      번진다. 진화설은 칼자루에서 손을 뗀다. 품에서 종이학 하나를 꺼내 든다.
    stakes: 소연의 목숨 (해독은 망운동의 설련뿐이다), 그리고 진화설이 이 자리에서 살아 나갈 수 있는가
    once: true
  - id: paper-crane
    kind: random
    when: 밤, 선원들이 처소나 객잔 지붕 근처에 있을 때
    scene: >-
      종이학 하나가 달빛을 받으며 절벽 쪽으로 미끄러진다. 기와지붕 위를 복면인 하나가 발소리 없이 달린다. 기와 한 장이
      빠져 처마 밑으로 떨어진다. 깨지는 소리. 복면인이 멈춰 선다. 고개를 돌린다.
    stakes: 쫓으면 지붕 추격이, 모른 척하면 새 한 마리가 마교에 닿는다
    once: false
  - id: black-wind
    kind: finale
    clock: 6
    when: 위기 시계가 가득 찼을 때, 결승 북이 울린다
    scene: >-
      결승 북이 울린다. 진안석이 꺼진다. 산을 두르던 호산진이 얼음 깨지는 소리를 내며 금 가고, 구름이 아래쪽부터 검게
      물든다. 검은 깃발 끝이 구름을 뚫고 하나, 둘, 셀 수 없이 올라온다. 관람석에서 도시락 보따리가 굴러떨어진다.
      청허 진인이 처음으로 두 눈을 다 뜬다. "왔구려." 그의 손에 끈 묶인 두루마리가 들려 있다.
    stakes: 백학산과 모든 문파 사람들, 소겸이 돌아올 자리, 누군가의 십 년, 그리고 선원들이 구름을 내려갈 길

trials:
  - id: prelim-duel
    name: 예선 비무
    act: 1
    description: >-
      산기운이 선원들의 재주를 무공으로 바꿔 놓았다. 몸 안의 낯선 내공이 제멋대로 뛰는데, 관람석 수백 명 앞에서
      혁련세가 무사나 다른 문파 고수와 붙어야 한다. 상대는 봐주지 않는다. 손님이라 더 세게 친다.
    test: >-
      비무에서 이긴다 (운동 또는 곡예 DC 15, 다른 세계의 재주를 몸과 병기의 움직임으로 풀어 말하면 이점). 혹은 상대가
      어느 발에 무게를 싣는지 읽고 한 수에 끝낸다 (통찰 DC 16). 져도 되지만, 어떻게 질지는 고를 수 있다
    on_success: 본선에 오르고 이름이 돈다. 혁련웅 호감도 +15, 관람석이 선원들을 보고 자리를 내준다
    on_fail: 예선에서 떨어진다. 수사는 관람석에서 해야 하고, 혁련웅이 지나갈 때마다 "바다 건너 고수 오셨네" 하고 놀린다
  - id: moonlit-roof
    name: 달밤 지붕 추격
    act: 2
    description: >-
      종이학을 날린 복면인이 기와지붕 위로 달아난다. 지붕은 가파르고 기와는 이슬에 젖었다. 처마 밖은 구름이다.
    test: 지붕을 타고 따라잡는다 (곡예 DC 16). 앞질러 길목을 막으려면 산 지형을 읽는다 (생존 DC 15, 소연의 지름길을 알면 이점)
    on_success: 복면을 벗긴다. 진화설이다. 그녀는 칼을 겨누지 않는다. "나도 그 새 쫓던 중이야."
    on_fail: 복면인이 종이학 하나를 떨어뜨리고 사라진다. 쫓던 선원은 어깨 혈을 짚여 다음 장면이 끝날 때까지 한 팔을 못 쓴다
  - id: ancestor-question
    name: 사조의 물음
    act: 3
    description: >-
      망운동 어귀를 안개로 된 노인이 지킨다. 칼 한 자루를 무릎에 얹고 앉아 묻는다. "칼은 왜 드나." 칼로 답해도 되고
      말로 답해도 된다. 거짓 답에는 안개 칼이 먼저 움직인다.
    test: >-
      안개 노인과 세 합을 버틴다 (건강 내성 DC 15). 혹은 진심으로 답한다 (판정 없음. 플레이어가 캐릭터의 진짜 이유를 말한다.
      GM이 진심인지 꾸민 말인지 가린다. 꾸민 말로 넘기려면 기만 DC 19)
    on_success: 노인이 옆으로 비킨다. 설련과 두루마리를 손에 넣고 한마디를 듣는다. "놓는 것부터 배워라. 나는 늦었다."
    on_fail: 설련만 겨우 얻는다. 한 선원이 안개 칼에 베여 이 섬에 있는 동안 최대 HP가 5 줄어든다
  - id: relight-array
    name: 진안석 다시 켜기
    act: 4
    description: >-
      꺼진 진안석을 다시 밝히려면 누군가 돌 위에 두 손을 얹고 몸 안의 내공을 전부 부어야 한다. 그동안 사방에서 흑풍대의
      칼이 들어온다. 돌은 손바닥을 데일 만큼 뜨거워진다.
    test: >-
      세 라운드 동안 내공을 붓는다 (라운드마다 건강 내성 DC 15). 나머지는 흑풍대를 막는다 (운동 또는 위협 DC 15).
      영감을 하나 쓰거나, 소겸이 돌아선 상태라면 그와 손을 겹쳐 이점을 얻는다
    on_success: 호산진이 다시 선다. 흑풍대가 구름 밑으로 밀려난다. 아무도 두루마리를 펴지 않고 산을 지킨다
    on_fail: >-
      호산진이 반만 선다. 흑풍대 일부가 연무대까지 올라오고, 선원들과 가장 가까운 사람 하나가 크게 다친다.
      누가 두루마리를 펴지 않으면 버틸 수 없다

blessings:
  - id: cloud-breath
    name: 백학문 숨법
    description: 청허가 새벽마다 가르치는 숨 고르기. 몸에 붙으면 어느 세계에서든 숨 한 번에 흐트러진 기운을 다시 모은다.
    condition: 청허 진인과의 호감도가 호의 이상이 되어 숨법을 배우거나, 망운동에서 사조의 물음을 통과한다
    effect: 캠페인 동안 섬마다 한 번, 건강 또는 근력 판정에 이점. 짧은 휴식 한 번으로 HP를 추가로 1d6 회복한다
    lasts: campaign
  - id: master-disciple-bond
    name: 사부의 목소리
    description: 서로 대신 죽겠다고 나섰던 사이는 그 목소리를 잊지 않는다. 쓰러지기 직전, 누가 등 뒤에서 "밥은 먹었냐" 하고 묻는다.
    condition: 청허 진인이나 소연과 유대 단계가 되거나, 소연 대신 아홉째 장의 값을 치르겠다고 나선다
    effect: 캠페인 동안 한 번, 동료가 쓰러질 피해를 입을 때 대신 받고 HP 1로 버틴다
    lasts: campaign
  - id: sword-heart
    name: 깨끗한 칼끝
    description: 비무대에서 수를 쓰지 않은 사람의 칼끝은 맑다. 이 산 사람들은 칼끝부터 본다.
    condition: 비무에서 암수 없이 이기거나, 비겁하지 않게 진다
    effect: 이 섬에 있는 동안 강호인을 상대로 한 설득과 위협 판정에 이점
    lasts: island

exits:
  - id: returning-sword
    name: 돌아온 칼
    condition: >-
      위소겸을 돌려세워 (호감도 신뢰 이상, 또는 진화설이나 소연의 설득) 함께 진안석을 다시 켜고,
      아무의 수명도 쓰지 않고 흑풍대를 막아 낸다
    epilogue: >-
      해가 뜰 때 구름은 다시 희다. 소겸은 연무대 한가운데 칼을 내려놓고 사부 앞에 무릎을 꿇는다. 청허는 한참 부채만
      부치다가 제자 머리를 부채로 톡 친다. "밥 먹고 벌 받아라." 누이를 찾으러 혁련웅과 진화설이 같이 구름 밑으로 내려가기로
      한다. 혁련웅은 그 얘기를 편지에 쓸지 말지 오래 고민한다. 소연은 진검 대신 사형의 칼을 받는다. 배의 사슬이 풀리고,
      선원들이 떠날 때 백학문 제자들이 난간에 한 줄로 서서 포권한다. 소연만 손을 흔든다.
    grants: [cloud-sword-token]
  - id: one-sword
    name: 아홉째 장
    condition: 누군가 두루마리를 펴고 아홉째 장의 칼로 흑풍대를 흩는다. 청허든, 소연이든, 선원이든
    epilogue: >-
      칼 한 번에 구름이 반으로 갈라진다. 갈라진 틈으로 햇빛이 곧게 떨어진다. 검은 깃발은 하나도 남지 않는다.
      칼을 휘두른 사람의 머리가 귀밑부터 하얗게 센다. 청허였다면 그는 웃으며 부채를 소연 손에 쥐여 주고 그날 저녁
      찻잔을 두 개만 꺼낸다. 선원이었다면 백학문은 그 이름을 사조 묘 옆 바위에 새긴다. 두루마리는 펼친 자리에서 재가 된다.
      다시 배울 사람은 없다.
    grants: [master-fan]
  - id: below-the-clouds
    name: 구름 밑으로
    condition: 결승 북이 울리기 전, 진화설과 함께 구름 밑으로 내려가 흑풍대 본대를 끌어내고 산을 떠난다
    epilogue: >-
      배가 사슬을 끊고 구름 속으로 곤두박질친다. 검은 깃발들이 산을 버리고 뒤를 쫓는다. 진화설은 뱃머리에 서서 면사를
      벗어 바람에 놓아준다. 멀리 위에서 북소리가 들린다. 산은 남은 사람들의 칼로 버틴다. 누가 살았는지 선원들은 끝내 모른다.
      다음 항구에서, 날개를 안쪽으로 접은 종이학 하나가 뱃전에 내려앉는다. 펴 보면 이름 하나가 적혀 있다.
    grants: [black-lotus-pin]

treasures:
  - id: cloud-sword-token
    name: 백학패
    description: 학 한 마리를 새긴 흰 옥패. 쥐면 손바닥이 서늘하다. 백학문이 빚진 사람에게만 내준다.
    kind: magic
    power: >-
      다음 섬에서 한 번, 패를 들어 보이면 그 자리 사람들이 싸움을 멈추고 한 번의 대화나 정식 결투 신청을 받아들인다.
      그 세계 예법이 무엇이든 정정당당하게 하자는 무게가 실린다.
  - id: master-fan
    name: 청허의 대나무 부채
    description: 손때가 까맣게 앉은 대나무 부채. 펴면 구름 그림이 있는데, 볼 때마다 구름 모양이 조금 다르다. 찻물 자국도 있다.
    kind: magic
    power: >-
      한 번, 부채를 펴서 부치면 날아드는 공격 하나나 쏟아지는 위험 하나가 옆으로 비껴 나간다.
      어느 세계에서든 그 순간만은 바람이 선원 쪽으로 분다.
  - id: black-lotus-pin
    name: 검은 연꽃 비녀
    description: 진화설이 면사를 벗으며 건넨 옻칠 비녀. 끝이 바늘처럼 가늘어 던질 수도 있다.
    kind: mundane
    power: >-
      한 번, 비녀를 보이면 그 세계의 쫓기는 사람, 집을 버린 사람, 도망자가 선원을 같은 처지로 알아보고 숨을 곳이나 길 하나를 내준다.

gm_notes:
  pacing: >-
    1막은 떠들썩하게. 포권, 짧은 비무, 허풍, 내기 돈. 2막은 달밤 지붕과 의심으로 좁혀 가다가 소연이 쓰러질 때 한 번에 떨어뜨린다.
    3막 망운동은 조용하게. 말수가 줄고 안개와 밧줄 소리만 남는다. 소겸과의 대치는 서두르지 않는다. 4막은 흑풍대와 진안석과
    두루마리가 한꺼번에 들이닥치는 결전이다.
  do:
    - 싸움은 몸과 병기로 쓴다. 어느 발에 무게가 실렸는지, 칼이 어디를 스쳤는지, 소매가 어디서 찢어졌는지. 초식 이름은 외치지 않는다.
    - 선원들의 다른 세계 재주는 무공으로 번역하되 이름 대신 모양으로 보여 준다. 총잡이는 손가락 사이에서 쇠구슬이 튀어 나가고, 해커는 돌과 깃발로 진을 짠다.
    - 말투는 사람마다 고정한다. 청허는 하오체, 혁련웅은 하게체, 소겸은 손님에게 하십시오체, 소연은 해요체, 진화설은 해라체 반말. 섞지 않는다.
    - 웃긴 순간을 아끼지 않는다. 무협의 맛은 허풍과 밥상과 내기에서 나온다. 진지한 장면 바로 앞에 농담을 하나 둔다.
    - 위소겸은 끝까지 좋은 사람으로 연기한다. 첩자라는 게 드러날 때 선원들이 아까워해야 한다.
    - 청허의 거짓말은 제자를 지키려는 것이지만, 그 거짓말 때문에 소연이 위험해졌다는 값도 보여 준다.
    - 진화설과 청허의 원한은 풀지 않는다. 같은 상에 앉는 데까지만 간다.
  dont:
    - 1막에서 소겸 쪽 단서를 몰아주지 않는다. 종이학은 처음엔 그냥 예쁜 버릇이다.
    - 소연을 죽게 두지 않는다. 독은 설련을 구해 올 시간을 준다. 미성년 인물을 연애 대상으로 다루지 않는다.
    - 마교를 괴물 집단으로만 그리지 않는다. 진화설과 소겸이 거기서 자랐다.
    - 아홉째 장을 공짜로 쓰게 하지 않는다. 십 년은 반드시 머리카락으로 보여 준다.
    - 대사에 "소협, 이 몸이", "천하제일" 같은 과장된 무협체를 쓰지 않는다. 한 사람이 한 번 쓸 때만 웃기다.
