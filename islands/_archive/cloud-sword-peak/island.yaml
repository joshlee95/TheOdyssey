# 무협. 십 년 만의 비무회, 비어 있는 궤짝, 문파 안의 첩자, 사부와 제자.
schema_version: 1
id: cloud-sword-peak

meta:
  title: 백학산
  author: 오디세이 테스트팩
  tagline: 장경각 궤짝이 비었는데, 장문인은 도둑을 찾으라면서 차만 따른다.
  tone: [무협, 사제, 첩자물, 건조한 농담]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: teen
    lines:
      - 고문 장면
      - 미성년 인물과의 연애나 성적 암시
      - 신체 절단의 구체적 묘사
    veils:
      - 죽음의 처참한 묘사 (칼이 들어가고 사람이 쓰러진다. 그 이상은 그리지 않는다)
      - 이십 년 전 정마대전의 학살 장면 (회상은 한두 문장으로만)

public:
  rumor: >-
    구름 위로 봉우리 하나만 내민 산이 있다 하오. 백학산이라 하지. 십 년에 한 번 거기서 비무회가 열리는데, 올해 우승하면
    백학문 검보의 마지막 장을 보여 준다고들 하더이다. 그 장은 백학문 제자들도 본 적이 없다는 게 우스운 점이오.
    요즘은 구름 밑에서 검은 깃발을 봤다는 뱃사람도 있고.
  first_sight: >-
    수평선 쪽 바다가 하얗게 부풀었다. 가까이 가 보니 물이 아니라 구름이다. 구름 위로 봉우리 하나가 솟아 있고,
    그 비탈에 기와지붕들이 층층이 붙어 있다. 꼭대기 평평한 데서 무언가 자꾸 번쩍인다. 칼날에 받은 햇빛이다.
    북소리가 한 번, 한참 있다가 또 한 번 들린다.
  arrival: >-
    뱃전이 구름을 밀고 나루에 닿는다. 발을 딛자 옷소매가 넓어지고 허리에 천 띠가 감긴다. 아랫배가 따뜻하다.
    나루 기둥에 붉은 전포 차림의 사내가 등을 대고 서서 사람 키만 한 도를 지팡이처럼 짚고 있다.
    "배에서 내리는 걸음이 가볍구먼. 어디 문파인가? 아니, 말하지 말게. 칼로 듣지."

world:
  reality:
    genre: [무협, 첩자물, 사제극]
    era: 정파와 마교가 서로를 벤 지 이십 년. 문파들은 평화를 말하면서 칼은 갈아 두는 시절
    magic: common
    technology: medieval
    speech: >-
      무협체는 절제해서 쓴다. 나이 든 사람은 하오체와 하게체, 젊은 무인은 서로 사형·사매·소협·낭자라 부르되 평소 말은
      요즘 말에 가깝다. 싸우기 전에 포권하고 이름과 문파를 대지만 대개 짧다. 속내는 농담이나 딴소리로 돌린다.
      시구를 읊는 사람은 한 명뿐이다.
    outsiders: >-
      바다 건너 온 떠돌이 무인으로 본다. 어느 문파에도 줄이 없으니 누구도 믿지 않지만, 바로 그래서 문파끼리 못 맡기는
      일을 맡기기 좋다. 선원들이 낯선 재주를 쓰면 강호인들은 먼저 "어디서 배운 수법이냐"부터 묻는다.
    crossover:
      magic: transformed
      tech: fails
      note: >-
        다른 세계의 마법과 이능은 내공과 무공으로 바뀐다. 불을 쏘던 손은 장심이 뜨거워지는 장법이 되고, 순간이동은
        눈으로 좇기 힘든 경공이 되며, 치유 주문은 혈을 짚어 막힌 기를 뚫는 의술이 된다. 산기운 속에서 기계와 전자 장치는
        켜지지 않는 쇳덩이가 된다. 칼과 활은 그대로 쓰이고, 쇳덩이는 던지면 암기다.
    appearance: blend_in
  premise: >-
    백학문 장문인 청허 진인은 검보 마지막 장인 아홉째 장을 자기 손으로 장경각에서 꺼내 망운동 사조 묘에 봉해 두었다.
    아홉째 장의 검은 구름을 가를 만큼 멀리 닿지만, 한 번 쓰면 쓴 사람의 수명이 십 년 준다. 청허는 제자 소연이 그걸 배우지
    않기를 바란다. 그는 또 문파 안에 마교 첩자가 있다고 보고, 검보를 도둑맞았다는 소문을 일부러 퍼뜨려 첩자를 움직이게 만든다.
    첩자는 대사형 위소겸이다. 마교에서 자라 열 살에 고아 행세를 하며 산문 앞에 버려졌고, 마교는 그의 누이동생을 데리고 있다.
    그의 임무는 결승 날 연무대의 진안석을 꺼서 흑풍대를 산 위로 들이고 검보를 가져가는 것이다. 그런데 그가 숨어든 밤,
    궤짝은 이미 비어 있었다. 한편 마교를 버리고 나온 옛 성녀 진화설이 떠돌이 검객 행세를 하며 소겸을 막으러 올라와 있다.
    청허는 이십 년 전 그녀의 어머니를 벤 사람이다.
  laws:
    - 비무대 위에서 포권하고 한 약속을 어기면 내공이 흩어져 하루 동안 검을 제대로 들지 못한다.
    - 호산진이 켜져 있는 동안은 아무도 구름 아래로 내려가지 못하고, 아래서도 올라오지 못한다.
    - 이 산에서 뽑은 검은 주인 속을 드러낸다. 거짓말하는 자의 칼끝은 흐려지고, 마공을 익힌 자의 칼끝에는 붉은 기가 번진다.
    - 비무에서 상대가 검을 내려놓으면 벨 수 없다. 이를 어긴 자는 그 자리의 모든 문파를 적으로 돌린다.
  start_location: cloud-ferry
  clock:
    name: 결승 북
    segments: 6

story:
  theme: 한 번 남의 편에서 칼을 든 사람에게도 돌아갈 산문이 있는가.
  hook: >-
    비무회 전날 밤, 장경각의 검보 궤짝이 비었다는 말이 산에 돈다. 호산진이 닫혀 대회가 끝날 때까지 아무도 하산할 수 없다.
    청허 진인은 어느 문파에도 줄이 없는 선원들을 따로 불러 찻잔부터 내민다. "결승 북이 울리기 전에 우리 집 쥐를 좀 찾아 주시오.
    찾으면 배를 풀어 드리리다. 못 찾으면, 뭐, 차는 계속 드리지."
  acts:
    - name: 산문의 손님
      goal: 비무회에 나가 이름을 얻고, 빈 궤짝과 문파들 사이의 눈치를 읽는다
      beats:
        - 나루에서 혁련웅이 비무를 청한다. 포권, 통성명, 세 합 (cloud-arrival)
        - 연무대 예선. 선원들의 다른 세계 재주가 처음으로 무공이 되어 나온다 (prelim-bouts)
        - 장경각 칠 층의 빈 궤짝. 자물쇠는 멀쩡하고, 목인은 움직인 적이 없다 (empty-shelf)
      turn: >-
        그날 밤 청허가 선원들을 다시 찻자리에 부른다. "훔친 자는 마교 끄나풀이겠지요. 밖에서 온 자는 아니고."
        선원들은 일을 맡고, 소연과 위소겸이 길잡이로 붙는다
    - name: 지붕 위의 새
      goal: 첩자를 찾아 산을 뒤지고, 달밤 지붕 위의 복면인을 쫓는다
      beats:
        - 달밤, 기와지붕 위를 달리는 복면인. 그가 떨어뜨린 종이학 하나 (paper-crane)
        - 소연이 대사형 자랑을 하다 흘린다. "사형은 밤마다 절벽에서 종이학을 날려요. 누이한테 보내는 거래요. 누이가 있는 줄은 몰랐지만요"
        - 혁련웅이 객잔에서 선원들을 첩자로 몰거나, 술을 이기고 나면 의형제를 하자고 조른다
      turn: >-
        판이 뒤집힌다. 준결승에서 소연이 독침을 맞고 쓰러지고 (poison-needle), 모두가 진화설의 소매 속 검은 연꽃 문신을 보고
        칼을 뽑는다. 진화설은 칼 대신 가로챈 종이학을 펼친다. 마교 암호다. "궤짝은 처음부터 비어 있었다."
        검보는 도둑맞은 적이 없다 (manual-hidden). 그럼 누가 검보를 옮겼고, 누가 새를 날렸나 (seol-defector)
    - name: 망운동
      goal: 소연을 살릴 설련을 구하고, 사부가 감춘 아홉째 장과 첩자를 마주한다
      beats:
        - 절벽 밧줄을 타고 구름 속 망운동으로. 사조의 검혼이 묻는다. "칼은 왜 드나"
        - 사조 묘 위에 설련 한 송이와 봉한 두루마리. 아홉째 장은 쓰는 사람의 십 년을 가져간다
        - 동굴 어귀에 위소겸이 서 있다. 뽑힌 칼끝에 붉은 기가 번진다 (spy-is-mugyeol)
      turn: >-
        소겸이 선원들에게 칼을 겨눈다. 그와의 호감도가 신뢰 이상이면 그는 칼을 바닥에 내려놓고 누이 이야기를 하며
        돌아설 길을 묻는다. 아니면 그는 두루마리를 들고 밧줄을 끊고 올라가고, 산 위에서 호산진 등불이 하나씩 꺼진다.
        그 소식을 들은 소연은 목검을 쥔 채 한참 일어나지 않는다
    - name: 결승 북
      goal: 흑풍대가 올라오는 결승 날, 무엇을 지키고 누구에게 값을 치르게 할지 선원들이 정한다
      beats:
        - 결승 도중 진안석 빛이 꺼지고, 구름 아래서 검은 깃발이 올라온다 (black-wind)
        - 청허가 두루마리 끈을 푼다. 소연이 그 손목을 잡는다. "제가 할게요. 사부님은 십 년이 없잖아요." 진화설은 소겸 쪽으로 걸어간다
        - 선원들과 가장 가까워진 사람이 목숨을 건다. 소겸은 진안석 앞에서, 혁련웅은 등을 맞대고, 청허는 두루마리를 편다
      turn: 선원들이 소겸을 받아 줄지, 누가 십 년을 낼지, 싸울지 떠날지 고르고, 그것이 결말(exits)을 정한다

locations:
  - id: cloud-ferry
    name: 아랫나루
    description: >-
      구름 위에 뜬 흰 돌 선착장. 난간 너머는 발 디딜 데 없이 하얗다. 호산진이 켜진 지금은 배마다 쇠사슬이 채워져
      있고, 사슬 고리에 누군가 붉은 실을 묶어 놓았다. 돌계단이 산꼭대기까지 끝도 없이 이어진다.
    connects_to: [sword-plaza, cloud-inn]
    tags: [시작, 경계]
  - id: sword-plaza
    name: 연무대
    description: >-
      봉우리 꼭대기를 평평하게 깎아 낸 비무장. 가장자리에 문파 깃발이 줄지어 서 있고, 관람석 돌계단에는 도시락 보따리와
      술병이 굴러다닌다. 한가운데 바닥에 진안석이 박혀 있다. 주먹만 한 푸른 돌인데, 밟으면 발바닥이 따뜻하다.
    connects_to: [cloud-ferry, cloud-inn, scripture-pavilion, disciple-quarters]
    tags: [비무, 공공장소, 결전]
  - id: cloud-inn
    name: 송학객잔
    description: >-
      다른 문파 사람들이 묵는 삼 층 객잔. 일 층은 혁련세가가 통째로 빌려 밤마다 상다리가 부러진다. 주인은 부러진 상 값을
      장부에 적으며 한숨 대신 주판을 튕긴다. 삼 층 끝방에는 검은 면사를 쓴 여자가 혼자 묵는데, 밥을 방으로 올려 달라고만 한다.
    connects_to: [cloud-ferry, sword-plaza]
    tags: [객잔, 정보, 소란]
  - id: scripture-pavilion
    name: 장경각
    description: >-
      칠 층 누각. 층마다 책궤가 빼곡하고, 문 앞에는 오래된 나무 인형이 창을 세우고 서 있다. 칠 층 안쪽 궤짝 하나가 열린 채
      비어 있다. 자물쇠에 긁힌 자국이 없다. 청허 진인이 하루 중 가장 오래 앉아 있는 곳이다.
    connects_to: [sword-plaza]
    tags: [비급, 사건 현장, 고요]
  - id: disciple-quarters
    name: 청송원
    description: >-
      제자들이 먹고 자고 수련하는 소나무 숲 처소. 새벽마다 목검 부딪는 소리가 나고, 아침상에는 늘 나물이 하나 모자란다.
      뒤편 절벽 끝 늙은 소나무 둥치에 밧줄이 쓸린 자국이 있다. 그 아래는 구름뿐이다. 위소겸의 창턱에는 접다 만 종이가 쌓여 있다.
    connects_to: [sword-plaza, gazing-cave]
    tags: [문파, 일상, 수련]
  - id: gazing-cave
    name: 망운동
    description: >-
      청송원 뒤 절벽을 밧줄로 내려가야 닿는 굴. 사조가 구름을 보며 앉은 채 숨을 거둔 곳이라 한다. 어귀에 안개가 사람
      모양으로 서 있고, 안쪽 돌관 위에 흰 꽃 한 송이와 끈으로 묶은 비단 두루마리가 놓여 있다. 향 탄 재가 아직 따뜻하다.
    connects_to: [disciple-quarters]
    hidden: true
    tags: [비밀, 시련, 신성]

npcs:
  - id: baekun
    name: 청허 진인
    role: 백학문 장문인, 소연의 사부
    adult: true
    look: 배꼽까지 오는 흰 수염을 끝만 묶어 다닌다. 담청 도포 소매에 찻물 자국이 있다. 대나무 부채를 쥐고 있고, 눈은 늘 반쯤 감았다.
    personality: >-
      묻는 말에 바로 답하는 법이 없다. 대신 찻잔을 채워 준다. 제자 일이라면 태연하게 거짓말을 하고, 들키면 웃는다.
      이십 년 전 벤 사람들 이름을 아직 외운다. 가끔 혼자 중얼거리며 손가락으로 수를 센다.
    voice: >-
      하오체를 끝까지 지킨다. "그러하오", "그럴 리가 있겠소". 대답 대신 되묻고, 곤란하면 차 이야기로 샌다.
      부채로 제 이마를 톡톡 치면 말을 고르는 중이다. 화가 나면 오히려 말이 짧고 정중해진다.
    wants: 소연이 아홉째 장을 배우지 않는 것. 첩자를 걸러 내 산을 지키는 것. 아홉째 장을 자기 대에서 없애는 것.
    fears: 소연이 제 머리를 하얗게 세우는 것. 손수 키운 소겸의 칼끝이 붉다는 걸 제 눈으로 보는 것.
    location: scripture-pavilion
    alertness: uncanny
    affinity: 10
    likes:
      - 차를 받고 한 판 바둑을 같이 두는 것
      - 제자들 앞에서 그를 장문인으로 대접해 주는 것
      - 딴소리에 딴소리로 받아치는 것
    dislikes:
      - 소연을 위험한 일에 끌고 가는 것
      - 마지막 장 이야기를 두 번 이상 캐묻는 것
      - 비무에서 암수를 쓰는 것
    behaviors:
