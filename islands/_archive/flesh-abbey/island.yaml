# 오를라 수도원. 바디 호러. 제 살을 나누는 수도사들과, 바다 밑에서 아직 태어나지 않은 것.
schema_version: 1
id: flesh-abbey

meta:
  title: 오를라 수도원
  author: 오디세이 테스트팩
  tagline: 저녁 식사에 초대받았다. 고기는 수도사들이 직접 준비한다고 했다.
  tone: [바디 호러, 코즈믹 호러, 경건한 환대, 가족극]
  players: { min: 2, max: 5 }
  session_minutes: 120
  content:
    rating: mature
    lines:
      - 미성년자의 신체 훼손이나 개조 묘사
      - 성폭력과 성적 강요
      - 현실의 특정 종교를 조롱하거나 지목하는 표현
    veils:
      - 성적 행위 자체의 묘사 (긴장과 친밀감까지만)
      - 현실에서 따라 할 수 있는 자해 방법의 구체적 절차
      - 플레이어 캐릭터의 영구적 신체 개조를 플레이어 동의 없이 확정하는 것

public:
  rumor: >-
    남쪽 따뜻한 물길 끝에 종 치는 수도원이 있다고 한다. 거기서 한 철 묵고 온 순례자를 항구 술집에서 본 사람이 있다.
    잔을 잡는 손가락이 열한 개였는데 본인은 세어 보지도 않더란다. "그 양반들 밥 인심이 좋아. 고기가 늘 따뜻해."
  first_sight: >-
    분홍빛 안개 위로 첨탑 하나가 올라와 있다. 망원경으로 보면 첨탑 옆구리가 천천히 부풀었다가 꺼진다.
    창에는 유리 대신 젖은 막이 끼워져 있고, 해가 비치자 막 안쪽으로 가는 핏줄이 보인다.
    종이 울린다. 쇳소리가 아니라 여러 사람이 한꺼번에 내는 긴 "아" 소리다.
  arrival: >-
    선창 말뚝은 나무가 아니다. 누렇게 휜 뼈 여러 대가 물속에서 올라와 발판을 받치고 있다. 발판은 미지근하고,
    밟을 때마다 발바닥 아래가 아주 조금 오므라든다. 선창 끝에 흰 옷을 입은 수도사 여섯이 팔을 벌리고 서 있다.
    제일 앞의 늙은 수사가 손바닥을 보이며 웃는다. 손바닥 한가운데 입술이 있고, 그 입술도 웃는다.

world:
  reality:
    genre: [바디 호러, 코즈믹 호러, 고딕 종교극]
    era: 촛불과 필사본의 시대. 이 수도원만 해마다 한 뼘씩 자란다
    magic: rare
    technology: medieval
    speech: >-
      느린 하오체. 몸에 일어나는 일을 부엌말과 살림말로 부른다. 살을 떼어 내는 일은 '나눔', 수술은 '손질',
      상처는 '문', 새로 돋은 몸은 '새살'. 서로를 이름 뒤에 '형제', '자매'를 붙여 부르고, 인사와 작별은 늘
      "몸 성하시오"다. 누가 아파해도 목소리를 높이지 않는다. 아이를 달래듯 "괜찮소, 괜찮소" 하고 두 번 말한다.
    outsiders: >-
      선원들을 귀한 손님으로 대접한다. 방을 내주고 발을 씻겨 주고 매 끼니 고기를 올린다. 대화하는 동안 수도사들의
      눈이 선원의 손목 굵기와 어깨 폭을 오간다. 재단사가 손님 치수를 눈으로 가늠하는 눈길이다.
      아무도 무엇을 시키지 않는다. 선원이 먼저 원할 때까지 그들은 친절하게 기다린다.
    crossover:
      magic: transformed
      tech: transformed
      note: >-
        이 섬에서는 무엇이든 살이 되려 한다. 다른 세계의 마법은 빛이나 불로 나오지 않고 돋는 살과 핏줄로 나온다.
        불 마법을 쓰면 손끝에서 뜨거운 피가 뿜어지고, 치유 마법을 쓰면 상처가 아문 자리에 작은 입이 하나 남는다.
        가져온 기계는 몇 시간 지나면 금속 겉면에 솜털이 돋고 전선이 맥을 친다. 작동은 한다. 밤에는 가끔 배고프다고 운다.
    appearance: unchanged
  premise: >-
    오래전 하늘에서 떨어진 것이 섬 아래 바다 밑에 가라앉아 있다. 수도사들은 그것을 '어머니'라 부른다. 실제로는
    아직 태어나지 않은 산만 한 태아다. 수도원 건물은 해수면 위로 자라 나온 그것의 태반이다. 수도사들의 몸이 바뀌는
    것은 신앙의 기적이 아니라 태아가 흘려보내는 성장 물질이 사람 몸을 제멋대로 빚은 결과다.
    세베린 원장은 십 년 전에 죽었다. 태아는 그의 시신을 입으로 쓴다. 태아가 태어나려면 사람 몸으로 빚은 산도가
    있어야 하고, 그 몸으로 정해진 사람이 수도원에 남은 마지막 온전한 수련수사 이냐시오다.
    태어난 것은 바다로 올라와 첫 젖을 찾는다. 이 바다에 사는 것 전부가 그 젖이다.
  laws:
    - 수도원 안에서 흘린 피는 바닥에 스며 아래로 내려간다. 피를 흘린 사람이 어디 있는지 아래의 것이 안다.
    - 저녁 나눔의 고기를 먹은 사람 몸에는 새살이 돋는다. 처음엔 가렵고, 사흘째부터는 작게 말을 한다.
    - 종이 세 번 연달아 울리면 수도원 전체가 진통한다. 복도가 좁아지고 문이 닫히고 벽이 사람을 붙잡는다.
    - 아무도 억지로 바쳐지지 않는다. 아래의 것은 스스로 원한 몸만 받는다. 그래서 수도사들은 권하고 기다린다.
  start_location: rib-quay
  clock:
    name: 진통
    segments: 8

locations:
  - id: rib-quay
    name: 뼈 선창
    description: >-
      물속에서 휘어 올라온 뼈 말뚝들이 발판을 받친다. 썰물이면 말뚝 밑동에 붙은 반투명한 알주머니가 줄줄이 드러난다.
      선창 끝에 돌로 둘러친 우물이 하나 있다. 수도사들은 도착한 손님의 발을 이 우물물로 씻긴다. 물은 체온만큼 따뜻하고 조금 비리다.
    connects_to: [flesh-nave, flayed-grotto]
    tags: [해안, 상륙 지점]
  - id: flesh-nave
    name: 본당
    description: >-
      천장이 숨을 쉰다. 기둥은 뼈로, 벽은 두꺼운 근육으로 되어 있다. 창마다 얇게 편 가죽이 걸려 있어서 볕이 분홍색으로 든다.
      제단 위 은쟁반에 사람 머리만 한 심장이 올려져 느리게 뛴다. 매일 저녁 이곳에서 나눔 식사를 한다.
      긴 식탁에는 의자가 늘 몇 개 남는다. 수도사들은 손님 수를 미리 세어 두는 법이 없다고 말한다.
    connects_to: [rib-quay, suture-cloister, larynx-belfry]
    tags: [예배, 중심지]
  - id: suture-cloister
    name: 동쪽 회랑
    description: >-
      수도사들의 숙소이자 손질하는 방. 회랑을 따라 돌 수술대가 열두 개 놓여 있고, 벽 고리에 뼈를 갈아 만든 칼과 머리카락을 꼬아 만든
      실타래가 걸려 있다. 방마다 손질 중인 수도사가 누워 저녁 기도를 흥얼거린다. 수술대 머리맡마다 이름이 새겨져 있다.
      회랑 끝 잠긴 문 너머에서 가끔 물 긷는 소리 같은 박동이 들린다.
    connects_to: [flesh-nave]
    tags: [위험, 수술실]
  - id: larynx-belfry
    name: 종탑
    description: >-
      첨탑 꼭대기. 종이 있어야 할 자리에 누런 연골로 된 커다란 목울대가 매달려 있다. 종지기가 힘줄 줄을 당기면 수백 명의 목소리가
      한꺼번에 "아" 하고 운다. 바닥 가운데 구멍으로 팔뚝 굵기의 관 하나가 곧게 내려간다. 관에 손을 대면 맥이 잡힌다.
    connects_to: [flesh-nave]
    tags: [높은 곳, 의식]
  - id: flayed-grotto
    name: 빨래굴
    description: >-
      선창 옆 절벽 밑, 파도가 드나드는 해식 동굴. 수도사들은 이름을 부르지 않고 그냥 빨래굴이라고 한다. 동굴 벽에 걸린 줄마다
      사람 가죽 수십 장이 빨래처럼 널려 마른다. 전부 같은 사람 것이다. 제일 오래된 가죽은 햇빛에 바래 종이처럼 얇다.
      가장 안쪽 물웅덩이는 바닥이 보이지 않고, 밀물 때면 아래에서 따뜻한 물이 올라온다.
    connects_to: [rib-quay]
    tags: [은신처, 해안, 이단]
  - id: womb-below
    name: 아랫샘
    description: >-
      수도원 밑, 그리고 바다 밑. 붉은 살로 된 관을 따라 한참 내려가면 물속에 커다란 막이 걸려 있다. 막 너머에 산만 한 것이 무릎을 끌어안고
      웅크렸다. 붙어 있는 눈꺼풀 아래에서 눈알이 선원들 움직임을 따라 구른다. 천장에서 굵은 줄 하나가 위로, 섬 전체로 뻗어 올라가 맥을 친다.
    connects_to: [suture-cloister, flayed-grotto, larynx-belfry]
    hidden: true
    tags: [클라이맥스, 해저, 극도로 위험]

npcs:
  - id: abbot-severin
    name: 세베린 원장
    role: 오를라 수도원 원장 (실은 아래의 것이 쓰는 입)
    adult: true
    look: >-
      허리 아래가 본당 바닥과 이어져 있는 노인. 뿌리처럼 뻗은 살이 물결처럼 일어나 그를 실어 나른다. 얼굴은 순하게 생겼는데 눈을
      깜빡이지 않는다. 목에 세로로 길게 째진 두 번째 입이 있다. 설교할 때 두 입이 반 박자 어긋나게 같은 말을 한다.
    personality: >-
      손님이 무슨 말을 해도 고개를 끄덕이며 끝까지 듣는다. 아픈 이야기를 들으면 "그거 좋은 일이오"라고 답한다. 밥을 먹지 않고, 앉지도 않는다.
      식탁에서는 남의 접시만 본다. 대화가 길어지면 단어가 가끔 엉뚱한 자리에 끼어든다. 배가, 아니, 기쁘다는 식으로.
    voice: >-
      "사랑하는 형제" 하고 부르며 시작하는 느린 하오체. 문장마다 "괜찮소"를 끼운다. 목의 입이 가끔 먼저 문장을 끝내 버리고,
      그러면 얼굴의 입은 잠깐 멈췄다가 같은 말을 따라 한다. 흐트러질 때는 '나', '우리', '어머니'가 한 문장에 섞인다.
    wants: 진통을 무사히 끝내는 것. 이냐시오가 제 발로 제단에 눕는 것. 되도록이면 손님들도 함께.
    fears: 위로 뻗은 줄이 끊기는 것. 세베린 자신은 무서운 게 없다. 이미 죽었으니까.
    location: flesh-nave
    alertness: uncanny
    affinity: 15
    likes:
      - 저녁 나눔의 고기를 기꺼이 먹는 것
      - 제 몸의 흠이나 병을 털어놓는 것
      - 수도원이 아름답다고 말하는 것
    dislikes:
      - 아랫샘이나 종탑의 관을 캐묻는 것
      - 오도라는 이름을 입에 올리는 것
      - 수도원 벽에 불이나 칼을 대는 것
    behaviors:
      hostile: >-
        종을 앞당겨 치게 한다. 본당 바닥을 열어 선원 한 명의 발목을 물게 하고, 수도사들에게 "이 형제는 벌써 원했소"라고 말한다.
        수도사들은 원장을 의심하지 않고 그 선원을 회랑으로 모셔 간다
      wary: >-
        손님들에게 방을 하나씩 따로 내준다. 밤이면 각 방 벽에 그의 목의 입이 열려, 그 방 사람이 제일 갖고 싶어 하는 것을 이름까지 대며 권한다
      friendly: >-
        종탑과 동쪽 회랑을 직접 구경시키고 오래된 경전을 읽어 준다. 선원 한 명에게 작은 선물을 진심으로 권한다.
        셋째 눈, 아가미, 손가락 하나 중에서 고르라고
      trusted: >-
        진통의 날 차례를 자랑스럽게 일러 주고, 이냐시오가 문이 된다는 말을 숨기지 않는다. 손님들에게 산파 자리를 권한다.
        이때 처음으로 목의 입이 선원 하나를 "우리 아가"라고 부른다
      bonded: >-
        아래의 것이 직접 말한다. 세베린의 얼굴 가죽이 턱 쪽으로 흘러내린다. 목의 입이 선원들을 엄마라고 부르며, 엄마가 가라는
        길로 태어나겠다고, 이냐시오 말고 다른 길도 괜찮다고 조른다
    relations:
      - { npc: sister-marta, affinity: 55, note: 제일 손이 좋은 수녀. 요즘 마지막 바늘땀에서 손이 떨린다는 걸 안다 }
      - { npc: brother-ignatius, affinity: 70, note: 마지막 남은 온전한 몸. 가장 아끼는 아이 }
      - { npc: flayed-odo, affinity: -90, note: 동생. 세베린이 살아 있을 때 유일하게 져 준 사람 }
    knows:
      - { secret: ignatius-canal, share_at: trusted }
      - { secret: mother-hunger, share_at: bonded }
      - { secret: hollow-abbot, share_at: bonded }
    sample_lines:
      - (처음 맞을 때) 사랑하는 형제, 발이 차구려. 괜찮소, 괜찮소. 여기서는 금방 따뜻해지오. 몸 성하시오.
      - (거절당했을 때) 안 드셔도 괜찮소. 형제가 배고플 때를 알아요, 우리는. 기다리는 건 잘하오.
      - (목의 입이 먼저) 배가, 아니, 기쁘오. 곧 오실 테니. (얼굴의 입이 따라서) 곧 오실 테니.
      - (가까워졌을 때) 형제 손목이 참 곱소. 그냥 하는 말이오. 이 늙은이는 그런 걸 오래 보오.

  - id: sister-marta
    name: 마르타 수녀
    role: 동쪽 회랑에서 손질을 맡은 수녀
    adult: true
    look: >-
      마흔 줄의 키 큰 여자. 양손 손가락이 여섯 개씩이다. 오른손 손바닥 가운데 작은 눈이 하나 떠 있어서 수술 부위를 들여다본다.
      수녀복 소매는 늘 피를 먹어 무겁다. 목에 제 손으로 꿰맨 실밥 자국이 목걸이처럼 한 바퀴 돈다.
    personality: >-
      묻는 말에만 답한다. 삼백 번 넘게 손질을 했고 그게 사랑이라고 믿어 왔다. 이냐시오의 날이 다가오면서 마지막 바늘땀에서
      손이 떨리기 시작했다. 떨릴 때마다 칼을 내려놓고 손을 수녀복에 한 번 닦는다. 누가 보고 있으면 닦지 않는다.
    voice: >-
      짧게 끊는 하오체. 반말에 가까운 "~요"를 섞는다(예: "가만있어요"). 해부 용어와 기도문을 같은 문장에 쓴다.
      마음이 흔들리면 목소리가 커지지 않고 말수가 줄어든다. 하던 말을 끝맺지 않고 "됐소"로 자른다.
    wants: 이냐시오를 살리는 것. 동시에 제 손으로 한 삼백 번이 죄가 아니었다고 믿고 싶다.
    fears: 오도가 옳았던 것. 손바닥의 눈이 보는 것을 제 입으로 인정하는 것.
    location: suture-cloister
    alertness: sharp
    affinity: 0
    romance: true
    likes:
      - 다친 사람을 망설이지 않고 돌보는 것
      - 그녀 솜씨를 인정하되 겁먹지 않는 것
      - 이냐시오를 진심으로 걱정하는 것
    dislikes:
      - 손질을 도축이라고 비웃는 것
      - 그녀 손이 떨린다고 짚는 것
      - 약한 사람을 방패로 세우는 것
    behaviors:
      hostile: >-
        선원들이 자는 사이 무릎 흉터, 약한 폐 같은 것을 적어 원장에게 올린다. 치료를 핑계로 선원 한 명 상처에 새살 씨를 심는다
      wary: >-
        회랑 입구를 막고 서서 무엇을 봤는지 하나씩 되묻는다. 상처는 꿰매 주지만 마취 없이 한다. 선원이 소리를 내면 바늘을 멈추고 기다린다
      friendly: >-
        상처를 머리카락 실로 깔끔하게 꿰매 준다. 새살이 늦게 돋게 하는 쓴 회색 이끼를 한 줌 준다. 꿰매다가 지나가는 말처럼
        이냐시오의 날을 흘린다. "종이 세 번 치는 날이오. 모레쯤"
      trusted: >-
        원장이 이미 죽은 몸이라고 말한다. 회랑 끝 잠긴 문 열쇠를 제 왼팔 안에 꿰매 두었다고 하고, 선원들 앞에서 팔을 열어 꺼낸다
      bonded: >-
        수녀 옷깃의 매듭을 푼다. 진통의 날 가장 오래된 뼈 칼을 들고 아랫샘의 줄 앞에 선다. 이냐시오를 떼어 내야 한다면 그 자리를
        자기가 막겠다고 한다
    relations:
      - { npc: brother-ignatius, affinity: 80, note: 갓난쟁이 때 선창에서 주워 키운 아이. 입 밖에 낸 적 없는 모정 }
      - { npc: abbot-severin, affinity: 20, note: 받드는 사람이자 무서운 사람. 그가 이제 그 사람이 아니라는 걸 안다 }
      - { npc: flayed-odo, affinity: -45, note: 그의 첫 가죽을 벗긴 게 그녀 칼이었다. 미안함이 미움 모양으로 굳었다 }
    knows:
      - { secret: ignatius-canal, share_at: friendly }
      - { secret: hollow-abbot, share_at: trusted }
      - { secret: cord-severance, share_at: bonded }
    sample_lines:
      - (처음) 가만있어요. 살은 기억하오. 바늘땀 하나 삐뚤면 평생 당신을 미워할 거요.
      - (경계할 때) 여기서 뭘 봤소. 수술대 몇 번째까지. 셌소?
      - (손이 떨리는 걸 들켰을 때) 삼백 번 했소. 한 번도 이런 적 없었지. 됐소. 가시오.
      - (가까워졌을 때) 그 애는 여섯 살까지 밤마다 이불에 오줌을 쌌소. 그걸 아는 사람이 이제 나 하나요.
      - (믿게 됐을 때) 팔 좀 잡아 줘요. 여기, 팔꿈치 위. 열쇠가 뼈에 걸려 있어서 한 번에 안 빠지오.

  - id: brother-ignatius
    name: 이냐시오 수사
    role: 마지막 온전한 수련수사, 진통의 날 문이 될 사람
    adult: true
    look: >-
      스물두 살의 마른 청년. 수도원에서 유일하게 손 안 댄 몸이라, 매끈한 맨살이 이 섬에서는 오히려 눈에 걸린다. 수도사들은 그를
      지나칠 때마다 손바닥으로 그의 배를 쓸고 간다. 요즘 배꼽 둘레가 붉게 부어올랐다. 그는 허리끈을 두 번 감아 그 자리를 가린다.
    personality: >-
      바깥 섬 이야기를 들으면 묻는 게 끝이 없다. 배가 몇 척인지, 거기 사람들은 뭘 먹는지. 무서운 이야기가 나오면 화제를
      빵 굽는 법 같은 데로 돌린다. 무서워하는 걸 믿음이 모자란 탓이라 여겨서, 밤마다 제 손등을 꼬집으며 기도문을 외운다.
    voice: >-
      조심스러운 해요체. 수도원 말투인 하오체를 흉내 내다가 겁이 나면 제 또래 말투로 돌아온다("아니, 그러니까요"). 질문으로 말을 끝내는
      버릇이 있다. 대답을 기다리지 않고 제가 먼저 다른 질문을 덧붙인다.
    wants: 바다 건너 다른 섬을 보는 것. 누군가 "도망쳐도 돼"라고 말해 주고, 그 말에 책임을 져 주는 것.
    fears: 진통의 날. 그날이 오면 자기가 기꺼이 누울 것 같다는 것.
    location: flesh-nave
    alertness: normal
    affinity: 30
    romance: true
    likes:
      - 바깥 이야기를 들려주는 것
      - 그를 바칠 몸이 아니라 사람으로 대하는 것
      - 마르타 수녀를 존중하는 것
    dislikes:
      - 그의 몸을 치수 재듯 훑어보는 것
      - 도망치라는 말을 쉽게 하고 뒷일은 모른 척하는 것
      - 수도원 사람들을 괴물이라 부르는 것. 그에게는 식구다
    behaviors:
      hostile: >-
        손님들이 자기를 데려가려 한다고 원장에게 고해한다. 그 벌로 진통의 날이 당겨져도 받아들인다
      wary: >-
        성가대석 뒤로 숨는다. 말을 걸면 경전 구절만 되풀이하고, 눈은 문 쪽을 본다
      friendly: >-
        피로 쓴 쪽지를 선원 소매에 몰래 넣는다. "사흘 뒤면 저는 문이 된대요." 수도원 안 샛길과 저녁 종 치는 시간을 알려 준다
      trusted: >-
        허리끈을 풀어 부은 배꼽을 보여 준다. 안에서 가끔 뭐가 두드린다고, 밤에 그 소리를 들으며 잔다고 말한다. 손님들을 따라 빨래굴까지 몰래 나선다
      bonded: >-
        제 일을 제가 정한다. 진통의 날 아래의 것이 자기만 보도록 제단에 스스로 눕고, 그동안 손님들이 줄을 끊게 한다.
        손님 한 명과 서로 마음이 있다면 살아서 같은 배를 타고 싶다고, 그 말만은 해요체로 끝까지 한다
    relations:
      - { npc: sister-marta, affinity: 85, note: 어머니나 다름없는 사람. 그녀가 칼을 들 때만 무섭다 }
      - { npc: abbot-severin, affinity: -25, note: 받들라고 배웠다. 목의 입이 말할 때마다 몸이 굳는다 }
      - { npc: flayed-odo, affinity: 25, note: 입에 올리면 안 되는 이름. 몰래 빨래굴에 한 번 가 봤다 }
    knows:
      - { secret: ignatius-canal, share_at: trusted }
    sample_lines:
      - (경계할 때) 몸 성하시오. 저녁 종은 여섯 번이오. 늦지 마시오.
      - (처음 편해졌을 때) 바깥에선 사람들이 태어난 몸 그대로 늙어요? 손가락도 그대로? 아니, 그냥 궁금해서요.
      - (가까워졌을 때) 수녀님한테는 말하지 마요. 제가 무서워한다는 거요. 그분 요즘 밥을 반만 드세요.
      - (믿게 됐을 때) 여기 대 봐요. 느껴져요? 밤에는 더 세게 두드려요. 대답해 달라는 것 같아서 저도 두드려 줘요.

  - id: flayed-odo
    name: 오도
    role: 쫓겨난 수사, 세베린 원장의 친동생
    adult: true
    look: >-
      가죽이 없다. 드러난 근육과 힘줄 위에 젖은 해초를 칭칭 감고 다닌다. 눈꺼풀도 없어서 눈이 늘 뜨여 있고, 말할 때마다 손가락으로
      눈알에 바닷물을 찍어 바른다. 새 가죽이 한 겹 돋으면 조개껍데기로 긁어 벗겨 동굴 줄에 넌다. 아래의 것이 자기 몸에 뿌리내리지 못하게 하려고.
    personality: >-
      남이 말하는 도중에 끼어든다. 수도원 이야기는 욕으로 하고, 형 이야기는 하다가 만다. 제가 여기서 유일하게 제정신이라는 걸 누가
      알아주기를 바라면서, 막상 누가 알아주면 소금을 한 줌 집어던지고 등을 돌린다.
    voice: >-
      빠르고 거친 반말. 수도원 말을 일부러 천하게 바꿔 부른다. 나눔은 '제 살 떼 먹이기', 손질은 '도축', 어머니는 '밑에 있는 그 배고픈 거'.
      형 이야기만은 늘 과거형이다. "형은 그랬어. 형은 싫어했지."
    wants: 줄을 끊어 형의 시신을 쉬게 하는 것. 제가 옳았다는 걸 한 사람이라도 알아주는 것.
    fears: 가죽이 다 자라 버리는 것. 형 얼굴이 흘러내리는 걸 다시 보는 것.
    location: flayed-grotto
    alertness: sharp
    affinity: -15
    likes:
      - 수도원의 가르침을 대놓고 의심하는 것
      - 그의 맨몸을 보고도 눈을 돌리지 않는 것
      - 소금이나 불처럼 살을 막는 물건을 가져다주는 것
    dislikes:
      - 저녁 나눔의 고기를 먹고 온 것
      - 형을 괴물이라 부르는 것. 그건 형이 아니라 형 시체다
      - 그를 불쌍하게 쳐다보는 것
    behaviors:
      hostile: >-
        물웅덩이로 손님들을 꾀어 밑으로 이어진 물길에 밀어 넣는다. 선원 피 냄새를 물에 풀어 아래의 것에게 먹이로 판다
      wary: >-
        아는 걸 알려 주는 대신 값을 부른다. 선원 한 명이 제 앞에서 손톱 하나를 뽑으라고. 뽑으려 들면 손목을 잡고 웃는다. 진짜 할 줄은 몰랐다고
      friendly: >-
        어머니가 신이 아니라 배고픈 태아라고 거칠게 털어놓는다. 새살을 늦추려면 상처에 바닷소금을 문지르라고 가르치고, 직접 문질러 준다. 세게
      trusted: >-
        물웅덩이 밑 물길로 아랫샘까지 가는 길을 알려 준다. 형이 죽었다는 말을 처음으로 현재형으로 한다. 줄을 끊는 방법을 반만 알려 준다.
        끊을 수 있는 칼은 밑에 있는 그것의 뼈로 만든 것뿐이라고
      bonded: >-
        함께 아랫샘으로 내려간다. 형의 시신 앞에서 두 손으로 형 얼굴을 감싸고, 목의 입이 더 말하지 못하게 제 몸으로 줄의 매듭을 막는다
    relations:
      - { npc: abbot-severin, affinity: -60, note: 좋아했던 형. 지금 그 얼굴을 쓰고 있는 것을 미워한다 }
      - { npc: sister-marta, affinity: -55, note: 첫 가죽을 벗긴 칼. 모른 척하는 게 더 역겹다 }
      - { npc: brother-ignatius, affinity: 50, note: 한 번 찾아왔던 녀석. 형처럼 되기 전에 꺼내 주고 싶다 }
    knows:
      - { secret: mother-hunger, share_at: friendly }
      - { secret: hollow-abbot, share_at: trusted }
      - { secret: cord-severance, share_at: trusted }
    sample_lines:
      - (처음) 거기 서. 더 오지 마. 너 저녁 먹었냐? 고기 먹었냐고.
      - (경계할 때) 공짜로 듣고 싶어? 여기 공짜는 저 위에서만 줘. 먹여 주고 재워 주고. 그다음은 알지?
      - (마음이 좀 풀렸을 때) 종소리 들으면 배고프지. 그거 너희 배가 고픈 게 아니야. 밑에서 우는 거야, 젖 달라고.
      - (믿게 됐을 때) 형은 생선 가시를 무서워했어. 목에 걸린다고. 지금 설교하는 그 목 봐. 가시가 아니라 입이 걸려 있잖아.

secrets:
  - id: mother-hunger
    truth: >-
      어머니는 신도 어미도 아니다. 하늘에서 떨어진 거대한 태아이고, 수도원 건물 전체가 그 태반이다. 수도사들 몸이 바뀌는 것은
      태아가 흘리는 성장 물질의 부작용일 뿐이다. 태어나면 바다로 올라와 첫 젖을 찾는다. 이 바다와 바다에 사는 것 전부가 그 젖이다.
    hints:
      - 종이 울릴 때마다 선원들 배가 까닭 없이 고프다. 방금 먹었어도 그렇다.
      - 경전 맨 앞 오래된 장에는 '어머니'라는 말이 한 번도 없다. '아기'라는 말만 백 번 넘게 나온다.
      - 제단의 심장은 한 번 뛸 때마다 아주 작게 쪽, 하고 젖 빠는 소리를 낸다.
    reveal_when: 오도의 호의를 얻거나, 경전 옛 장을 읽어 내거나, 아랫샘을 직접 보았을 때
  - id: hollow-abbot
    truth: >-
      세베린 원장은 십 년 전 첫 진통 때 죽었다. 지금 그 몸은 아래의 것이 수도원을 다스리려고 쓰는 꼭두각시다. 말하는 것은 목의 입이고,
      얼굴의 입은 그걸 따라 할 뿐이다.
    hints:
      - 원장은 눈을 깜빡이지 않고, 음식을 입에 대지 않는다. 그림자가 바닥의 살과 이어져 끊기지 않는다.
      - 두 입이 같은 말을 할 때 늘 목의 입이 반 박자 먼저다.
      - 오도는 형 이야기를 할 때 늘 과거형을 쓴다.
    reveal_when: 2막 끝(중간 반전). 마르타나 오도의 신뢰를 얻었거나, 원장에게 상처를 냈는데 피 대신 맑은 물이 흐를 때
  - id: ignatius-canal
    truth: >-
      이냐시오는 진통의 날 산도가 된다. 배꼽을 중심으로 몸이 조금씩 열리도록 빚어지는 중이다. 손질이 끝나면 그는 아래의 것이 세상으로
      나오는 문이 되고, 살아남지 못한다.
    hints:
      - 수도사들은 이냐시오를 지나칠 때마다 손바닥으로 그의 배를 쓸고 간다.
      - 동쪽 회랑 제일 큰 수술대 머리맡에 이미 이냐시오의 이름이 새겨져 있다. 다른 이름들보다 글씨가 새것이다.
      - 이냐시오 배꼽 둘레가 붉게 부었고, 가끔 안에서 두드린다.
    reveal_when: 1막 끝. 이냐시오의 쪽지를 받았거나 동쪽 회랑을 뒤졌을 때
  - id: cord-severance
    truth: >-
      아래의 것과 섬을 잇는 줄은 그것의 뼈로 만든 칼로만 끊긴다. 그 칼은 마르타가 쓰는 가장 오래된 뼈 칼이다. 줄을 끊으면 그것은
      다시 깨지 않고, 수도원은 썩어 무너지며, 그것과 이어진 수도사들도 같이 죽는다. 이냐시오도 반쯤 이어져 있어서 끊기 전에 누군가
      그를 떼어 내야 한다.
    hints:
      - 마르타는 제일 오래된 칼 하나만은 남에게 닦게 두지 않는다. 쓰고 나면 제 소매 안에 넣는다.
      - 빨래굴 벽에 손톱으로 긁은 글씨가 있다. "어미 뼈라야 어미 줄을 자른다."
    reveal_when: 3막. 마르타와 유대하거나 오도의 신뢰를 얻었을 때

events:
  - id: kiss-of-welcome
    kind: arrival
    when: 상륙 직후, 선원들이 뼈 선창에 발을 디딜 때
    scene: >-
      수도사들이 한 사람씩 다가와 선원들 손을 잡는다. 손바닥의 입술이 손등에 입을 맞추고, 혀끝으로 살갗을 아주 조금 핥는다.
      늙은 수사가 눈을 감고 입맛을 다신다. "좋은 몸이오. 괜찮소, 괜찮소."
      뒤에서 종이 한 번 운다. 선원들 배 속이 동시에 꾸르륵 운다. 아침을 먹은 지 한 시간도 안 됐다.
    stakes: 손을 빼면 수도사들은 서운한 얼굴로 물러날 뿐이다. 다만 맛본 수도사는 그 선원의 몸을 기억한다
  - id: flesh-communion
    kind: location
    where: flesh-nave
    when: 선원들이 처음 본당에서 저녁을 맞을 때
    scene: >-
      저녁 종이 여섯 번 친다. 수도사들이 줄지어 제단 앞에 무릎을 꿇고, 차례로 제 허벅지나 팔뚝에서 손바닥만 한 살을 떠서 은쟁반에 올린다.
      피가 바닥에 스미자 제단의 심장이 빨라진다. 떠낸 자리는 수프 한 그릇 식을 동안 분홍빛으로 도로 찬다.
      세베린 원장이 첫 점을 집어 선원 앞 접시에 놓는다. "형제 살이오. 드시오. 이제 식구니까."
      성가대석 뒤에서 이냐시오 혼자 빈 접시를 앞에 두고 이쪽을 본다.
    stakes: 먹으면 새살이 돋는다(법칙 2). 거절하면 원장의 호감이 떨어진다. 고난 '저녁 나눔'
  - id: offering-surgery
    kind: location
    where: suture-cloister
    when: 선원들이 동쪽 회랑에 처음 들어설 때
    scene: >-
      수술대 위의 수도사가 저녁 기도를 부르고 있다. 마르타가 그의 갈비뼈를 한 대씩 벌려 젖히고, 그 사이에 두 번째 심장을 앉혀 꿰맨다.
      기도 소리는 한 음도 끊기지 않는다. 피가 수술대 홈을 따라 흘러 바닥 구멍으로 쪽쪽 빨려 들어간다.
      마지막 바늘땀에서 마르타가 칼을 내려놓고 손을 소매에 문지른다. 선원들 쪽은 보지도 않는다.
      "제일 큰 대에는 앉지 마시오. 임자 있소."
    stakes: 제일 큰 수술대의 이름을 확인하면 비밀 ignatius-canal의 힌트
  - id: first-contraction
    kind: clock
    clock: 4
    when: 위기 시계가 4칸 찼을 때 (2막에서 3막으로 넘어가는 즈음)
    scene: >-
      종이 세 번 연달아 운다. 복도 벽이 양쪽에서 한 뼘씩 다가온다. 문이란 문은 전부 안쪽으로 오므라들며 닫힌다.
      본당 바닥이 갈라지고 붉은 관이 드러난다. 관 속에서 집채만 한 것이 한 번 몸을 뒤친다.
      수도사들은 바닥에 엎드려 소리 내어 운다. 웃는 얼굴로.
      이냐시오가 허리끈을 붙잡고 무릎을 꿇는다. 허리끈 아래로 맑은 물이 번진다.
    stakes: 흩어져 있던 선원들은 서로 떨어진 채 갇힌다. 고난 '좁아지는 복도'. 수도사들이 이냐시오를 동쪽 회랑으로 모셔 간다
  - id: face-in-the-wall
    kind: random
    when: 선원들이 수도원 안을 조용히 지나갈 때, 또는 누군가 피를 흘린 직후
    scene: >-
      벽이 부풀고 얼굴 하나가 천천히 떠오른다. 선원 가운데 한 명의 얼굴이다. 턱의 면도 자국까지 똑같다.
      얼굴이 눈을 뜨고 그 선원 목소리로 말한다. "여기 있으면 안 아파. 들어와. 추웠잖아."
      손을 뻗으면 벽이 손을 따뜻하게 감싸 쥔다. 놓지 않는다.
    stakes: 벽에 붙잡히면 건강 내성 DC 14. 실패하면 손에 살이 엉겨 붙어 떼어 낼 때 HP 피해. 아래의 것이 그 선원을 기억한다
    once: false
  - id: the-great-birth
    kind: finale
    clock: 8
    when: 위기 시계가 가득 찼을 때 (4막, 아랫샘에서)
    scene: >-
      막이 가운데부터 찢어진다. 따뜻한 물이 쏟아져 아랫샘을 채운다. 붙어 있던 눈꺼풀이 천천히 떨어진다.
      제단에 누운 이냐시오의 배가 꽃봉오리 벌어지듯 열리기 시작한다. 그 옆에서 원장의 시신이 두 입을 다 벌리고 저녁 기도를 부른다.
      커다란 눈이 선원들을 하나씩 본다. 그리고 선원들 각자의 목소리를 흉내 내 아주 작게 부른다. "엄마?"
    stakes: 이냐시오의 목숨, 수도사들 전부, 이 바다, 그리고 그것이 누구를 엄마로 삼을지

story:
  theme: 아픈 것을 사랑이라고 부르는 식구들을, 죽이지 않고 구할 수 있는가
  hook: >-
    상륙 첫날 저녁, 고기에 손대지 않은 수사 하나가 식탁 밑으로 선원 소매에 쪽지를 밀어 넣는다. 피로 쓴 글씨다.
    "사흘 뒤면 저는 문이 된대요. 되기 싫어요." 수도원 사람들은 모두 친절하고, 누구도 그를 가두지 않았다.
    선창에는 배도 있다. 그런데 그는 왜 떠나지 못하는가.
  acts:
    - name: 1막 손님 대접
      goal: 수도원의 믿음과 규칙을 알고, 이냐시오가 무엇을 무서워하는지 알아낸다
      beats:
        - 뼈 선창의 입맞춤 인사와 첫 종소리의 허기 (이벤트 kiss-of-welcome)
        - 저녁 나눔. 형제 살을 먹을 것인가 (이벤트 flesh-communion, 고난 '저녁 나눔')
        - 이냐시오의 쪽지. 호의 단계가 아니라면 그가 성가대석 뒤에서 선원들을 몰래 지켜보는 장면으로 대신한다
      turn: >-
        동쪽 회랑 제일 큰 수술대에서 이냐시오의 이름을 본다(이벤트 offering-surgery). 문이 된다는 말이 비유가 아니라 수술 일정이다.
        같은 밤, 고기를 먹은 선원의 새살이 처음으로 제 주인 이름을 부른다
    - name: 2막 꿰맨 자리
      goal: 진통이 무엇인지, 어머니가 무엇인지, 오도가 왜 쫓겨났는지 알아낸다
      beats:
        - 빨래굴에서 오도와 흥정한다. 그는 아는 것의 값으로 아픔을 부른다
        - 마르타와 마주한다. 떨리는 손, 그리고 이냐시오 이야기만 나오면 짧아지는 대답
        - 벽에서 선원 자신의 얼굴이 떠오른다 (이벤트 face-in-the-wall)
        - 세베린 원장과 이야기하다가 누군가 목의 입이 반 박자 먼저 움직인다는 걸 알아챈다
      turn: >-
        중간 반전. 원장은 십 년 전에 죽었고 지금 말하는 것은 아래의 것이다(비밀 hollow-abbot). 선원들이 광신도 두목이라고 여겼던
        사람은 시신이고, 수도사들은 전부 바다 밑 아기의 부작용이자 피해자다(비밀 mother-hunger). 싸울 상대가 구할 사람으로 바뀐다
    - name: 3막 진통
      goal: 끌려간 이냐시오를 되찾고, 아랫샘으로 내려갈 길과 줄을 끊을 칼을 손에 넣는다
      beats:
        - 종이 세 번 울리고 수도원이 진통한다 (이벤트 first-contraction, 고난 '좁아지는 복도')
        - 마르타가 고른다. 신뢰 이상이면 선원들 앞에서 제 팔을 열어 잠긴 문 열쇠와 뼈 칼을 꺼낸다. 불신 이하라면 이냐시오를 지키겠다며
          오히려 선원들을 회랑에 가두고 제 손으로 손질하러 간다
        - 어두운 순간. 이냐시오가 제단째 아래로 내려가고, 새살이 돋은 선원의 몸이 그쪽으로 끌린다. 믿었던 사람 하나(마르타나 이냐시오 자신)가
          "그 애한테 제일 덜 아픈 길"이라며 등을 돌린다
      turn: >-
        회랑 끝 잠긴 문, 빨래굴 물웅덩이 밑 물길, 종탑의 관 가운데 하나로 숨겨진 장소 '아랫샘'이 열린다
    - name: 4막 아랫샘
      goal: 그것 앞에서 고른다. 끊을 것인가, 받아 낼 것인가, 달아날 것인가
      beats:
        - 커다란 눈과 마주친다. 그것이 선원들 각자의 목소리로 엄마를 부른다 (고난 '엄마 소리')
        - 원장의 시신이 마지막 설교를 하고, 오도가 형 얼굴 앞에 선다
        - 이냐시오를 제단에서 떼어 낼 것인가. 떼어 내면 누군가 그 자리를 막아야 한다 (마르타가 나설 수 있다)
      turn: >-
        선원들의 선택이 결말을 정한다. 뼈 칼로 줄을 끊으면 '줄을 끊다', 산파가 되어 그것을 섬 밖 깊은 바다로 이끌면 '받아 내다',
        이냐시오만 안고 물길로 빠져나가면 '배로 돌아가다'. 주사위는 그 선택을 치르는 값만 정하고, 어느 결말인지는 정하지 않는다

trials:
  - id: communion-table
    name: 저녁 나눔
    act: 1
    description: >-
      원장이 직접 접시에 놓아 준 형제 살 한 점. 식탁의 수도사 수십 명이 포크를 내려놓고 기다린다. 거절한다고 화내는 사람은 없다.
      다들 조금 서운해할 뿐이다. 먹기는 쉽다. 따뜻하고, 이상하게 달다.
    test: >-
      선택 또는 판정. 먹는 척 소매에 숨기려면 손재주 DC 19(원장의 눈썰미 uncanny). 정중히 사양하며 납득시키려면 설득 DC 15,
      또는 학식 DC 14로 경전을 들어 '아직 준비가 덜 됐다'고 말한다. 선원 한 명이 동료들 몫까지 대표로 먹겠다고 나설 수도 있다
    on_success: >-
      선원들은 몸을 지키고 원장의 호감도 잃지 않는다. 대표로 먹은 선원이 있으면 동료들은 '식구의 일행'으로 대접받아 동쪽 회랑에 드나들 수 있다
    on_fail: >-
      들키면 원장의 호감 -15. 수도사들이 식사 내내 선원들을 조금 슬프게 쳐다본다. 억지로 삼켰다면 그 선원에게 새살이 돋는다.
      섬에 있는 동안 아래의 것이 그의 위치를 알고, 종이 울릴 때마다 지혜 내성 DC 12에 실패하면 한 턴 동안 종소리 쪽으로 걸어간다
  - id: stolen-name-plate
    name: 수술대 이름
    act: 2
    description: >-
      이냐시오의 손질 기록과 그의 몸을 어떻게 열지 그린 도면이 마르타의 방에 있다. 방까지 가려면 회랑을 지나야 하고, 회랑에는
      손질 중인 수도사들이 누워 있다. 그들이 새로 얻은 눈은 감기지 않는다.
    test: >-
      은신 DC 16(마르타의 눈썰미 sharp) 또는 기만 DC 16으로 치료받으러 온 척한다. 마르타가 호의 이상이면 판정 없이 보여 달라고
      부탁할 수 있다. 대신 그녀는 선원 한 명의 상처를 자기가 직접 꿰매겠다고 고집한다
    on_success: >-
      도면과 날짜(종이 세 번 치는 날)를 확인한다. 도면 귀퉁이에 마르타 글씨로 한 줄이 적혀 있다. "다른 몸으로 대신할 수 있는가." 세 번 긋고 다시 쓴 자국이 있다.
      비밀 ignatius-canal이 드러나고, 마르타가 흔들리고 있다는 것을 알게 된다
    on_fail: >-
      손질 중인 수도사가 비명 대신 기도를 크게 부른다. 회랑 전체가 따라 부른다. 선원 한 명이 붙잡혀 마르타에게 작은 선물을 받는다.
      손바닥에 작은 입이 하나 생기고, 섬에 있는 동안 가끔 혼자 기도를 중얼거려 은신 판정에 불리. 위기 시계 +1
  - id: tightening-halls
    name: 좁아지는 복도
    act: 3
    description: >-
      진통하는 수도원. 복도가 목구멍처럼 오므라들고, 벽의 살이 팔다리를 감고, 바닥은 따뜻한 물로 미끄럽다. 끌려가는 이냐시오 목소리가
      점점 멀어진다. 흩어진 동료들을 모아 동쪽 회랑까지 가야 한다.
    test: >-
      파티 전체의 연속 판정. 운동 또는 곡예 DC 15로 좁아지는 통로를 빠져나가고, 건강 내성 DC 13으로 벽이 내뿜는 달큰한 물의 마비를 버틴다.
      불이나 소금을 대면 벽이 잠깐 움츠러들어 이점. 오도에게 소금 쓰는 법을 배웠다면 이점
    on_success: >-
      이냐시오가 제단에 묶이기 직전 회랑에 닿는다. 마르타와 마주 선 장면에서 선원들이 먼저 입을 열 수 있다
    on_fail: >-
      실패할 때마다 HP 피해를 입고, 선원 한 명의 소지품 하나를 벽이 삼킨다(무엇을 잃을지는 플레이어가 고른다). 이냐시오는 이미 아래로
      내려간 뒤다. 4막은 그를 되찾는 데서 시작한다. 위기 시계 +1
  - id: mothers-call
    name: 엄마 소리
    act: 4
    description: >-
      그것이 눈을 뜬다. 선원마다 제일 보고 싶은 사람 목소리로, 제일 듣고 싶던 말을 한다. 그러고는 부른다. "엄마. 안아 줘."
      그 목소리 쪽으로 걸어가면 줄이 부드럽게 몸에 감긴다.
    test: >-
      선원 한 명씩 지혜 내성 또는 통찰 DC 17. 새살이 있는 선원은 불리. 동료가 이름을 불러 주거나 붙잡으면 이점.
      이미 끌려간 동료를 줄에서 떼어 내려면 누군가 HP를 치르고 운동 DC 15
    on_success: >-
      선원들은 제 발로 고를 자리에 선다. 그것은 아직 누구의 아이도 아니다. 이제 칼을 들지, 팔을 벌릴지 정한다
    on_fail: >-
      실패한 선원은 줄에 반쯤 이어진다. 결말을 고를 때 그 선원은 그것 편에서 한마디를 해야 한다. 줄을 끊는 결말이라면
      그 순간 최대 HP가 영구히 3 줄어든다. 끊긴 줄이 몸에 흉터로 남는다

blessings:
  - id: stitched-heart
    name: 머리카락 실밥
    description: >-
      마르타가 제 머리카락을 꼬아 만든 실로 선원의 가장 깊은 상처를 꿰매 준다. 매듭을 짓고 나서 이로 실을 끊는다.
      실밥 자리는 어느 섬에 가도 희미하게 분홍빛이고, 다칠 때마다 그 둘레 살이 남보다 조금 빨리 아문다.
    condition: 마르타가 신뢰 이상일 때, 선원이 제 몸을 그녀 손에 맡기겠다고 스스로 말한다
    effect: 최대 HP +4. 캠페인 동안 한 번, 쓰러질 상황에서 HP 1로 버틴다 (실밥이 터지면서 대신 받아 낸다)
    lasts: campaign
  - id: salt-scoured
    name: 소금 문지르기
    description: >-
      오도가 하던 대로 상처와 새살에 바닷소금을 문질러 그것의 기운을 긁어낸다. 몹시 쓰리다. 그 뒤로 이 섬의 살은 선원의 몸을 잘 붙잡지 못한다.
    condition: 오도가 호의 이상일 때 빨래굴에서 그를 따라 소금을 문지른다 (HP 2 피해)
    effect: 이 섬에 있는 동안 새살, 벽의 붙잡기, 그것의 부름에 맞서는 모든 내성 판정에 이점
    lasts: island
  - id: mothers-imprint
    name: 명치 흉터
    description: >-
      그것을 받아 낸 선원의 명치 한가운데 탯줄 자리 같은 소용돌이 흉터가 남는다. 선원이 죽을 고비를 넘길 때마다 흉터가 따뜻해진다.
      먼 바다 밑 어딘가에서 누가 엄마를 걱정하고 있다.
    condition: 결말 '받아 내다'를 고르고, 선원이 그것을 직접 안아 섬 밖으로 이끈다
    effect: >-
      캠페인 동안 한 번, 죽음을 피한다 (몸이 살로 다시 이어 붙는다). 그 뒤로는 어느 섬에서든 날고기나 피 냄새를 맡으면
      허기를 감추지 못한다 (GM이 한 번 연출할 수 있다)
    lasts: campaign

exits:
  - id: sever-the-cord
    name: 줄을 끊다
    condition: >-
      아랫샘에서 뼈 칼로 줄을 끊는다. 끊기 전에 이냐시오를 제단에서 떼어 내야 하고, 누군가 그 빈자리를 잠깐 몸으로 막아야 한다
      (마르타나 오도가 유대 단계면 스스로 나선다)
    epilogue: >-
      끊긴 줄에서 검은 피가 길게 뿜어 나오다 멎는다. 커다란 눈꺼풀이 천천히 내려온다. 다시 올라오지 않는다.
      물길을 거슬러 올라오니 수도원은 벌써 물러지고 있다. 첨탑이 부풀지 않는다. 종이 마지막으로 운다. 이번에는 한 사람 목소리다.
      늙은 남자가 목을 가다듬는 소리가 짧게 나고 그친다.
      수도사들은 식탁에, 복도에, 수술대 위에 하나씩 누워 잠든다. 배에 오르는 것은 이냐시오, 그리고 줄 앞을 막지 않았다면 마르타다.
      이냐시오는 난간을 잡고 서서 허리끈을 푼다. 부은 자리가 햇볕을 받는다.
    grants: [bone-scalpel]
  - id: midwife-of-the-deep
    name: 받아 내다
    condition: >-
      그것과 흥정한다. 이냐시오 대신 선원들이 산파가 되어, 섬 앞바다가 아니라 먼 해구 쪽으로 그것을 이끌어 낳게 한다.
      원장이 유대 단계이거나, 선원 전원이 '엄마 소리'를 견뎌 낸 상태여야 한다
    epilogue: >-
      배 옆으로 바다가 부풀어 오르고 산만 한 등이 스치듯 지나간다. 첫 울음이 터진다. 수평선 끝까지 물고기들이 배를 뒤집고 떠오른다.
      그것은 섬을 먹지 않는다. 엄마들이 가라고 한 쪽, 바닥이 없는 깊은 물로 천천히 가라앉는다.
      수도원은 남는다. 수도사들은 여전히 저녁마다 제 살을 나누고, 이냐시오는 섬에 남아 원장 자리에 앉는다.
      배가 선창을 떠날 때 종이 운다. 조금 서툴게, 옹알이처럼.
    grants: [birth-caul]
  - id: turn-from-the-quay
    name: 배로 돌아가다
    condition: 진통이 끝나기 전에 이냐시오를 데리고(혹은 데려오지 못한 채) 빨래굴 물길이나 선창으로 배까지 달아난다
    epilogue: >-
      배가 분홍 안개를 빠져나올 때 뒤에서 섬이 일어선다. 수도원이 무릎을 짚고 몸을 세우듯 솟고, 뼈 선창이 바다를 끌어안는다.
      종소리가 수평선 너머까지 따라온다. 몇 주 뒤 다른 항구 술집에서 이야기를 듣는다. 남쪽 바다에 고기가 안 잡힌다고.
      이냐시오가 배에 있다면, 그는 밤마다 허리끈 위에 손을 얹고 누워 있다. 가끔 손가락으로 두 번 두드린다. 대답하듯이.
    grants: []

treasures:
  - id: bone-scalpel
    name: 뼈 칼
    description: >-
      상앗빛으로 비치는 가느다란 칼. 날 안쪽에서 아주 느리게 맥이 뛴다. 아랫샘의 그것이 처음 떨군 뼈를 갈아 만들었다.
      마르타가 삼백 번을 이 칼로 했다. 손잡이에 그녀 손가락 여섯 개 자국이 닳아 있다.
    kind: anomaly
    power: >-
      다음 섬에서 한 번, 눈에 보이지 않는 이음 하나를 끊는다. 저주와 그 저주에 걸린 사람, 조종하는 자와 조종당하는 자, 계약과 계약자,
      기계와 그것을 부리는 신호 같은 것. 끊긴 쪽은 다시는 같은 방식으로 이어지지 않는다.
  - id: birth-caul
    name: 양막 한 조각
    description: >-
      그것이 태어날 때 찢어진 막의 한 조각. 얇고 질기며 늘 사람 체온만큼 따뜻하다. 몸에 두르면 제 심장 소리가 두 개로 들린다.
    kind: magic
    power: >-
      다음 섬에서 한 번, 이 막으로 한 사람을 감싸면 그는 한 장면 동안 굶주림, 질식, 독, 추위 같은 환경의 해를 입지 않는다.
      막 안에 있는 동안은 말을 하지 못한다.

gm_notes:
  pacing: >-
    1막은 느리고 따뜻하게 간다. 환대가 진심이라는 게 제일 무섭다. 폭력 말고 친절로 조여라. 2막 끝 반전(원장은 이미 죽었다) 뒤로
    속도를 올리고, 위기 시계 4칸의 진통부터는 쉴 틈을 주지 않는다. 4막은 고르는 데 시간을 쓴다. 그것이 "엄마?" 하고 부른 뒤에는
    한 박자 비워 두고 선원들이 먼저 말하게 한다.
  do:
    - 고어는 생생하게 쓰되, 무서움은 수도사들의 평온에서 나오게 한다. 비명보다 저녁 기도가 무섭다.
    - 수도사들은 괴물이 아니라 사랑받고 싶은 식구다. 선원이 해쳐도 원망하지 않고 "괜찮소" 하며 슬퍼한다.
    - 공포는 평범한 물건이 조금 틀린 데서 온다. 의자가 한 개 모자라거나, 고기가 너무 따뜻하거나, 벽에서 제 목소리가 들리는 식으로.
    - 새살이 돋은 선원에게는 제 몸이 속삭이는 연출을 준다. 강도는 플레이어가 즐기는 선에서 맞춘다.
    - 마르타, 이냐시오와의 로맨스는 서로를 살리려는 긴장과 친밀감으로 다루고, 그 이상은 화면 밖으로 넘긴다.
    - 결말은 선원들이 고른다. 판정은 치를 값만 정한다.
  dont:
    - 1막에서 그것이 태아라는 것이나 원장이 죽었다는 것을 직접 말하지 않는다.
    - 플레이어 캐릭터 몸을 동의 없이 영구히 바꾸지 않는다. 영구 변화는 선택이나 명시된 실패 대가로만 온다.
    - 수도사들이 선원을 억지로 수술대에 눕히게 하지 않는다. 이 섬의 공포는 제가 원하게 되는 것이다.
    - 저주받은, 끔찍한, 기괴한 같은 형용사로 장면을 칠하지 않는다. 사물 하나를 정확히 보여 준다.
    - 고어를 위한 고어로 장면을 끌지 않는다. 한 장면에 강한 이미지 하나면 된다.
